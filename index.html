.test-log-detail{margin-top:2px;color:#666;font-size:8px;line-height:1.12;word-break:break-word}
.test-log-ok{color:var(--gold)}
.test-log-fail{color:var(--red)}
.test-log-empty{padding:24px 10px;color:#666;text-align:center;font-size:13px}
.test-log-reset{position:sticky;bottom:0;flex:0 0 auto;width:100%;min-height:46px;margin-top:10px;padding-bottom:env(safe-area-inset-bottom);border:1px solid var(--red);border-radius:8px;background:#fafafa;color:var(--red);font-size:15px;font-weight:700;z-index:5}
.test-score-controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.test-score-action{min-height:42px;border-radius:8px;background:#fafafa;font-size:13px;font-weight:800;letter-spacing:.1px}
.test-score-action.add{border:2px solid var(--gold);color:var(--gold)}
.test-score-action.delete{border:2px solid var(--red);color:var(--red)}

.par-cell{font-style:italic}
.top-team-select.has-team{font-size:20px}
.hole-cell{font-size:24px}
.score-button{font-size:30px}
.score-mark{width:37px;height:37px;font-size:26px}
.score-mark.double-circle,.score-mark.double-square{font-size:26px}
.score-button .score-mark{transform:none}
.score-mark-number{display:inline-block;transform:translateY(-3px)}
.score-mark:not(.par-mark) .score-mark-number{transform:none}
.leader-team-name{font-size:20.5px;white-space:nowrap;overflow:hidden}

.home-scorecard-access{position:relative;width:100%}
.home-scorecard-split{display:grid;grid-template-columns:minmax(0,1fr) 48px;width:100%;min-height:70px;border:2px solid var(--gold);border-radius:9px;overflow:visible;background:var(--gold)}
.home-scorecard-main,.home-scorecard-arrow{border:0;background:var(--gold);color:#eee;font-weight:700}
.home-scorecard-main{min-width:0;padding:8px 0 8px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.02;overflow:hidden}
.home-scorecard-action{display:block;width:100%;font-size:20px;font-weight:700;letter-spacing:.25px;white-space:nowrap;text-align:center}
.home-scorecard-team{display:block;width:100%;margin-top:5px;font-size:18px;font-weight:700;letter-spacing:.15px;white-space:nowrap;text-align:center;overflow:hidden}
.home-scorecard-team.select-team{font-style:italic;font-weight:600}
.home-scorecard-arrow{position:relative;border-left:1px solid rgba(255,255,255,.28);font-size:0}
.home-scorecard-arrow::after{content:"";position:absolute;left:50%;top:54%;width:11px;height:11px;border-left:3px solid #eee;border-top:3px solid #eee;transform:translate(-50%,-35%) rotate(45deg)}
.home-scorecard-main:active,.home-scorecard-arrow:active{filter:brightness(.9)}
.home-team-dropup{position:absolute;left:0;right:0;bottom:calc(100% + 7px);z-index:80;display:none;max-height:min(48dvh,390px);overflow-y:auto;padding:6px;border:2px solid var(--gold);border-radius:9px;background:#fafafa;box-shadow:0 -8px 28px rgba(255,255,255,.48)}
.home-team-dropup.open{display:block}
.home-team-option{display:block;width:100%;min-height:48px;padding:9px 12px;border:0;border-bottom:1px solid #ccc;background:#fafafa;color:#000;text-align:center;font-size:18px;font-weight:600}
.home-team-option:last-child{border-bottom:0}
.home-team-option:active{background:var(--gold);color:#eee}
.modal-overlay.reset-authorization{align-items:flex-end;justify-content:center;padding:20px 20px max(calc(env(safe-area-inset-bottom) + 20px),calc(33dvh - 55px))}

          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function intervalSeconds(
      start,
      end
    ) {

      return (
        (
          end -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function msSeconds(value) {

      const ms = Number(value);

      return Number.isFinite(ms)
        ? (ms / 1000).toFixed(3)
        : null;

    }


    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

       SSHCP V5.2 — QR AUTHORIZATION
       Worker remains the final authority for every score write.
       ========================================================= */

    const SSHCP_QR_PASSKEY_KEY = 'sshcpQrPasskey';
    const SSHCP_QR_ROLE_KEY = 'sshcpQrRole';
    const SSHCP_QR_ID_KEY = 'sshcpQrId';
    const SSHCP_QR_TEAM_KEY = 'sshcpQrTeam';
    const SSHCP_QR_SLOT_KEY = 'sshcpQrSlot';
    const SSHCP_TEAM_AUTH_KEY = 'sshcpTeamAuthorization';
    const SSHCP_MASTER_TEST_KEY = 'glmNnV63TWS42fcRB8z2yldF';

    /* V16.31 — one QR-auth owner at a time. This fixes the latent V16.30
       race where a slow, older request could finish after REMOVE AUTH and
       write authorization back into storage. */
    const SSHCP_QR_AUTH_REQUEST_KEY_V1631 = 'sshcpQrAuthActiveRequestV1631';
    let sshcpQrAuthControllerV1631 = null;

    function makeQrAuthRequestTokenV1631() {
      return String(Date.now()) + '-' + Math.random().toString(36).slice(2);
    }

    function beginQrAuthRequestV1631() {
      if (sshcpQrAuthControllerV1631) {
        try { sshcpQrAuthControllerV1631.abort(); } catch (_) {}
      }
      const token = makeQrAuthRequestTokenV1631();
      localStorage.setItem(SSHCP_QR_AUTH_REQUEST_KEY_V1631, token);
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      sshcpQrAuthControllerV1631 = controller;
      return { token, controller };
    }

    function invalidateQrAuthRequestsV1631() {
      localStorage.setItem(SSHCP_QR_AUTH_REQUEST_KEY_V1631, 'REMOVED-' + makeQrAuthRequestTokenV1631());
      if (sshcpQrAuthControllerV1631) {
        try { sshcpQrAuthControllerV1631.abort(); } catch (_) {}
      }
      sshcpQrAuthControllerV1631 = null;
    }

    function qrAuthRequestIsCurrentV1631(token) {
      return localStorage.getItem(SSHCP_QR_AUTH_REQUEST_KEY_V1631) === token;
    }

    /* CF V1.3 now supplies the complete TEST/admin QR directory in one
       read-only request. No permanent passkey list is hard-coded here. */
    const SSHCP_TEST_QR_CACHE_KEY = 'sshcpTestQrDirectoryCacheV20';
    const SSHCP_TEST_QR_CACHE_TIME_KEY = 'sshcpTestQrDirectoryCacheTimeV20';

    let sshcpQrDirectoryCache = null;
    let sshcpQrDirectoryPromise = null;

    function readStoredTestQrDirectory() {
      if (sshcpQrDirectoryCache) return sshcpQrDirectoryCache;
      try {
        const parsed = JSON.parse(localStorage.getItem(SSHCP_TEST_QR_CACHE_KEY) || 'null');
        if (Array.isArray(parsed) && parsed.length) {
          sshcpQrDirectoryCache = parsed;
          return parsed;
        }
      } catch (_) {}
      return null;
    }

    function saveStoredTestQrDirectory(directory) {
      if (!Array.isArray(directory) || !directory.length) return;
      sshcpQrDirectoryCache = directory;
      localStorage.setItem(SSHCP_TEST_QR_CACHE_KEY, JSON.stringify(directory));
      localStorage.setItem(SSHCP_TEST_QR_CACHE_TIME_KEY, String(Date.now()));
    }

    async function validateQrPasskey(passkey, showFailure=true){
      const clean=String(passkey||'').trim();

      if(!clean){
        invalidateQrAuthRequestsV1631();
        clearQrAuthorization();
        localStorage.removeItem('rotbAuthorizedTeam');
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();
        addTestLog('QR AUTH CHECK','INVALID','—','EMPTY PASSKEY');
        if(showFailure) showInvalidQrPasskey();
        return false;
      }

      const request = beginQrAuthRequestV1631();
      const requestToken = request.token;
      const started = timerStart();

      try{
        const fetchOptions = {cache:'no-store'};
        if (request.controller) fetchOptions.signal = request.controller.signal;

        const response=await fetch(
          CLOUDFLARE_API_URL+
          '?action=qrAuth&passkey='+encodeURIComponent(clean)+
          '&refresh='+Date.now(),
          fetchOptions
        );

        /* A newer auth or REMOVE AUTH owns state now. Ignore this response
           completely — no storage write, no failure popup, no stale log. */
        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        const httpStatus=response.status;
        let data;

        try{
          data=await response.json();
        }catch(_){
          if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • INVALID JSON'
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        if(!response.ok || !data || data.ok!==true){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+
            (data && (data.reason||data.error) ? ' • '+String(data.reason||data.error) : '')
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(data.valid!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'INVALID',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • VALID FALSE'
          );
          if(showFailure) showInvalidQrPasskey();
          return false;
        }

        if(data.role==='QR' && data.assigned!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'OK',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • '+String(data.qrId||'QR')+' • VALID / NOT ASSIGNED'
          );
          if(showFailure) showValidUnassignedQrPasskey();
          return false;
        }

        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        saveQrAuthorization(data,clean);
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();

        addTestLog(
          'QR AUTH CHECK',
          'OK',
          timerSeconds(started)+'s',
          [
            'HTTP '+httpStatus,
            String(data.role||''),
            data.qrId ? 'QR '+String(data.qrId) : '',
            data.team ? String(data.team) : ''
          ].filter(Boolean).join(' • ')
        );

        return true;
      }catch(error){
        if(
          !qrAuthRequestIsCurrentV1631(requestToken) ||
          (error && error.name === 'AbortError')
        ){
          return null;
        }

        addTestLog(
          'QR AUTH CHECK',
          'FAILED',
          timerSeconds(started)+'s',
          error && error.message ? error.message : 'REQUEST FAILED'
        );
        if(showFailure) showAuthorizationCheckFailed(clean);
        return false;
      }finally{
        if(
          sshcpQrAuthControllerV1631 === request.controller &&
          qrAuthRequestIsCurrentV1631(requestToken)
        ){
          sshcpQrAuthControllerV1631 = null;
        }
      }
    }

    async function loadAssignedPasskeys(forceRefresh = true) {
      if (sshcpQrDirectoryPromise) return sshcpQrDirectoryPromise;

      if (!forceRefresh) {
        const stored = readStoredTestQrDirectory();
        if (stored) return stored;
      }

      const started = timerStart();

      sshcpQrDirectoryPromise = (async () => {
        let response = null;

        try {
          response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=qrDirectory' +
              '&passkey=' + encodeURIComponent(SSHCP_MASTER_TEST_KEY) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          const httpStatus = response.status;
          let data;

          try {
            data = await response.json();
          } catch (_) {
            throw new Error('HTTP ' + httpStatus + ' — invalid JSON response');
          }

          if (
            !response.ok ||
            !data ||
            data.ok !== true ||
            data.authorized !== true ||
            data.role !== 'MASTER' ||
            !Array.isArray(data.directory)
          ) {
            const reason =
              data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'Directory request failed';
            throw new Error('HTTP ' + httpStatus + ' — ' + reason);
          }

          const directory = data.directory
            .filter(item => item && item.qrId && item.passkey)
            .map(item => ({
              qrId: String(item.qrId),
              passkey: String(item.passkey).trim(),
              role: 'QR',
              assigned: item.assigned === true,
              team: String(item.team || ''),
              status: String(item.status || (item.assigned ? 'ASSIGNED' : 'NOT ASSIGNED'))
            }));

          const master = data.master && data.master.passkey
            ? {
                qrId: 'MASTER',
                passkey: String(data.master.passkey).trim(),
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              }
            : {
                qrId: 'MASTER',
                passkey: SSHCP_MASTER_TEST_KEY,
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              };

          const assignedCount =
            directory.filter(item => item.assigned && item.team).length;

          const unassignedCount =
            directory.filter(item => !item.assigned).length;

          const validQrCount =
            Number(data.counts && data.counts.validQrCount) ||
            directory.length + 1;

          const workerAssignedCount =
            Number(data.counts && data.counts.assignedCount);

          const workerUnassignedCount =
            Number(data.counts && data.counts.unassignedCount);

          const countsMatch =
            validQrCount === directory.length + 1 &&
            (!Number.isFinite(workerAssignedCount) || workerAssignedCount === assignedCount) &&
            (!Number.isFinite(workerUnassignedCount) || workerUnassignedCount === unassignedCount);

          if (!countsMatch) {
            throw new Error(
              'HTTP ' + httpStatus +
              ' — directory count mismatch (' +
              validQrCount + ' valid / ' +
              assignedCount + ' assigned / ' +
              unassignedCount + ' unassigned)'
            );
          }

          const snapshot = [
            master,
            ...directory
          ];

          saveStoredTestQrDirectory(snapshot);

          const cfTotal =
            data.timing && Number.isFinite(Number(data.timing.totalMs))
              ? (Number(data.timing.totalMs) / 1000).toFixed(3) + 's CF'
              : '';

          addTestLog(
            'QR PASSKEY LOAD',
            'OK',
            timerSeconds(started) + 's',
            [
              'HTTP ' + httpStatus,
              validQrCount + ' VALID',
              assignedCount + ' ASSIGNED',
              unassignedCount + ' UNASSIGNED',
              cfTotal
            ].filter(Boolean).join(' • ')
          );

          return snapshot;
        }
        catch (error) {
          addTestLog(
            'QR PASSKEY LOAD',
            'FAILED',
            timerSeconds(started) + 's',
            error && error.message
              ? error.message
              : 'Directory request failed — CACHE NOT REPLACED'
          );

          return readStoredTestQrDirectory() || [
            {
              qrId: 'MASTER',
              passkey: SSHCP_MASTER_TEST_KEY,
              role: 'MASTER',
              assigned: true,
              team: 'MASTER',
              status: 'MASTER'
            }
          ];
        }
      })().finally(() => {
        sshcpQrDirectoryPromise = null;
      });

      return sshcpQrDirectoryPromise;
    }

    function populatePasskeyTeamSelect(menu, directory) {
      if (!menu) return;
      const assigned = (directory || [])
        .filter(item => item.qrId !== 'MASTER' && item.assigned && item.team)
        .sort((a, b) => {
          /* V16.31 — QR directory order follows the authoritative QR ID/slot,
             so custom names such as SUPERDUPER LONGNAME remain Team 2. */
          const as = Number(a.qrId);
          const bs = Number(b.qrId);
          const aNum = Number.isFinite(as);
          const bNum = Number.isFinite(bs);
          if (aNum && bNum && as !== bs) return as - bs;
          if (aNum !== bNum) return aNum ? -1 : 1;
          return String(a.qrId).localeCompare(String(b.qrId), undefined, { numeric:true });
        });

      menu.innerHTML =
        '<button type="button" class="passkey-team-option" data-passkey="' + escapeHtml(SSHCP_MASTER_TEST_KEY) + '" data-label="MASTER">MASTER</button>' +
        assigned.map(item =>
          '<button type="button" class="passkey-team-option" data-passkey="' + escapeHtml(item.passkey) + '" data-label="' + escapeHtml(item.team.toUpperCase()) + '">' + escapeHtml(item.team.toUpperCase()) + '</button>'
        ).join('');
    }

    /* =========================================================

       Blank / missing / invalid Starting Hole normalizes to 1 through
       scorecardStartingHoleV16(). Scan active teams from Team 1 forward;
       the first active team above 1 makes the event a shotgun start.

       In shotgun mode, every team — including a team that starts on 1 —
       receives STARTING HOLE X every time that team's scorecard is entered
       while all 18 scores are blank. Dismissing the message does not create
       a persistent seen-state. As soon as any score exists, the message stops.

       This is informational only and does not change THRU, scoring, save

    /*
      SSHCP V18.35 — Next Expected Score Row (NESR) positioning.

      ENTER:
        - if NESR plus the next four course rows are already fully visible,
          leave the viewport alone;
        - if four later course rows exist but are not all visible, scroll only
          enough to place NESR with exactly four rows beneath it;
        - if fewer than four later course rows exist, do not scroll.

      REFRESH / fresh Scorecard entry:
        normalize NESR to exactly four rows beneath whenever course boundaries
        allow; near the end, use the bottom/end view.

      There is no fixed-time ENTER duration. Motion is distance-based and uses
      quintic smoothstep easing so short moves stay quick while longer recovery
      moves remain visibly smooth.
    */
    let scoreEnterBeautyScrollFrameV1618 = 0;
    let scoreEnterBeautyScrollTargetV1618 = null;

    function cancelScoreEnterBeautyScrollV1618() {
      if (scoreEnterBeautyScrollFrameV1618) {
        cancelAnimationFrame(scoreEnterBeautyScrollFrameV1618);
      }

      scoreEnterBeautyScrollFrameV1618 = 0;
      scoreEnterBeautyScrollTargetV1618 = null;
    }

    function animateScorecardNESRScrollV1835(targetTop, onSettledV1835 = null) {
      if (!els.scoreScroll) return false;

      const startTop = els.scoreScroll.scrollTop;
      const distance = targetTop - startTop;

      if (Math.abs(distance) <= 3) {
        return false;
      }

      cancelScoreEnterBeautyScrollV1618();

      const sampleRowV1835 = els.scoreRows
        ? els.scoreRows.querySelector('.score-row')
        : null;
      const rowHeightV1835 = sampleRowV1835
        ? Math.max(1, sampleRowV1835.getBoundingClientRect().height)
        : 60;
      const rowDistanceV1835 = Math.abs(distance) / rowHeightV1835;
      const durationMsV1835 = Math.min(650, Math.max(300, 260 + (rowDistanceV1835 * 55)));

      const startedAt = performance.now();
      scoreEnterBeautyScrollTargetV1618 = targetTop;

      const step = now => {
        const progress = Math.min(1, Math.max(0, (now - startedAt) / durationMsV1835));
        /* Quintic smoothstep: zero velocity at both ends, no finishing snap. */
        const eased = progress * progress * progress * (progress * (progress * 6 - 15) + 10);
        els.scoreScroll.scrollTop = startTop + (distance * eased);

        if (progress < 1) {
          scoreEnterBeautyScrollFrameV1618 = requestAnimationFrame(step);
          return;
        }

        scoreEnterBeautyScrollFrameV1618 = 0;
        scoreEnterBeautyScrollTargetV1618 = null;
        rememberScorePosition();
        if (typeof onSettledV1835 === 'function') {
          onSettledV1835({ scrolled: true });
        }
      };

      scoreEnterBeautyScrollFrameV1618 = requestAnimationFrame(step);
      return true;
    }

    function restoreScorePosition(useLocalProgress = false, onSettledV1835 = null) {

      const settleV1835 = scrolled => {
        if (typeof onSettledV1835 === 'function') {
          onSettledV1835({ scrolled: !!scrolled });
        }
      };

      if (!selectedTeam || !els.scoreScroll) {
        settleV1835(false);
        return;
      }

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          /* NESR follows the live UI state, including any pending gray score. */
          const progressScoresV1835 = localScores;
          const nesrIndexV1835 = scorecardActiveHoleIndexV16(progressScoresV1835, selectedTeam);
          const rowsV1835 = els.scoreRows
            ? Array.from(els.scoreRows.querySelectorAll('.score-row'))
            : [];
          const nesrRowV1835 = rowsV1835[nesrIndexV1835] || null;

          if (!nesrRowV1835) {
            els.scoreScroll.scrollTop = 0;
            rememberScorePosition();
            settleV1835(false);
            return;
          }

          const actualRowsAfterV1835 = Math.max(0, 17 - nesrIndexV1835);
          const reducedMotionV1835 = window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          /* ENTER only moves when four later rows really exist AND NESR + those
             four rows are not already fully visible. Near the course end, stay
             put rather than chasing spacing that cannot exist. */
          if (useLocalProgress) {
            if (actualRowsAfterV1835 < 4) {
              rememberScorePosition();
              settleV1835(false);
              return;
            }

            const fourthAfterV1835 = rowsV1835[nesrIndexV1835 + 4];
            const scrollRectV1835 = els.scoreScroll.getBoundingClientRect();
            const nesrRectV1835 = nesrRowV1835.getBoundingClientRect();
            const fourthRectV1835 = fourthAfterV1835
              ? fourthAfterV1835.getBoundingClientRect()
              : null;
            const visibilityToleranceV1835 = 2;
            const alreadyHasFourBelowV1835 = !!(
              fourthRectV1835 &&
              nesrRectV1835.top >= (scrollRectV1835.top - visibilityToleranceV1835) &&
              fourthRectV1835.bottom <= (scrollRectV1835.bottom + visibilityToleranceV1835)
            );

            if (alreadyHasFourBelowV1835) {
              rememberScorePosition();
              settleV1835(false);
              return;
            }
          }

          /* Exact NESR target: NESR is the fifth visible course row whenever
             possible. Top and bottom boundaries gracefully clamp the view. */
          const targetIndexV1835 = Math.min(
            9,
            Math.max(0, nesrIndexV1835 - 4)
          );
          const targetRowV1835 = rowsV1835[targetIndexV1835];

          if (!targetRowV1835) {
            rememberScorePosition();
            settleV1835(false);
            return;
          }

          const maxScrollV1835 = Math.max(
            0,
            els.scoreScroll.scrollHeight - els.scoreScroll.clientHeight
          );
          const scrollRectV1835 = els.scoreScroll.getBoundingClientRect();
          const targetRectV1835 = targetRowV1835.getBoundingClientRect();
          const targetScrollV1835 = els.scoreScroll.scrollTop +
            (targetRectV1835.top - scrollRectV1835.top);
          const clampedTargetV1835 = Math.min(
            Math.max(0, targetScrollV1835),
            maxScrollV1835
          );
          const deltaV1835 = Math.abs(clampedTargetV1835 - els.scoreScroll.scrollTop);

          if (deltaV1835 <= 3) {
            rememberScorePosition();
            settleV1835(false);
            return;
          }

          if (reducedMotionV1835) {
            cancelScoreEnterBeautyScrollV1618();
            els.scoreScroll.scrollTop = clampedTargetV1835;
            rememberScorePosition();
            settleV1835(false);
            return;
          }

          const startedV1835 = animateScorecardNESRScrollV1835(
            clampedTargetV1835,
            onSettledV1835
          );
          if (!startedV1835) settleV1835(false);
        });
      });
    }

    function numericTeamHandicapV188(team, leaderRow) {
      const candidates = [
        team && team.handicap,
        team && team.hcp,
        leaderRow && leaderRow.handicap,
        leaderRow && leaderRow.hcp,
        leaderRow && leaderRow.teamHandicap,
        leaderRow && leaderRow.teamHcp
      ];
      for (const value of candidates) {
        if (value === '' || value === null || value === undefined) continue;
        const number = Number(value);
        if (Number.isFinite(number)) return Math.abs(number);
      }
      return null;
    }

    function officialRoundCheckV188(scoreSource, leaderboardRows) {
      const sourceTeams = Array.isArray(scoreSource && scoreSource.teams)
        ? scoreSource.teams.filter(team => team && String(team.name || '').trim() !== '')
        : [];
      const sourceHoles = Array.isArray(scoreSource && scoreSource.course && scoreSource.course.holes)
        ? scoreSource.course.holes.slice(0, 18)
        : [];
      const rows = Array.isArray(leaderboardRows) ? leaderboardRows : [];
      const failures = [];

      if (!sourceTeams.length) failures.push('NO OFFICIAL TEAMS');
      if (sourceHoles.length !== 18) failures.push('COURSE != 18 HOLES');
      if (!rows.length) failures.push('NO LEADERBOARD ROWS');
      if (failures.length) return { ok:false, failures };

      const parTotal = sourceHoles.reduce((sum, hole) => {
        const par = Number(hole && hole.par);
        return sum + (Number.isFinite(par) ? par : 0);
      }, 0);

      const rowsBySlot = new Map(
        rows.map(row => [Number(row && row.slot), row])
      );

      sourceTeams.forEach(team => {
        const slot = Number(team && team.slot);
        const row = rowsBySlot.get(slot);
        if (!row) {
          failures.push('T' + slot + ' MISSING FROM LEADERBOARD');
          return;
        }

        const rawScores = Array.isArray(team.scores) ? team.scores.slice(0, 18) : [];
        const validScores = rawScores.map(value => Number(value))
          .filter(value => Number.isFinite(value) && value > 0);
        const thru = validScores.length;

        if (thru !== Number(row.thru)) {
          failures.push('T' + slot + ' THRU ' + thru + '!=' + row.thru);
        }

        if (thru === 18) {
          const totalStrokes = validScores.reduce((sum, value) => sum + value, 0);
          const grossVsPar = totalStrokes - parTotal;
          const hcp = numericTeamHandicapV188(team, row);
          const netVsPar = hcp === null ? NaN : grossVsPar - hcp;

          if (Number.isFinite(Number(row.totalStrokes)) &&
              Number(row.totalStrokes) !== totalStrokes) {
            failures.push('T' + slot + ' STROKES ' + totalStrokes + '!=' + row.totalStrokes);
          }
          if (Number.isFinite(Number(row.gross)) &&
              Number(row.gross) !== grossVsPar) {
            failures.push('T' + slot + ' GROSS ' + grossVsPar + '!=' + row.gross);
          }
          if (Number.isFinite(netVsPar) &&
              Number.isFinite(Number(row.net)) &&
              Number(row.net) !== netVsPar) {
            failures.push('T' + slot + ' NET ' + netVsPar + '!=' + row.net);
          }

          const tbScores = Array.isArray(row.tiebreakScores) ? row.tiebreakScores : [];
          const tbHoles = Array.isArray(row.tiebreakHoles) ? row.tiebreakHoles : [];
          const tbCount = Math.min(tbScores.length, tbHoles.length);
          for (let index = 0; index < tbCount; index++) {
            const actualHole = Number(tbHoles[index]);
            const listed = Number(tbScores[index]);
            const official = Number(rawScores[actualHole - 1]);
            if (
              !Number.isInteger(actualHole) ||
              actualHole < 1 ||
              actualHole > 18 ||
              !Number.isFinite(listed) ||
              !Number.isFinite(official) ||
              listed !== official
            ) {
              failures.push(
                'T' + slot + ' TB' + (index + 1) +
                ' H' + String(tbHoles[index]) +
                ' ' + String(tbScores[index]) +
                '!=' + String(official)
              );
              break;
            }
          }
        }
      });

      const completeRows = rows.filter(row => Number(row && row.thru) === 18);
      if (completeRows.length === rows.length && rows.length) {
        try {
          buildTournamentPodium(rows);
          const firstTie = firstPlaceTiedRows(rows);
          if (firstTie.length >= 2) {
            const resolution = resolveTieContenders(firstTie);
            if (!resolution) failures.push('TIE BREAK RESOLUTION MISSING');
          }
        } catch (error) {
          failures.push('PODIUM ' + String(error && error.message || 'ERROR'));
        }
      }

      return { ok: failures.length === 0, failures };
    }

          throw new Error((leaderData && leaderData.error) || 'Leaderboard read failed.');
        }

        const rows = Array.isArray(leaderData.leaderboard) ? leaderData.leaderboard : [];
        const check = officialRoundCheckV188(scoreData, rows);

        if (!check.ok) {
          throw new Error(check.failures.slice(0, 8).join(' • ') || 'RESULTS mismatch');
        }

        addTestLog(
          'RESULTS CHECK',
          'OK',
          rows.length + ' TEAMS',
          'Actual Scores match the Scramble Summary RESULTS / Tie Break interpretation'
        );
        completeLoadingLine();
      } catch (error) {
        stopLoadingLine();
        addTestLog(
          'RESULTS CHECK',
          'FAILED',
          timerSeconds(started) + 's',
          String(error && error.message || 'Request failed')
        );
      }

      renderTestLog();
      requestAnimationFrame(fitTestPageButtonText);
    }


    /* =========================================================
       SSHCP V18.9 — INDEPENDENT ACCUMULATED RESULT AUDIT
       The expected Scramble Summary is derived from raw authoritative score
       data + raw handicap/tiebreak configuration. It intentionally does NOT
       call buildTournamentPodium(), resolveTieContenders(), or reuse the app's
       displayed ordering. The rendered Summary is snapshotted separately and
       compared only after the independent answer exists.
       ========================================================= */
    const RESULT_AUDIT_LOG_KEY_V189 = 'sshcpResultAuditLogV189';
    let resultAuditEpochV189 = 0;
    const pendingResultAuditsV189 = new Set();

    function getResultAuditLogV189() {
      try {
        const parsed = JSON.parse(localStorage.getItem(RESULT_AUDIT_LOG_KEY_V189) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function resetResultAuditLogV189() {
      resultAuditEpochV189 += 1;
      localStorage.removeItem(RESULT_AUDIT_LOG_KEY_V189);
    }

    function normalizeAuditTextV189(value) {
      return String(value == null ? '' : value)
        .replace(/\u00a0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function canonicalAuditTeamV1810(value) {
      return normalizeAuditTextV189(value)
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '');
    }

    function auditGolfScoreV189(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return '';
      if (number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }

    function auditHandicapV189(team, rawLeaderRow) {
      const candidates = [
        team && team.handicap,
        team && team.hcp,
        rawLeaderRow && rawLeaderRow.handicap,
        rawLeaderRow && rawLeaderRow.hcp,
        rawLeaderRow && rawLeaderRow.teamHandicap,
        rawLeaderRow && rawLeaderRow.teamHcp
      ];
      for (const value of candidates) {
        if (value === '' || value === null || value === undefined) continue;
        const number = Number(value);
        if (Number.isFinite(number)) return Math.abs(number);
      }
      return null;
    }

    function auditOrdinalV189(number) {
      const n = Number(number);
      if (n === 1) return '1st';
      if (n === 2) return '2nd';
      if (n === 3) return '3rd';
      return String(n) + 'th';
    }

    function snapshotRenderedSummaryV189() {
      if (!els.modalOverlay.classList.contains('tournament-summary')) return null;
      const body = els.modalBody;
      if (!body) return null;
      const rows = [];

      body.querySelectorAll('.tournament-summary-grid .tournament-summary-row:not(.header)').forEach(row => {
        rows.push({
          place: normalizeAuditTextV189(row.querySelector('.tournament-summary-place')?.textContent),
          team: normalizeAuditTextV189(row.querySelector('.tournament-summary-team')?.textContent),
          strokes: normalizeAuditTextV189(row.querySelector('.tournament-summary-strokes')?.textContent),
          net: normalizeAuditTextV189(row.querySelector('.tournament-summary-net')?.textContent)
        });
      });

      body.querySelectorAll('.tournament-summary-remaining-row').forEach(row => {
        const cells = row.querySelectorAll('.tournament-summary-remaining-cell');
        rows.push({
          place: normalizeAuditTextV189(cells[0]?.textContent),
          team: normalizeAuditTextV189(cells[1]?.textContent),
          strokes: normalizeAuditTextV189(cells[2]?.textContent),
          net: normalizeAuditTextV189(cells[3]?.textContent)
        });
      });

      const notes = [...body.querySelectorAll('.tournament-summary-note')]
        .map(node => normalizeAuditTextV189(node.textContent))
        .filter(Boolean);

      return { rows, notes };
    }

    function rawTiebreakOrderV189(rawLeaderRows) {
      const rows = Array.isArray(rawLeaderRows) ? rawLeaderRows : [];
      for (const row of rows) {
        if (!Array.isArray(row && row.tiebreakHoles) || !row.tiebreakHoles.length) continue;
        const order = row.tiebreakHoles
          .map(value => Number(value))
          .filter(value => Number.isInteger(value) && value >= 1 && value <= 18);
        if (order.length) return order;
      }
      return [];
    }

    function independentlyResolveTieV189(group, tiebreakOrder) {
      let contenders = [...group];
      for (let index = 0; index < tiebreakOrder.length && contenders.length > 1; index++) {
        const actualHole = Number(tiebreakOrder[index]);
        const scored = contenders.map(team => ({
          team,
          score: Number(team.scores[actualHole - 1])
        }));
        if (scored.some(item => !Number.isFinite(item.score) || item.score <= 0)) {
          return { winner:null, decidingIndex:null, unresolved:true, actualHole, contenders };
        }
        const low = Math.min(...scored.map(item => item.score));
        contenders = scored.filter(item => item.score === low).map(item => item.team);
        if (contenders.length === 1) {
          return {
            winner: contenders[0],
            decidingIndex: index,
            actualHole,
            winningScore: low,
            unresolved: false,
            entering: scored
          };
        }
      }
      return { winner:null, decidingIndex:null, unresolved:true, contenders };
    }

    function independentExpectedSummaryV189(scoreData, rawLeaderRows) {
      const sourceHoles = Array.isArray(scoreData && scoreData.course && scoreData.course.holes)
        ? scoreData.course.holes.slice(0, 18)
        : [];
      const sourceTeams = Array.isArray(scoreData && scoreData.teams)
        ? scoreData.teams.filter(team => team && String(team.name || '').trim() !== '')
        : [];
      if (sourceHoles.length !== 18) throw new Error('RAW COURSE != 18 HOLES');
      if (!sourceTeams.length) throw new Error('NO RAW OFFICIAL TEAMS');

      const pars = sourceHoles.map(hole => Number(hole && hole.par));
      if (pars.some(par => !Number.isFinite(par) || par <= 0)) throw new Error('RAW PAR DATA INVALID');
      const parTotal = pars.reduce((sum, value) => sum + value, 0);
      const rawRowsBySlot = new Map(
        (Array.isArray(rawLeaderRows) ? rawLeaderRows : []).map(row => [Number(row && row.slot), row])
      );
      const tiebreakOrder = rawTiebreakOrderV189(rawLeaderRows);
      if (!tiebreakOrder.length) throw new Error('RAW TIEBREAK ORDER MISSING');

      const teams = sourceTeams.map(team => {
        const slot = Number(team && team.slot);
        const scores = Array.isArray(team && team.scores)
          ? team.scores.slice(0, 18).map(value => Number(value))
          : [];
        if (scores.length !== 18 || scores.some(value => !Number.isFinite(value) || value <= 0)) {
          throw new Error('T' + slot + ' RAW ROUND INCOMPLETE');
        }
        const handicap = auditHandicapV189(team, rawRowsBySlot.get(slot));
        if (!Number.isFinite(handicap)) throw new Error('T' + slot + ' RAW HCP MISSING');
        const grossStrokes = scores.reduce((sum, value) => sum + value, 0);
        const netStrokes = grossStrokes - handicap;
        const netToPar = netStrokes - parTotal;
        return {
          slot,
          team: String(team.name || '').trim(),
          handicap,
          scores,
          grossStrokes,
          netStrokes,
          netToPar
        };
      });

      const byNetThenSlot = (a, b) =>
        (a.netStrokes - b.netStrokes) ||
        ((Number.isFinite(a.slot) ? a.slot : 9999) - (Number.isFinite(b.slot) ? b.slot : 9999)) ||
        a.team.localeCompare(b.team);

      const remaining = [...teams].sort(byNetThenSlot);
      const podium = [];
      const notes = [];
      const traces = [];

      for (let place = 1; place <= 3 && remaining.length; place++) {
        const bestNet = remaining[0].netStrokes;
        const tied = remaining.filter(team => team.netStrokes === bestNet);
        let winner = tied[0];

        if (tied.length > 1) {
          const resolution = independentlyResolveTieV189(tied, tiebreakOrder);
          if (resolution && resolution.winner) {
            winner = resolution.winner;
            const note = '• ' + auditOrdinalV189(place) + ' Place Won on ' +
              (resolution.decidingIndex + 1) + ' HCP Hole (Hole ' + resolution.actualHole + ')';
            notes.push(note);
            traces.push(
              auditOrdinalV189(place) + ' PLACE: ' +
              tied.map(item => 'T' + item.slot).join('/') +
              ' -> HCP ' + (resolution.decidingIndex + 1) +
              ' / HOLE ' + resolution.actualHole +
              ' -> T' + winner.slot
            );
          } else {
            traces.push(auditOrdinalV189(place) + ' PLACE: UNRESOLVED TIE ' + tied.map(item => 'T' + item.slot).join('/'));
          }
        }

        podium.push(winner);
        const removeAt = remaining.indexOf(winner);
        if (removeAt >= 0) remaining.splice(removeAt, 1);
      }

      remaining.sort(byNetThenSlot);
      const ordered = [...podium, ...remaining].slice(0, 10);
      const expectedRows = ordered.map((team, index) => {
        let place;
        if (index < 3) {
          place = String(index + 1);
        } else {
          const currentNet = team.netStrokes;
          const priorSame = ordered.slice(3, index).some(item => item.netStrokes === currentNet);
          const laterSame = ordered.slice(index + 1).some(item => item.netStrokes === currentNet);
          let unresolvedPlace = 4;
          for (let i = 3; i < index; i++) {
            if (ordered[i].netStrokes < currentNet) unresolvedPlace += 1;
          }
          place = (priorSame || laterSame) ? 'T' + unresolvedPlace : String(unresolvedPlace);
        }
        return {
          place,
          team: normalizeAuditTextV189(team.team),
          strokes: String(team.netStrokes) + ' (HCP ' + team.handicap + ')',
          net: auditGolfScoreV189(team.netToPar),
          slot: team.slot
        };
      });

      return { parTotal, teams, tiebreakOrder, expectedRows, notes, traces };
    }

    function compareExpectedToRenderedSummaryV189(expected, actual) {
      const mismatches = [];
      if (!actual) return ['SCRAMBLE SUMMARY SNAPSHOT MISSING'];
      if (actual.rows.length !== expected.expectedRows.length) {
        mismatches.push('ROW COUNT ' + actual.rows.length + '!=' + expected.expectedRows.length);
      }

      const count = Math.min(actual.rows.length, expected.expectedRows.length);
      for (let index = 0; index < count; index++) {
        const e = expected.expectedRows[index];
        const a = actual.rows[index];
        const prefix = 'ROW ' + (index + 1) + ' / T' + e.slot;
        if (normalizeAuditTextV189(a.place).toUpperCase() !== normalizeAuditTextV189(e.place).toUpperCase()) {
          mismatches.push(prefix + ' PLACE ' + a.place + '!=' + e.place);
        }
        if (canonicalAuditTeamV1810(a.team) !== canonicalAuditTeamV1810(e.team)) {
          mismatches.push(prefix + ' TEAM ' + a.team + '!=' + e.team);
        }
        if (normalizeAuditTextV189(a.strokes) !== normalizeAuditTextV189(e.strokes)) {
          mismatches.push(prefix + ' NET STROKES ' + a.strokes + '!=' + e.strokes);
        }
        if (normalizeAuditTextV189(a.net).toUpperCase() !== normalizeAuditTextV189(e.net).toUpperCase()) {
          mismatches.push(prefix + ' NET +/- ' + a.net + '!=' + e.net);
        }
      }

      const expectedNotes = expected.notes.map(normalizeAuditTextV189);
      const actualNotes = actual.notes.map(normalizeAuditTextV189);
      if (expectedNotes.length !== actualNotes.length || expectedNotes.some((note, i) => note !== actualNotes[i])) {
        mismatches.push(
          'TIEBREAK NOTES [' + (actualNotes.join(' || ') || 'NONE') + '] != [' +
          (expectedNotes.join(' || ') || 'NONE') + ']'
        );
      }
      return mismatches;
    }

    function resultAuditFingerprintV189(expected) {
      return expected.teams
        .slice()
        .sort((a,b) => a.slot - b.slot)
        .map(team => [team.slot, team.handicap, ...team.scores].join(','))
        .join('|') + '::TB=' + expected.tiebreakOrder.join(',');
    }

    function appendResultAuditV189(entry) {
      const log = getResultAuditLogV189();
      if (entry.fingerprint && log.some(item => item && item.fingerprint === entry.fingerprint)) return false;
      log.push(entry);
      localStorage.setItem(RESULT_AUDIT_LOG_KEY_V189, JSON.stringify(log));
      return true;
    }

    function formatResultAuditEntryV189(entry, index) {
      const lines = [
        '=== TEST ' + (index + 1) + ' — ' + (entry.ok ? 'OK' : 'FAILED') + ' ===',
        'TIME ' + (entry.timestamp || ''),
        'PAR ' + entry.parTotal,
        'TB ORDER ' + (entry.tiebreakOrder || []).map((hole, i) => (i + 1) + ':H' + hole).join(' '),
        'RAW OFFICIAL'
      ];
      (entry.rawTeams || []).forEach(team => {
        lines.push(
          'T' + team.slot + ' | ' + team.team +
          ' | HCP ' + team.handicap +
          ' | SCORES ' + team.scores.join(',') +
          ' | GROSS ' + team.grossStrokes +
          ' | NET ' + team.netStrokes +
          ' | NET+/- ' + auditGolfScoreV189(team.netToPar)
        );
      });
      lines.push('EXPECTED SUMMARY');
      (entry.expectedRows || []).forEach(row => {
        lines.push(row.place + ' | ' + row.team + ' | ' + row.strokes + ' | ' + row.net);
      });
      lines.push('EXPECTED TIEBREAK ' + ((entry.expectedNotes || []).join(' || ') || 'NONE'));
      if (entry.traces && entry.traces.length) lines.push('TIE TRACE ' + entry.traces.join(' || '));
      lines.push('APP SUMMARY');
      (entry.actualRows || []).forEach(row => {
        lines.push(row.place + ' | ' + row.team + ' | ' + row.strokes + ' | ' + row.net);
      });
      lines.push('APP TIEBREAK ' + ((entry.actualNotes || []).join(' || ') || 'NONE'));
      lines.push('CHECK ' + (entry.ok ? 'OK — RAW DATA MATCHES SCRAMBLE SUMMARY / TIEBREAK' : 'FAILED — ' + (entry.mismatches || []).join(' • ')));
      return lines.join('\n');
    }

    async function runSummaryResultAuditV189(renderedSnapshot, epochAtStart) {
      try {
        const stamp = Date.now();
        const [scoreResponse, leaderResponse] = await Promise.all([
          fetch(CLOUDFLARE_API_URL + '?refresh=' + stamp + '-summary-audit', { cache:'no-store' }),
          fetch(CLOUDFLARE_API_URL + '?action=leaderboard&refresh=' + stamp + '-summary-audit', { cache:'no-store' })
        ]);
        const [scoreData, leaderData] = await Promise.all([scoreResponse.json(), leaderResponse.json()]);
        if (epochAtStart !== resultAuditEpochV189) return;
        if (!scoreResponse.ok || !scoreData || scoreData.ok !== true) throw new Error('RAW OFFICIAL READ FAILED');
        if (!leaderResponse.ok || !leaderData || leaderData.ok !== true) throw new Error('RAW LEADERBOARD READ FAILED');

        const rawLeaderRows = Array.isArray(leaderData.leaderboard) ? leaderData.leaderboard : [];
        const expected = independentExpectedSummaryV189(scoreData, rawLeaderRows);
        const fingerprint = resultAuditFingerprintV189(expected);
        if (getResultAuditLogV189().some(item => item && item.fingerprint === fingerprint)) return;
        const mismatches = compareExpectedToRenderedSummaryV189(expected, renderedSnapshot);
        const entry = {
          timestamp: new Date().toISOString(),
          fingerprint,
          ok: mismatches.length === 0,
          parTotal: expected.parTotal,
          tiebreakOrder: expected.tiebreakOrder,
          rawTeams: expected.teams,
          expectedRows: expected.expectedRows,
          expectedNotes: expected.notes,
          traces: expected.traces,
          actualRows: renderedSnapshot ? renderedSnapshot.rows : [],
          actualNotes: renderedSnapshot ? renderedSnapshot.notes : [],
          mismatches
        };
        if (epochAtStart !== resultAuditEpochV189) return;
        if (appendResultAuditV189(entry)) {
          const testNumber = getResultAuditLogV189().length;
          addTestLog(
            'RESULT AUDIT',
            entry.ok ? 'OK' : 'FAILED',
            'TEST ' + testNumber,
            entry.ok
              ? 'RAW DATA MATCHES SCRAMBLE SUMMARY / TIEBREAK'
              : mismatches.slice(0, 3).join(' • ')
          );
        }
      } catch (error) {
        if (epochAtStart !== resultAuditEpochV189) return;
        const entry = {
          timestamp: new Date().toISOString(),
          fingerprint: '',
          ok: false,
          parTotal: '—',
          tiebreakOrder: [],
          rawTeams: [],
          expectedRows: [],
          expectedNotes: [],
          traces: [],
          actualRows: renderedSnapshot ? renderedSnapshot.rows : [],
          actualNotes: renderedSnapshot ? renderedSnapshot.notes : [],
          mismatches: [String(error && error.message || 'RESULT AUDIT FAILED')]
        };
        appendResultAuditV189(entry);
        addTestLog('RESULT AUDIT', 'FAILED', '—', entry.mismatches[0]);
      }
    }

    function captureTournamentSummaryAuditV189() {
      const renderedSnapshot = snapshotRenderedSummaryV189();
      if (!renderedSnapshot) return;
      const epochAtStart = resultAuditEpochV189;
      const promise = runSummaryResultAuditV189(renderedSnapshot, epochAtStart);
      pendingResultAuditsV189.add(promise);
      promise.finally(() => pendingResultAuditsV189.delete(promise));
    }

    function buildResultAuditReportV189() {
      const log = getResultAuditLogV189();
      const lines = [
        'SSHCP V19.4 RESULT LOG',
        'Generated: ' + new Date().toISOString(),
        'Tests: ' + log.length,
        ''
      ];
      log.forEach((entry, index) => {
        lines.push(formatResultAuditEntryV189(entry, index));
        lines.push('');
      });
      if (!log.length) lines.push('NO RESULT TESTS RECORDED');
      return lines.join('\n');
    }

    async function copyResultAuditLogV189() {
      if (pendingResultAuditsV189.size) {
        await Promise.allSettled([...pendingResultAuditsV189]);
      }
      const report = buildResultAuditReportV189();
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(report);
          copied = true;
        }
      } catch (_) {}
      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
        textarea.remove();
      }
      if (els.controlCenterResultsCheckButtonV188) {
        const original = 'COPY RESULT LOG';
        els.controlCenterResultsCheckButtonV188.textContent = copied ? 'COPIED' : 'COPY FAILED';
        setTimeout(() => {
          if (els.controlCenterResultsCheckButtonV188) {
            els.controlCenterResultsCheckButtonV188.textContent = original;
            requestAnimationFrame(fitTestPageButtonText);
          }
        }, 1200);
      }
      if (!copied) addTestLog('COPY RESULT LOG', 'FAILED', '—', 'CLIPBOARD UNAVAILABLE');
    }

    function buildTestLogReport() {
      const log = getTestLog();
      const directory = readStoredTestQrDirectory() || [];
      const assigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && item.assigned && item.team
      ).length;
      const unassigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && !item.assigned
      ).length;
      const cacheTimeRaw = Number(
        localStorage.getItem(SSHCP_TEST_QR_CACHE_TIME_KEY) || 0
      );

      const lines = [
        'SSHCP V19.4 CONTROL CENTER LOG',
        'Generated: ' + new Date().toISOString(),
        'Viewport: ' + controlCenterViewportLineV188(),
        'Geometry: ' + controlCenterGeometryLineV188(),
        'Worker: ' + CLOUDFLARE_API_URL,
        'Authorization: ' + getQrRole() +
          (getQrTeam() ? ' / ' + getQrTeam() : ''),
        'QR cache: ' +
          (directory.length
            ? directory.length + ' valid / ' + assigned + ' assigned / ' + unassigned + ' unassigned'
            : 'NOT LOADED'),
        'QR cache time: ' +
          (cacheTimeRaw ? new Date(cacheTimeRaw).toISOString() : '—'),
        'Log entries: ' + log.length,
        '',
        'TIME | ACTION | RESULT | TOTAL | DETAIL'
      ];

      log.slice().reverse().forEach(item => {
        lines.push(
          [
            item.timestamp || item.time || '',
            item.action || '',
            item.result || '',
            item.total || '—',
            item.detail || ''
          ].join(' | ')
        );
      });

      return lines.join('\n');
    }

    async function copyTestLog() {

    /* =========================================================
       SSHCP V16.27 — CONTROL CENTER / TEAMS POPUP
       CF V1.9 supplies all 36 fixed TEAMS slots from TEAMS!B1:F37.
       This frontend view is intentionally read-only: only assigned/active
       teams are displayed, and Google Sheets remains the sole edit surface.
       Refresh restore keeps the last rendered TEAMS snapshot visible while
       fresh data loads so no provisional giant-header geometry can flash.
       ========================================================= */

    let controlCenterTeamsData = [];
    const TEAMS_POPUP_OPEN_KEY_V1626 = 'sshcpTeamsPopupOpenV1626';
    const TEAMS_POPUP_SCROLL_KEY_V1626 = 'sshcpTeamsPopupScrollTopV1626';
    const TEAMS_POPUP_DATA_KEY_V1626 = 'sshcpTeamsPopupDataV1626';

    function teamsPopupWasOpenOnRefreshV1626() {

    function teamsPopupMeasureTextWidth(element, text, fontSize) {
      if (!teamsPopupTextMeasureContext) return 0;
      const style = getComputedStyle(element);
      const family = style.fontFamily || "'Oswald',Arial,sans-serif";
      const weight = style.fontWeight || '400';
      const fontStyle = style.fontStyle || 'normal';
      teamsPopupTextMeasureContext.font = fontStyle + ' ' + weight + ' ' + fontSize + 'px ' + family;
      let width = teamsPopupTextMeasureContext.measureText(String(text || '')).width;
      const spacing = parseFloat(style.letterSpacing);
      if (Number.isFinite(spacing) && spacing !== 0) {
        width += Math.max(0, String(text || '').length - 1) * spacing;
      }
      return width;
    }

    function teamsPopupTargetRatioV1626(element) {
      if (!element) return 0.60;
      if (element.closest('.teams-popup-row.header')) return 0.45;
      if (element.classList.contains('teams-popup-name')) return 0.60;
      if (element.classList.contains('teams-popup-hcp')) return 0.50;
      if (
        element.classList.contains('teams-popup-team') ||
        element.classList.contains('teams-popup-qr') ||
        element.classList.contains('teams-popup-hole')
      ) return 0.40;
      return 0.40;

    function fitTeamsPopupCellText(element) {
      if (!element) return;
      const rowHeight = Math.max(1, teamsPopupCalculatedRowHeightV1626 || 36);
      const target = rowHeight * teamsPopupTargetRatioV1626(element);
      const minimum = 7;
      const text = element.textContent || '';
      const available = Math.max(1, element.clientWidth - 6);
      let size = target;

      element.style.fontSize = size + 'px';
      while (size > minimum && teamsPopupMeasureTextWidth(element, text, size) > available) {
        size = Math.max(minimum, size - 0.5);
        element.style.fontSize = size + 'px';
      }
    }

    /* =========================================================
       SSHCP V5.3 QUICK TEST-WRITE PATCH
       - One retry for transient RANDOM 2 team writes.
       - HTTP status + Worker reason logged for bulk test failures.
       ========================================================= */

    /* =========================================================
       TEST PAGE — BULK SCORE CONTROLS
       ADD PAR / ADD RANDOM affect current teams. DELETE ALL clears all slots.
       ADD RANDOM 2 uses the existing verified saveScores path to create a
       stronger 68–74 round with 3–7 birdies, 3–7 bogeys and 0–2 eagles.
       ========================================================= */

    function randomIntInclusive(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffledIndexes(values) {
      const copy = [...values];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function generateRandom2Round(courseHoles) {
      const usable = Array.isArray(courseHoles) ? courseHoles.slice(0, 18) : [];
      if (usable.length !== 18) {
        throw new Error('ADD RANDOM 2 requires 18 course holes.');
      }

      const pars = usable.map(hole => Number(hole.par));
      if (pars.some(par => !Number.isFinite(par) || par <= 0)) {
        throw new Error('ADD RANDOM 2 could not read the course pars.');
      }

      const parTotal = pars.reduce((sum, par) => sum + par, 0);
      const eagleEligible = usable
        .map((hole, index) => Number(hole.par) >= 4 ? index : -1)
        .filter(index => index >= 0);

      const combinations = [];
      for (let eagles = 0; eagles <= 2; eagles++) {
        if (eagles > eagleEligible.length) continue;
        for (let birdies = 3; birdies <= 7; birdies++) {
          for (let bogeys = 3; bogeys <= 7; bogeys++) {
            if (eagles + birdies + bogeys > 18) continue;
            const total = parTotal - (2 * eagles) - birdies + bogeys;
            if (total >= 68 && total <= 74) {
              combinations.push({ eagles, birdies, bogeys, total });
            }
          }
        }
      }

      if (!combinations.length) {
        throw new Error('No 68–74 RANDOM 2 combination fits this course par.');
      }

      const combo = combinations[randomIntInclusive(0, combinations.length - 1)];
      const scores = [...pars];
      const used = new Set();

      shuffledIndexes(eagleEligible)
        .slice(0, combo.eagles)
        .forEach(index => {
          scores[index] = pars[index] - 2;
          used.add(index);
        });

      const birdiePool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      birdiePool.slice(0, combo.birdies).forEach(index => {
        scores[index] = pars[index] - 1;
        used.add(index);
      });

      const bogeyPool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      bogeyPool.slice(0, combo.bogeys).forEach(index => {
        scores[index] = pars[index] + 1;
        used.add(index);
      });

      return { scores, ...combo };
    }

    async function loadFreshTestScoreSource() {
      const response = await fetch(
        CLOUDFLARE_API_URL + '?refresh=' + Date.now() + '-random2',
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error('ADD RANDOM 2 could not load current teams.');
      }

      const data = await response.json();
      if (!data || data.ok !== true) {
        throw new Error((data && data.error) || 'ADD RANDOM 2 data unavailable.');
      }

      const freshHoles = Array.isArray(data.course && data.course.holes)
        ? data.course.holes.slice(0, 18)
        : [];
      const freshTeams = Array.isArray(data.teams)
        ? data.teams.filter(team => team && String(team.name || '').trim() !== '')
        : [];

      if (freshHoles.length !== 18 || !freshTeams.length) {
        throw new Error('ADD RANDOM 2 needs 18 holes and at least one current team.');
      }

      holes = freshHoles;
      teams = freshTeams;
      return { freshHoles, freshTeams };
    }

    async function runRandom2Current() {
      const { freshHoles, freshTeams } = await loadFreshTestScoreSource();
      const passkey = isMasterQr() && getQrPasskey()
        ? getQrPasskey()
        : SSHCP_MASTER_TEST_KEY;

      const generated = [];

      /* Sequential verified writes avoid concurrent Google Sheets test writes.
         A single transient Worker/Sheets failure gets one immediate retry. */
      for (const team of freshTeams) {
        const round = generateRandom2Round(freshHoles);
        let lastError = null;
        let verified = false;

        for (let attempt = 1; attempt <= 2 && !verified; attempt++) {
          try {
            const response = await fetch(
              CLOUDFLARE_API_URL +
                '?action=saveScores' +
                '&slot=' + encodeURIComponent(Number(team.slot)) +
                '&scores=' + encodeURIComponent(JSON.stringify(round.scores)) +
                '&passkey=' + encodeURIComponent(passkey) +
                '&refresh=' + Date.now() + '-' + attempt,
              { cache: 'no-store' }
            );

            let data = null;
            try { data = await response.json(); } catch (_) {}

            if (!response.ok) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'request failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            if (
              !data ||
              data.ok !== true ||
              data.verified !== true ||
              !scoresEqual(data.verifiedScores, round.scores)
            ) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'verification failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            verified = true;
          } catch (error) {
            lastError = error;
            if (attempt === 1) {
              await new Promise(resolve => setTimeout(resolve, 450));
            }
          }
        }

        if (!verified) {
          throw new Error(
            'ADD RANDOM 2 failed for ' + String(team.name || 'a team') +
            (lastError && lastError.message ? ' • ' + lastError.message : '')
          );
        }

        generated.push(round);
      }

      const totals = generated.map(round => round.total);
      const birdies = generated.map(round => round.birdies);
      const bogeys = generated.map(round => round.bogeys);
      const eagles = generated.map(round => round.eagles);

      return {
        ok: true,
        verified: true,
        affectedTeams: generated.length,
        random2Summary:
          Math.min(...totals) + '–' + Math.max(...totals) + ' TOTAL • ' +
          Math.min(...birdies) + '–' + Math.max(...birdies) + ' BIRDIES • ' +
          Math.min(...bogeys) + '–' + Math.max(...bogeys) + ' BOGEYS • ' +
          Math.min(...eagles) + '–' + Math.max(...eagles) + ' EAGLES'
      };
    }

    async function runTestScoreAction(mode, scope) {
      closeModal();
      startLoadingLine();

      const started = timerStart();
      const isPar = mode === 'par';
      const isRandom = mode === 'random';
      const isRandom2 = mode === 'random2';

      const actionLabel =
        isRandom2
          ? 'ADD RANDOM 2'
          : isRandom
            ? 'ADD RANDOM'
            : isPar
              ? 'ADD PAR'
              : 'DELETE ALL';

      try {
        let data;

        if (isRandom2) {
          data = await runRandom2Current();
        } else {
          const controlCenterPasskey =
            isMasterQr()
              ? getQrPasskey()
              : (
                  mode === 'clear' &&
                  scope === 'all' &&
                  isTeamQr() &&
                  getQrPasskey()
                )
                ? SSHCP_MASTER_TEST_KEY
                : '';

          const response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=testScores' +
              '&mode=' + encodeURIComponent(mode) +
              '&scope=' + encodeURIComponent(scope) +
              '&passkey=' + encodeURIComponent(controlCenterPasskey) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          let parsed = null;
          try { parsed = await response.json(); } catch (_) {}

          if (!response.ok) {
            const reason = parsed && (parsed.reason || parsed.error)
              ? String(parsed.reason || parsed.error)
              : 'request failed';
            throw new Error(actionLabel + ' failed • HTTP ' + response.status + ' • ' + reason);
          }

          data = parsed;
        }

        if (!data || data.ok !== true || data.verified !== true) {
          throw new Error(
            (data && data.error) ||
            (actionLabel + ' was not verified.')
          );
        }

        teams.forEach(team => {
          localStorage.removeItem(pendingScoresKey(team));
        });

        scorecardHasLoaded = false;
        leaderboardHasLoaded = false;
        sessionStorage.removeItem('sshcpScorecardSnapshotV53');
        sessionStorage.removeItem('sshcpLeaderboardSnapshotV53');

        const testDetailParts = [
          data.affectedTeams + ' team slot' +
            (Number(data.affectedTeams) === 1 ? '' : 's')
        ];

        if (mode === 'random' && data.randomMix) {
          testDetailParts.push(
            data.randomMix.birdiesPerTeam + ' BIRDIES / ' +
            data.randomMix.parsPerTeam + ' PARS / ' +
            data.randomMix.bogeysPerTeam + ' BOGEYS EACH'
          );
        }

        if (isRandom2 && data.random2Summary) {
          testDetailParts.push(data.random2Summary);
        }

        if (mode === 'clear' && scope === 'all') {
          /* V18.12: DELETE ALL behavior is unchanged. After the verified clear,
             start a fresh QA cycle and keep this successful DELETE ALL as the
             first visible row in the new Control Center log. */
          resetTestLog();
          addTestLog(
            actionLabel,
            'VERIFIED',
            timerSeconds(started) + 's',
            testDetailParts.join(' • ')
          );
        } else {
          addTestLog(
            actionLabel,
            'VERIFIED',
            timerSeconds(started) + 's',
            testDetailParts.join(' • ')
          );
        }

        completeLoadingLine();
        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' COMPLETE';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          data.affectedTeams +
          ' team slot' +
          (Number(data.affectedTeams) === 1 ? '' : 's') +
          ' verified.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', 'primary', closeModal);
        els.modalActions.className = 'modal-actions single test-success';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
      catch (error) {
        stopLoadingLine();

        addTestLog(
          actionLabel,
          'FAILED',
          timerSeconds(started) + 's',
          error && error.message ? error.message : 'Action failed'
        );

        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        closeModal();
        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' FAILED';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          error && error.message
            ? error.message
            : 'The score action could not be completed.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', '', closeModal);
        els.modalActions.className = 'modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
    }

    const sshcpRevealShieldsV177 = new Map();

    function removeDataRevealShieldV177(key, shield) {
      const active = sshcpRevealShieldsV177.get(key);
      const target = shield || active;
      if (target && target.parentNode) target.parentNode.removeChild(target);
      if (!shield || active === shield) sshcpRevealShieldsV177.delete(key);

    /* V17.11 — main-page Scorecard / Leaderboard shields deliberately ignore
       table/footer geometry. They cover the entire page content zone from just
       below the permanent HOME / event / INFO navigation to the bottom of the
       visible viewport. This hides first-load table construction and any
       completed-round footer/button rearrangement. Popup shields deliberately
       do NOT use this path. */
    function syncMainPageRevealGeometryV1710(shield, mode) {
      if (!shield) return false;

      let top = null;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!(viewportHeight > 0)) return false;

      if (mode === 'scorecard') {
        /* V18.6: Scorecard geometry is intentionally untouched. */
        const topAnchor = els.scorecardView && els.scorecardView.querySelector('.score-nav');
        if (!topAnchor) return false;
        const topRect = topAnchor.getBoundingClientRect();
        top = Math.ceil(topRect.bottom);
      } else if (mode === 'leaderboard') {
        /* V18.18: Leaderboard refresh protection starts at the exact bottom of
           the complete HOME / event / INFO nav row and covers the entire viewport
           below it. No mutable LIVE LEADERBOARD / FINAL RESULTS title, loading
           strip, table or footer geometry is allowed above the shield boundary. */
        const nav = els.leaderboardView && els.leaderboardView.querySelector('.leader-nav');
        if (!nav) return false;
        const navRect = nav.getBoundingClientRect();
        top = Math.floor(navRect.bottom);
      } else {
        return false;
      }

      top = Math.max(0, Math.min(viewportHeight - 1, top));
      shield.style.left = '0px';
      shield.style.right = '0px';
      shield.style.top = top + 'px';
      shield.style.bottom = '0px';
      shield.style.width = 'auto';
      shield.style.height = 'auto';
      return true;
    }

    function syncDataRevealShieldGeometryV177(shield, elements) {
      if (!shield || shield.classList.contains('full-screen-v177')) return true;

      const mainMode = shield.dataset.mainPageGeometryV1710 || '';
      if (mainMode) return syncMainPageRevealGeometryV1710(shield, mainMode);

      const rects = (Array.isArray(elements) ? elements : [elements])
        .filter(Boolean)
        .map(el => el.getBoundingClientRect())
        .filter(rect => rect.width > 0 && rect.height >= 0);

      if (!rects.length) return false;

      const left = Math.max(0, Math.min(...rects.map(rect => rect.left)));
      const top = Math.max(0, Math.min(...rects.map(rect => rect.top)));
      const right = Math.min(window.innerWidth || document.documentElement.clientWidth || 0, Math.max(...rects.map(rect => rect.right)));
      const bottom = Math.min(window.innerHeight || document.documentElement.clientHeight || 0, Math.max(...rects.map(rect => rect.bottom)));

      shield.style.left = Math.floor(left) + 'px';
      shield.style.top = Math.floor(top) + 'px';
      shield.style.width = Math.max(1, Math.ceil(right - left)) + 'px';
      shield.style.height = Math.max(1, Math.ceil(bottom - top)) + 'px';
      return true;
    }

    function beginDataRevealShieldV177(key, elements, color = '#fff', fullScreen = false, zIndex = 4900, mainPageGeometryV1710 = '') {
      removeDataRevealShieldV177(key);

      const shield = document.createElement('div');
      shield.className = 'sshcp-data-reveal-shield-v177' + (fullScreen ? ' full-screen-v177' : '');
      shield.setAttribute('aria-hidden', 'true');
      if (mainPageGeometryV1710) shield.dataset.mainPageGeometryV1710 = mainPageGeometryV1710;
      shield.style.background = color;
      shield.style.setProperty('z-index', String(zIndex), 'important');

      if (!fullScreen && !syncDataRevealShieldGeometryV177(shield, elements)) return null;

      document.body.appendChild(shield);
      sshcpRevealShieldsV177.set(key, shield);
      return shield;
    }

    /* V17.9 sequencing retained in V17.11 — the reveal itself is the gate. Callers that need
       automatic positioning can await this promise instead of guessing with a
       parallel timer. The timeout is only a transitionend safety fallback. */
    function revealDataShieldV177(key, shield) {
      return new Promise(resolve => {
        if (!shield || !shield.isConnected) {
          if (sshcpRevealShieldsV177.get(key) === shield) sshcpRevealShieldsV177.delete(key);
          resolve();
          return;
        }

        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          shield.removeEventListener('transitionend', onTransitionEnd);
          removeDataRevealShieldV177(key, shield);
          resolve();
        };
        const onTransitionEnd = event => {
          if (!event || event.propertyName === 'opacity') finish();
        };

        shield.addEventListener('transitionend', onTransitionEnd);
        shield.classList.add('is-revealing-v177');
        window.setTimeout(finish, 560);
      });
    }

    function revealDataShieldAfterLayoutV177(key, shield, frames = 2, elements = null) {
      return new Promise(resolve => {
        if (!shield) {
          resolve();
          return;
        }

        let remaining = Math.max(1, Number(frames) || 1);
        const step = () => {
          if (elements) syncDataRevealShieldGeometryV177(shield, elements);
          remaining -= 1;
          if (remaining <= 0) {
            revealDataShieldV177(key, shield).then(resolve);
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      const hadExistingScorecard =
        scorecardHasLoaded &&
        els.scoreRows &&
        els.scoreRows.children.length > 0;

      const scorecardRevealShieldV177 = beginScorecardRevealV177();

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();
        const scorecardRevealDoneV179 = revealDataShieldAfterLayoutV177(
          'scorecard',
          scorecardRevealShieldV177,
          2,
          [els.scorecardView && els.scorecardView.querySelector('.score-table-head'), els.scoreScroll]
        );

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        scorecardHasLoaded =
          true;

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {
          setTimeout(
            () => submitScores('refresh'),
            0
          );
        }

        /* V17.9 sequencing retained in V17.11: showScorecard() performs its active-hole positioning only
           after loadScorecard() returns. Hold that return until the .5s white
           reveal is completely finished, so reveal and scroll never overlap. */
        await scorecardRevealDoneV179;

      }
      catch (error) {

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreTimingDetail =
          '';

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'FAILED', scorecardLoadSeconds + 's', 'Request failed');
        stopLoadingLine();
        revealDataShieldAfterLayoutV177('scorecard', scorecardRevealShieldV177, 1);

        if (!hadExistingScorecard) {
          showLoadError(
            'Scorecard Could Not Load',
            'The ROTB scorecard could not be loaded.',
            async () => {
              closeModal();
              scorecardHasLoaded =
                false;
              await loadScorecard();
            }
          );
        }

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }
