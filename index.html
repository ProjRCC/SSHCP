    /* =========================================================
       SCORE ENTRY
       ========================================================= */


    function updateScoreEntryPreview() {
      if (
        activeScoreIndex === null ||
        !els.scoreEntryPreview
      ) {
        return;
      }

      const hole = holes[activeScoreIndex];
      if (!hole) return;

      const value = Number(els.scoreEntryInput.value);

      els.scoreEntryPreview.replaceChildren();

      if (
        !Number.isInteger(value) ||
        value <= 0
      ) {
        return;
      }

      els.scoreEntryPreview.appendChild(
        makeSubmittedScoreMark(
          value,
          Number(hole.par)
        )
      );
    }


    function openScoreEntry(
      index
    ) {

      const hole =
        holes[
          index
        ];


      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }


      activeScoreIndex =
        index;


      scoreEntryClosing =
        false;


      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;


      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;


      els.scoreEntryInput.value =
        String(
          localScores[index] === null
            ? hole.par
            : localScores[index]
        );

      updateScoreEntryPreview();


      els.scoreEntryOverlay
        .classList
        .add(
          'open'
        );


      // V7-CF.14: keyboard stays closed by default.
      els.scoreEntryInput.blur();


      positionScoreEntry();

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return {
          committed: false,
          cleared: false,
          index: null
        };

      }


      const index =
        activeScoreIndex;


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value < 0
      ) {

        return {
          committed: false,
          cleared: false,
          index
        };

      }


      if (
        value === 0
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      localScores[
        index
      ] =
        value;


      renderScorecard();
      syncPendingScoresStorage();


      addTestLog(
        'SCORE H' + (index + 1),
        'PENDING',
        '—',
        'Score ' + value + ' • auto-submit'
      );


      return {
        committed: true,
        cleared: false,
        index
      };

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      const commitResult =
        commitTypedValue
          ? commitScoreEntryValue()
          : {
              committed: false,
              cleared: false,
              index: activeScoreIndex
            };


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      /*
        V7-CF.11: A committed 0 OR blank value is handled as one atomic CLEAR.
        The popup is closed first, then the auto-submit is started.
        This avoids the old deferred clear/close race that could make
        Android Enter appear to require multiple attempts.

        Every committed score now starts the verified save immediately after
        the popup closes. If another score is entered while that save is
        in flight, one follow-up save is queued so the newer gray score is
        not overwritten or lost.
      */
      if (
        commitResult.committed
      ) {

        /*
          SSHCP V2.8 — ENTER advances immediately.
          A real entered score has already rerendered the next-hole gray
          indicator from localScores, and this moves the visible viewport
          at the same moment. CLEAR intentionally does not auto-advance.
          Gold remains verification-only.
        */
        if (!commitResult.cleared) {
          restoreScorePosition(true);
        }

        submitScores();

      }


      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function positionScoreEntry() {

      /*
        V7-CF.14: The score panel is intentionally anchored in the
        lower part of the screen for one-thumb use. CSS owns the
        position; opening the panel never summons the keyboard.
      */
      els.scoreEntryOverlay.style.paddingTop = '';

    }


    /* =========================================================
       CLOUDFLARE: VERIFIED SCORE WRITE
       Google Apps Script is NOT used.

       One request only:
       Worker writes -> reads Google Sheets back -> verifies.
       Gold score state is applied only after verified:true and
       exact verifiedScores match. No artificial wait. No same-attempt retry.
       ========================================================= */


    async function submitScores() {

      if (
        !selectedTeam ||
        !hasPendingScores()
      ) {
        return;
      }

      if (saveInProgress) {
        saveQueued = true;
        return;
      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      const started =
        timerStart();

      const expectedScores =
        normalizeScores(
          localScores
        );

      const expectedSlot =
        Number(
          selectedTeam.slot
        );

      const apiScores =
        expectedScores.map(
          score =>
            score === null
              ? ''
              : score
        );

      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            apiScores
          )
        );

      const url =
        CLOUDFLARE_API_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&passkey=' +
        encodeURIComponent(getQrPasskey()) +
        '&refresh=' +
        Date.now();

      startLoadingLine();

      try {

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Save request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true ||
          data.verified !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not verified.'
          );
        }

        const confirmedScores =
          normalizeScores(
            data.verifiedScores
          );

        if (
          !scoresEqual(
            confirmedScores,
            expectedScores
          )
        ) {
          throw new Error(
            'Verified scores did not match submitted scores.'
          );
        }

        /*
          V15.9 — determine whether this verified batch contains an
          entered score before replacing savedScores. This preserves the
          V15.8 behavior: ENTER may auto-position; CLEAR does not.
        */
        const shouldAutoPositionAfterSave =
          expectedScores.some(
            (score, index) =>
              score !== null &&
              score !== savedScores[index]
          );

        savedScores =
          [
            ...confirmedScores
          ];

        /*
          Do not overwrite localScores here. The player may already have
          entered another hole while this request was in flight. The
          verified snapshot becomes savedScores; any newer local difference
          stays gray and is sent by the queued save below.
        */
        syncPendingScoresStorage();

        const teamIndex =
          teams.findIndex(
            team =>
              Number(
                team.slot
              ) ===
              expectedSlot
          );

        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...confirmedScores
            ];

          selectedTeam =
            teams[
              teamIndex
            ];

        }

        syncPendingScoresStorage();
        renderScorecard();

        /*
          V15.9 — only an entered/verified score advances the visible
          scorecard position. Clearing a score still rerenders the
          scorecard and updates its hole indicator, but does not move
          the viewport.
        */
        if (shouldAutoPositionAfterSave) {
          restoreScorePosition();
        }

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'save'
          );

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'VERIFIED', scoreSaveSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

      }
      catch (error) {

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'FAILED', scoreSaveSeconds + 's', String(error && error.message ? error.message : 'Save failed'));
        stopLoadingLine();

        showMessageModal(
          'Save Not Confirmed',
          'Google Sheets did not confirm the new scores. Your entered scores remain gray. If they stay gray, refresh the page and ROTB will read the official scorecard, retry the pending scores, and verify them.'
        );

      }
      finally {

        saveInProgress =
          false;

        updateSubmitButtonState();

        if (saveQueued) {
          saveQueued = false;

          if (hasPendingScores()) {
            setTimeout(
              () => submitScores(),
              0
            );
          }
        }

      }

    }


    /* =========================================================
       CLOUDFLARE: LEADERBOARD READ
       Google Apps Script is NOT used.
       Fresh read every time LIVE LEADERBOARD is opened + manual REFRESH. No polling.
       ========================================================= */


    async function loadLeaderboard(
      showErrorIfEmpty
    ) {

      if (
        leaderboardLoadInProgress
      ) {
        return;
      }

      leaderboardLoadInProgress =
        true;

      stopLeaderboardRefreshCycle();

      resetLeaderboardToTop();

      els.leaderRefreshButton.disabled =
        true;

      const wasAlreadyLoaded =
        leaderboardHasLoaded;

      const started =
        timerStart();

      els.leaderUpdateNote.textContent =
        wasAlreadyLoaded
          ? 'Refreshing leaderboard...'
          : 'Loading leaderboard...';

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?action=leaderboard' +
          '&refresh=' +
          Date.now();

        /*
          If leaderboard is opened before scorecard, get team
          metadata in parallel so HCP fallback stays available.
          This is a Cloudflare read too — never Apps Script.
        */
        const teamMetadataPromise =
          teams.length
            ? Promise.resolve(null)
            : fetch(
                CLOUDFLARE_API_URL +
                '?refresh=' +
                Date.now() +
                '-teams',
                {
                  cache:
                    'no-store'
                }
              )
                .then(
                  response =>
                    response.ok
                      ? response.json()
                      : null
                )
                .catch(
                  () => null
                );

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Leaderboard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );
        }

        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];

        const teamMetadata =
          await teamMetadataPromise;

        if (
          teams.length === 0 &&
          teamMetadata &&
          teamMetadata.ok === true &&
          Array.isArray(
            teamMetadata.teams
          )
        ) {
          teams =
            teamMetadata.teams.filter(
              team =>
                team &&
                String(
                  team.name || ''
                ).trim() !== ''
            );
        }

        renderLeaderboard(
          rows
        );
        updateTournamentFinishState(
          rows
        );

        const renderedAt =
          timerStart();

        leaderboardTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        const seconds =
          timerSeconds(
            started
          );

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'OK', seconds + 's', leaderboardTimingDetail);

        leaderboardHasLoaded =
          true;

        els.leaderUpdateNote.textContent =
          'Tap REFRESH for latest standings';

        completeLoadingLine();

        if (currentView === 'leaderboard') {
          startLeaderboardRefreshCycle();
        }

      }
      catch (error) {

        const seconds =
          timerSeconds(
            started
          );

        leaderboardTimingDetail =
          '';

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'FAILED', seconds + 's', String(error && error.message ? error.message : 'Request failed'));
        stopLoadingLine();

        if (
          leaderboardHasLoaded
        ) {
          els.leaderUpdateNote.textContent =
            'Refresh failed • standings unchanged';

          if (currentView === 'leaderboard') {
            startLeaderboardRefreshCycle();
          }

          return;
        }

        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';

        if (
          showErrorIfEmpty
        ) {
          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {
              closeModal();
              await loadLeaderboard(
                true
              );
            }
          );
        }

      }
      finally {

        leaderboardLoadInProgress =
          false;

        els.leaderRefreshButton.disabled =
          false;

      }

    }


    /* =========================================================
       V14.1 — TOURNAMENT COMPLETION / PODIUM TIEBREAK
       ========================================================= */
    function tournamentIsComplete(rows) {
      return Array.isArray(rows) && rows.length > 0 &&
        rows.every(row => Number(row.thru) === 18);
    }

    function firstPlaceTiedRows(rows) {
      if (!Array.isArray(rows) || rows.length < 2) return [];
      const numericRows = rows.filter(row => Number.isFinite(Number(row.net)));
      if (numericRows.length < 2) return [];
      const bestNet = Math.min(...numericRows.map(row => Number(row.net)));
      return numericRows.filter(row => Number(row.net) === bestNet);
    }

    function tiebreakValue(row, index) {
      const raw = Array.isArray(row.tiebreakScores)
        ? row.tiebreakScores[index]
        : '';
      if (raw === '' || raw === null || raw === undefined) return NaN;
      return Number(raw);
    }

    function actualTiebreakHole(row, index) {
      const raw = Array.isArray(row?.tiebreakHoles)
        ? row.tiebreakHoles[index]
        : '';

      if (raw === '' || raw === null || raw === undefined) return '';
      return String(raw).trim();
    }

    function compareTiebreakRows(a, b) {
      const aScores = Array.isArray(a?.tiebreakScores) ? a.tiebreakScores : [];
      const bScores = Array.isArray(b?.tiebreakScores) ? b.tiebreakScores : [];
      const holeCount = Math.max(aScores.length, bScores.length);

      for (let index = 0; index < holeCount; index++) {
        const aScore = tiebreakValue(a, index);
        const bScore = tiebreakValue(b, index);
        if (!Number.isFinite(aScore) || !Number.isFinite(bScore)) return 0;
        if (aScore !== bScore) {
          return {
            order: aScore - bScore,
            decidingIndex: index
          };
        }
      }
      return { order: 0, decidingIndex: null };
    }

    function resolveTieGroup(rows) {
      const original = [...rows];
      const sorted = [...rows].sort((a, b) => {
        const result = compareTiebreakRows(a, b);
        return result && typeof result === 'object' ? result.order : 0;
      });
      return { original, sorted };
    }

    function resolveTieContenders(tied) {
      if (!Array.isArray(tied) || tied.length < 2) return null;

      let contenders = [...tied];

      const holeCount = Math.max(
        0,
        ...tied.map(row =>
          Array.isArray(row?.tiebreakScores)
            ? row.tiebreakScores.length
            : 0
        )
      );

      for (let index = 0; index < holeCount; index++) {
        const enteringHole = [...contenders];

        const scored = enteringHole.map(row => ({
          row,
          score: tiebreakValue(row, index)
        }));

        if (scored.some(item => !Number.isFinite(item.score))) {
          return {
            tied: [...tied],
            winner: null,
            decidingIndex: null,
            unresolved: true,
            decidingContenders: enteringHole
          };
        }

        const bestScore = Math.min(...scored.map(item => item.score));
        contenders = scored
          .filter(item => item.score === bestScore)
          .map(item => item.row);

        if (contenders.length === 1) {
          return {
            tied: [...tied],
            winner: contenders[0],
            decidingIndex: index,
            winningScore: bestScore,
            unresolved: false,
            decidingContenders: enteringHole
          };
        }
      }

      return {
        tied: [...tied],
        winner: null,
        decidingIndex: null,
        unresolved: true,
        decidingContenders: [...contenders]
      };
    }

    function resolveFirstPlaceTie(rows) {
      const tied = firstPlaceTiedRows(rows);
      if (tied.length < 2) return null;
      return resolveTieContenders(tied);
    }

    function ordinalNumber(number) {
      const n = Number(number);
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 13) return n + 'th';
      switch (n % 10) {
        case 1: return n + 'st';
        case 2: return n + 'nd';
        case 3: return n + 'rd';
        default: return n + 'th';
      }
    }

    function ordinalHandicapHole(index) {
      const number = Number(index) + 1;
      return Number.isFinite(number) && number > 0
        ? ordinalNumber(number) + ' Handicap Hole'
        : '';
    }

    function setLeaderboardFinalAction(mode) {
      if (!els.leaderFinalActionButton || !els.leaderTop) return;
      const button = els.leaderFinalActionButton;
      button.classList.remove('break-tie', 'tournament-summary', 'summary-label');

      if (!mode) {
        button.textContent = '';
        button.setAttribute('aria-hidden', 'true');
        els.leaderTop.classList.remove('final-action-active');
        return;
      }

      els.leaderTop.classList.add('final-action-active');
      button.setAttribute('aria-hidden', 'false');

      if (mode === 'break-tie') {
        button.innerHTML = '<span class="leader-final-main">BREAK TIE</span>';
        button.classList.add('break-tie');
      } else {
        const tied = firstPlaceTiedRows(lastLeaderboardRows);
        if (tied.length >= 2 && hasViewedTournamentTieBreak()) {
          button.innerHTML =
            '<span class="leader-final-main">SCRAMBLE SUMMARY*</span>';
        } else {
          button.innerHTML =
            '<span class="leader-final-main">SCRAMBLE SUMMARY</span>';
        }
        button.classList.add('tournament-summary', 'summary-label');
      }
    }

    function updateTournamentFinishState(rows) {
      lastLeaderboardRows = Array.isArray(rows) ? rows.map(row => ({ ...row })) : [];

      const complete = tournamentIsComplete(lastLeaderboardRows);
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;

      if (screen) {
        if (complete && els.leaderContent) {
          /* Preserve the proven leaderboard viewport height exactly.
             Only its vertical position changes in final-results mode. */
          const contentHeight =
            els.leaderContent.getBoundingClientRect().height;

          if (contentHeight > 0) {
            screen.style.setProperty(
              '--leader-final-content-height',
              contentHeight + 'px'
            );
          }
        }

        screen.classList.toggle(
          'tournament-complete',
          complete
        );
      }

      if (!complete) {
        resetTournamentTieBreakViewed();
        setLeaderboardFinalAction(null);
        return;
      }

      const tied = firstPlaceTiedRows(lastLeaderboardRows);
      if (tied.length < 2) {
        setLeaderboardFinalAction('tournament-summary');
        return;
      }

      setLeaderboardFinalAction(
        hasViewedTournamentTieBreak() ? 'tournament-summary' : 'break-tie'
      );
    }

    function joinTeamNames(rows) {
      const names = rows.map(row => displayTeamName(row.team || ''));
      if (names.length <= 1) return names[0] || '';
      if (names.length === 2) return names[0] + ' and ' + names[1];
      return names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1];
    }

    function showTieBreakResult() {
      const resolution = resolveFirstPlaceTie(lastLeaderboardRows);
      if (!resolution || resolution.tied.length < 2) {
        showTournamentSummary();
        return;
      }

      markTournamentTieBreakViewed();
      setLeaderboardFinalAction('tournament-summary');

      /* Re-render immediately so the resolved winner moves to #1 and
         receives the single asterisk on the normal leaderboard. */
      renderLeaderboard(lastLeaderboardRows);

      closeModal();
      els.modalOverlay.classList.add('tournament-result');
      els.modalTitle.textContent = 'TIE BREAK RESULT';
      els.modalTitle.classList.remove('testing');
      els.modalInput.style.display = 'none';

      if (!resolution.winner || resolution.decidingIndex === null) {
        els.modalBody.innerHTML =
          '<div class="tiebreak-winner">TIE REMAINS</div>' +
          '<div class="tiebreak-explanation">All configured Handicap Holes were used and the tie still remains.</div>';
      } else {
        const tiedNet = formatGolfScore(resolution.tied[0].net);
        const holeLabel = ordinalHandicapHole(resolution.decidingIndex);
        const actualHole = actualTiebreakHole(
          resolution.winner,
          resolution.decidingIndex
        );
        const actualHoleText = actualHole
          ? ' (Hole ' + actualHole + ')'
          : '';
        const priorCount = resolution.decidingIndex;
        const priorText = priorCount === 0 ? '' :
          (priorCount === 1 ? 'They remained tied on the 1st Handicap Hole.<br><br>' :
          'They remained tied through the first ' + priorCount + ' Handicap Holes.<br><br>');

        const losingScores = (resolution.decidingContenders || resolution.tied)
          .filter(row => row !== resolution.winner)
          .map(row => tiebreakValue(row, resolution.decidingIndex))
          .filter(score => Number.isFinite(score));
        const nextBest = losingScores.length ? Math.min(...losingScores) : null;
        const scoreText = Number.isFinite(nextBest)
          ? ', ' + resolution.winningScore + ' to ' + nextBest
          : '';

        els.modalBody.innerHTML =
          '<div class="tiebreak-winner">' +
          escapeHtml(displayTeamName(resolution.winner.team || '').toUpperCase()) +
          ' WINS</div>' +
          '<div class="tiebreak-explanation">' +
          escapeHtml(joinTeamNames(resolution.tied)) +
          ' finished tied at <strong>' + escapeHtml(tiedNet) + '</strong>.<br><br>' +
          priorText +
          escapeHtml(displayTeamName(resolution.winner.team || '')) +
          ' won on the <strong>' + escapeHtml(holeLabel) + '</strong>' +
          (actualHoleText
            ? ' <strong>' + escapeHtml(actualHoleText) + '</strong>'
            : '') +
          escapeHtml(scoreText) + '.</div>';
      }

      const back = makeModalButton('BACK', '', closeModal);
      const summary = makeModalButton(
        'SCRAMBLE SUMMARY',
        'tournament-summary-button',
        showTournamentSummary
      );
      els.modalActions.className = 'modal-actions';
      els.modalActions.replaceChildren(back, summary);
      els.modalOverlay.classList.add('open');
    }

    function getSummaryHandicap(row) {
      const match = teams.find(team => Number(team.slot) === Number(row.slot));
      const candidates = [
        row.handicap,
        row.hcp,
        row.teamHandicap,
        row.teamHcp,
        match ? match.handicap : undefined,
        match ? match.hcp : undefined
      ];
      const direct = candidates.find(value =>
        value !== undefined && value !== null && String(value).trim() !== ''
      );
      let hcp = Number(direct);
      if (!Number.isFinite(hcp)) {
        const gross = Number(row.gross);
        const net = Number(row.net);
        if (Number.isFinite(gross) && Number.isFinite(net)) {
          hcp = Math.abs(gross - net);
        }
      }
      return Number.isFinite(hcp) ? Math.abs(hcp) : null;
    }

    function buildTournamentPodium(rows) {
      const source = Array.isArray(rows)
        ? rows.filter(row => row && Number.isFinite(Number(row.net)))
        : [];

      /* Base tournament order is net score, then stable team slot order.
         Slot order is the clean fallback for any places we do NOT explicitly
         resolve by tiebreak. */
      const base = [...source].sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      const annotations = new Map();
      const podiumRows = [];
      const remaining = [...base];

      /* Resolve ONLY podium places. For each place, find everyone tied on the
         best remaining NET score, resolve that tie through handicap holes,
         remove the winner, then repeat for the next podium place. */
      for (let place = 1; place <= 3 && remaining.length; place++) {
        const bestNet = Number(remaining[0].net);
        const tiedGroup = remaining.filter(
          row => Number(row.net) === bestNet
        );

        let winner = tiedGroup[0];
        let resolution = null;

        if (tiedGroup.length > 1) {
          resolution = resolveTieContenders(tiedGroup);

          if (resolution && resolution.winner) {
            winner = resolution.winner;
          }
        }

        podiumRows.push(winner);

        const removeIndex = remaining.indexOf(winner);
        if (removeIndex >= 0) remaining.splice(removeIndex, 1);

        if (
          resolution &&
          resolution.winner &&
          resolution.decidingIndex !== null
        ) {
          if (place === 1) {
            const actualHole = actualTiebreakHole(
              winner,
              resolution.decidingIndex
            );

            annotations.set(winner, {
              marks: '*',
              note:
                '* Won on ' +
                ordinalHandicapHole(resolution.decidingIndex) +
                (actualHole ? ' (Hole ' + actualHole + ')' : '')
            });
          }
          else {
            annotations.set(winner, {
              marks: '**',
              note:
                '** Won ' +
                place +
                ordinalSuffix(place) +
                '-place tiebreak on ' +
                ordinalHandicapHole(resolution.decidingIndex)
            });
          }
        }
      }

      /* Everything after 3rd is intentionally NOT further tiebroken.
         Preserve clean NET grouping and team/slot order inside each tie. */
      remaining.sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      return {
        ordered: [...podiumRows, ...remaining],
        annotations,
        firstTie: firstPlaceTiedRows(source)
      };
    }

    function ordinalSuffix(number) {
      if (number === 1) return 'st';
      if (number === 2) return 'nd';
      if (number === 3) return 'rd';
      return 'th';
    }

    function tournamentSummaryRows(rows, resolution) {
      return buildTournamentPodium(rows).ordered;
    }

    function competitionPlaces(rows) {
      const places = [];
      let previousNet = null;
      let previousPlace = 0;

      rows.forEach((row, index) => {
        const currentNet = Number(row.net);
        if (
          index > 0 &&
          Number.isFinite(currentNet) &&
          Number.isFinite(previousNet) &&
          currentNet === previousNet
        ) {
          places.push(previousPlace);
        } else {
          previousPlace = index + 1;
          places.push(previousPlace);
        }
        previousNet = currentNet;
      });

      return places;
    }

    function fitTournamentSummaryRemaining() {
      if (!els.modalOverlay.classList.contains('tournament-summary')) return;

      const body = els.modalBody;
      const remaining = body.querySelector('.tournament-summary-remaining');
      const rows = remaining
        ? Array.from(remaining.querySelectorAll('.tournament-summary-remaining-row'))
        : [];

      const root = document.documentElement;
      const teamCount = Math.min(10, Math.max(3, lastLeaderboardRows.length || 3));

      /* Preserve the locked V14.12 card geometry:
         3 teams = 60% tall; 10 teams = 80% tall; linear between. */
      const edgePct = 20 - ((teamCount - 3) / 7) * 10;
      root.style.setProperty('--ts-edge', edgePct.toFixed(3) + '%');

      root.style.removeProperty('--ts-lower-font');
      root.style.removeProperty('--ts-note-font');

      if (!remaining || !rows.length) return;

      const noteFont = Math.min(17, Math.max(13, window.innerWidth * 0.035));
      root.style.setProperty('--ts-note-font', noteFont + 'px');

      /* The lower table already flexes into the exact remaining space.
         Derive font size from its REAL rendered row allowance. */
      requestAnimationFrame(() => {
        if (!remaining.isConnected || !rows.length) return;

        const lowerHeight = remaining.getBoundingClientRect().height;
        const rowHeight = lowerHeight / rows.length;

        const topGrid = body.querySelector('.tournament-summary-grid');
        const thirdPlaceTeam = topGrid
          ? topGrid.querySelector('.tournament-summary-row.place-3 .tournament-summary-team')
          : null;

        const thirdFont = thirdPlaceTeam
          ? parseFloat(getComputedStyle(thirdPlaceTeam).fontSize)
          : Math.min(24, Math.max(18, window.innerWidth * 0.05));

        /* Normal target = 95% of 3rd-place team font.
           Extreme crushed screens shrink from actual row height so rows cannot overlap. */
        const targetFont = thirdFont * 0.95;
        const fitFont = Math.max(9, Math.min(targetFont, rowHeight * 0.56));

        root.style.setProperty('--ts-lower-font', fitFont + 'px');
      });
    }

    function showTournamentSummary() {
      if (!tournamentIsComplete(lastLeaderboardRows)) {
        closeModal();
        return;
      }

      const podium = buildTournamentPodium(lastLeaderboardRows);
      const rows = podium.ordered.slice(0, 10);
      const places = competitionPlaces(rows);

      function summaryPlaceLabel(rowIndex) {
        if (rowIndex < 3) return String(rowIndex + 1);

        const row = rows[rowIndex];
        if (!row) return '';

        const currentNet = Number(row.net);
        const priorSameNet = rows
          .slice(3, rowIndex)
          .some(item => Number(item.net) === currentNet);

        const laterSameNet = rows
          .slice(rowIndex + 1)
          .some(item => Number(item.net) === currentNet);

        /* Podium has already been explicitly resolved. The first unresolved
           row starts at place 4. Any tied NET group from there is shown as
           T4 / T5 / etc rather than pretending additional places were won. */
        let unresolvedPlace = 4;
        for (let i = 3; i < rowIndex; i++) {
          if (Number(rows[i].net) < currentNet) unresolvedPlace++;
        }

        return (priorSameNet || laterSameNet)
          ? 'T' + unresolvedPlace
          : String(unresolvedPlace);
      }

      closeModal();
      els.modalOverlay.classList.add('tournament-summary');
      els.modalTitle.textContent = 'SCRAMBLE SUMMARY';
      els.modalTitle.classList.remove('testing');
      els.modalInput.style.display = 'none';

      let html =
        '<div class="tournament-summary-subtitle">' + (lastLeaderboardRows.length >= 10 ? 'TOP 10' : 'RESULTS') + '</div>' +
        '<div class="tournament-summary-grid">' +
        '<div class="tournament-summary-row header">' +
        '<div>#</div><div>TEAM</div><div>NET STROKES</div><div>NET SCORE</div>' +
        '</div>';

      rows.slice(0, 3).forEach((row, index) => {
        const annotation = podium.annotations.get(row);
        const marks = annotation ? annotation.marks : '';
        const leftMarks = marks ? marks + ' ' : '';
        const rightMarks = marks ? ' ' + marks : '';
        const hcp = getSummaryHandicap(row);
        const strokesText =
          String(row.totalStrokes ?? '') +
          (hcp === null ? '' : ' (HCP ' + hcp + ')');

        html +=
          '<div class="tournament-summary-row place-' + (index + 1) + '">' +
          '<div class="tournament-summary-place">' + escapeHtml(String(index + 1)) + '</div>' +
          '<div class="tournament-summary-team">' +
          escapeHtml(leftMarks) + escapeHtml(displayTeamName(row.team || '')) +
          escapeHtml(rightMarks) + '</div>' +
          '<div class="tournament-summary-strokes">' + escapeHtml(strokesText) + '</div>' +
          '<div class="tournament-summary-net ' + scoreClass(row.net) + '">' +
          escapeHtml(formatGolfScore(row.net)) + '</div>' +
          '</div>';
      });

      html += '</div>';

      const notes = [];
      rows.slice(0, 3).forEach(row => {
        const annotation = podium.annotations.get(row);
        if (annotation && annotation.note && !notes.includes(annotation.note)) {
          notes.push(annotation.note);
        }
      });
      if (notes.length) {
        html += '<div class="tournament-summary-notes">' +
          notes.map(note =>
            '<div class="tournament-summary-note">' + escapeHtml(note) + '</div>'
          ).join('') +
          '</div>';
      }

      if (rows.length > 3) {
        html += '<div class="tournament-summary-remaining">';
        rows.slice(3).forEach((row, index) => {
          const rowIndex = index + 3;
          const place = summaryPlaceLabel(rowIndex);
          const hcp = getSummaryHandicap(row);
          const strokesText =
            String(row.totalStrokes ?? '') +
            (hcp === null ? '' : ' (HCP ' + hcp + ')');
          html +=
            '<div class="tournament-summary-remaining-row">' +
            '<div class="tournament-summary-remaining-cell place">' + escapeHtml(String(place)) + '</div>' +
            '<div class="tournament-summary-remaining-cell team">' + escapeHtml(displayTeamName(row.team || '')) + '</div>' +
            '<div class="tournament-summary-remaining-cell net-strokes">' + escapeHtml(strokesText) + '</div>' +
            '<div class="tournament-summary-remaining-cell net-score ' + scoreClass(row.net) + '">' +
            escapeHtml(formatGolfScore(row.net)) + '</div>' +
            '</div>';
        });
        html += '</div>';
      }

      els.modalBody.innerHTML = html;
      const back = makeModalButton('BACK', '', closeModal);
      els.modalActions.className = 'modal-actions single';
      els.modalActions.replaceChildren(back);
      els.modalOverlay.classList.add('open');

      requestAnimationFrame(fitTournamentSummaryRemaining);
    }

    function handleLeaderboardFinalAction() {
      if (!tournamentIsComplete(lastLeaderboardRows)) return;
      const tied = firstPlaceTiedRows(lastLeaderboardRows);
      if (tied.length >= 2 && !hasViewedTournamentTieBreak()) {
        showTieBreakResult();
        return;
      }
      showTournamentSummary();
    }

    /* =========================================================
       LEADERBOARD RENDER
       ========================================================= */


    function renderLeaderboard(
      rows
    ) {

      /* SSHCP V2.8 — Once the tournament is complete, the normal leaderboard
         keeps the existing resolved podium ordering. Scramble Summary uses
         that same top-three logic, but does not resolve places 4 and below.
         A first-place tie still remains unrevealed until BREAK TIE is viewed. */
      if (tournamentIsComplete(rows)) {
        const firstTie = firstPlaceTiedRows(rows);
        const mayShowResolvedPodium =
          firstTie.length < 2 || hasViewedTournamentTieBreak();

        if (mayShowResolvedPodium) {
          const podium = buildTournamentPodium(rows);
          const podiumOrder = new Map(
            podium.ordered.map((row, index) => [Number(row.slot), index])
          );

          rows = [...rows].sort((a, b) => {
            const aNet = Number(a.net);
            const bNet = Number(b.net);

            if (Number.isFinite(aNet) && Number.isFinite(bNet) && aNet !== bNet) {
              return aNet - bNet;
            }

            const aOrder = podiumOrder.get(Number(a.slot));
            const bOrder = podiumOrder.get(Number(b.slot));

            if (Number.isFinite(aOrder) && Number.isFinite(bOrder)) {
              return aOrder - bOrder;
            }
            return 0;
          });
        }
      }

      els.leaderRows.innerHTML =
        '';

      if (els.leaderContent) {
        els.leaderContent.classList.toggle(
          'short-leaderboard',
          Array.isArray(rows) && rows.length < 8
        );
      }


      let previousNet = null;
      let previousPlace = 0;

      const authorizedTeamName =
        normalizeName(
          getAuthorizedTeam() || ''
        );

      rows.forEach(
        (row, index) => {

          const netKey = Number(row.net);
          const samePlace = index > 0 && Number.isFinite(netKey) && Number.isFinite(previousNet) && netKey === previousNet;
          const place = samePlace ? previousPlace : index + 1;
          previousNet = netKey;
          previousPlace = place;

          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';
          line.dataset.team = normalizeName(row.team || '');

          const placeCell = document.createElement('div');
          placeCell.className = 'leader-place-cell';
          placeCell.textContent = String(place);

          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';

          if (
            authorizedTeamName &&
            line.dataset.team === authorizedTeamName
          ) {
            teamCell.classList.add(
              'authorized-team-cell'
            );
          }


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          const completedTieResolution =
            tournamentIsComplete(rows) &&
            hasViewedTournamentTieBreak()
              ? resolveFirstPlaceTie(rows)
              : null;

          teamName.textContent =
            displayTeamName(row.team || '') +
            (
              completedTieResolution &&
              completedTieResolution.winner === row
                ? '*'
                : ''
            );


          const hcpCell =
            document.createElement(
              'div'
            );


          hcpCell.className =
            'leader-hcp-cell';


          /*
            HCP SOURCE — OFFICIAL LEADERBOARD:
            Prefer an explicit handicap value if Cloudflare supplies one.
            If it does not, derive the handicap directly from the official
            leaderboard values: GROSS - NET. This keeps HCP correct even
            when the leaderboard response does not expose a separate HCP field.
          */
          const match =
            teams.find(
              team =>
                Number(
                  team.slot
                ) ===
                Number(
                  row.slot
                )
            );


          const directHandicapCandidates = [
            row.handicap,
            row.hcp,
            row.teamHandicap,
            row.teamHcp,
            match
              ? match.handicap
              : undefined,
            match
              ? match.hcp
              : undefined
          ];


          let handicapValue =
            directHandicapCandidates.find(
              value =>
                value !== undefined &&
                value !== null &&
                String(
                  value
                ).trim() !== ''
            );


          let handicapNumber =
            Number(
              handicapValue
            );


          if (
            !Number.isFinite(
              handicapNumber
            )
          ) {

            const grossNumber =
              Number(
                row.gross
              );

            const netNumber =
              Number(
                row.net
              );


            if (
              Number.isFinite(
                grossNumber
              ) &&
              Number.isFinite(
                netNumber
              )
            ) {

              handicapNumber =
                Math.abs(
                  grossNumber -
                  netNumber
                );

            }

          }


          hcpCell.textContent =
            Number.isFinite(
              handicapNumber
            )
              ? (
                  handicapNumber === 0
                    ? '-'
                    : String(
                        Math.abs(
                          handicapNumber
                        )
                      )
                )
              : '-';


          teamCell.append(
            teamName
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';

          /*
            V15.13 — STATUS progress background.
            Fill left to right in 18 equal hole segments.
          */
          const throughProgress =
            Math.max(
              0,
              Math.min(
                18,
                Number(row.thru) || 0
              )
            );

          throughCell.style.setProperty(
            '--thru-progress',
            `${(throughProgress / 18) * 100}%`
          );


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );


          throughLabel.className =
            'leader-through-label';


          const throughWord =
            document.createElement(
              'span'
            );


          throughWord.className =
            'leader-through-word';


          throughWord.textContent =
            'THRU ';


          const throughValue =
            document.createElement(
              'span'
            );


          throughValue.className =
            'leader-through-value' +
            (
              Number(row.thru) > 0
                ? ' has-progress'
                : ''
            );


          throughValue.textContent =
            row.thru;


          throughLabel.append(
            throughWord,
            throughValue
          );


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            placeCell,
            teamCell,
            hcpCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );


          /*
            V7-CF.12: Normal one-line team names are about 20% larger.
            If that larger size would not fit, fall back to the prior
            mobile size rather than wrapping onto a second line.
          */
          if (
            teamName.scrollWidth >
            teamName.clientWidth
          ) {

            teamName.style.fontSize =
              '17px';

          }

        }
      );

      sizeLeaderboardRows();
      scheduleLeaderboardAutoScroll();

    }

    /* =========================================================
       V9.10 — LEADERBOARD ROW SIZING
       The existing fixed UI keeps its V9.9 dimensions. Because
       .leader-content flexes into only the remaining screen space,
       dividing its inner height by 8 produces exactly eight visible rows.
       ========================================================= */

    /* =========================================================
       V12 — RESPONSIVE LEADERBOARD TYPOGRAPHY
       All row typography is driven from the actual leaderboard row height.
       Width fitting is shared by column group, never row-by-row.
       ========================================================= */

    function fitLeaderboardTypography() {
      if (!els.leaderRows) {
        return;
      }

      const row =
        els.leaderRows.querySelector(
          '.leader-row'
        );

      if (!row) {
        return;
      }

      const rowHeight =
        row.getBoundingClientRect().height;

      if (
        !Number.isFinite(rowHeight) ||
        rowHeight <= 0
      ) {
        return;
      }

      const root =
        els.leaderRows;

      /* V12.14 agreed body typography:
         TEAM 40% RH
         TOTAL 60% RH
         PLACE 33% RH
         HCP 66% of PLACE
         STATUS score 35% RH
         STATUS THRU/hole 28% RH */
      const teamSize =
        rowHeight * 0.40;

      const totalSize =
        rowHeight * 0.60;

      let placeSize =
        rowHeight * 0.33;

      let hcpSize =
        placeSize * 0.66;

      let statusScoreSize =
        rowHeight * 0.35;

      let statusThruSize =
        rowHeight * 0.28;

      const statusGap =
        rowHeight * 0.05;

      const setSizes = () => {
        root.style.setProperty(
          '--leader-team-font',
          teamSize + 'px'
        );

        root.style.setProperty(
          '--leader-total-font',
          totalSize + 'px'
        );

        root.style.setProperty(
          '--leader-place-font',
          placeSize + 'px'
        );

        root.style.setProperty(
          '--leader-hcp-font',
          hcpSize + 'px'
        );

        root.style.setProperty(
          '--leader-status-score-font',
          statusScoreSize + 'px'
        );

        root.style.setProperty(
          '--leader-status-thru-font',
          statusThruSize + 'px'
        );

        root.style.setProperty(
          '--leader-status-gap',
          statusGap + 'px'
        );
      };

      setSizes();

      /* PLACE/HCP stay uniform across rows and preserve their relationship
         if the narrow columns require one common reduction. */
      let placeHcpScale = 1;

      root
        .querySelectorAll(
          '.leader-place-cell, .leader-hcp-cell'
        )
        .forEach(
          element => {
            const available =
              element.clientWidth;

            const needed =
              element.scrollWidth;

            if (
              available > 0 &&
              needed > available
            ) {
              placeHcpScale =
                Math.min(
                  placeHcpScale,
                  available / needed
                );
            }
          }
        );

      placeSize *= placeHcpScale;
      hcpSize *= placeHcpScale;

      /* STATUS score and THRU/hole have separate agreed RH targets.
         If width requires reduction, shrink both by the same factor. */
      let statusScale = 1;

      root
        .querySelectorAll(
          '.leader-through-score, .leader-through-label'
        )
        .forEach(
          element => {
            const available =
              element.clientWidth;

            const needed =
              element.scrollWidth;

            if (
              available > 0 &&
              needed > available
            ) {
              statusScale =
                Math.min(
                  statusScale,
                  available / needed
                );
            }
          }
        );

      statusScoreSize *= statusScale;
      statusThruSize *= statusScale;

      setSizes();

      /* TEAM is 40% RH by default.
         Every name may use at most two lines.
         Only names that would exceed two lines are reduced. */
      root
        .querySelectorAll(
          '.leader-team-name'
        )
        .forEach(
          element => {
            element.style.removeProperty(
              'font-size'
            );

            const name =
              (element.textContent || '').trim();

            if (!name) {
              return;
            }

            const maxFont =
              teamSize;

            const minFont =
              Math.max(
                11,
                teamSize * 0.52
              );

            let fontSize =
              maxFont;

            element.style.setProperty(
              'font-size',
              fontSize + 'px',
              'important'
            );

            while (fontSize > minFont) {
              const computed =
                getComputedStyle(element);

              const lineHeight =
                parseFloat(computed.lineHeight) ||
                fontSize;

              const maxTwoLineHeight =
                lineHeight * 2 + 1;

              const fitsTwoLines =
                element.scrollHeight <=
                maxTwoLineHeight;

              const fitsWidth =
                element.scrollWidth <=
                element.clientWidth + 1;

              if (
                fitsTwoLines &&
                fitsWidth
              ) {
                break;
              }

              fontSize -= 0.5;

              element.style.setProperty(
                'font-size',
                fontSize + 'px',
                'important'
              );
            }
          }
        );
    }

    function sizeLeaderboardRows() {
      if (!els.leaderContent) {
        return;
      }

      const bodyHeight = els.leaderContent.clientHeight;

      if (!Number.isFinite(bodyHeight) || bodyHeight <= 0) {
        return;
      }

      const rowHeight = bodyHeight / 8;

      els.leaderContent.style.setProperty(
        '--leader-row-height',
        rowHeight + 'px'
      );

      requestAnimationFrame(
        fitLeaderboardTypography
      );
    }


    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);
        leaderboardAutoScrollTimer = null;
      }
    }

    function resetLeaderboardToTop() {
      cancelLeaderboardAutoScroll();

      if (els.leaderContent) {
        els.leaderContent.scrollTop = 0;
      }

      window.scrollTo(0, 0);
    }

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          /* V15.12:
             Keep the initial visible leaderboard untouched when the
             authorized team is already on screen.

             For an authorized team below that initial view, position by
             current leaderboard place — never by hard-coded team number:
               • last place:        0.0 rows visible below
               • second-to-last:    1.0 row visible below
               • third-to-last:     1.5 rows visible below
               • fourth-to-last+:   2.5 rows visible below

             This preserves a partial-row cue when more teams remain below,
             while naturally tapering at the bottom of any leaderboard size. */
          const rowHeight =
            target.offsetHeight;

          const targetIndex =
            Array.prototype.indexOf.call(
              els.leaderRows.children,
              target
            );

          if (targetIndex < 8) {
            return;
          }

          const totalRows =
            els.leaderRows.children.length;

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          const rowsBelow =
            totalRows - targetIndex - 1;

          let desiredRowsBelow;

          if (rowsBelow <= 0) {
            desiredRowsBelow = 0;
          } else if (rowsBelow === 1) {
            desiredRowsBelow = 1;
          } else if (rowsBelow === 2) {
            desiredRowsBelow = 1.5;
          } else {
            desiredRowsBelow = 2.5;
          }

          /*
            Eight rows are visible. To leave N rows beneath the authorized
            row, place it at visible index 7 - N.
          */
          const visibleTargetIndex =
            7 - desiredRowsBelow;

          const preferredScroll =
            Math.max(
              0,
              (targetIndex - visibleTargetIndex) *
              rowHeight
            );

          const desired =
            Math.min(
              preferredScroll,
              maxScroll
            );

          els.leaderContent.scrollTo({
            top: desired,
            behavior: 'smooth'
          });
        },
        1500
      );
    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }

        '<div class="quick-guide-footnote">*Closing Browser/Site will NOT reset scores*</div>' 


      els.modalInput.style.display =
        'none';


      const close =
        makeModalButton(
          'CLOSE',
          'primary',
          closeModal
        );


      els.modalActions.className =
        'modal-actions single';


      els.modalActions.replaceChildren(
        close
      );


      els.modalOverlay
        .classList
        .add(
          'open'
        );

    }


    function closeModal() {

      els.modalOverlay
        .classList
        .remove(
          'open',
          'authorization',
          'reset-authorization',
          'quick-guide',
          'switch-authorization',
          'tournament-result',
          'tournament-summary'
        );


      els.modalTitle
        .classList
        .remove(
          'testing'
        );


      els.modalInput.blur();


      els.modalInput.style.display =
        'none';


      els.modalInput.value =
        '';


      els.modalInput.removeAttribute('maxlength');

      els.modalInput.onkeydown =
        null;


      els.modalActions.innerHTML =
        '';


      els.modalActions.className =
        'modal-actions';

    }


    function escapeHtml(
      value
    ) {

      return String(
        value
      )
        .replaceAll(
          '&',
          '&amp;'
        )
        .replaceAll(
          '<',
          '&lt;'
        )
        .replaceAll(
          '>',
          '&gt;'
        )
        .replaceAll(
          '"',
          '&quot;'
        )
        .replaceAll(
          "'",
          '&#039;'
        );

    }


    /* =========================================================
       LOADING LINE
       ========================================================= */


    function startLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'done'
        );


      els.topLoading
        .classList
        .add(
          'active'
        );

    }


    function completeLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active'
        );


      els.topLoading
        .classList
        .add(
          'done'
        );


      setTimeout(
        () => {

          els.topLoading
            .classList
            .remove(
              'done'
            );

        },
        300
      );

    }


    function stopLoadingLine() {

      els.topLoading
        .classList
        .remove(
          'active',
          'done'
        );

    }


    /* =========================================================
       EVENTS
       ========================================================= */


    els.homeScorecardButton
      .addEventListener(
        'click',
        homeScorecardAccess
      );




    els.homeTeamArrowButton
      .addEventListener(
        'click',
        event => {
          event.stopPropagation();
          if (els.homeTeamDropup.classList.contains('open')) closeHomeTeamDropup();
          else openHomeTeamDropup();
        }
      );

    if (els.teamMenuBackdrop) {
      els.teamMenuBackdrop.addEventListener('click', closeAllTeamMenus);
    }

    els.testLogHotspot.addEventListener('click', showTestLog);
    els.testLogHomeButton.addEventListener('click', showHome);
    els.testLogCloseButton.addEventListener('click', showHome);
    els.testLogResetButton.addEventListener('click', resetTestLog);
    if (els.testCopyLogButton) els.testCopyLogButton.addEventListener('click', copyTestLog);
    if (els.testSwitchAuthorizationButton) els.testSwitchAuthorizationButton.addEventListener('click', showSwitchAuthorization);
    if (els.testValidQrListButton) els.testValidQrListButton.addEventListener('click', runAssignedPasskeyLoad);
    if (els.testDeleteCacheButton) els.testDeleteCacheButton.addEventListener('click', deleteTestQrCache);
    if (els.testRemoveAuthorizationButton) els.testRemoveAuthorizationButton.addEventListener('click', removeQrAuthorization);
    if (els.testTeamAuthorizationCheck) {
      els.testTeamAuthorizationCheck.checked = isTeamAuthorizationEnabled();
      els.testTeamAuthorizationCheck.addEventListener('change', event => setTeamAuthorizationEnabled(event.target.checked));
    }
    if (els.testQrCameraInput) els.testQrCameraInput.addEventListener('change', event => decodeQrImage(event.target.files && event.target.files[0]));
    els.testAddParCurrentButton.addEventListener('click', () => showTestScoreWarning('par', 'current'));
    els.testAddRandomCurrentButton.addEventListener('click', () => showTestScoreWarning('random', 'current'));
    els.testDeleteCurrentButton.addEventListener('click', () => showTestScoreWarning('clear', 'current'));
    els.testDeleteAllButton.addEventListener('click', () => showTestScoreWarning('clear', 'all'));


    els.homeLeaderboardButton
      .addEventListener(
        'click',
        showLeaderboard
      );


    if (els.resetUserButton) {
      els.resetUserButton.addEventListener('click', resetUser);
    }


    els.scoreHomeButton
      .addEventListener(
        'click',
        showHome
      );


    els.leaderHomeButton
      .addEventListener(
        'click',
        showHome
      );


    els.scoreLeaderboardButton
      .addEventListener(
        'click',
        showLeaderboard
      );


    els.leaderRefreshButton
      .addEventListener(
        'click',
        () => {

          loadLeaderboard(
            false
          );

        }
      );



    els.leaderFinalActionButton
      .addEventListener(
        'click',
        handleLeaderboardFinalAction
      );


    els.leaderScorecardButton
      .addEventListener(
        'click',
        showScorecard
      );


    els.submitBtn
      .addEventListener(
        'click',
        submitScores
      );


    document
      .querySelectorAll(
        '[data-guide]'
      )
      .forEach(
        button => {

          button.addEventListener(
            'click',
            showQuickGuide
          );

        }
      );


    els.scoreScroll
      .addEventListener(
        'scroll',
        rememberScorePosition,
        {
          passive:
            true
        }
      );


    els.scoreTeamSelectButton
      .addEventListener(
        'click',
        toggleScoreTeamDropdown
      );


    /*
      X = CANCEL ONLY.
    */

    els.scoreEntryCancel
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            false
          );

        }
      );


    function stepScoreEntry(delta) {
      const current = Number(els.scoreEntryInput.value);
      const next = Math.max(0, (Number.isFinite(current) ? current : 1) + delta);
      els.scoreEntryInput.value = String(next);
      updateScoreEntryPreview();
    }

    els.scoreEntryMinus.addEventListener('click', () => stepScoreEntry(-1));
    els.scoreEntryPlus.addEventListener('click', () => stepScoreEntry(1));

    els.scoreEntryClear.addEventListener('click', () => {
      els.scoreEntryInput.value = '0';
      closeScoreEntry(true);
    });


    els.scoreEntryEnter
      .addEventListener(
        'click',
        () => {

          closeScoreEntry(
            true
          );

        }
      );



    els.scoreEntryOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.scoreEntryOverlay
          ) {

            closeScoreEntry(
              true
            );

          }

        }
      );


    els.modalCloseX
      .addEventListener(
        'click',
        () => {
          closeModal();
        }
      );


    els.modalOverlay
      .addEventListener(
        'pointerdown',
        event => {

          if (
            event.target ===
            els.modalOverlay
          ) {

            closeModal();

          }

        }
      );


    if (
      window.visualViewport
    ) {

      window.visualViewport
        .addEventListener(
          'resize',
          positionScoreEntry
        );


      window.visualViewport
        .addEventListener(
          'scroll',
          positionScoreEntry
        );

    }


    /* =========================================================
       STARTUP
       ========================================================= */


    async function initialize() {

  
    window.addEventListener(
      'resize',
      () => {
        if (currentView === 'leaderboard') {
          sizeLeaderboardRows();
        }

        if (currentView === 'scorecard') {
          requestAnimationFrame(
            fitScorecardBodyTypography
          );
          requestAnimationFrame(
            fitScoreTeamSelectName
          );
        }
      }
    );


    await initializeQrAuthorization();
    if (isTeamQr() && getQrTeam()) rememberSelectedTeam(getQrTeam());
    syncTestAuthorizationToggle();
    syncTeamQrLockedUi();
    updateHomeScorecardAccess();

      const rememberedView =
        getRememberedView();


      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }


    initialize();

  
    /* =========================================================
       V12.14 — LEADERBOARD IDLE REFRESH
       Any interaction while the leaderboard is open resets the
       progress bar and requires 10 full idle seconds before refresh.
       ========================================================= */
    let leaderboardInteractionResetFrame = null;

    function resetLeaderboardRefreshFromInteraction() {
      if (currentView !== 'leaderboard' || !leaderboardHasLoaded || leaderboardLoadInProgress) {
        return;
      }

      if (leaderboardInteractionResetFrame) {
        cancelAnimationFrame(leaderboardInteractionResetFrame);
      }

      leaderboardInteractionResetFrame = requestAnimationFrame(() => {
        leaderboardInteractionResetFrame = null;
        startLeaderboardRefreshCycle();
      });
    }

    document.addEventListener('pointerdown', resetLeaderboardRefreshFromInteraction, { passive: true });
    document.addEventListener('pointermove', event => {
      if (event.pointerType === 'touch' && event.buttons !== 0) {
        resetLeaderboardRefreshFromInteraction();
      }
    }, { passive: true });
    document.addEventListener('touchmove', resetLeaderboardRefreshFromInteraction, { passive: true });
    document.addEventListener('scroll', resetLeaderboardRefreshFromInteraction, { passive: true, capture: true });


    window.addEventListener('resize', () => {
      if (els.modalOverlay.classList.contains('tournament-summary')) {
        requestAnimationFrame(fitTournamentSummaryRemaining);
      }
    });

</script>

</body>
</html>
