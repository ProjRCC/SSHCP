    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }



    /* =========================================================
       V9.9 — SCORECARD RUNNING GROSS / NET
       Uses verified (gold) scores only.
       Net matches the leaderboard convention:
       gross relative-to-par minus the team's full handicap.
       ========================================================= */

    function scorecardHandicap(team) {
      if (!team) return 0;

      const candidates = [
        team.handicap,
        team.hcp,
        team.teamHandicap,
        team.teamHcp
      ];

      const value = candidates.find(
        item =>
          item !== undefined &&
          item !== null &&
          String(item).trim() !== ''
      );

      const number = Number(value);
      return Number.isFinite(number) ? Math.abs(number) : 0;
    }


    function formatScorecardRelative(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }


    function updateScorecardRunningScores() {
      if (!els.scoreRunningGross || !els.scoreRunningNet) return;

      if (!selectedTeam) {
        els.scoreRunningGross.textContent = 'E';
        els.scoreRunningNet.textContent = 'E';
        els.scoreRunningGross.classList.remove('under-par');
        els.scoreRunningNet.classList.remove('under-par');
        return;
      }

      let gross = 0;

      savedScores.forEach((score, index) => {
        if (
          score === null ||
          !holes[index] ||
          !Number.isFinite(Number(score)) ||
          !Number.isFinite(Number(holes[index].par))
        ) {
          return;
        }

        gross += Number(score) - Number(holes[index].par);
      });

      const net = gross - scorecardHandicap(selectedTeam);

      els.scoreRunningGross.textContent =
        formatScorecardRelative(gross);

      els.scoreRunningNet.textContent =
        formatScorecardRelative(net);

      els.scoreRunningGross.classList.toggle('under-par', gross < 0);
      els.scoreRunningNet.classList.toggle('under-par', net < 0);
    }


    /* =========================================================

    let v5MeasureProbe = null;

    function fitTextToBoxV5(
      box,
      target,
      maxPx,
      minPx = 8,
      options = {}
    ) {
      if (!box || !target) return minPx;

      const boxWidth = box.clientWidth;
      const boxHeight = box.clientHeight;
      if (boxWidth <= 0 || boxHeight <= 0) return minPx;

      const horizontalPad = Number(options.horizontalPad || 0);
      const verticalPad = Number(options.verticalPad || 0);
      const availableWidth = Math.max(1, boxWidth - horizontalPad);
      const availableHeight = Math.max(1, boxHeight - verticalPad);

      if (!v5MeasureProbe) {
        v5MeasureProbe = document.createElement('span');
        v5MeasureProbe.setAttribute('aria-hidden', 'true');

      function visibleFamilyMembers(row) {
        if (!row) return [];
        return Array.from(row.children).filter(element => {
          if (!(element instanceof HTMLElement)) return false;
          const style = getComputedStyle(element);
          return style.display !== 'none' && element.clientWidth > 0 && element.clientHeight > 0;
        });

      function familyFitsOneLine(elements) {
        return elements.every(element => {
          const widthOkay = element.scrollWidth <= element.clientWidth + 1;
          const heightOkay = element.scrollHeight <= element.clientHeight + 1;
          return widthOkay && heightOkay;
        });

      function fitFamily(selector, targetBase, minimumBase) {
        const row = els.testLogView.querySelector(selector);
        const elements = visibleFamilyMembers(row);
        if (!elements.length) return;

          size = Math.max(minimum, size - 0.25);
          elements.forEach(element => {

    function getVerticalMetricsV188() {
      const innerWidth = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
      const innerHeight = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
      const visualWidth = Math.max(
        1,
        Number(window.visualViewport && window.visualViewport.width) || innerWidth
      );
      const visualHeight = Math.max(
        1,
        Number(window.visualViewport && window.visualViewport.height) || innerHeight
      );
      const dpr = Math.max(0.1, Number(window.devicePixelRatio) || 1);
      const screenWidth = Math.max(1, Number(window.screen && screen.width) || innerWidth);
      const screenHeight = Math.max(1, Number(window.screen && screen.height) || innerHeight);
      const physicalShort = Math.min(screenWidth, screenHeight) * dpr;
      const physicalLong = Math.max(screenWidth, screenHeight) * dpr;
      const isS25 =
        Math.abs(physicalShort - V188_S25_PHYSICAL_W) <= 140 &&
        Math.abs(physicalLong - V188_S25_PHYSICAL_H) <= 180;
      const screenLong = Math.max(screenWidth, screenHeight);

      let s25ScreenLong = Number(localStorage.getItem('sshcpV188S25ScreenCssHeight') || 0);
      if (isS25 && screenLong > 0) {
        s25ScreenLong = screenLong;
        try {
          localStorage.setItem('sshcpV188S25ScreenCssHeight', String(s25ScreenLong));
        } catch (_) {}
      }
      if (!(s25ScreenLong > 0)) s25ScreenLong = V188_S25_SCREEN_CSS_FALLBACK_H;

      /* V18.9: device multiplier is based only on the app's visible browser
         viewport. Samsung S25 measured visual viewport = 724 CSS px = 1.000. */
      const multiplier = Math.max(
        0.70,
        Math.min(1.30, visualHeight / V189_S25_VISUAL_VIEWPORT_H)
      );

      return {
        innerWidth,
        innerHeight,
        visualWidth,
        visualHeight,
        screenWidth,
        screenHeight,
        screenLong,
        dpr,
        physicalShort,
        physicalLong,
        isS25,
        s25ScreenLong,
        multiplier
      };
    }

    function distributeIntegerPixelsV188(totalPixels, count) {
      const countSafe = Math.max(1, Math.floor(Number(count) || 1));
      const total = Math.max(countSafe, Math.round(Number(totalPixels) || countSafe));
      const base = Math.floor(total / countSafe);
      const remainder = total - (base * countSafe);
      return Array.from({ length: countSafe }, (_, index) =>
        base + (index < remainder ? 1 : 0)
      );
    }

    function distributeWeightedPixelsV188(totalPixels, weights) {
      const safeWeights = (Array.isArray(weights) ? weights : [])
        .map(value => Math.max(0, Number(value) || 0));
      if (!safeWeights.length) return [];
      const total = Math.max(safeWeights.length, Math.round(Number(totalPixels) || safeWeights.length));
      const weightTotal = safeWeights.reduce((sum, value) => sum + value, 0) || 1;
      const raw = safeWeights.map(value => (total * value) / weightTotal);
      const pixels = raw.map(value => Math.floor(value));
      let remainder = total - pixels.reduce((sum, value) => sum + value, 0);
      const order = raw
        .map((value, index) => ({ index, fraction: value - Math.floor(value) }))
        .sort((a, b) => b.fraction - a.fraction || a.index - b.index);
      let pointer = 0;
      while (remainder > 0) {
        pixels[order[pointer % order.length].index] += 1;
        pointer += 1;
        remainder -= 1;
      }
      return pixels;
    }

    /* =========================================================

       ========================================================= */
    function tournamentIsComplete(rows) {
      return Array.isArray(rows) && rows.length > 0 &&
        rows.every(row => Number(row.thru) === 18);
    }

    function firstPlaceTiedRows(rows) {
      if (!Array.isArray(rows) || rows.length < 2) return [];
      const numericRows = rows.filter(row => Number.isFinite(Number(row.net)));
      if (numericRows.length < 2) return [];
      const bestNet = Math.min(...numericRows.map(row => Number(row.net)));
      return numericRows.filter(row => Number(row.net) === bestNet);
    }

    function tiebreakValue(row, index) {
      const raw = Array.isArray(row.tiebreakScores)
        ? row.tiebreakScores[index]
        : '';
      if (raw === '' || raw === null || raw === undefined) return NaN;
      return Number(raw);
    }

    function actualTiebreakHole(row, index) {
      const raw = Array.isArray(row?.tiebreakHoles)
        ? row.tiebreakHoles[index]
        : '';

      if (raw === '' || raw === null || raw === undefined) return '';
      return String(raw).trim();
    }

    function resolveTieContenders(tied) {
      if (!Array.isArray(tied) || tied.length < 2) return null;

      let contenders = [...tied];

      const holeCount = Math.max(
        0,
        ...tied.map(row =>
          Array.isArray(row?.tiebreakScores)
            ? row.tiebreakScores.length
            : 0
        )
      );

      for (let index = 0; index < holeCount; index++) {
        const enteringHole = [...contenders];

        const scored = enteringHole.map(row => ({
          row,
          score: tiebreakValue(row, index)
        }));

        if (scored.some(item => !Number.isFinite(item.score))) {
          return {
            tied: [...tied],
            winner: null,
            decidingIndex: null,
            unresolved: true,
            decidingContenders: enteringHole
          };
        }

        const bestScore = Math.min(...scored.map(item => item.score));
        contenders = scored
          .filter(item => item.score === bestScore)
          .map(item => item.row);

        if (contenders.length === 1) {
          return {
            tied: [...tied],
            winner: contenders[0],
            decidingIndex: index,
            winningScore: bestScore,
            unresolved: false,
            decidingContenders: enteringHole
          };
        }
      }

      return {
        tied: [...tied],
        winner: null,
        decidingIndex: null,
        unresolved: true,
        decidingContenders: [...contenders]
      };
    }

    function resolveFirstPlaceTie(rows) {
      const tied = firstPlaceTiedRows(rows);
      if (tied.length < 2) return null;
      return resolveTieContenders(tied);
    }

    function ordinalNumber(number) {
      const n = Number(number);
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 13) return n + 'th';
      switch (n % 10) {
        case 1: return n + 'st';
        case 2: return n + 'nd';
        case 3: return n + 'rd';
        default: return n + 'th';
      }
    }

    function ordinalHandicapHole(index) {
      const number = Number(index) + 1;
      return Number.isFinite(number) && number > 0
        ? ordinalNumber(number) + ' Handicap Hole'
        : '';
    }

    function fitTieBreakExplanationV1515() {
      if (!els.modalOverlay.classList.contains('tournament-result')) return;

      const fitsAt = size => {

        return inner.scrollWidth <= outer.clientWidth + 0.75;

      if (fitsAt(targetPx)) return;

      let low = minPx;

        const mid = (low + high) / 2;

          low = mid;

        }
      }

      fitsAt(best);

    function getSummaryHandicap(row) {
      const match = teams.find(team => Number(team.slot) === Number(row.slot));
      const candidates = [
        row.handicap,
        row.hcp,
        row.teamHandicap,
        row.teamHcp,
        match ? match.handicap : undefined,
        match ? match.hcp : undefined
      ];
      const direct = candidates.find(value =>
        value !== undefined && value !== null && String(value).trim() !== ''
      );
      let hcp = Number(direct);
      if (!Number.isFinite(hcp)) {
        const gross = Number(row.gross);
        const net = Number(row.net);
        if (Number.isFinite(gross) && Number.isFinite(net)) {
          hcp = Math.abs(gross - net);
        }
      }
      return Number.isFinite(hcp) ? Math.abs(hcp) : null;
    }

    function buildTournamentPodium(rows) {
      const source = Array.isArray(rows)
        ? rows.filter(row => row && Number.isFinite(Number(row.net)))
        : [];

      /* Base tournament order is net score, then stable team slot order.
         Slot order is the clean fallback for any places we do NOT explicitly
         resolve by tiebreak. */
      const base = [...source].sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      const annotations = new Map();
      const podiumRows = [];
      const remaining = [...base];

      /* Resolve ONLY podium places. For each place, find everyone tied on the
         best remaining NET score, resolve that tie through handicap holes,
         remove the winner, then repeat for the next podium place. */
      for (let place = 1; place <= 3 && remaining.length; place++) {
        const bestNet = Number(remaining[0].net);
        const tiedGroup = remaining.filter(
          row => Number(row.net) === bestNet
        );

        let winner = tiedGroup[0];
        let resolution = null;

        if (tiedGroup.length > 1) {
          resolution = resolveTieContenders(tiedGroup);

          if (resolution && resolution.winner) {
            winner = resolution.winner;
          }
        }

        podiumRows.push(winner);

        const removeIndex = remaining.indexOf(winner);
        if (removeIndex >= 0) remaining.splice(removeIndex, 1);

        if (
          resolution &&
          resolution.winner &&
          resolution.decidingIndex !== null
        ) {
          const actualHole = actualTiebreakHole(
            winner,
            resolution.decidingIndex
          );
          const hcpHoleNumber = Number(resolution.decidingIndex) + 1;

          annotations.set(winner, {
            marks: '',
            note:
              '• ' +
              place +
              ordinalSuffix(place) +
              ' Place Won on ' +
              hcpHoleNumber +
              ' HCP Hole' +
              (actualHole ? ' (Hole\u00A0' + actualHole + ')' : '')
          });
        }
      }

      /* Everything after 3rd is intentionally NOT further tiebroken.
         Preserve clean NET grouping and team/slot order inside each tie. */
      remaining.sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      return {
        ordered: [...podiumRows, ...remaining],
        annotations,
        firstTie: firstPlaceTiedRows(source)
      };
    }

    function ordinalSuffix(number) {
      if (number === 1) return 'st';
      if (number === 2) return 'nd';
      if (number === 3) return 'rd';
      return 'th';
    }

    /* V15.15 — one authoritative resolved-place labeler shared by
       FINAL RESULTS and SCRAMBLE SUMMARY after BREAK TIE is revealed. */
    function resolvedTournamentPlaceLabel(orderedRows, rowIndex) {
      if (!Array.isArray(orderedRows) || rowIndex < 0 || rowIndex >= orderedRows.length) {
        return '';
      }

      if (rowIndex < 3) return String(rowIndex + 1);

      const row = orderedRows[rowIndex];
      const currentNet = Number(row && row.net);

      const priorSameNet = orderedRows
        .slice(3, rowIndex)
        .some(item => Number(item && item.net) === currentNet);

      const laterSameNet = orderedRows
        .slice(rowIndex + 1)
        .some(item => Number(item && item.net) === currentNet);

      let unresolvedPlace = 4;
      for (let i = 3; i < rowIndex; i++) {
        if (Number(orderedRows[i] && orderedRows[i].net) < currentNet) {
          unresolvedPlace++;
        }
      }

      return (priorSameNet || laterSameNet)
        ? 'T' + unresolvedPlace
        : String(unresolvedPlace);
    }

    function fitTournamentSummaryRemaining() {

      document.documentElement.style.setProperty('--v1810-popup-top-inset', popupTopInsetV1810 + 'px');

      applyTournamentSummaryGeometryV16(body, topGrid, lower, lowerRows);

      const header = topGrid.querySelector('.tournament-summary-row.header');
      if (header) {
        Array.from(header.children).forEach(cell => {

            wrap: false,

          });

      /* V18.17 Scramble Summary TEAM hierarchy:
         - Every tier has a one-line ceiling of 45% of its OWN actual row height.
         - Two-line names are allowed, but the complete two-line block may use
           at most 80% of that row height.
         - The ACTUAL fitted per-line font size cascades downward at 90%:
           1st -> 2nd -> 3rd -> one shared size for 4th-10th.
         - 15px is the absolute TEAM-name floor. There are no pixel maximums. */
      const summaryTeamMinimumV1817 = 15;
      let previousPodiumTeamSizeV1817 = null;

      [1,2,3].forEach((place, index) => {
        const row = topGrid.querySelector('.tournament-summary-row.place-' + place);
        if (!row) return;
        const placeCell = row.querySelector('.tournament-summary-place');
        const team = row.querySelector('.tournament-summary-team');
        const teamAnchor = row.querySelector('.summary-team-anchor');
        const teamText = row.querySelector('.summary-team-text') || team;
        const net = row.querySelector('.tournament-summary-net');

        if (placeCell) fitTextToBoxV5(placeCell, placeCell, row.clientHeight * 0.34, 9, {horizontalPad:4,verticalPad:5});

        if (team && teamText) {
          const ownRowCeiling = row.clientHeight * 0.45;
          const cascadeCeiling = Number.isFinite(previousPodiumTeamSizeV1817)
            ? previousPodiumTeamSizeV1817 * 0.90
            : ownRowCeiling;
          const targetSize = Math.max(
            summaryTeamMinimumV1817,
            Math.min(ownRowCeiling, cascadeCeiling)
          );
          const fittedTeam = fitTwoLineTeamTextV58(
            team,
            teamAnchor,
            teamText,
            row.clientHeight,
            targetSize,
            summaryTeamMinimumV1817,
            22,
            0.80
          );
          previousPodiumTeamSizeV1817 = fittedTeam && Number.isFinite(fittedTeam.size)
            ? fittedTeam.size
            : targetSize;
        }

        /* Keep the approved 60/55/50% podium NET +/- hierarchy, but remove
           the old 46px hard maximum so it remains proportional to the row. */
        if (net) fitTextToBoxV5(net, net, row.clientHeight * ([0.60,0.55,0.50][index]), 12, {horizontalPad:6,verticalPad:5});
      });

      const lowerPlace = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.place'));
      const lowerTeam = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.team'));
      const lowerNet = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-score'));

      const fitUniform = (cells, ratio, minimum, pad=6) => {
        let chosen = Infinity;
        cells.forEach(cell => {
          chosen = Math.min(chosen, fitTextToBoxV5(cell, cell, cell.clientHeight * ratio, minimum, {
            horizontalPad: pad,
            verticalPad: 5
          }));
        });
        if (Number.isFinite(chosen)) {
          cells.forEach(cell => cell.style.setProperty('font-size', chosen + 'px', 'important'));
        }
        return chosen;
      };

      fitUniform(lowerPlace, 0.34, 9, 4);

      if (lowerTeam.length) {
        const lowerRowHeights = lowerTeam
          .map(cell => cell.clientHeight || cell.getBoundingClientRect().height || 0)
          .filter(height => height > 0);
        const shortestLowerRow = lowerRowHeights.length ? Math.min(...lowerRowHeights) : 1;
        const ownLowerRowCeiling = shortestLowerRow * 0.45;
        const cascadeLowerCeiling = Number.isFinite(previousPodiumTeamSizeV1817)
          ? previousPodiumTeamSizeV1817 * 0.90
          : ownLowerRowCeiling;
        const sharedLowerTarget = Math.max(
          summaryTeamMinimumV1817,
          Math.min(ownLowerRowCeiling, cascadeLowerCeiling)
        );

        /* First pass discovers the smallest actual fit required by any of
           places 4-10. Second pass applies that one exact size to all of them. */
        let sharedLowerActual = sharedLowerTarget;
        lowerTeam.forEach(teamCell => {
          const anchor = teamCell.querySelector('.summary-team-anchor');
          const teamText = teamCell.querySelector('.summary-team-text');
          if (!teamText) return;
          const fitted = fitTwoLineTeamTextV58(
            teamCell,
            anchor,
            teamText,
            teamCell.clientHeight,
            sharedLowerTarget,
            summaryTeamMinimumV1817,
            10,
            0.80
          );
          if (fitted && Number.isFinite(fitted.size)) {
            sharedLowerActual = Math.min(sharedLowerActual, fitted.size);
          }
        });

        sharedLowerActual = Math.max(summaryTeamMinimumV1817, sharedLowerActual);
        lowerTeam.forEach(teamCell => {
          const anchor = teamCell.querySelector('.summary-team-anchor');
          const teamText = teamCell.querySelector('.summary-team-text');
          if (!teamText) return;
          fitTwoLineTeamTextV58(
            teamCell,
            anchor,
            teamText,
            teamCell.clientHeight,
            sharedLowerActual,
            summaryTeamMinimumV1817,
            10,
            0.80
          );
        });
      }

      fitUniform(lowerNet, 0.48, 12, 6);

      /* V18.16: every NET STROKES cell, 1st through 10th, uses one common
         target derived from the narrowest/shortest result row. The target is
         exactly 40% of that narrowest row height; width fitting may reduce the
         common size only if a NET STROKES value cannot fit its own cell. */
      const allStrokes = [
        ...Array.from(topGrid.querySelectorAll('.tournament-summary-strokes')),
        ...Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-strokes'))
      ];
      const strokeRowHeights = allStrokes
        .map(cell => cell.getBoundingClientRect().height || cell.clientHeight || 0)
        .filter(height => height > 0);
      const narrowestStrokeRow = strokeRowHeights.length

      const probe = document.createElement('span');
      probe.setAttribute('aria-hidden', 'true');

      probe.style.lineHeight = '1';
      probe.style.textTransform = 'uppercase';
      probe.style.fontSize = target + 'px';
      document.body.appendChild(probe);

      let shared = target;
      (Array.isArray(texts) ? texts : []).forEach(value => {
        probe.textContent = String(value ?? '');
        const width = probe.getBoundingClientRect().width;
        if (width > available && width > 0) {

      probe.remove();
      return Math.max(minPx, Math.min(target, shared * 0.985));

    /* =========================================================
       SSHCP V16.27 — SKINS FIRST PASS
       Gross skins only. Assigned OFFICIAL teams are eligible. For each actual
       Hole 1-18, the unique lowest valid score wins one skin. Tied low scores
       produce no winner; no carryover and no handicap adjustment in this pass.
       ========================================================= */
    const SKINS_ENABLED_KEY_V1627 = 'sshcpSkinsEnabledV1627';

    function skinsEnabledV1627() {
      return true;
    }

    function setSkinsEnabledV1627(enabled) {
      localStorage.setItem(SKINS_ENABLED_KEY_V1627, enabled ? '1' : '0');
      if (els.controlCenterSkinsCheck) els.controlCenterSkinsCheck.checked = Boolean(enabled);
      addTestLog('SKINS', enabled ? 'ON' : 'OFF', '—', 'Summary button ' + (enabled ? 'shown' : 'hidden'));

    function buildSkinsResultsV1627(scorecardTeams, courseHoles) {
      const eligible = Array.isArray(scorecardTeams)
        ? scorecardTeams.filter(team => team && String(team.name || '').trim() !== '')
        : [];
      const course = Array.isArray(courseHoles) ? courseHoles : [];
      const results = [];

      for (let index = 0; index < 18; index++) {
        const hole = course[index] || {};
        const entered = eligible.map(team => {
          const value = Number(Array.isArray(team.scores) ? team.scores[index] : NaN);
          return { team, score: value };
        }).filter(item => Number.isFinite(item.score) && item.score > 0);

        /* A skin is only meaningful when every currently assigned team has a
           valid score on that hole. Completed Summary normally guarantees it,
           but this guard prevents partial data from awarding a false skin. */
        if (!eligible.length || entered.length !== eligible.length) continue;

        const low = Math.min(...entered.map(item => item.score));
        const winners = entered.filter(item => item.score === low);
        if (winners.length !== 1) continue;

        results.push({
          team: winners[0].team,
          hole: Number(hole.hole) || (index + 1),
          par: Number(hole.par),
          score: low
        });
      }

      return results;
    }

    function makeSkinsScoreMarkV1627(score, par) {
      const wrap = document.createElement('span');
      wrap.className = 'skins-score-mark-v1627';
      const relative = Number(score) - Number(par);
      if (relative === -1) wrap.classList.add('single-circle');
      else if (relative <= -2) wrap.classList.add('double-circle');

      const number = document.createElement('span');
      number.className = 'skins-score-number-v1627';
      number.textContent = String(score);
      wrap.appendChild(number);
      return wrap;
    }

      if (!els.modalOverlay.classList.contains('tournament-summary')) return;

      const subtitle = els.modalBody.querySelector('.tournament-summary-subtitle');

      const leaderboard = els.modalBox.querySelector('.summary-leaderboard-overlay-v182');
      if (!subtitle || !table || !home || !leaderboard) return;

      /* V18.5: RESULTS/TOP 10 remains centered vertically in the open band.
         HOME and LEADERBOARD each own exactly 25% of the table width. Their
         OUTER edges align exactly with the table edges, leaving the middle 50%
         as the stable centered subtitle zone. */
      subtitle.style.setProperty('transform', 'none', 'important');
      const titleRect = els.modalTitle.getBoundingClientRect();
      const tableRect = table.getBoundingClientRect();
      const subtitleRect = subtitle.getBoundingClientRect();
      const boxRect = els.modalBox.getBoundingClientRect();
      if (!(tableRect.width > 0) || !(boxRect.width > 0)) return;

      const centerY = (titleRect.bottom + tableRect.top) / 2;
      const subtitleCenterY = subtitleRect.top + (subtitleRect.height / 2);
      subtitle.style.setProperty(
        'transform',
        'translateY(' + (centerY - subtitleCenterY).toFixed(2) + 'px)',
        'important'
      );

      /* V18.9: Summary top navigation is NOT part of the bottom-button family.
         It owns only the open band between the title and TABLE HEADER ROW,
         preserving a small buffer on both sides and shrinking locally if the
         band is tighter on another device. */
      const sharedV189 = syncSharedGeometryV187();
      const navBand = Math.max(1, tableRect.top - titleRect.bottom);
      const navBuffer = Math.max(2, Math.round(6 * sharedV189.multiplier));
      const scorecardNavH = Math.max(1, Math.round(35 * sharedV189.multiplier));
      const buttonH = Math.max(1, Math.min(
        scorecardNavH,
        Math.floor(navBand - (navBuffer * 2))
      ));
      const buttonW = Math.max(1, tableRect.width * 0.25);
      const tableLeftInBox = tableRect.left - boxRect.left;
      const tableRightInBox = tableRect.right - boxRect.left;
      const top = centerY - boxRect.top - (buttonH / 2);

      home.style.setProperty('width', buttonW + 'px', 'important');
      home.style.setProperty('height', buttonH + 'px', 'important');
      home.style.setProperty('left', tableLeftInBox + 'px', 'important');
      home.style.setProperty('top', top + 'px', 'important');

      leaderboard.style.setProperty('width', buttonW + 'px', 'important');
      leaderboard.style.setProperty('height', buttonH + 'px', 'important');
      leaderboard.style.setProperty('left', (tableRightInBox - buttonW) + 'px', 'important');
      leaderboard.style.setProperty('top', top + 'px', 'important');

      [home, leaderboard].forEach(button => {
        fitTextToBoxV5(button, button, buttonH * 0.40, 9, {
          horizontalPad: 12,
          verticalPad: 6,
          wrap: false,
          lineHeight: 1
        });

      const availableTwoLineHeight = Math.max(1, rowHeight * safeTwoLineRatio);
      const minimum = Math.max(5, Number(minSize) || 8);
      const target = Math.max(minimum, Number(targetSize) || minimum);

      /* Target size, one line first. */
      textEl.style.setProperty('font-size', target + 'px', 'important');
      textEl.style.setProperty('line-height', '1.04', 'important');
      textEl.style.setProperty('white-space', 'nowrap', 'important');
      textEl.style.setProperty('overflow', 'visible', 'important');

      if (
        measureTeamLineWidthV58(textEl, original, target) <= availableWidth + 0.75 &&
        target * 1.04 <= availableTwoLineHeight + 0.75
      ) {
        return { size: target, truncated: false, lines: 1 };
      }

      /* First fallback: two lines at the SAME target size. */
      let two = twoLineTeamFitsV58(
        textEl,
        original,
        target,
        availableWidth,
        availableTwoLineHeight,
        splitter
      );
      renderTwoLineTeamTextV58(textEl, two.line1, two.line2);
      textEl.style.setProperty('font-size', target + 'px', 'important');
      textEl.style.setProperty('line-height', '1.02', 'important');
      textEl.style.setProperty('white-space', 'normal', 'important');
      textEl.style.setProperty('overflow', 'visible', 'important');

      if (two.fits) {
        return { size: target, truncated: false, lines: 2 };
      }

      /* Only now shrink the two-line block. */
      let size = target;
      while (size > minimum) {
        size = Math.max(minimum, size - 0.5);
        two = twoLineTeamFitsV58(
          textEl,
          original,
          size,
          availableWidth,
          availableTwoLineHeight,
          splitter
        );
        renderTwoLineTeamTextV58(textEl, two.line1, two.line2);
        textEl.style.setProperty('font-size', size + 'px', 'important');
        if (two.fits) {
          return { size, truncated: false, lines: 2 };
        }
      }

      /* Final fallback: only after two lines + minimum still cannot fit,
         truncate to the longest fitting prefix and add |. */
      for (let count = original.length - 1; count >= 1; count--) {
        const prefix = original.slice(0, count).replace(/\s+$/, '');
        if (!prefix) continue;
        const candidate = prefix + '|';
        const candidateFit = twoLineTeamFitsV58(
          textEl,
          candidate,
          minimum,
          availableWidth,
          availableTwoLineHeight,
          splitter
        );
        if (!candidateFit.fits) continue;

        renderTwoLineTeamTextV58(textEl, candidateFit.line1, candidateFit.line2);
        textEl.style.setProperty('font-size', minimum + 'px', 'important');
        textEl.style.setProperty('line-height', '1.02', 'important');
        return { size: minimum, truncated: true, lines: 2 };
      }

      textEl.textContent = '|';
      textEl.classList.remove('two-line');
      textEl.style.setProperty('font-size', minimum + 'px', 'important');
      return { size: minimum, truncated: true, lines: 1 };
    }

    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          /* V15.12:
             Keep the initial visible leaderboard untouched when the
             authorized team is already on screen.

             For an authorized team below that initial view, position by
             current leaderboard place — never by hard-coded team number:
               • last place: 0.0 rows visible below
               • second-to-last: 1.0 row visible below
               • third-to-last: 1.5 rows visible below
               • fourth-to-last+: 2.5 rows visible below

             This preserves a partial-row cue when more teams remain below,
             while naturally tapering at the bottom of any leaderboard size. */
          const rowHeight =
            parseFloat(
              getComputedStyle(els.leaderContent)
                .getPropertyValue('--leader-row-height')
            ) || target.getBoundingClientRect().height;

          const targetIndex =
            Array.prototype.indexOf.call(
              els.leaderRows.children,
              target
            );

          if (targetIndex < 8) {
            return;
          }

          const totalRows =
            els.leaderRows.children.length;

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          const rowsBelow =
            totalRows - targetIndex - 1;

          let desiredRowsBelow;

          if (rowsBelow <= 0) {
            desiredRowsBelow = 0;
          } else if (rowsBelow === 1) {
            desiredRowsBelow = 1;
          } else if (rowsBelow === 2) {
            desiredRowsBelow = 1.5;
          } else {
            desiredRowsBelow = 2.5;
          }

          /*
            Eight rows are visible. To leave N rows beneath the authorized
            row, place it at visible index 7 - N.
          */
          const visibleTargetIndex =
            7 - desiredRowsBelow;

          const preferredScroll =
            Math.max(
              0,
              (targetIndex - visibleTargetIndex) *
              rowHeight
            );

          const desired =
            Math.min(
              preferredScroll,
              maxScroll
            );

          els.leaderContent.scrollTo({
            top: desired,
            behavior: 'smooth'
          });
        },
        1500
      );
    }

    function parseCssColorV172(value) {
      const text = String(value || '').trim();
      const match = text.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)(?:\s*,\s*([\d.]+))?\s*\)$/i);
      if (!match) return null;
      return {
        r: Math.max(0, Math.min(255, Number(match[1]) || 0)),
        g: Math.max(0, Math.min(255, Number(match[2]) || 0)),
        b: Math.max(0, Math.min(255, Number(match[3]) || 0)),
        a: match[4] == null ? 1 : Math.max(0, Math.min(1, Number(match[4]) || 0))
      };
    }

    function monochromeCssV172(value, transparentAsWhite) {
      const c = parseCssColorV172(value);
      if (!c) return transparentAsWhite ? '#fff' : '#333';

    function fitQrWelcomeTeamV170() {
      const team = document.getElementById('qrWelcomeTeamV170');
      const welcome = document.querySelector('.qr-welcome-title-v170');
      if (!team || !team.textContent) return;

      /* V18.40: preserve the proven 85%-viewport horizontal fit. Short names
         may still grow aggressively, but their TOP edge can never enter the
         protected blank band below WELCOME. That band is exactly 50% of the
         rendered WELCOME box height, so the same rule scales on phone/tablet. */
      const targetWidth = Math.max(1, window.innerWidth * 0.85);
      const probeSize = 100;
      const minimum = 18;

      team.style.width = 'max-content';
      team.style.maxWidth = 'none';
      team.style.fontSize = probeSize + 'px';

      const measuredWidth = team.getBoundingClientRect().width;
      let size = measuredWidth > 0
        ? probeSize * (targetWidth / measuredWidth)
        : probeSize;
      size = Math.max(minimum, size);

      team.style.fontSize = size.toFixed(2) + 'px';
      team.style.width = '85vw';
      team.style.maxWidth = '85vw';

      if (welcome) {
        const welcomeRect = welcome.getBoundingClientRect();
        const teamRect = team.getBoundingClientRect();
        const protectedTop = welcomeRect.bottom + (welcomeRect.height * 0.50);
        const allowedHeight = teamRect.bottom - protectedTop;

        if (teamRect.height > 0 && teamRect.top < protectedTop && allowedHeight > 0) {
          size = Math.max(minimum, size * (allowedHeight / teamRect.height));
          team.style.fontSize = size.toFixed(2) + 'px';
        }
      }
    }

        if (currentView === 'scorecard') {
          requestAnimationFrame(
            fitScorecardBodyTypography
          );
          requestAnimationFrame(
            fitScoreTeamSelectName
          );
        }
      }
    );


      const rememberedView =
        getRememberedView();
      const restoreTeamsPopupV1626 = false; /* V18.40: Control Center TEAMS row retired. */
      syncHomeTournamentCompleteV1630(
        sessionStorage.getItem('sshcpTournamentComplete') === '1'
      );

      if (
        rememberedView ===
        'scorecard'
      ) {
        hydrateScorecardSnapshotV53();
      }
      else if (
        rememberedView ===
        'leaderboard'
      ) {
        hydrateLeaderboardSnapshotV53();
      }

      setupQrWelcomeV170();
      await initializeQrAuthorization();
      if (geekEnabledV180()) startGeekDiagnosticV180b();
      revealQrWelcomeAfterAuthV170();
      if (isTeamQr() && getQrTeam()) rememberSelectedTeam(getQrTeam());
      syncTestAuthorizationToggle();
      syncTeamQrLockedUi();
      updateHomeScorecardAccess();

      /* V17.1 — retained behavior: browser refresh while TEAMS is open returns directly to the
         TEAMS workspace (and restores its table scroll position) instead of
         falling through to HOME. */
      if (restoreTeamsPopupV1626) {
        showTestLog();
        openTeamsPopup({ restoreAfterRefresh: true });
        return;
      }

      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      /* V18.31 — every browser refresh that resolves to HOME silently checks
         current leaderboard completion first. This makes separate devices agree
         on VIEW LIVE LEADERBOARD vs SCRAMBLE SUMMARY without requiring either
         device to visit the Leaderboard. */
      await refreshHomeTournamentStateV1831();
      showHome();

    }



    const refitCompletedLeaderboard = () => {
      if (
        currentView === 'leaderboard' &&
        tournamentIsComplete(lastLeaderboardRows)
      ) {
        requestAnimationFrame(() => {
          sizeLeaderboardRows();
          positionCompletedFinalAction();
        });
      }
    };

    window.addEventListener(
      'resize',
      refitCompletedLeaderboard
    );

    window.addEventListener(
      'orientationchange',
      () => {
        window.setTimeout(
          refitCompletedLeaderboard,
          80
        );
      }
    );


    let v5ResizeFrame = 0;

    function refitVisibleGeometryV5() {
      cancelAnimationFrame(
        v5ResizeFrame
      );

      v5ResizeFrame =
        requestAnimationFrame(() => {
          if (
            currentView === 'home'
          ) {
            fitHomeScorecardTeamNameV55();
          }

          if (
            currentView === 'scorecard'
          ) {
            sizeScorecardV5();
            fitScoreTeamSelectName();
          }

          if (
            currentView === 'leaderboard'
          ) {
            sizeLeaderboardRows();
          }

          if (
            currentView === 'testlog'
          ) {
            fitTestPageButtonText();
          }

          if (
            els.modalOverlay.classList.contains(
              'tournament-summary'
            )
          ) {
            fitTournamentSummaryRemaining();
          }
        });
    }

    const v5GeometryObserver =
      new ResizeObserver(
        refitVisibleGeometryV5
      );

    [
      document.querySelector(
        '.scorecard-screen'
      ),
      document.querySelector(
        '.leaderboard-screen'
      ),
      els.modalBox
    ]
      .filter(Boolean)
      .forEach(element => {
        v5GeometryObserver.observe(
          element
        );
      });

    window.addEventListener(
      'resize',
      refitVisibleGeometryV5,
      {
        passive: true
      }
    );

    if (currentView === 'scorecard') {
      sizeScorecardV5();
    } else if (currentView === 'leaderboard') {
      sizeLeaderboardRows();
    }

    /* V5.8 Oswald determinism: initial fallback-font measurements are allowed
       for instant paint, but every width-sensitive element is remeasured once
       the actual webfont is ready. This keeps S25/iPad fitting consistent. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        requestAnimationFrame(() => {
          fitHomeScorecardTeamNameV55();
          fitScoreTeamSelectName();
          fitHomeTeamOptionsV58();
          fitScoreTeamOptionsV58();
          if (currentView === 'scorecard') sizeScorecardV5();
          if (currentView === 'leaderboard') sizeLeaderboardRows();
          if (currentView === 'testlog') fitTestPageButtonText();
          if (els.modalOverlay.classList.contains('authorization')) {
            fitAuthorizationTeamNameV58();
          }
          if (els.modalOverlay.classList.contains('tournament-summary')) {
            fitTournamentSummaryRemaining();
          }
        });
      }).catch(() => {});
    }

    initialize()
      .catch(error => {
        console.error('SSHCP initialization failed:', error);
      })
      .finally(() => {
        document.documentElement.classList.remove(
          'sshcp-pre-scorecard',
          'sshcp-pre-leaderboard',
          'sshcp-pre-complete'
        );
      });

    window.addEventListener('resize', () => {
      if (els.modalOverlay.classList.contains('tournament-summary')) {
        requestAnimationFrame(fitTournamentSummaryRemaining);
      }
      if (els.modalOverlay.classList.contains('geek-mode-v180')) {
        requestAnimationFrame(fitGeekRowsV180);
      }
      if (els.modalOverlay.classList.contains('geek-detail-v180')) {
        requestAnimationFrame(fitGeekDetailV182);
      }
      if (els.modalOverlay.classList.contains('skins-results-v1627')) {
        requestAnimationFrame(fitSkinsTableTextV1627);
      }
      if (els.modalOverlay.classList.contains('quick-guide')) {
        syncQuickGuideBodyFontV1816();
      }
      if (els.modalOverlay.classList.contains('tournament-result')) {
        syncTieBreakResultGeometryV1850();
        requestAnimationFrame(fitTieBreakExplanationV1515);
      }
    });

</script>

</body>
</html>
