<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var rememberedView = sessionStorage.getItem('rotbCurrentView') || 'home';
        window.__sshcpBootView = rememberedView;
        if (rememberedView === 'scorecard' || rememberedView === 'leaderboard') {
          document.documentElement.classList.add('sshcp-pre-' + rememberedView);
        }

        if (
          rememberedView === 'leaderboard' &&
          sessionStorage.getItem('sshcpTournamentComplete') === '1'
        ) {
          document.documentElement.classList.add('sshcp-pre-complete');
        }

        var role = localStorage.getItem('sshcpQrRole') || 'NONE';
        var qrTeam = localStorage.getItem('sshcpQrTeam') || '';
        var authorizedTeam = localStorage.getItem('rotbAuthorizedTeam') || '';
        var rememberedTeam = localStorage.getItem('rotbSelectedTeam') || '';

        window.__sshcpBootTeam =
          (role === 'QR' && qrTeam) ? qrTeam :
          (authorizedTeam || rememberedTeam || '');

        window.__sshcpBootLocked =
          (role === 'QR' && !!qrTeam);

        window.__sshcpBootTournamentComplete =
          sessionStorage.getItem('sshcpTournamentComplete') === '1';

        window.__sshcpBootFinalActionMode =
          sessionStorage.getItem('sshcpFinalActionMode') || '';

        window.__sshcpBootFinalActionLabel =
          (sessionStorage.getItem('sshcpFinalActionLabel') || '').replace(/\*+$/, '');

        /* V5.3 refresh continuity: data snapshots are read before paint so a
           pull-to-refresh can show the last-known scorecard/leaderboard immediately. */
        try {
          window.__sshcpBootScorecardSnapshot = JSON.parse(
            sessionStorage.getItem('sshcpScorecardSnapshotV53') || 'null'
          );
        } catch (_) {
          window.__sshcpBootScorecardSnapshot = null;
        }

        try {
          window.__sshcpBootLeaderboardSnapshot = JSON.parse(
            sessionStorage.getItem('sshcpLeaderboardSnapshotV53') || 'null'
          );
          if (
            window.__sshcpBootLeaderboardSnapshot &&
            Number(window.__sshcpBootLeaderboardSnapshot.finalSlotHeight) > 0
          ) {
            document.documentElement.style.setProperty(
              '--v53-final-slot-h',
              Number(window.__sshcpBootLeaderboardSnapshot.finalSlotHeight) + 'px'
            );
          }
        } catch (_) {
          window.__sshcpBootLeaderboardSnapshot = null;
        }

        /*
          V5.2 — preserve the last-known RESPONSIVE geometry during a
          browser pull-to-refresh. This is shell state, not tournament data.
          Restore only when the viewport is effectively the same size.
        */
        try {
          var savedGeometry = JSON.parse(
            sessionStorage.getItem('sshcpResponsiveGeometryV5') || 'null'
          );

          if (savedGeometry) {
            var nowW = window.innerWidth || 0;
            var nowH = window.innerHeight || 0;
            var closeW = Math.abs((savedGeometry.w || 0) - nowW) <= 8;
            var closeH = Math.abs((savedGeometry.h || 0) - nowH) <= 12;

            if (closeW && closeH) {
              var rootStyle = document.documentElement.style;

              if (savedGeometry.scoreHead) {
                rootStyle.setProperty('--v5-score-head-h', savedGeometry.scoreHead + 'px');
              }
              if (savedGeometry.scoreRow) {
                rootStyle.setProperty('--v5-score-row-h', savedGeometry.scoreRow + 'px');
              }
              if (savedGeometry.scoreBox) {
                rootStyle.setProperty('--v5-score-box', savedGeometry.scoreBox + 'px');
              }
              if (savedGeometry.scoreDivider) {
                rootStyle.setProperty('--v5-nine-break-h', savedGeometry.scoreDivider + 'px');
              }
              if (savedGeometry.leaderHead) {
                rootStyle.setProperty('--v5-leader-head-h', savedGeometry.leaderHead + 'px');
              }
              if (savedGeometry.leaderRow) {
                rootStyle.setProperty('--leader-row-height', savedGeometry.leaderRow + 'px');
              }
            }
          }
        } catch (e) {}
      } catch (e) {
        window.__sshcpBootTeam = '';
        window.__sshcpBootLocked = false;
      }
    })();
  </script>

      left: 0;

        width .2s ease,
        opacity .2s ease;
    }

    }

    .top-loading.done {
      width: 100%;
      opacity: 1;

   V12.15 remains the frozen recovery build.

   FIXED CONTROLS

   dimensions: navigation, footer actions, modal actions and utility buttons.
   The target design range begins at normal iPhone portrait height; shorter
   torture-test viewports may look compressed but must remain functional.

   RESPONSIVE TABLE CONTENT
   Scorecard and leaderboard table content owns the available row space.
   Anything inside a resizable row may shrink with that row, including the
   tappable score box and its notation.

    function timerStart() {

    function timerSeconds(
      start
    ) {

      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function intervalSeconds(
      start,
      end
    ) {

      return (
        (
          end -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function msSeconds(value) {

      const ms = Number(value);

      return Number.isFinite(ms)
        ? (ms / 1000).toFixed(3)
        : null;

    }


    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

    const SSHCP_TEST_QR_CACHE_KEY = 'sshcpTestQrDirectoryCacheV20';
    const SSHCP_TEST_QR_CACHE_TIME_KEY = 'sshcpTestQrDirectoryCacheTimeV20';

    let sshcpQrDirectoryCache = null;
    let sshcpQrDirectoryPromise = null;

    function readStoredTestQrDirectory() {
      if (sshcpQrDirectoryCache) return sshcpQrDirectoryCache;
      try {
        const parsed = JSON.parse(localStorage.getItem(SSHCP_TEST_QR_CACHE_KEY) || 'null');
        if (Array.isArray(parsed) && parsed.length) {
          sshcpQrDirectoryCache = parsed;
          return parsed;
        }
      } catch (_) {}
      return null;
    }

    function saveStoredTestQrDirectory(directory) {
      if (!Array.isArray(directory) || !directory.length) return;
      sshcpQrDirectoryCache = directory;
      localStorage.setItem(SSHCP_TEST_QR_CACHE_KEY, JSON.stringify(directory));
      localStorage.setItem(SSHCP_TEST_QR_CACHE_TIME_KEY, String(Date.now()));
    }

    function getQrRole(){ return localStorage.getItem(SSHCP_QR_ROLE_KEY) || 'NONE'; }

    function isMasterQr(){ return getQrRole() === 'MASTER'; }
    function isTeamQr(){ return getQrRole() === 'QR'; }

    async function validateQrPasskey(passkey, showFailure=true){
      const clean=String(passkey||'').trim();

      if(!clean){
        clearQrAuthorization();
        localStorage.removeItem('rotbAuthorizedTeam');
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();
        addTestLog('QR AUTH CHECK','INVALID','—','EMPTY PASSKEY');
        if(showFailure) showInvalidQrPasskey();
        return false;
      }

      const started = timerStart();

      try{
        const response=await fetch(
          CLOUDFLARE_API_URL+
          '?action=qrAuth&passkey='+encodeURIComponent(clean)+
          '&refresh='+Date.now(),
          {cache:'no-store'}
        );

        const httpStatus=response.status;
        let data;

        try{
          data=await response.json();
        }catch(_){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • INVALID JSON'
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(!response.ok || !data || data.ok!==true){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+
            (data && (data.reason||data.error) ? ' • '+String(data.reason||data.error) : '')
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(data.valid!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'INVALID',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • VALID FALSE'
          );
          if(showFailure) showInvalidQrPasskey();
          return false;
        }

        if(data.role==='QR' && data.assigned!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'OK',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • '+String(data.qrId||'QR')+' • VALID / NOT ASSIGNED'
          );
          if(showFailure) showValidUnassignedQrPasskey();
          return false;
        }

        saveQrAuthorization(data,clean);
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();

        addTestLog(
          'QR AUTH CHECK',
          'OK',
          timerSeconds(started)+'s',
          [
            'HTTP '+httpStatus,
            String(data.role||''),
            data.qrId ? 'QR '+String(data.qrId) : '',
            data.team ? String(data.team) : ''
          ].filter(Boolean).join(' • ')
        );

        return true;
      }catch(error){
        addTestLog(
          'QR AUTH CHECK',
          'FAILED',
          timerSeconds(started)+'s',
          error && error.message ? error.message : 'REQUEST FAILED'
        );
        if(showFailure) showAuthorizationCheckFailed(clean);
        return false;
      }
    }

    async function loadAssignedPasskeys(forceRefresh = true) {
      if (sshcpQrDirectoryPromise) return sshcpQrDirectoryPromise;

      if (!forceRefresh) {
        const stored = readStoredTestQrDirectory();
        if (stored) return stored;
      }

      const started = timerStart();

      sshcpQrDirectoryPromise = (async () => {
        let response = null;

        try {
          response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=qrDirectory' +
              '&passkey=' + encodeURIComponent(SSHCP_MASTER_TEST_KEY) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          const httpStatus = response.status;
          let data;

          try {
            data = await response.json();
          } catch (_) {
            throw new Error('HTTP ' + httpStatus + ' — invalid JSON response');
          }

          if (
            !response.ok ||
            !data ||
            data.ok !== true ||
            data.authorized !== true ||
            data.role !== 'MASTER' ||
            !Array.isArray(data.directory)
          ) {
            const reason =
              data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'Directory request failed';
            throw new Error('HTTP ' + httpStatus + ' — ' + reason);
          }

          const directory = data.directory
            .filter(item => item && item.qrId && item.passkey)
            .map(item => ({
              qrId: String(item.qrId),
              passkey: String(item.passkey).trim(),
              role: 'QR',
              assigned: item.assigned === true,
              team: String(item.team || ''),
              status: String(item.status || (item.assigned ? 'ASSIGNED' : 'NOT ASSIGNED'))
            }));

          const master = data.master && data.master.passkey
            ? {
                qrId: 'MASTER',
                passkey: String(data.master.passkey).trim(),
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              }
            : {
                qrId: 'MASTER',
                passkey: SSHCP_MASTER_TEST_KEY,
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              };

          const assignedCount =
            directory.filter(item => item.assigned && item.team).length;

          const unassignedCount =
            directory.filter(item => !item.assigned).length;

          const validQrCount =
            Number(data.counts && data.counts.validQrCount) ||
            directory.length + 1;

          const workerAssignedCount =
            Number(data.counts && data.counts.assignedCount);

          const workerUnassignedCount =
            Number(data.counts && data.counts.unassignedCount);

          const countsMatch =
            validQrCount === directory.length + 1 &&
            (!Number.isFinite(workerAssignedCount) || workerAssignedCount === assignedCount) &&
            (!Number.isFinite(workerUnassignedCount) || workerUnassignedCount === unassignedCount);

          if (!countsMatch) {
            throw new Error(
              'HTTP ' + httpStatus +
              ' — directory count mismatch (' +
              validQrCount + ' valid / ' +
              assignedCount + ' assigned / ' +
              unassignedCount + ' unassigned)'
            );
          }

          const snapshot = [
            master,
            ...directory
          ];

          saveStoredTestQrDirectory(snapshot);

          const cfTotal =
            data.timing && Number.isFinite(Number(data.timing.totalMs))
              ? (Number(data.timing.totalMs) / 1000).toFixed(3) + 's CF'
              : '';

          addTestLog(
            'QR PASSKEY LOAD',
            'OK',
            timerSeconds(started) + 's',
            [
              'HTTP ' + httpStatus,
              validQrCount + ' VALID',
              assignedCount + ' ASSIGNED',
              unassignedCount + ' UNASSIGNED',
              cfTotal
            ].filter(Boolean).join(' • ')
          );

          return snapshot;
        }
        catch (error) {
          addTestLog(
            'QR PASSKEY LOAD',
            'FAILED',
            timerSeconds(started) + 's',
            error && error.message
              ? error.message
              : 'Directory request failed — CACHE NOT REPLACED'
          );

          return readStoredTestQrDirectory() || [
            {
              qrId: 'MASTER',
              passkey: SSHCP_MASTER_TEST_KEY,
              role: 'MASTER',
              assigned: true,
              team: 'MASTER',
              status: 'MASTER'
            }
          ];
        }
      })().finally(() => {
        sshcpQrDirectoryPromise = null;
      });

      return sshcpQrDirectoryPromise;
    }

        const buttonRect = button.getBoundingClientRect();

    async function decodeQrImage(file){
      if(!file) return;
      try{
        if(!('BarcodeDetector' in window)) throw new Error('QR camera decoding is not available in this browser.');
        const detector=new BarcodeDetector({formats:['qr_code']});
        const bitmap=await createImageBitmap(file);
        const codes=await detector.detect(bitmap);
        if(!codes.length) throw new Error('No QR code found.');
        const raw=String(codes[0].rawValue||'');
        let passkey=raw;
        try{ const u=new URL(raw,window.location.href); passkey=u.searchParams.get('passkey')||u.searchParams.get('key')||raw; }catch(_){}
        startLoadingLine();
        const ok=await validateQrPasskey(passkey,true);
        completeLoadingLine();
        if(ok){ scorecardHasLoaded=false; leaderboardHasLoaded=false; showTestLog(); }
      }catch(error){
        closeModal();
        els.modalTitle.textContent='QR SCAN';
        els.modalBody.textContent=(error&&error.message)||'QR code could not be read. Use ENTER PASSKEY or scan the QR with the phone camera.';
        els.modalInput.style.display='none';
        const ok=makeModalButton('OK','',showSwitchAuthorization);
        els.modalActions.className='modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }finally{ if(els.testQrCameraInput) els.testQrCameraInput.value=''; }
    }

    function restoreScorePosition(useLocalProgress = false) {

      if (
        !selectedTeam ||
        !els.scoreScroll
      ) {

        return;

      }


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              /*
                SSHCP V5.2 progress positioning:
                normal page/load positioning uses verified GOLD scores.
                Immediately after ENTER, useLocalProgress=true lets the
                viewport follow the newly entered gray score without
                waiting for Worker verification.

                The score viewport is exactly nine holes tall.

                Through Hole 5 -> show 1-9
                Through Hole 6 -> show 2-10
                Through Hole 7 -> show 3-11
                ...
                Through Hole 14 -> show 10-18
                Hole 15+ -> remain at 10-18
              */
              let lastCompletedIndex =
                -1;

              const progressScores =
                useLocalProgress
                  ? localScores
                  : savedScores;


              progressScores.forEach(
                (
                  score,
                  index
                ) => {

                  if (
                    score !== null
                  ) {

                    lastCompletedIndex =
                      index;

                  }

                }
              );


              if (
                lastCompletedIndex >= 0
              ) {

                const targetIndex =
                  Math.min(
                    9,
                    Math.max(
                      0,
                      lastCompletedIndex - 4
                    )
                  );


                const row =
                  els.scoreRows.querySelector(
                    '.score-row[data-score-index="' +
                    targetIndex +
                    '"]'
                  );


                if (row) {

                  const maxScroll =
                    Math.max(
                      0,
                      els.scoreScroll.scrollHeight -
                      els.scoreScroll.clientHeight
                    );


                  const scrollRect =
                    els.scoreScroll.getBoundingClientRect();

                  const rowRect =
                    row.getBoundingClientRect();

                  const targetScroll =
                    els.scoreScroll.scrollTop +
                    (
                      rowRect.top -
                      scrollRect.top
                    );


                  const clampedTarget =
                    Math.min(
                      Math.max(
                        0,
                        targetScroll
                      ),
                      maxScroll
                    );

                  const reducedMotion =
                    window.matchMedia &&
                    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                  const shouldSmooth =
                    !useLocalProgress &&
                    !reducedMotion &&
                    clampedTarget >
                      (els.scoreScroll.scrollTop + 2);

                  if (shouldSmooth) {
                    els.scoreScroll.scrollTo({
                      top: clampedTarget,
                      behavior: 'smooth'
                    });

                    window.setTimeout(
                      rememberScorePosition,
                      520
                    );
                  } else {
                    els.scoreScroll.scrollTop =
                      clampedTarget;

                    rememberScorePosition();
                  }

                  return;

                }

              }


              els.scoreScroll.scrollTop =
                0;

              rememberScorePosition();

            }
          );

        }
      );

    }

    function getTestLog() {
      try {

    function addTestLog(action, result, total, detail) {
      const log = getTestLog();
      const now = new Date();

      log.unshift({
        time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
        timestamp: now.toISOString(),
        action: String(action || ''),
        result: String(result || ''),
        total: total ? String(total) : '—',
        detail: String(detail || '')
      });

      /* SSHCP V5.2 — no 20-entry truncation. History remains until the
         user explicitly taps DELETE TEST DATA. */
      localStorage.setItem(TEST_LOG_KEY, JSON.stringify(log));

      if (currentView === 'testlog') renderTestLog();
    }

    function buildTestLogReport() {
      const log = getTestLog();
      const directory = readStoredTestQrDirectory() || [];
      const assigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && item.assigned && item.team
      ).length;
      const unassigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && !item.assigned
      ).length;
      const cacheTimeRaw = Number(
        localStorage.getItem(SSHCP_TEST_QR_CACHE_TIME_KEY) || 0
      );

      const lines = [
        'SSHCP V5.4a TEST LOG',
        'Generated: ' + new Date().toISOString(),
        'Worker: ' + CLOUDFLARE_API_URL,
        'Authorization: ' + getQrRole() +
          (getQrTeam() ? ' / ' + getQrTeam() : ''),
        'QR cache: ' +
          (directory.length
            ? directory.length + ' valid / ' + assigned + ' assigned / ' + unassigned + ' unassigned'
            : 'NOT LOADED'),
        'QR cache time: ' +
          (cacheTimeRaw ? new Date(cacheTimeRaw).toISOString() : '—'),
        'Log entries: ' + log.length,
        '',
        'TIME | ACTION | RESULT | TOTAL | DETAIL'
      ];

      log.slice().reverse().forEach(item => {
        lines.push(
          [
            item.timestamp || item.time || '',
            item.action || '',
            item.result || '',
            item.total || '—',
            item.detail || ''
          ].join(' | ')
        );
      });

      return lines.join('\n');
    }

    /* =========================================================
       SSHCP V5.3 QUICK TEST-WRITE PATCH
       - One retry for transient RANDOM 2 team writes.
       - HTTP status + Worker reason logged for bulk test failures.
       ========================================================= */

    /* =========================================================
       TEST PAGE — BULK SCORE CONTROLS
       ADD PAR / ADD RANDOM affect current teams. DELETE ALL clears all slots.
       ADD RANDOM 2 uses the existing verified saveScores path to create a
       stronger 68–74 round with 3–7 birdies, 3–7 bogeys and 0–2 eagles.
       ========================================================= */

    function randomIntInclusive(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffledIndexes(values) {
      const copy = [...values];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function generateRandom2Round(courseHoles) {
      const usable = Array.isArray(courseHoles) ? courseHoles.slice(0, 18) : [];
      if (usable.length !== 18) {
        throw new Error('ADD RANDOM 2 requires 18 course holes.');
      }

      const pars = usable.map(hole => Number(hole.par));
      if (pars.some(par => !Number.isFinite(par) || par <= 0)) {
        throw new Error('ADD RANDOM 2 could not read the course pars.');
      }

      const parTotal = pars.reduce((sum, par) => sum + par, 0);
      const eagleEligible = usable
        .map((hole, index) => Number(hole.par) >= 4 ? index : -1)
        .filter(index => index >= 0);

      const combinations = [];
      for (let eagles = 0; eagles <= 2; eagles++) {
        if (eagles > eagleEligible.length) continue;
        for (let birdies = 3; birdies <= 7; birdies++) {
          for (let bogeys = 3; bogeys <= 7; bogeys++) {
            if (eagles + birdies + bogeys > 18) continue;
            const total = parTotal - (2 * eagles) - birdies + bogeys;
            if (total >= 68 && total <= 74) {
              combinations.push({ eagles, birdies, bogeys, total });
            }
          }
        }
      }

      if (!combinations.length) {
        throw new Error('No 68–74 RANDOM 2 combination fits this course par.');
      }

      const combo = combinations[randomIntInclusive(0, combinations.length - 1)];
      const scores = [...pars];
      const used = new Set();

      shuffledIndexes(eagleEligible)
        .slice(0, combo.eagles)
        .forEach(index => {
          scores[index] = pars[index] - 2;
          used.add(index);
        });

      const birdiePool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      birdiePool.slice(0, combo.birdies).forEach(index => {
        scores[index] = pars[index] - 1;
        used.add(index);
      });

      const bogeyPool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      bogeyPool.slice(0, combo.bogeys).forEach(index => {
        scores[index] = pars[index] + 1;
        used.add(index);
      });

      return { scores, ...combo };
    }

    async function loadFreshTestScoreSource() {
      const response = await fetch(
        CLOUDFLARE_API_URL + '?refresh=' + Date.now() + '-random2',
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error('ADD RANDOM 2 could not load current teams.');
      }

      const data = await response.json();
      if (!data || data.ok !== true) {
        throw new Error((data && data.error) || 'ADD RANDOM 2 data unavailable.');
      }

      const freshHoles = Array.isArray(data.course && data.course.holes)
        ? data.course.holes.slice(0, 18)
        : [];
      const freshTeams = Array.isArray(data.teams)
        ? data.teams.filter(team => team && String(team.name || '').trim() !== '')
        : [];

      if (freshHoles.length !== 18 || !freshTeams.length) {
        throw new Error('ADD RANDOM 2 needs 18 holes and at least one current team.');
      }

      holes = freshHoles;
      teams = freshTeams;
      return { freshHoles, freshTeams };
    }

    async function runRandom2Current() {
      const { freshHoles, freshTeams } = await loadFreshTestScoreSource();
      const passkey = isMasterQr() && getQrPasskey()
        ? getQrPasskey()
        : SSHCP_MASTER_TEST_KEY;

      const generated = [];

      /* Sequential verified writes avoid concurrent Google Sheets test writes.
         A single transient Worker/Sheets failure gets one immediate retry. */
      for (const team of freshTeams) {
        const round = generateRandom2Round(freshHoles);
        let lastError = null;
        let verified = false;

        for (let attempt = 1; attempt <= 2 && !verified; attempt++) {
          try {
            const response = await fetch(
              CLOUDFLARE_API_URL +
                '?action=saveScores' +
                '&slot=' + encodeURIComponent(Number(team.slot)) +
                '&scores=' + encodeURIComponent(JSON.stringify(round.scores)) +
                '&passkey=' + encodeURIComponent(passkey) +
                '&refresh=' + Date.now() + '-' + attempt,
              { cache: 'no-store' }
            );

            let data = null;
            try { data = await response.json(); } catch (_) {}

            if (!response.ok) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'request failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            if (
              !data ||
              data.ok !== true ||
              data.verified !== true ||
              !scoresEqual(data.verifiedScores, round.scores)
            ) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'verification failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            verified = true;
          } catch (error) {
            lastError = error;
            if (attempt === 1) {
              await new Promise(resolve => setTimeout(resolve, 450));
            }
          }
        }

        if (!verified) {
          throw new Error(
            'ADD RANDOM 2 failed for ' + String(team.name || 'a team') +
            (lastError && lastError.message ? ' • ' + lastError.message : '')
          );
        }

        generated.push(round);
      }

      const totals = generated.map(round => round.total);
      const birdies = generated.map(round => round.birdies);
      const bogeys = generated.map(round => round.bogeys);
      const eagles = generated.map(round => round.eagles);

      return {
        ok: true,
        verified: true,
        affectedTeams: generated.length,
        random2Summary:
          Math.min(...totals) + '–' + Math.max(...totals) + ' TOTAL • ' +
          Math.min(...birdies) + '–' + Math.max(...birdies) + ' BIRDIES • ' +
          Math.min(...bogeys) + '–' + Math.max(...bogeys) + ' BOGEYS • ' +
          Math.min(...eagles) + '–' + Math.max(...eagles) + ' EAGLES'
      };
    }

    async function runTestScoreAction(mode, scope) {
      closeModal();
      startLoadingLine();

      const started = timerStart();
      const isPar = mode === 'par';
      const isRandom = mode === 'random';
      const isRandom2 = mode === 'random2';

      const actionLabel =
        isRandom2
          ? 'ADD RANDOM 2'
          : isRandom
            ? 'ADD RANDOM'
            : isPar
              ? 'ADD PAR'
              : 'DELETE ALL';

      try {
        let data;

        if (isRandom2) {
          data = await runRandom2Current();
        } else {
          const response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=testScores' +
              '&mode=' + encodeURIComponent(mode) +
              '&scope=' + encodeURIComponent(scope) +
              '&passkey=' + encodeURIComponent(isMasterQr() ? getQrPasskey() : '') +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          let parsed = null;
          try { parsed = await response.json(); } catch (_) {}

          if (!response.ok) {
            const reason = parsed && (parsed.reason || parsed.error)
              ? String(parsed.reason || parsed.error)
              : 'request failed';
            throw new Error(actionLabel + ' failed • HTTP ' + response.status + ' • ' + reason);
          }

          data = parsed;
        }

        if (!data || data.ok !== true || data.verified !== true) {
          throw new Error(
            (data && data.error) ||
            (actionLabel + ' was not verified.')
          );
        }

        teams.forEach(team => {
          localStorage.removeItem(pendingScoresKey(team));
        });

        scorecardHasLoaded = false;
        leaderboardHasLoaded = false;
        sessionStorage.removeItem('sshcpScorecardSnapshotV53');
        sessionStorage.removeItem('sshcpLeaderboardSnapshotV53');

        const testDetailParts = [
          data.affectedTeams + ' team slot' +
            (Number(data.affectedTeams) === 1 ? '' : 's')
        ];

        if (mode === 'random' && data.randomMix) {
          testDetailParts.push(
            data.randomMix.birdiesPerTeam + ' BIRDIES / ' +
            data.randomMix.parsPerTeam + ' PARS / ' +
            data.randomMix.bogeysPerTeam + ' BOGEYS EACH'
          );
        }

        if (isRandom2 && data.random2Summary) {
          testDetailParts.push(data.random2Summary);
        }

        addTestLog(
          actionLabel,
          'VERIFIED',
          timerSeconds(started) + 's',
          testDetailParts.join(' • ')
        );

        completeLoadingLine();
        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' COMPLETE';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          data.affectedTeams +
          ' team slot' +
          (Number(data.affectedTeams) === 1 ? '' : 's') +
          ' verified.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', 'primary', closeModal);
        els.modalActions.className = 'modal-actions single test-success';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
      catch (error) {
        stopLoadingLine();

        addTestLog(
          actionLabel,
          'FAILED',
          timerSeconds(started) + 's',
          error && error.message ? error.message : 'Action failed'
        );

        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        closeModal();
        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' FAILED';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          error && error.message
            ? error.message
            : 'The score action could not be completed.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', '', closeModal);
        els.modalActions.className = 'modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
    }

    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      const hadExistingScorecard =
        scorecardHasLoaded &&
        els.scoreRows &&
        els.scoreRows.children.length > 0;

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        const renderedAt =

          );

        scorecardHasLoaded =

        scorecardLoadSeconds =
          timerSeconds(

          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {

    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }



    /* =========================================================
       V9.9 — SCORECARD RUNNING GROSS / NET
       Uses verified (gold) scores only.
       Net matches the leaderboard convention:
       gross relative-to-par minus the team's full handicap.
       ========================================================= */

    function scorecardHandicap(team) {
      if (!team) return 0;

      const candidates = [
        team.handicap,
        team.hcp,
        team.teamHandicap,
        team.teamHcp
      ];

      const value = candidates.find(
        item =>
          item !== undefined &&
          item !== null &&
          String(item).trim() !== ''
      );

      const number = Number(value);
      return Number.isFinite(number) ? Math.abs(number) : 0;
    }


    function formatScorecardRelative(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }


    function updateScorecardRunningScores() {
      if (!els.scoreRunningGross || !els.scoreRunningNet) return;

      if (!selectedTeam) {
        els.scoreRunningGross.textContent = '(E)';
        els.scoreRunningNet.textContent = '(E)';
        els.scoreRunningGross.classList.remove('under-par');
        els.scoreRunningNet.classList.remove('under-par');
        return;
      }

      let gross = 0;

      savedScores.forEach((score, index) => {
        if (
          score === null ||
          !holes[index] ||
          !Number.isFinite(Number(score)) ||
          !Number.isFinite(Number(holes[index].par))
        ) {
          return;
        }

        gross += Number(score) - Number(holes[index].par);
      });

      const net = gross - scorecardHandicap(selectedTeam);

      els.scoreRunningGross.textContent =
        '(' + formatScorecardRelative(gross) + ')';

      els.scoreRunningNet.textContent =
        '(' + formatScorecardRelative(net) + ')';

      els.scoreRunningGross.classList.toggle('under-par', gross < 0);
      els.scoreRunningNet.classList.toggle('under-par', net < 0);
    }

    let v5MeasureProbe = null;

    function fitTextToBoxV5(
      box,
      target,
      maxPx,
      minPx = 8,
      options = {}
    ) {
      if (!box || !target) return minPx;

      const boxWidth = box.clientWidth;
      const boxHeight = box.clientHeight;
      if (boxWidth <= 0 || boxHeight <= 0) return minPx;

      const horizontalPad = Number(options.horizontalPad || 0);
      const verticalPad = Number(options.verticalPad || 0);
      const availableWidth = Math.max(1, boxWidth - horizontalPad);
      const availableHeight = Math.max(1, boxHeight - verticalPad);

      if (!v5MeasureProbe) {
        v5MeasureProbe = document.createElement('span');
        v5MeasureProbe.setAttribute('aria-hidden', 'true');
        Object.assign(v5MeasureProbe.style, {
          position: 'fixed',
          left: '-10000px',
          top: '-10000px',
          visibility: 'hidden',
          pointerEvents: 'none',
          zIndex: '-1'
        });
        document.body.appendChild(v5MeasureProbe);
      }

      const computed = getComputedStyle(target);
      const text = String(target.textContent || '').replace(/\s+/g, ' ').trim();

      v5MeasureProbe.textContent = text;
      v5MeasureProbe.style.fontFamily = computed.fontFamily;
      v5MeasureProbe.style.fontWeight = computed.fontWeight;
      v5MeasureProbe.style.fontStyle = computed.fontStyle;
      v5MeasureProbe.style.letterSpacing = computed.letterSpacing;
      v5MeasureProbe.style.textTransform = computed.textTransform;
      v5MeasureProbe.style.whiteSpace = options.wrap ? 'normal' : 'nowrap';
      v5MeasureProbe.style.width = options.wrap ? availableWidth + 'px' : 'auto';
      v5MeasureProbe.style.lineHeight = String(options.lineHeight || 1);

      let low = Math.max(5, minPx);
      let high = Math.max(low, maxPx);
      let best = low;

      for (let i = 0; i < 12; i++) {
        const mid = (low + high) / 2;
        v5MeasureProbe.style.fontSize = mid + 'px';
        const rect = v5MeasureProbe.getBoundingClientRect();

        const fits =
          rect.width <= availableWidth + 0.75 &&
          rect.height <= availableHeight + 0.75;

        if (fits) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      target.style.setProperty('font-size', best + 'px', 'important');
      target.style.setProperty('line-height', String(options.lineHeight || 1), 'important');
      target.style.setProperty('white-space', options.wrap ? 'normal' : 'nowrap', 'important');
      target.style.setProperty('overflow', 'hidden', 'important');
      target.style.setProperty('text-align', 'center', 'important');

      return best;
    }

    function rememberResponsiveGeometryV5(patch = {}) {
      try {
        const previous = JSON.parse(
          sessionStorage.getItem('sshcpResponsiveGeometryV5') || '{}'
        ) || {};

        const next = {
          ...previous,
          ...patch,
          w: window.innerWidth || 0,
          h: window.innerHeight || 0
        };

        sessionStorage.setItem(
          'sshcpResponsiveGeometryV5',
          JSON.stringify(next)
        );
      } catch (e) {}
    }


    function sizeScorecardV5() {
      const screen = els.scorecardView
        ? els.scorecardView.querySelector('.scorecard-screen')
        : null;
      const top = els.scorecardView
        ? els.scorecardView.querySelector('.score-fixed-top')
        : null;
      const header = els.scorecardView
        ? els.scorecardView.querySelector('.score-table-head')
        : null;
      const bottom = els.scorecardView
        ? els.scorecardView.querySelector('.score-fixed-bottom')
        : null;

      if (!screen || !top || !header || !bottom || !els.scoreScroll) {
        return;
      }

      const screenHeight = screen.clientHeight;
      const topHeight = top.getBoundingClientRect().height;
      const oldHeaderHeight = header.getBoundingClientRect().height;
      const bottomHeight = bottom.getBoundingClientRect().height;

      if (!Number.isFinite(screenHeight) || screenHeight <= 0) return;

      /*
        V5.2 fixed-point geometry.
        HEADER + 9 ROWS + divider share ONE current table-height budget.
        Because the header is removed from the measured fixed shell before
        solving, rerendering data cannot change the result.
      */
      const fixedShellWithoutHeader =
        Math.max(0, topHeight - oldHeaderHeight) + bottomHeight;

      const tableBudget =
        Math.max(1, screenHeight - fixedShellWithoutHeader);

      const divider =
        Math.max(2, Math.min(4, tableBudget * 0.004));

      const scoreTableBudget = Math.max(1, tableBudget - divider);
      const headerHeight = (scoreTableBudget / 10) * 0.85;
      const rowHeight = Math.max(1, (scoreTableBudget - headerHeight) / 9);

      els.scorecardView.style.setProperty('--v5-score-row-h', rowHeight + 'px');
      els.scorecardView.style.setProperty('--v5-score-head-h', headerHeight + 'px');
      els.scorecardView.style.setProperty('--v5-nine-break-h', divider + 'px');

      const scoreBox = Math.max(
        28,
        Math.min(
          rowHeight * 0.94,
          els.scoreScroll.clientWidth * 0.17
        )
      );
      els.scorecardView.style.setProperty('--v5-score-box', scoreBox + 'px');

      rememberResponsiveGeometryV5({
        scoreHead: headerHeight,
        scoreRow: rowHeight,
        scoreBox: scoreBox,
        scoreDivider: divider
      });

      /* Header content fits its CURRENT hard cells. */
      Array.from(header.children).forEach((cell, index) => {
        if (index < 3) {
          fitTextToBoxV5(cell, cell, headerHeight * 0.375, 12, {
            horizontalPad: 8,
            verticalPad: 4
          });
        }
      });

      const running = header.querySelector('.score-running-header');
      if (running) {
        const parts = Array.from(running.children);
        if (parts[0]) fitTextToBoxV5(parts[0], parts[0], headerHeight * 0.40, 8, {horizontalPad:2});
        if (parts[1]) fitTextToBoxV5(parts[1], parts[1], headerHeight * 0.375, 12, {horizontalPad:4});
        if (parts[2]) fitTextToBoxV5(parts[2], parts[2], headerHeight * 0.40, 8, {horizontalPad:2});
      }

      els.scoreRows.querySelectorAll('.score-row').forEach(row => {
        const holeCell = row.querySelector('.hole-cell');
        const hole = row.querySelector('.hole-number');
        const par = row.querySelector('.par-cell');
        const yards = row.querySelector('.yardage-cell');
        const button = row.querySelector('.score-button');

        if (holeCell && hole) {
          fitTextToBoxV5(holeCell, hole, rowHeight * 0.50, 13, {horizontalPad:8,verticalPad:6});
        }
        if (par) {
          fitTextToBoxV5(par, par, rowHeight * 0.40, 12, {horizontalPad:8,verticalPad:6});
        }
        if (yards) {
          fitTextToBoxV5(yards, yards, rowHeight * 0.40, 11, {horizontalPad:8,verticalPad:6});
        }
        if (button) {
          fitTextToBoxV5(button, button, scoreBox * 0.68, 13, {horizontalPad:4,verticalPad:4});
        }
      });
    }


    function fitScorecardBodyTypography() {

    function renderScorecard() {

      els.scoreRows.innerHTML =
        '';


      /*
        SSHCP V5.2 — the gray current-hole indicator follows LOCAL entry
        progress immediately. Gold still follows verified/savedScores.
        This lets ENTER mean "move on now" while verification finishes
        in the background.
      */
      let lastEnteredHoleIndex = -1;

      localScores.forEach(
        (score, index) => {
          if (score !== null) {
            lastEnteredHoleIndex = index;
          }
        }
      );

      const nextHoleIndex =
        lastEnteredHoleIndex < holes.length - 1
          ? lastEnteredHoleIndex + 1
          : holes.length - 1;


      holes.forEach(
        (
          hole,
          index
        ) => {


          if (
            index === 9
          ) {

            const breakRow =
              document.createElement(
                'div'
              );


            breakRow.className =
              'nine-break';


            els.scoreRows.appendChild(
              breakRow
            );

          }


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'score-row';


          row.dataset.scoreIndex =
            String(
              index
            );


          const holeCell =
            document.createElement(
              'div'
            );


          holeCell.className =
            'hole-cell';

          if (index === nextHoleIndex) {
            holeCell.classList.add(
              'next-hole-cell'
            );
          }


          const holeNumber =
            document.createElement(
              'span'
            );

          holeNumber.className =
            'hole-number';

          holeNumber.textContent =
            hole.hole;

          holeCell.appendChild(
            holeNumber
          );


          const parCell =
            document.createElement(
              'div'
            );


          parCell.className =

      updateScorecardRunningScores();
      saveScorecardSnapshotV53();

      );

    function makeSubmittedScoreMark(score, par) {
      const mark = document.createElement('span');
      const relative = Number(score) - Number(par);
      mark.className = 'score-mark';
      const number = document.createElement('span');
      number.className = 'score-mark-number';
      number.textContent = String(score);
      mark.appendChild(number);
      if (relative === -1) mark.classList.add('single-circle');
      else if (relative <= -2) mark.classList.add('double-circle');
      else if (relative === 1) mark.classList.add('single-square');
      else if (relative === 2) mark.classList.add('double-square');
      else if (relative >= 3) mark.classList.add('bold-square');
      else mark.classList.add('par-mark');
      return mark;
    }

    function pendingScoresKey(team) {
      if (!team) return '';
      return 'rotbPendingScores:' + String(team.slot);
    }


    function readPendingScores(team) {
      const key = pendingScoresKey(team);
      if (!key) return null;

      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        if (!Array.isArray(parsed) || parsed.length !== 18) return null;
        return normalizeScores(parsed);
      }
      catch (_) {
        return null;
      }
    }


    function syncPendingScoresStorage() {
      if (!selectedTeam) return;

      const key = pendingScoresKey(selectedTeam);
      if (!key) return;

      if (hasPendingScores()) {
        localStorage.setItem(key, JSON.stringify(localScores));
      }
      else {
        localStorage.removeItem(key);
      }
    }


    function hasPendingScores() {
      if (!selectedTeam) return false;
      return localScores.some((score,index) => score !== savedScores[index]);
    }

    function updateSubmitButtonState() {
      els.submitBtn.disabled = saveInProgress || !hasPendingScores();
    }

    function isSelectedTeamAuthorized() {

      if (
        !selectedTeam
      ) {

        return false;

      }


      return (
        normalizeName(
          getAuthorizedTeam()
        ) ===
        normalizeName(

        )
      );

    function requestScoreEntry(
      index
    ) {

      if (
        !selectedTeam
      ) {

        return;

      }


      if (isTeamQr()) {
        if (normalizeName(selectedTeam.name) !== normalizeName(getQrTeam())) { showNotAuthorized(); return; }
        openScoreEntry(index);
        return;
      }

      if (isMasterQr() && !isTeamAuthorizationEnabled()) {
        openScoreEntry(index);
        return;
      }

      if (isSelectedTeamAuthorized()) {
        openScoreEntry(index);
        return;
      }

      showAuthorizationModal(index);

    }

    /* =========================================================
       SCORE ENTRY
       ========================================================= */


    function updateScoreEntryPreview() {
      if (
        activeScoreIndex === null ||
        !els.scoreEntryPreview
      ) {
        return;
      }

      const hole = holes[activeScoreIndex];
      if (!hole) return;

      const value = Number(els.scoreEntryInput.value);

      els.scoreEntryPreview.replaceChildren();

      if (
        !Number.isInteger(value) ||
        value <= 0
      ) {
        return;
      }

      els.scoreEntryPreview.appendChild(
        makeSubmittedScoreMark(
          value,
          Number(hole.par)
        )
      );
    }


    function openScoreEntry(
      index
    ) {

      const hole =
        holes[
          index
        ];


      if (
        !hole ||
        !selectedTeam
      ) {

        return;

      }


      activeScoreIndex =
        index;


      scoreEntryClosing =
        false;


      els.scoreEntryHole.textContent =
        'HOLE ' +
        hole.hole;


      els.scoreEntryPar.textContent =
        'PAR ' +
        hole.par;


      els.scoreEntryInput.value =
        String(
          localScores[index] === null
            ? hole.par
            : localScores[index]
        );

      updateScoreEntryPreview();


      els.scoreEntryOverlay
        .classList
        .add(
          'open'
        );


      // V7-CF.14: keyboard stays closed by default.
      els.scoreEntryInput.blur();


      positionScoreEntry();

    }


    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return {
          committed: false,
          cleared: false,
          index: null
        };

      }


      const index =
        activeScoreIndex;


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value < 0
      ) {

        return {
          committed: false,
          cleared: false,
          index
        };

      }


      if (
        value === 0
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      localScores[
        index
      ] =
        value;


      renderScorecard();
      syncPendingScoresStorage();


      addTestLog(
        'SCORE H' + (index + 1),
        'PENDING',
        '—',
        'Score ' + value + ' • auto-submit'
      );


      return {
        committed: true,
        cleared: false,
        index
      };

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      const commitResult =
        commitTypedValue
          ? commitScoreEntryValue()
          : {
              committed: false,
              cleared: false,
              index: activeScoreIndex
            };


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      /*
        V7-CF.11: A committed 0 OR blank value is handled as one atomic CLEAR.
        The popup is closed first, then the auto-submit is started.
        This avoids the old deferred clear/close race that could make
        Android Enter appear to require multiple attempts.

        Every committed score now starts the verified save immediately after
        the popup closes. If another score is entered while that save is
        in flight, one follow-up save is queued so the newer gray score is
        not overwritten or lost.
      */
      if (
        commitResult.committed
      ) {

        /*
          SSHCP V5.2 — ENTER advances immediately.
          A real entered score has already rerendered the next-hole gray
          indicator from localScores, and this moves the visible viewport
          at the same moment. CLEAR intentionally does not auto-advance.
          Gold remains verification-only.
        */
        if (!commitResult.cleared) {
          restoreScorePosition(true);
        }

        submitScores();

      }


      setTimeout(
        () => {

          scoreEntryClosing =
            false;

        },
        0
      );

    }


    function positionScoreEntry() {

      /*
        V7-CF.14: The score panel is intentionally anchored in the
        lower part of the screen for one-thumb use. CSS owns the
        position; opening the panel never summons the keyboard.
      */
      els.scoreEntryOverlay.style.paddingTop = '';

    }


    /* =========================================================
       CLOUDFLARE: VERIFIED SCORE WRITE
       Google Apps Script is NOT used.

       One request only:
       Worker writes -> reads Google Sheets back -> verifies.
       Gold score state is applied only after verified:true and
       exact verifiedScores match. No artificial wait. No same-attempt retry.
       ========================================================= */


    async function submitScores() {

      if (
        !selectedTeam ||
        !hasPendingScores()
      ) {
        return;
      }

      if (saveInProgress) {
        saveQueued = true;
        return;
      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      const started =
        timerStart();

      const expectedScores =
        normalizeScores(
          localScores
        );

      const expectedSlot =
        Number(
          selectedTeam.slot
        );

      const apiScores =
        expectedScores.map(
          score =>
            score === null
              ? ''
              : score
        );

      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            apiScores
          )
        );

      const url =
        CLOUDFLARE_API_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&passkey=' +
        encodeURIComponent(getQrPasskey()) +
        '&refresh=' +
        Date.now();

      startLoadingLine();

      try {

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Save request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true ||
          data.verified !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not verified.'
          );
        }

        const confirmedScores =
          normalizeScores(
            data.verifiedScores
          );

        if (
          !scoresEqual(
            confirmedScores,
            expectedScores
          )
        ) {
          throw new Error(
            'Verified scores did not match submitted scores.'
          );
        }

        /*
          V15.9 — determine whether this verified batch contains an
          entered score before replacing savedScores. This preserves the
          V15.8 behavior: ENTER may auto-position; CLEAR does not.
        */
        const shouldAutoPositionAfterSave =
          expectedScores.some(
            (score, index) =>
              score !== null &&
              score !== savedScores[index]
          );

        savedScores =
          [
            ...confirmedScores
          ];

        /*
          Do not overwrite localScores here. The player may already have
          entered another hole while this request was in flight. The
          verified snapshot becomes savedScores; any newer local difference
          stays gray and is sent by the queued save below.
        */
        syncPendingScoresStorage();

        const teamIndex =
          teams.findIndex(
            team =>
              Number(
                team.slot
              ) ===
              expectedSlot
          );

        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...confirmedScores
            ];

          selectedTeam =
            teams[
              teamIndex
            ];

        }

        syncPendingScoresStorage();
        renderScorecard();

        /*
          V15.9 — only an entered/verified score advances the visible
          scorecard position. Clearing a score still rerenders the
          scorecard and updates its hole indicator, but does not move
          the viewport.
        */
        if (shouldAutoPositionAfterSave) {
          restoreScorePosition();
        }

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'save'
          );

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'VERIFIED', scoreSaveSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

      }
      catch (error) {

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'FAILED', scoreSaveSeconds + 's', String(error && error.message ? error.message : 'Save failed'));
        stopLoadingLine();

        showMessageModal(
          'Save Not Confirmed',
          'Google Sheets did not confirm the new scores. Your entered scores remain gray. If they stay gray, refresh the page and ROTB will read the official scorecard, retry the pending scores, and verify them.'
        );

      }
      finally {

        saveInProgress =
          false;

        updateSubmitButtonState();

        if (saveQueued) {
          saveQueued = false;

          if (hasPendingScores()) {
            setTimeout(
              () => submitScores(),
              0
            );
          }
        }

      }

    }


    /* =========================================================
       CLOUDFLARE: LEADERBOARD READ
       Google Apps Script is NOT used.
       Fresh read every time LIVE LEADERBOARD is opened + manual REFRESH. No polling.
       ========================================================= */


    async function loadLeaderboard(
      showErrorIfEmpty
    ) {

      if (
        leaderboardLoadInProgress
      ) {
        return;
      }

      leaderboardLoadInProgress =
        true;

      /* V4.3 — refresh data without visually reverting the existing shell.
         The current table/state stays in place until fresh rows are ready. */

      els.leaderRefreshButton.disabled =
        true;

      const wasAlreadyLoaded =
        leaderboardHasLoaded;

      const started =
        timerStart();

      els.leaderUpdateNote.textContent =
        wasAlreadyLoaded
          ? 'Refreshing leaderboard...'
          : 'Loading leaderboard...';

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?action=leaderboard' +
          '&refresh=' +
          Date.now();

        /*
          If leaderboard is opened before scorecard, get team
          metadata in parallel so HCP fallback stays available.
          This is a Cloudflare read too — never Apps Script.
        */
        const teamMetadataPromise =
          teams.length
            ? Promise.resolve(null)
            : fetch(
                CLOUDFLARE_API_URL +
                '?refresh=' +
                Date.now() +
                '-teams',
                {
                  cache:
                    'no-store'
                }
              )
                .then(
                  response =>
                    response.ok
                      ? response.json()
                      : null
                )
                .catch(
                  () => null
                );

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Leaderboard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Leaderboard unavailable.'
          );
        }

        const rows =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];

        const teamMetadata =
          await teamMetadataPromise;

        if (
          teams.length === 0 &&
          teamMetadata &&
          teamMetadata.ok === true &&
          Array.isArray(
            teamMetadata.teams
          )
        ) {
          teams =
            teamMetadata.teams.filter(
              team =>
                team &&
                String(
                  team.name || ''
                ).trim() !== ''
            );
        }

        renderLeaderboard(
          rows,
          !wasAlreadyLoaded
        );
        updateTournamentFinishState(
          rows
        );
        saveLeaderboardSnapshotV53();

        const renderedAt =
          timerStart();

        leaderboardTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        const seconds =
          timerSeconds(
            started
          );

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'OK', seconds + 's', leaderboardTimingDetail);

        leaderboardHasLoaded =
          true;

        els.leaderUpdateNote.textContent =
          'Tap REFRESH for latest standings';

        completeLoadingLine();


      }
      catch (error) {

        const seconds =
          timerSeconds(
            started
          );

        leaderboardTimingDetail =
          '';

        if (
          wasAlreadyLoaded
        ) {
          leaderboardRefreshSeconds =
            seconds;
        }
        else {
          leaderboardLoadSeconds =
            seconds;
        }

        updateLeaderboardTiming();
        addTestLog(wasAlreadyLoaded ? 'LEADERBOARD REFRESH' : 'LEADERBOARD LOAD', 'FAILED', seconds + 's', String(error && error.message ? error.message : 'Request failed'));
        stopLoadingLine();

        if (
          leaderboardHasLoaded
        ) {
          els.leaderUpdateNote.textContent =
            'Refresh failed • standings unchanged';

          return;
        }

        els.leaderUpdateNote.textContent =
          'Leaderboard could not be loaded';

        if (
          showErrorIfEmpty
        ) {
          showLoadError(
            'Leaderboard Could Not Load',
            'The live leaderboard could not be loaded.',
            async () => {
              closeModal();
              await loadLeaderboard(
                true
              );
            }
          );
        }

      }
      finally {

        leaderboardLoadInProgress =
          false;

        els.leaderRefreshButton.disabled =
          false;

      }

    }


    /* =========================================================
       V14.1 — TOURNAMENT COMPLETION / PODIUM TIEBREAK
       ========================================================= */
    function tournamentIsComplete(rows) {
      return Array.isArray(rows) && rows.length > 0 &&
        rows.every(row => Number(row.thru) === 18);
    }

    function firstPlaceTiedRows(rows) {
      if (!Array.isArray(rows) || rows.length < 2) return [];
      const numericRows = rows.filter(row => Number.isFinite(Number(row.net)));
      if (numericRows.length < 2) return [];
      const bestNet = Math.min(...numericRows.map(row => Number(row.net)));
      return numericRows.filter(row => Number(row.net) === bestNet);
    }

    function tiebreakValue(row, index) {
      const raw = Array.isArray(row.tiebreakScores)
        ? row.tiebreakScores[index]
        : '';
      if (raw === '' || raw === null || raw === undefined) return NaN;
      return Number(raw);
    }

    function actualTiebreakHole(row, index) {
      const raw = Array.isArray(row?.tiebreakHoles)
        ? row.tiebreakHoles[index]
        : '';

      if (raw === '' || raw === null || raw === undefined) return '';
      return String(raw).trim();
    }

    function resolveTieContenders(tied) {
      if (!Array.isArray(tied) || tied.length < 2) return null;

      let contenders = [...tied];

      const holeCount = Math.max(
        0,
        ...tied.map(row =>
          Array.isArray(row?.tiebreakScores)
            ? row.tiebreakScores.length
            : 0
        )
      );

      for (let index = 0; index < holeCount; index++) {
        const enteringHole = [...contenders];

        const scored = enteringHole.map(row => ({
          row,
          score: tiebreakValue(row, index)
        }));

        if (scored.some(item => !Number.isFinite(item.score))) {
          return {
            tied: [...tied],
            winner: null,
            decidingIndex: null,
            unresolved: true,
            decidingContenders: enteringHole
          };
        }

        const bestScore = Math.min(...scored.map(item => item.score));
        contenders = scored
          .filter(item => item.score === bestScore)
          .map(item => item.row);

        if (contenders.length === 1) {
          return {
            tied: [...tied],
            winner: contenders[0],
            decidingIndex: index,
            winningScore: bestScore,
            unresolved: false,
            decidingContenders: enteringHole
          };
        }
      }

      return {
        tied: [...tied],
        winner: null,
        decidingIndex: null,
        unresolved: true,
        decidingContenders: [...contenders]
      };
    }

    function resolveFirstPlaceTie(rows) {
      const tied = firstPlaceTiedRows(rows);
      if (tied.length < 2) return null;
      return resolveTieContenders(tied);
    }

    function ordinalNumber(number) {
      const n = Number(number);
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 13) return n + 'th';
      switch (n % 10) {
        case 1: return n + 'st';
        case 2: return n + 'nd';
        case 3: return n + 'rd';
        default: return n + 'th';
      }
    }

    function ordinalHandicapHole(index) {
      const number = Number(index) + 1;
      return Number.isFinite(number) && number > 0
        ? ordinalNumber(number) + ' Handicap Hole'
        : '';
    }

    function setLeaderboardFinalAction(mode) {
      if (!els.leaderFinalActionButton || !els.leaderTop) return;
      const button = els.leaderFinalActionButton;
      button.classList.remove('break-tie', 'tournament-summary', 'summary-label');

      if (!mode) {
        button.textContent = '';
        button.setAttribute('aria-hidden', 'true');
        els.leaderTop.classList.remove('final-action-active');
        try {
          sessionStorage.removeItem('sshcpFinalActionMode');
          sessionStorage.removeItem('sshcpFinalActionLabel');
        } catch (e) {}
        return;
      }

      els.leaderTop.classList.add('final-action-active');
      button.setAttribute('aria-hidden', 'false');

      if (mode === 'break-tie') {
        button.innerHTML = '<span class="leader-final-main">BREAK TIE</span>';
        button.classList.add('break-tie');
      } else {
        button.innerHTML =
          '<span class="leader-final-main">SCRAMBLE SUMMARY</span>';
        button.classList.add('tournament-summary', 'summary-label');
      }

      try {
        sessionStorage.setItem('sshcpFinalActionMode', mode);
        sessionStorage.setItem(
          'sshcpFinalActionLabel',
          button.textContent.trim()
        );
      } catch (e) {}
    }

    function measureCompletedActionSpaceV53() {
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;
      const titleBar = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-title-bar')
        : null;
      if (!screen) return;

      let freed = 0;
      if (titleBar && getComputedStyle(titleBar).display !== 'none') {
        const style = getComputedStyle(titleBar);
        freed += titleBar.getBoundingClientRect().height +
          (parseFloat(style.marginTop) || 0) +
          (parseFloat(style.marginBottom) || 0);
      }
      if (freed > 0) {
        screen.style.setProperty('--v53-final-slot-h', freed + 'px');
      }
    }

    function positionCompletedFinalAction() {
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;

      if (
        !screen ||
        !screen.classList.contains('tournament-complete') ||
        !els.leaderContent
      ) {
        return;
      }

      /*
        SSHCP V5.2:
        Completed-state leaderboard uses the SAME live responsive table
        sizing as in-play. There is no stored/frozen table height.

        Once the title/progress disappear, normal flex layout gives:
          responsive leaderboard
          responsive result-action row
          fixed footer

        Re-run the normal leaderboard row fitter against the CURRENT
        available height every time the layout changes.
      */
      requestAnimationFrame(() => {
        sizeLeaderboardRows();
      });
    }

    function updateTournamentFinishState(rows) {
      lastLeaderboardRows = Array.isArray(rows) ? rows.map(row => ({ ...row })) : [];

      const complete = tournamentIsComplete(lastLeaderboardRows);

      sessionStorage.setItem(
        'sshcpTournamentComplete',
        complete ? '1' : '0'
      );

      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;

      if (complete && screen && !screen.classList.contains('tournament-complete')) {
        measureCompletedActionSpaceV53();
      }

      if (screen) {
        screen.classList.toggle(
          'tournament-complete',
          complete
        );
      }

      if (!complete) {
        resetTournamentTieBreakViewed();
        setLeaderboardFinalAction(null);
        return;
      }

      /* Final-results mode is stable; manual REFRESH only. */
      const tied = firstPlaceTiedRows(lastLeaderboardRows);
      if (tied.length < 2) {
        setLeaderboardFinalAction('tournament-summary');

        requestAnimationFrame(
          positionCompletedFinalAction
        );
        return;
      }

      setLeaderboardFinalAction(
        hasViewedTournamentTieBreak() ? 'tournament-summary' : 'break-tie'
      );

      requestAnimationFrame(
        positionCompletedFinalAction
      );
    }

    function joinTeamNamesHtml(rows) {
      const names = rows.map(row =>
        '<strong>' + escapeHtml(displayTeamName(row.team || '')) + '</strong>'
      );
      if (names.length <= 1) return names[0] || '';
      if (names.length === 2) return names[0] + ' and ' + names[1];
      return names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1];
    }

    function showTieBreakResult() {
      const resolution = resolveFirstPlaceTie(lastLeaderboardRows);
      if (!resolution || resolution.tied.length < 2) {
        showTournamentSummary();
        return;
      }

      markTournamentTieBreakViewed();
      setLeaderboardFinalAction('tournament-summary');

      renderLeaderboard(lastLeaderboardRows, false);

      if (!resolution.winner || resolution.decidingIndex === null) {
