<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>ROTB 2026</title>

  <!-- SIMPLE SCRAMBLE HANDICAP — SSHCP V2.8 -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --gold: #D0A621;
      --light-gray: #e6e6e6;
      --test-blue: #6EC8FF;
      --text: #000000;
      --muted: #636363;
      --line: rgba(0,0,0,.34);
      --line-strong: rgba(0,0,0,.72);
      --red: #CC3535;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    body {
      margin: 0;
      min-height: 100%;

      background: #fff;
      color: var(--text);

      font-family: "Oswald", Arial, sans-serif;

      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      z-index: -2;

      background:
        linear-gradient(
          rgba(255,255,255,.34),
          rgba(255,255,255,.34)
        ),
        url("BG.jpg")
        center top /
        100% auto
        repeat-y;

      pointer-events: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .view {
      display: none;

      width: 100%;
      min-height: 100dvh;
    }

    .view.active {
      display: block;
    }

    .top-loading {
      position: fixed;

      top: 0;
      left: 0;

      width: 0;
      height: 3px;

      opacity: 0;

      background: var(--gold);

      z-index: 7000;

      transition:
        width .2s ease,
        opacity .2s ease;
    }

    .top-loading.active {
      width: 72%;
      opacity: 1;

      animation:
        loadingSweep
        1.05s
        ease-in-out
        infinite
        alternate;
    }

    .top-loading.done {
      width: 100%;
      opacity: 1;
    }

    @keyframes loadingSweep {

      from {
        width: 24%;
      }

      to {
        width: 84%;
      }

    }

    .nav-button {
      width: 74px;
      height: 40px;

      padding: 0;

      border:
        1px solid
        var(--line-strong);

      border-radius: 8px;

      background:
        rgba(255,255,255,.76);

      color: #000;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .25px;
    }

    #homeView {
      text-align: center;
      overflow: visible;
    }

    .home-shell {
      width: 100%;
      max-width: 760px;

      min-height: 100dvh;

      margin: 0 auto;

      padding-bottom:
        calc(
          26px +
          env(safe-area-inset-bottom)
        );
    }

    .splash-image-wrap {
      width: 100%;
      margin: 0 auto;
    }

    .splash-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;
    }

    .reset-user-float {
      position: relative;

      width: 100%;
      height: 0;

      z-index: 10;
    }

    .reset-user-button {
      position: absolute;

      left: 50%;
      bottom: 13px;

      transform:
        translateX(-50%);

      width:
        min(
          52%,
          215px
        );

      min-height: 39px;

      border:
        1px solid
        var(--test-blue);

      border-radius: 8px;

      background:
        rgba(255,255,255,.82);

      color:
        var(--test-blue);

      font-size: 15px;
      font-weight: 600;

      letter-spacing: .4px;
    }

    .home-actions {
      width:
        calc(
          100% - 34px
        );

      max-width: 470px;

      margin:
        -2px auto 0;

      display: flex;

      flex-direction: column;

      gap: 13px;
    }

    .home-main-button {
      width: 100%;

      min-height: 58px;

      padding:
        12px 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      background:
        rgba(255,255,255,.78);

      color: #000;

      font-size: 21px;
      font-weight: 600;

      letter-spacing: .5px;
    }

    .home-main-button:active {
      background:
        var(--gold);

      color: #fff;
    }

    .quick-guide-button {
      align-self: center;

      width:
        min(
          64%,
          260px
        );

      min-height: 44px;

      margin-top: 7px;

      border:
        1px solid #000;

      border-radius: 8px;

      background:
        rgba(255,255,255,.78);

      color:
        var(--gold);

      font-size: 18px;
      font-weight: 600;

      letter-spacing: .4px;
    }

    #scorecardView {
      height: 100dvh;
    }

    .scorecard-screen {
      width:
        min(
          760px,
          100%
        );

      height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      overflow: visible;
    }

    .score-fixed-top {
      flex:
        0 0 auto;

      position: relative;

      z-index: 50;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        0;

      background:
        rgba(255,255,255,.95);

      backdrop-filter:
        blur(7px);
    }

    .score-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      align-items: center;

      gap: 8px;
    }

    .test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      white-space: nowrap;
    }

    .team-select-wrap {
      position: relative;

      width: 100%;

      padding:
        6px 10px
        6px;
    }

    .team-select-wrap::after {
      content: "";

      position: absolute;

      right: 30px;
      top: 50%;

      width: 10px;
      height: 10px;

      border-right:
        3px solid
        var(--gold);

      border-bottom:
        3px solid
        var(--gold);

      transform:
        translateY(-72%)
        rotate(45deg);

      pointer-events: none;
    }

    .top-team-select {
      display: block;

      width: 100%;
      height: 45px;

      padding:
        0 58px
        0 18px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      outline: none;

      background: #fafafa;

      color: #000;

      font-size: 18px;
      font-weight: 600;

      text-align: center;
      text-align-last: center;

      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .top-team-select.has-team {
      color:
        var(--gold);

      font-size: 19px;
      font-weight: 700;
    }

    .top-team-select:focus {
      border-color:
        var(--gold);

      box-shadow:
        0 0 0 1px
        var(--gold);
    }

    .score-table-head {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: center;

      min-height: 42px;

      overflow: hidden;

      border:
        1px solid
        var(--line-strong);

      border-bottom:
        1px solid
        var(--line);

      border-radius:
        9px 9px
        0 0;

      background:
        rgba(255,255,255,.94);

      color: #2d2d2d;

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: .35px;
    }

    .score-table-head > div {
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      border-right:
        1px solid
        var(--line);
    }

    .score-table-head > div:last-child {
      border-right: 0;

      color: #000;

      font-weight: 700;
    }

    .score-scroll {
      flex:
        1 1 auto;

      min-height: 0;

      margin:
        0 14px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling:
        touch;

      overscroll-behavior-y:
        contain;

      border-left:
        1px solid
        var(--line-strong);

      border-right:
        1px solid
        var(--line-strong);

      background:
        rgba(255,255,255,.28);
    }

    #scoreRows {
      height: 100%;
    }

    .score-row {
      display: grid;

      grid-template-columns:
        19%
        18%
        28%
        35%;

      align-items: stretch;

      height:
        calc(
          (100% - 3px) / 9
        );

      min-height: 48px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(255,255,255,.47);
    }

    #scoreRows > .score-row:nth-child(9) {
      border-bottom: 0;
    }

    .score-row > div {
      min-width: 0;

      border-right:
        1px solid
        var(--line);
    }

    .score-row > div:last-child {
      border-right: 0;
    }

    .hole-cell,
    .par-cell,
    .yardage-cell,
    .score-cell {
      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .hole-cell {
      font-size: 22px;
      font-weight: 700;
    }

    .par-cell {
      font-size: 20px;
      font-weight: 500;
    }

    .yardage-cell {
      gap: 4px;

      white-space: nowrap;

      font-size: 18px;
      font-weight: 500;
    }

    .yard-white {
      color: #000;
    }

    .yard-slash {
      color: #555;
    }

    .yard-gold {
      color:
        var(--gold);
    }

    .score-button {
      width: 58px;
      height: 40px;

      border:
        1px solid
        rgba(0,0,0,.48);

      border-radius: 8px;

      background:
        rgba(255,255,255,.72);

      color: #000;

      font-size: 25px;
      font-weight: 700;

      line-height: 1;
    }

    .score-button.empty {
      background:
        rgba(255,255,255,.72);

      color: #555;
    }

    .score-button.unsaved {
      border-color:
        #1f1f1f;

      background:
        #484848;

      color: #eee;
    }

    .score-button.saved {
      border-color:
        #D0A621;

      background:
        var(--gold);

      color: #eee;
    }

    .nine-break {
      height: 3px;

      background:
        var(--gold);
    }

    .score-fixed-bottom {
      flex:
        0 0 auto;

      z-index: 60;

      padding:
        7px
        14px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(255,255,255,.96);

      backdrop-filter:
        blur(7px);
    }

    .score-bottom-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 11px;
    }

    .bottom-action {
      min-height: 55px;

      border-radius: 9px;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: .25px;
    }

    .leaderboard-button {
      border:
        1px solid
        var(--line-strong);

      background:
        #fafafa;

      color: #000;
    }

    .submit-button {
      border:
        1px solid
        var(--gold);

      background:
        var(--gold);

      color: #eee;
    }

    .submit-button:disabled {
      opacity: .42;

      cursor: default;
    }

    #leaderboardView {
      min-height: 100dvh;
    }

    .leaderboard-screen {
      width:
        min(
          760px,
          100%
        );

      min-height: 100dvh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;
    }

    .leader-top {
      flex:
        0 0 auto;

      padding:
        calc(
          8px +
          env(safe-area-inset-top)
        )
        14px
        6px;

      background:
        rgba(255,255,255,.94);
    }

    .leader-nav {
      display: grid;

      grid-template-columns:
        74px
        minmax(0,1fr)
        74px;

      gap: 8px;

      align-items: center;
    }

    .leader-test-timing {
      min-width: 0;
      min-height: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--test-blue);

      text-align: center;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.15;

      letter-spacing: .1px;

      margin: 0;

      white-space: nowrap;
    }

    .leader-title-bar {
      position: relative;

      min-height: 43px;

      margin-top: 5px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .leader-title {
      color: #000;

      text-align: center;

      font-size: 24px;
      font-weight: 700;

      line-height: 1;

      letter-spacing: .35px;
    }

    .leader-refresh-button {
      position: absolute;

      right: 0;

      width: 72px;
      height: 32px;

      padding: 0;

      border:
        1px solid
        var(--gold);

      border-radius: 7px;

      background:
        #fafafa;

      color:
        var(--gold);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: .25px;
    }

    .leader-refresh-button:disabled {
      opacity: .45;
    }

    .leader-content {
      flex:
        1 1 auto;

      min-height: 0;

      padding:
        4px
        24px
        4px;

      overflow-y: auto;

      -webkit-overflow-scrolling:
        touch;
    }

    .leader-table {
      width: calc(100% + 28px);

      max-width: none;

      margin:
        0 -14px;

      overflow: visible;

      border:
        1px solid
        var(--line-strong);

      border-radius:
        9px
        9px
        0
        0;

      background:
        rgba(255,255,255,.42);
    }

    .leader-row {
      display: grid;

      grid-template-columns:
        minmax(0,1fr)
        28px
        84px
        80px;

      min-height: 61px;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(255,255,255,.46);
    }

    .leader-row:last-child {
      border-bottom: 0;
    }

    .leader-row.header {
      position: sticky;
      top: 0;
      z-index: 30;

      min-height: 42px;

      color: #1f1f1f;

      background:
        #fff;

      text-align: center;

      font-size: 17px;
      font-weight: 700;

      letter-spacing: .3px;
    }

    .leader-row > div {
      min-width: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        5px 8px;

      border-right:
        1px solid
        var(--line);
    }

    .leader-row > div:last-child {
      border-right: 0;
    }

    .leader-team-cell {
      flex-direction: column;

      align-items:
        center !important;

      justify-content:
        center !important;

      text-align: center;
    }

    .leader-team-name {
      width: 100%;

      color: #000;

      font-size: 18px;
      font-weight: 700;

      line-height: 1.08;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }

    .leader-team-cell.authorized-team-cell {
      background:
        var(--gold);
    }

    .leader-team-cell.authorized-team-cell .leader-team-name {
      color:
        #eee;
    }

    .leader-hcp-cell {
      color: var(--red);

      font-size: 16px;
      font-weight: 700;

      line-height: 1;
      text-align: center;

      padding-left: 3px !important;
      padding-right: 3px !important;
    }

    .leader-hcp-header {
      padding-left: 0 !important;
      padding-right: 0 !important;
      overflow: visible;
    }

    .leader-hcp-header span {
      display: inline-block;
      transform: none;
      transform-origin: center;
      white-space: nowrap;
      max-width: 100%;
    }

    .leader-through-cell {
      flex-direction: column;

      text-align: center;
    }

    .leader-through-score {
      font-size: 22px;
      font-weight: 700;

      line-height: 1;
    }

    .leader-through-label {
      margin-top: 4px;

      color: #555;

      font-size: 13px;
      font-weight: 500;

      line-height: 1;
    }

    .leader-total {
      font-size: 30px;
      font-weight: 700;

      line-height: 1;

      text-align: center;
    }

    .under {
      color:
        var(--red);
    }

    .even-over {
      color: #000;
    }

    .leader-update-note {
      min-height: 18px;

      margin:
        4px auto
        0;

      color: #777;

      text-align: center;

      font-size: 11px;
    }

    .leader-bottom {
      flex:
        0 0 auto;

      padding:
        8px
        18px
        calc(
          8px +
          env(safe-area-inset-bottom)
        );

      background:
        rgba(255,255,255,.96);
    }

    .access-scorecard {
      width: 100%;

      min-height: 53px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #eee;

      font-size: 18px;
      font-weight: 700;
    }

    .modal-overlay,
    .score-entry-overlay {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(255,255,255,.62);

      backdrop-filter:
        blur(7px);
    }

    .modal-overlay.open,
    .score-entry-overlay.open {
      display: flex;
    }

    .modal-box {
      position: relative;

      width:
        min(
          650px,
          100%
        );

      max-height:
        calc(
          100dvh - 40px
        );

      overflow-y: auto;

      padding:
        26px 28px
        28px;

      border:
        1px solid
        rgba(0,0,0,.82);

      border-radius: 17px;

      background: #fafafa;

      text-align: left;
    }

    .modal-title {
      margin-bottom: 16px;

      color:
        var(--gold);

      font-size: 27px;
      font-weight: 700;

      line-height: 1.1;
    }

    .modal-title.testing {
      color:
        var(--test-blue);
    }

    .modal-text {
      color: #222;

      font-size: 18px;

      line-height: 1.42;
    }

    .modal-input {
      width: 100%;

      height: 56px;

      margin-top: 17px;

      padding:
        0 14px;

      border:
        2px solid
        var(--gold);

      border-radius: 9px;

      outline: none;

      background: #e9e9e9;

      color: #000;

      font-size: 21px;
    }

    .modal-actions {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 13px;

      margin-top: 20px;
    }

    .modal-actions.single {
      grid-template-columns:
        1fr;
    }

    .modal-btn {
      min-height: 54px;

      border:
        1px solid
        var(--line-strong);

      border-radius: 9px;

      background: #fafafa;

      color: #000;

      font-size: 18px;
      font-weight: 700;
    }

    .modal-btn.primary {
      border-color:
        var(--gold);

      background:
        var(--gold);

      color: #eee;
    }

    .modal-btn.testing {
      border-color:
        var(--test-blue);

      background: #fafafa;

      color:
        var(--test-blue);
    }

    .quick-list {
      margin: 0;

      padding-left: 23px;
    }

    .quick-list li {
      margin-bottom: 8px;
    }

    .quick-correction {
      margin-top: 17px;

      color: #000;
    }

    .score-entry-overlay {
      align-items:
        flex-start;

      padding-top: 11vh;

      z-index: 5200;
    }

    .score-entry-box {
      position: relative;

      width:
        min(
          420px,
          calc(100% - 10px)
        );

      padding: 24px;

      border:
        1px solid
        rgba(0,0,0,.84);

      border-radius: 14px;

      background: #fafafa;

      text-align: center;
    }

    .score-entry-cancel {
      position: absolute;

      top: 8px;
      right: 10px;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #bfbfbf;

      font-family: Arial, sans-serif;

      font-size: 27px;
      font-weight: 400;

      line-height: 34px;

      text-align: center;

      opacity: .88;
    }

    .score-entry-hole {
      font-size: 28px;
      font-weight: 700;
    }

    .score-entry-par {
      margin-top: 2px;

      color: #555;

      font-size: 20px;
    }

    .score-entry-input {
      width: 100%;

      height: 68px;

      margin-top: 18px;

      border:
        2px solid
        var(--gold);

      border-radius: 10px;

      outline: none;

      background: #e6e6e6;

      color: #000;

      text-align: center;

      font-size: 34px;
      font-weight: 700;
    }

    .score-entry-enter {
      width: 100%;

      min-height: 58px;

      margin-top: 14px;

      border:
        1px solid
        var(--gold);

      border-radius: 9px;

      background:
        var(--gold);

      color: #eee;

      font-size: 21px;
      font-weight: 700;
    }

    @media (max-height: 820px) and (min-height: 651px) {
  .modal-overlay.tournament-summary .modal-box {
    height: auto;
    max-height: 80dvh;
    padding-top: 12px;
    padding-bottom: 12px;
  }
  .modal-overlay.tournament-summary .modal-title {

/* =========================================================
   ROTB 2026 — V13 LAYOUT CONTRACT

   V12.15 remains the frozen recovery build.

   FIXED CONTROLS
   Controls outside data tables intentionally keep their proven physical
   dimensions: navigation, footer actions, modal actions and utility buttons.
   The target design range begins at normal iPhone portrait height; shorter
   torture-test viewports may look compressed but must remain functional.

   RESPONSIVE TABLE CONTENT
   Scorecard and leaderboard table content owns the available row space.
   Anything inside a resizable row may shrink with that row, including the
   tappable score box and its notation.

   ACTION POPUPS
   Thumb-zone position remains viewport based. Non-scrollable action popups
   compress their internal vertical geometry when viewport height becomes
   shorter than the normal phone range rather than becoming scrollable.
   ========================================================= */

/* SCORECARD — one geometry for EMPTY, PENDING and CERTIFIED states.
   State changes appearance only; the row controls the box dimensions. */
.score-row {
  min-height: 0 !important;
}

.score-cell {

}

.score-button.empty,
.score-button.unsaved,

  min-height: 0 !important;
  max-height: none !important;

  width: auto !important;
  max-width: calc(100% - 6px) !important;
  aspect-ratio: 1.25 / 1 !important;

  padding: 0 !important;
  border-radius: 6px !important;

  display: flex !important;

    function timerStart() {

    function timerSeconds(
      start
    ) {

      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function intervalSeconds(
      start,
      end
    ) {

      return (
        (
          end -
          start
        ) /
        1000
      ).toFixed(2);

    }


    function msSeconds(value) {

      const ms = Number(value);

      return Number.isFinite(ms)
        ? (ms / 1000).toFixed(3)
        : null;

    }


    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

      if (!element) return;

      const nav =
        element.closest('.score-nav, .leader-nav');

      const referenceButton =
        nav
          ? nav.querySelector('.nav-button')
          : null;

      if (!referenceButton) return;

      const buttonStyle =
        getComputedStyle(referenceButton);

      /*
        V7-CF.1 TIMING TEXT:
        - May use one or two lines.
        - Never extends lower than HOME / INFO.
        - HOME / INFO button height is the absolute vertical limit.
        - Font shrinks only as needed to keep all timing visible
          inside that same height.
      */
      const maxHeight =
        referenceButton.clientHeight;

      const maxSize = 15;
      const minSize = 8;

        buttonStyle.fontFamily;

        buttonStyle.fontWeight;

      element.style.letterSpacing =
        buttonStyle.letterSpacing;

      element.style.lineHeight = '1.05';
      element.style.whiteSpace = 'normal';
      element.style.textAlign = 'center';
      element.style.justifyContent = 'center';
      element.style.alignItems = 'center';
      element.style.height = maxHeight + 'px';
      element.style.maxHeight = maxHeight + 'px';
      element.style.overflow = 'hidden';

      let size = maxSize;

      element.style.fontSize =
        size + 'px';

      while (

        element.style.fontSize =

    /* =========================================================
       SSHCP V2.8 — QR AUTHORIZATION
       Worker remains the final authority for every score write.
       ========================================================= */

    const SSHCP_QR_PASSKEY_KEY = 'sshcpQrPasskey';
    const SSHCP_QR_ROLE_KEY = 'sshcpQrRole';
    const SSHCP_QR_ID_KEY = 'sshcpQrId';
    const SSHCP_QR_TEAM_KEY = 'sshcpQrTeam';
    const SSHCP_QR_SLOT_KEY = 'sshcpQrSlot';
    const SSHCP_TEAM_AUTH_KEY = 'sshcpTeamAuthorization';
    const SSHCP_MASTER_TEST_KEY = 'glmNnV63TWS42fcRB8z2yldF';

    /* CF V1.3 now supplies the complete TEST/admin QR directory in one
       read-only request. No permanent passkey list is hard-coded here. */
    const SSHCP_TEST_QR_CACHE_KEY = 'sshcpTestQrDirectoryCacheV20';
    const SSHCP_TEST_QR_CACHE_TIME_KEY = 'sshcpTestQrDirectoryCacheTimeV20';

    let sshcpQrDirectoryCache = null;
    let sshcpQrDirectoryPromise = null;

    function readStoredTestQrDirectory() {
      if (sshcpQrDirectoryCache) return sshcpQrDirectoryCache;
      try {
        const parsed = JSON.parse(localStorage.getItem(SSHCP_TEST_QR_CACHE_KEY) || 'null');
        if (Array.isArray(parsed) && parsed.length) {
          sshcpQrDirectoryCache = parsed;
          return parsed;
        }
      } catch (_) {}
      return null;
    }

    function saveStoredTestQrDirectory(directory) {
      if (!Array.isArray(directory) || !directory.length) return;
      sshcpQrDirectoryCache = directory;
      localStorage.setItem(SSHCP_TEST_QR_CACHE_KEY, JSON.stringify(directory));
      localStorage.setItem(SSHCP_TEST_QR_CACHE_TIME_KEY, String(Date.now()));
    }

    function getQrPasskey(){ return localStorage.getItem(SSHCP_QR_PASSKEY_KEY) || ''; }
    function getQrRole(){ return localStorage.getItem(SSHCP_QR_ROLE_KEY) || 'NONE'; }
    function getQrTeam(){ return localStorage.getItem(SSHCP_QR_TEAM_KEY) || ''; }
    function isMasterQr(){ return getQrRole() === 'MASTER'; }
    function isTeamQr(){ return getQrRole() === 'QR'; }
    function isTeamAuthorizationEnabled(){ return localStorage.getItem(SSHCP_TEAM_AUTH_KEY) !== '0'; }

    async function validateQrPasskey(passkey, showFailure=true){
      const clean=String(passkey||'').trim();

      if(!clean){
        clearQrAuthorization();
        localStorage.removeItem('rotbAuthorizedTeam');
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();
        addTestLog('QR AUTH CHECK','INVALID','—','EMPTY PASSKEY');
        if(showFailure) showInvalidQrPasskey();
        return false;
      }

      const started = timerStart();

      try{
        const response=await fetch(
          CLOUDFLARE_API_URL+
          '?action=qrAuth&passkey='+encodeURIComponent(clean)+
          '&refresh='+Date.now(),
          {cache:'no-store'}
        );

        const httpStatus=response.status;
        let data;

        try{
          data=await response.json();
        }catch(_){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • INVALID JSON'
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(!response.ok || !data || data.ok!==true){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+
            (data && (data.reason||data.error) ? ' • '+String(data.reason||data.error) : '')
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(data.valid!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'INVALID',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • VALID FALSE'
          );
          if(showFailure) showInvalidQrPasskey();
          return false;
        }

        if(data.role==='QR' && data.assigned!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'OK',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • '+String(data.qrId||'QR')+' • VALID / NOT ASSIGNED'
          );
          if(showFailure) showValidUnassignedQrPasskey();
          return false;
        }

        saveQrAuthorization(data,clean);
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();

        addTestLog(
          'QR AUTH CHECK',
          'OK',
          timerSeconds(started)+'s',
          [
            'HTTP '+httpStatus,
            String(data.role||''),
            data.qrId ? 'QR '+String(data.qrId) : '',
            data.team ? String(data.team) : ''
          ].filter(Boolean).join(' • ')
        );

        return true;
      }catch(error){
        addTestLog(
          'QR AUTH CHECK',
          'FAILED',
          timerSeconds(started)+'s',
          error && error.message ? error.message : 'REQUEST FAILED'
        );
        if(showFailure) showAuthorizationCheckFailed(clean);
        return false;
      }
    }

    async function initializeQrAuthorization(){
      const params=new URLSearchParams(window.location.search);
      const incoming=params.get('passkey') || params.get('key') || '';

        params.delete('passkey'); params.delete('key');
        const q=params.toString();
        history.replaceState(null,'',window.location.pathname+(q?'?'+q:'')+window.location.hash);
      }else if(getQrPasskey()){
        const storedOk = await validateQrPasskey(getQrPasskey(),false);
        if (!storedOk) {

        }
      }

    async function loadAssignedPasskeys(forceRefresh = true) {
      if (sshcpQrDirectoryPromise) return sshcpQrDirectoryPromise;

      if (!forceRefresh) {
        const stored = readStoredTestQrDirectory();
        if (stored) return stored;
      }

      const started = timerStart();

      sshcpQrDirectoryPromise = (async () => {
        let response = null;

        try {
          response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=qrDirectory' +
              '&passkey=' + encodeURIComponent(SSHCP_MASTER_TEST_KEY) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          const httpStatus = response.status;
          let data;

          try {
            data = await response.json();
          } catch (_) {
            throw new Error('HTTP ' + httpStatus + ' — invalid JSON response');
          }

          if (
            !response.ok ||
            !data ||
            data.ok !== true ||
            data.authorized !== true ||
            data.role !== 'MASTER' ||
            !Array.isArray(data.directory)
          ) {
            const reason =
              data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'Directory request failed';
            throw new Error('HTTP ' + httpStatus + ' — ' + reason);
          }

          const directory = data.directory
            .filter(item => item && item.qrId && item.passkey)
            .map(item => ({
              qrId: String(item.qrId),
              passkey: String(item.passkey).trim(),
              role: 'QR',
              assigned: item.assigned === true,
              team: String(item.team || ''),
              status: String(item.status || (item.assigned ? 'ASSIGNED' : 'NOT ASSIGNED'))
            }));

          const master = data.master && data.master.passkey
            ? {
                qrId: 'MASTER',
                passkey: String(data.master.passkey).trim(),
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              }
            : {
                qrId: 'MASTER',
                passkey: SSHCP_MASTER_TEST_KEY,
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              };

          const assignedCount =
            directory.filter(item => item.assigned && item.team).length;

          const unassignedCount =
            directory.filter(item => !item.assigned).length;

          const validQrCount =
            Number(data.counts && data.counts.validQrCount) ||
            directory.length + 1;

          const workerAssignedCount =
            Number(data.counts && data.counts.assignedCount);

          const workerUnassignedCount =
            Number(data.counts && data.counts.unassignedCount);

          const countsMatch =
            validQrCount === directory.length + 1 &&
            (!Number.isFinite(workerAssignedCount) || workerAssignedCount === assignedCount) &&
            (!Number.isFinite(workerUnassignedCount) || workerUnassignedCount === unassignedCount);

          if (!countsMatch) {
            throw new Error(
              'HTTP ' + httpStatus +
              ' — directory count mismatch (' +
              validQrCount + ' valid / ' +
              assignedCount + ' assigned / ' +
              unassignedCount + ' unassigned)'
            );
          }

          const snapshot = [
            master,
            ...directory
          ];

          saveStoredTestQrDirectory(snapshot);

          const cfTotal =
            data.timing && Number.isFinite(Number(data.timing.totalMs))
              ? (Number(data.timing.totalMs) / 1000).toFixed(3) + 's CF'
              : '';

          addTestLog(
            'QR PASSKEY LOAD',
            'OK',
            timerSeconds(started) + 's',
            [
              'HTTP ' + httpStatus,
              validQrCount + ' VALID',
              assignedCount + ' ASSIGNED',
              unassignedCount + ' UNASSIGNED',
              cfTotal
            ].filter(Boolean).join(' • ')
          );

          return snapshot;
        }
        catch (error) {
          addTestLog(
            'QR PASSKEY LOAD',
            'FAILED',
            timerSeconds(started) + 's',
            error && error.message
              ? error.message
              : 'Directory request failed — CACHE NOT REPLACED'
          );

          return readStoredTestQrDirectory() || [
            {
              qrId: 'MASTER',
              passkey: SSHCP_MASTER_TEST_KEY,
              role: 'MASTER',
              assigned: true,
              team: 'MASTER',
              status: 'MASTER'
            }
          ];
        }
      })().finally(() => {
        sshcpQrDirectoryPromise = null;
      });

      return sshcpQrDirectoryPromise;
    }

    function populatePasskeyTeamSelect(menu, directory) {
      if (!menu) return;
      const assigned = (directory || [])
        .filter(item => item.qrId !== 'MASTER' && item.assigned && item.team)
        .sort((a, b) => {
          const as = Number((String(a.team).match(/\d+/) || [999])[0]);
          const bs = Number((String(b.team).match(/\d+/) || [999])[0]);
          return as - bs || String(a.team).localeCompare(String(b.team));
        });

      menu.innerHTML =
        '<button type="button" class="passkey-team-option" data-passkey="' + escapeHtml(SSHCP_MASTER_TEST_KEY) + '" data-label="MASTER">MASTER</button>' +
        assigned.map(item =>

        ).join('');
    }

      const closeTeamMenu = () => {
        if (!menu || !button) return;
        menu.classList.remove('open');
        menu.setAttribute('aria-hidden','true');
        button.setAttribute('aria-expanded','false');
      };

      const openTeamMenu = () => {
        if (!menu || !button) return;

        /* SSHCP V2.8 — viewport-owned TEST dropdown.
           It is fixed to the visible viewport rather than constrained by
           the modal box. It may extend beyond the popup and stops roughly
           35px above the actual visible bottom edge. */
        const buttonRect = button.getBoundingClientRect();
        const viewport = window.visualViewport;
        const viewportTop = viewport ? viewport.offsetTop : 0;
        const viewportHeight = viewport ? viewport.height : window.innerHeight;
        const viewportBottom = viewportTop + viewportHeight;
        const menuTop = buttonRect.bottom + 6;
        const availableHeight = Math.max(120, viewportBottom - menuTop - 35);

        menu.style.left = buttonRect.left + 'px';
        menu.style.top = menuTop + 'px';
        menu.style.width = buttonRect.width + 'px';
        menu.style.maxHeight = availableHeight + 'px';
        menu.classList.add('open');
        menu.setAttribute('aria-hidden','false');
        button.setAttribute('aria-expanded','true');
      };

      if (button && menu) {
        button.addEventListener('click', () => {
          if (menu.classList.contains('open')) closeTeamMenu();
          else openTeamMenu();
        });

        menu.addEventListener('click', event => {
          const option = event.target.closest('.passkey-team-option');
          if (!option) return;
          button.textContent = option.dataset.label || 'MASTER';
          els.modalInput.value = option.dataset.passkey || SSHCP_MASTER_TEST_KEY;
          closeTeamMenu();
        });
      }

      const directory = readStoredTestQrDirectory() || [
        { qrId:'MASTER', passkey:SSHCP_MASTER_TEST_KEY, role:'MASTER', assigned:true, team:'MASTER' }
      ];
      populatePasskeyTeamSelect(document.getElementById('passkeyTeamMenu'), directory);

    }
    async function decodeQrImage(file){
      if(!file) return;
      try{
        if(!('BarcodeDetector' in window)) throw new Error('QR camera decoding is not available in this browser.');
        const detector=new BarcodeDetector({formats:['qr_code']});
        const bitmap=await createImageBitmap(file);
        const codes=await detector.detect(bitmap);
        if(!codes.length) throw new Error('No QR code found.');
        const raw=String(codes[0].rawValue||'');
        let passkey=raw;
        try{ const u=new URL(raw,window.location.href); passkey=u.searchParams.get('passkey')||u.searchParams.get('key')||raw; }catch(_){}
        startLoadingLine();
        const ok=await validateQrPasskey(passkey,true);
        completeLoadingLine();
        if(ok){ scorecardHasLoaded=false; leaderboardHasLoaded=false; showTestLog(); }
      }catch(error){
        closeModal();
        els.modalTitle.textContent='QR SCAN';
        els.modalBody.textContent=(error&&error.message)||'QR code could not be read. Use ENTER PASSKEY or scan the QR with the phone camera.';
        els.modalInput.style.display='none';
        const ok=makeModalButton('OK','',showSwitchAuthorization);
        els.modalActions.className='modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }finally{ if(els.testQrCameraInput) els.testQrCameraInput.value=''; }
    }

      if (
        !selectedTeam
      ) {

        return -1;

      }


      return localScores.findIndex(
        score =>
          score === null
      );

    }


    function restoreScorePosition(useLocalProgress = false) {

      if (
        !selectedTeam ||
        !els.scoreScroll
      ) {

        return;

      }


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              /*
                SSHCP V2.8 progress positioning:
                normal page/load positioning uses verified GOLD scores.
                Immediately after ENTER, useLocalProgress=true lets the
                viewport follow the newly entered gray score without
                waiting for Worker verification.

                The score viewport is exactly nine holes tall.

                Through Hole 5  -> show 1-9
                Through Hole 6  -> show 2-10
                Through Hole 7  -> show 3-11
                ...
                Through Hole 14 -> show 10-18
                Hole 15+        -> remain at 10-18
              */
              let lastCompletedIndex =
                -1;

              const progressScores =
                useLocalProgress
                  ? localScores
                  : savedScores;


              progressScores.forEach(
                (
                  score,
                  index
                ) => {

                  if (
                    score !== null
                  ) {

                    lastCompletedIndex =
                      index;

                  }

                }
              );


              if (
                lastCompletedIndex >= 0
              ) {

                const targetIndex =
                  Math.min(
                    9,
                    Math.max(
                      0,
                      lastCompletedIndex - 4
                    )
                  );


                const row =
                  els.scoreRows.querySelector(
                    '.score-row[data-score-index="' +
                    targetIndex +
                    '"]'
                  );


                if (row) {

                  const maxScroll =
                    Math.max(
                      0,
                      els.scoreScroll.scrollHeight -
                      els.scoreScroll.clientHeight
                    );


                  const scrollRect =
                    els.scoreScroll.getBoundingClientRect();

                  const rowRect =
                    row.getBoundingClientRect();

                  const targetScroll =
                    els.scoreScroll.scrollTop +
                    (
                      rowRect.top -
                      scrollRect.top
                    );


                  els.scoreScroll.scrollTop =
                    Math.min(
                      Math.max(
                        0,
                        targetScroll
                      ),
                      maxScroll
                    );


                  rememberScorePosition();

                  return;

                }

              }


              els.scoreScroll.scrollTop =
                0;

              rememberScorePosition();

            }
          );

        }
      );

    }

    const TEST_LOG_KEY = 'rotbTestLogV75';

    function getTestLog() {
      try {
        const parsed = JSON.parse(localStorage.getItem(TEST_LOG_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function addTestLog(action, result, total, detail) {
      const log = getTestLog();
      const now = new Date();

      log.unshift({
        time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
        timestamp: now.toISOString(),
        action: String(action || ''),
        result: String(result || ''),
        total: total ? String(total) : '—',
        detail: String(detail || '')
      });

      /* SSHCP V2.8 — no 20-entry truncation. History remains until the
         user explicitly taps DELETE TEST DATA. */
      localStorage.setItem(TEST_LOG_KEY, JSON.stringify(log));

      if (currentView === 'testlog') renderTestLog();
    }

    function buildTestLogReport() {
      const log = getTestLog();
      const directory = readStoredTestQrDirectory() || [];
      const assigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && item.assigned && item.team
      ).length;
      const unassigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && !item.assigned
      ).length;
      const cacheTimeRaw = Number(
        localStorage.getItem(SSHCP_TEST_QR_CACHE_TIME_KEY) || 0
      );

      const lines = [
        'SSHCP V2.8 TEST LOG',
        'Generated: ' + new Date().toISOString(),
        'Worker: ' + CLOUDFLARE_API_URL,
        'Authorization: ' + getQrRole() +
          (getQrTeam() ? ' / ' + getQrTeam() : ''),
        'QR cache: ' +
          (directory.length
            ? directory.length + ' valid / ' + assigned + ' assigned / ' + unassigned + ' unassigned'
            : 'NOT LOADED'),
        'QR cache time: ' +
          (cacheTimeRaw ? new Date(cacheTimeRaw).toISOString() : '—'),
        'Log entries: ' + log.length,
        '',
        'TIME | ACTION | RESULT | TOTAL | DETAIL'
      ];

      log.slice().reverse().forEach(item => {
        lines.push(
          [
            item.timestamp || item.time || '',
            item.action || '',
            item.result || '',
            item.total || '—',
            item.detail || ''
          ].join(' | ')
        );
      });

      return lines.join('\n');
    }

    async function copyTestLog() {
      const report = buildTestLogReport();
      let copied = false;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(report);
          copied = true;
        }
      } catch (_) {}

      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();

        try {
          copied = document.execCommand('copy');
        } catch (_) {
          copied = false;
        }

        textarea.remove();
      }

      if (copied) {
        addTestLog('COPY LOG', 'OK', '—', getTestLog().length + ' ENTRIES COPIED');
        if (els.testCopyLogButton) {
          const original = 'COPY LOG';
          els.testCopyLogButton.textContent = 'COPIED';
          setTimeout(() => {
            if (els.testCopyLogButton) els.testCopyLogButton.textContent = original;
          }, 1200);
        }
      } else {
        addTestLog('COPY LOG', 'FAILED', '—', 'CLIPBOARD UNAVAILABLE');
      }
    }

    function renderTestLog() {
      const log = getTestLog();
      if (!log.length) {
        els.testLogRows.innerHTML = '<div class="test-log-empty">NO TEST ACTIONS RECORDED</div>';
        return;
      }
      els.testLogRows.innerHTML = log.map(item => {
        const resultClass = item.result === 'OK' || item.result === 'VERIFIED' ? 'test-log-ok' : (item.result === 'FAILED' ? 'test-log-fail' : '');
        const detail = item.detail ? '<div class="test-log-detail">' + escapeHtml(item.detail) + '</div>' : '';
        return '<div class="test-log-row">' +
          '<div>' + escapeHtml(item.time) + '</div>' +
          '<div class="test-log-action"><strong>' + escapeHtml(item.action) + '</strong>' + detail + '</div>' +
          '<div class="' + resultClass + '">' + escapeHtml(item.result) + '</div>' +
          '<div>' + escapeHtml(item.total) + '</div>' +
          '</div>';
      }).join('');
    }

       TEST PAGE — BULK SCORE CONTROLS
       Every action requires an explicit YES confirmation.
       ADD RANDOM CURRENT uses CF V1.4's realistic random score mode.
       CURRENT = teams that currently exist in the Sheet.
       ALL = all 36 score slots (DELETE ALL only in the UI).
       ========================================================= */

    function showTestScoreWarning(mode, scope) {
      closeModal();

      const isPar = mode === 'par';

      const isAdd = isPar || isRandom;
      const isAll = scope === 'all';

            ? (isAll ? 'ADD PAR ALL?' : 'ADD PAR CURRENT?')
            : (isAll ? 'DELETE ALL?' : 'DELETE CURRENT?');

      const question =
        isRandom
          ? 'Add a realistic random mix of birdies, pars, and bogeys to every current team?'
          : isPar
            ? (isAll
                ? 'Add par scores to all 36 team slots?'
                : 'Add par scores to every current team?')
            : (isAll
                ? 'Delete all scores from all 36 team slots?'
                : 'Delete all scores from every current team?');

      els.modalOverlay.classList.add('reset-authorization');
      els.modalTitle.textContent = title;
      els.modalTitle.classList.remove('testing');
      els.modalBody.textContent = question;
      els.modalInput.style.display = 'none';

      const yes = makeModalButton(

      );

      els.modalActions.replaceChildren(no, yes);
      els.modalOverlay.classList.add('open');

    async function runTestScoreAction(mode, scope) {
      closeModal();
      startLoadingLine();

      const started = timerStart();
      const isPar = mode === 'par';
      const isRandom = mode === 'random';
      const isAdd = isPar || isRandom;
      const isAll = scope === 'all';

      const actionLabel =
        isRandom
          ? 'ADD RANDOM CURRENT'
          : isPar
            ? (isAll ? 'ADD PAR ALL' : 'ADD PAR CURRENT')
            : (isAll ? 'DELETE ALL' : 'DELETE CURRENT');

      try {
        const response = await fetch(
          CLOUDFLARE_API_URL +
            '?action=testScores' +
            '&mode=' + encodeURIComponent(mode) +
            '&scope=' + encodeURIComponent(scope) +
            '&passkey=' + encodeURIComponent(isMasterQr() ? getQrPasskey() : '') +
            '&refresh=' + Date.now(),
          { cache: 'no-store' }
        );

        if (!response.ok) {
          throw new Error(actionLabel + ' failed.');
        }

        const data = await response.json();

        if (!data || data.ok !== true || data.verified !== true) {
          throw new Error(
            (data && data.error) ||
            (actionLabel + ' was not verified.')
          );
        }

        /* Never let this device re-send stale pending scores after a bulk
           TEST action changed the Sheet. */
        teams.forEach(team => {
          localStorage.removeItem(pendingScoresKey(team));
        });

        scorecardHasLoaded = false;
        leaderboardHasLoaded = false;

        const testDetailParts = [
          data.affectedTeams + ' team slot' +
            (Number(data.affectedTeams) === 1 ? '' : 's')
        ];

        if (mode === 'random' && data.randomMix) {
          testDetailParts.push(
            data.randomMix.birdiesPerTeam + ' BIRDIES / ' +
            data.randomMix.parsPerTeam + ' PARS / ' +
            data.randomMix.bogeysPerTeam + ' BOGEYS EACH'
          );
        }

        addTestLog(
          actionLabel,
          'VERIFIED',
          timerSeconds(started) + 's',
          testDetailParts.join(' • ')
        );

        completeLoadingLine();
        renderTestLog();

        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' COMPLETE';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          data.affectedTeams +
          ' team slot' +
          (Number(data.affectedTeams) === 1 ? '' : 's') +
          ' verified.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', 'primary', closeModal);
        els.modalActions.className = 'modal-actions single test-success';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
      catch (error) {
        stopLoadingLine();

        addTestLog(
          actionLabel,
          'FAILED',
          timerSeconds(started) + 's',
          error && error.message ? error.message : 'Action failed'
        );

        renderTestLog();

        closeModal();
        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' FAILED';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          error && error.message
            ? error.message
            : 'The score action could not be completed.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', '', closeModal);
        els.modalActions.className = 'modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
    }

    function startLeaderboardRefreshCycle() {

      stopLeaderboardRefreshCycle();
      resetLeaderboardRefreshProgress();

      if (
        currentView !== 'leaderboard' ||
        !leaderboardHasLoaded
      ) {
        return;
      }

      leaderboardRefreshCycleStartedAt = performance.now();
      const duration = 10000;

      const draw = now => {

        if (
          currentView !== 'leaderboard' ||
          leaderboardLoadInProgress
        ) {
          return;
        }

        const percent = Math.min(
          100,
          ((now - leaderboardRefreshCycleStartedAt) / duration) * 100
        );

        if (els.leaderRefreshProgressFill) {
          els.leaderRefreshProgressFill.style.width = Math.max(0, percent) + '%';
        }

        if (percent < 100) {
          leaderboardRefreshCycleFrame = requestAnimationFrame(draw);
        }

      };

      leaderboardRefreshCycleFrame = requestAnimationFrame(draw);

      leaderboardRefreshCycleTimer = setTimeout(
        async () => {
          leaderboardRefreshCycleTimer = null;

          if (
            currentView === 'leaderboard' &&
            !leaderboardLoadInProgress
          ) {
            await loadLeaderboard(false);
          }
        },
        duration

    /* =========================================================
       CLOUDFLARE: SCORECARD READ
       Google Apps Script is NOT used.
       ========================================================= */


    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        scorecardHasLoaded =
          true;

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {
          setTimeout(
            () => submitScores(),
            0
          );
        }

      }
      catch (error) {

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreTimingDetail =
          '';

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'FAILED', scorecardLoadSeconds + 's', 'Request failed');
        stopLoadingLine();

        showLoadError(
          'Scorecard Could Not Load',
          'The ROTB scorecard could not be loaded.',
          async () => {
            closeModal();
            scorecardHasLoaded =
              false;
            await loadScorecard();
          }
        );

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }

    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }



    /* =========================================================
       V9.9 — SCORECARD RUNNING GROSS / NET
       Uses verified (gold) scores only.
       Net matches the leaderboard convention:
       gross relative-to-par minus the team's full handicap.
       ========================================================= */

    function scorecardHandicap(team) {
      if (!team) return 0;

      const candidates = [
        team.handicap,
        team.hcp,
        team.teamHandicap,
        team.teamHcp
      ];

      const value = candidates.find(
        item =>
          item !== undefined &&
          item !== null &&
          String(item).trim() !== ''
      );

      const number = Number(value);
      return Number.isFinite(number) ? Math.abs(number) : 0;
    }


    function formatScorecardRelative(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }


    function updateScorecardRunningScores() {
      if (!els.scoreRunningGross || !els.scoreRunningNet) return;

      if (!selectedTeam) {
        els.scoreRunningGross.textContent = '(E)';
        els.scoreRunningNet.textContent = '(E)';
        els.scoreRunningGross.classList.remove('under-par');
        els.scoreRunningNet.classList.remove('under-par');
        return;
      }

      let gross = 0;

      savedScores.forEach((score, index) => {
        if (
          score === null ||
          !holes[index] ||
          !Number.isFinite(Number(score)) ||
          !Number.isFinite(Number(holes[index].par))
        ) {
          return;
        }

        gross += Number(score) - Number(holes[index].par);
      });

      const net = gross - scorecardHandicap(selectedTeam);

      els.scoreRunningGross.textContent =
        '(' + formatScorecardRelative(gross) + ')';

      els.scoreRunningNet.textContent =
        '(' + formatScorecardRelative(net) + ')';

      els.scoreRunningGross.classList.toggle('under-par', gross < 0);
      els.scoreRunningNet.classList.toggle('under-par', net < 0);
    }

      /* V12.14 agreed scorecard typography:

      const holeFont =

        );
    }

    function renderScorecard() {

      els.scoreRows.innerHTML =
        '';


      /*
        SSHCP V2.8 — the gray current-hole indicator follows LOCAL entry
        progress immediately. Gold still follows verified/savedScores.
        This lets ENTER mean "move on now" while verification finishes
        in the background.
      */
      let lastEnteredHoleIndex = -1;

      localScores.forEach(
        (score, index) => {
          if (score !== null) {
            lastEnteredHoleIndex = index;
          }
        }
      );

      const nextHoleIndex =
        lastEnteredHoleIndex < holes.length - 1
          ? lastEnteredHoleIndex + 1
          : holes.length - 1;


      holes.forEach(
        (
          hole,
          index
        ) => {


          if (

          ) {

              );

              breakRow
            );

          }


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'score-row';


          row.dataset.scoreIndex =
            String(
              index
            );


          const holeCell =
            document.createElement(
              'div'
            );


          holeCell.className =
            'hole-cell';

          if (index === nextHoleIndex) {
            holeCell.classList.add(

            );
          }

            document.createElement(
              'span'
            );

          holeNumber.className =

          holeNumber.textContent =

          holeCell.appendChild(
            holeNumber
          );


          const parCell =
            document.createElement(
              'div'
            );


          parCell.className =
            'par-cell';


          parCell.textContent =
            hole.par;


          const yardageCell =
            document.createElement(
              'div'
            );


          yardageCell.className =
            'yardage-cell';


          const white =
            document.createElement(
              'span'
            );


          white.className =
            'yard-white';


          white.textContent =
            hole.white;


          const slash =
            document.createElement(
              'span'
            );


          slash.className =
            'yard-slash';


          slash.textContent =
            '/';


          const gold =
            document.createElement(
              'span'
            );


          gold.className =
            'yard-gold';


          gold.textContent =
            hole.gold;


          yardageCell.append(
            white,
            slash,
            gold
          );


          const scoreCell =
            document.createElement(
              'div'
            );


          scoreCell.className =
            'score-cell';


          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'score-button';


          if (
            !selectedTeam
          ) {

            button.disabled =
              true;


            button.classList.add(
              'empty'
            );


            button.textContent =
              '';

          }
          else {

            const local =
              localScores[
                index
              ];


            const saved =
              savedScores[
                index
              ];


            if (
              local === null
            ) {

              button.classList.add(
                'empty'
              );


              button.textContent =
                '';

            }
            else {

              if (local === saved) {
                button.classList.add('saved');
                button.appendChild(makeSubmittedScoreMark(local, hole.par));
              }
              else {
                button.classList.add('unsaved');
                button.appendChild(makeSubmittedScoreMark(local, hole.par));
              }

            }


            button.addEventListener(
              'click',
              () => {

                requestScoreEntry(
                  index
                );

              }
            );

          }


          scoreCell.appendChild(
            button
          );


          row.append(
            holeCell,
            parCell,
            yardageCell,
            scoreCell
          );


          els.scoreRows.appendChild(
            row
          );

        }
      );

      updateSubmitButtonState();
      updateScorecardRunningScores();


      requestAnimationFrame(
        fitScorecardBodyTypography
      );

    function makeSubmittedScoreMark(score, par) {
      const mark = document.createElement('span');
      const relative = Number(score) - Number(par);
      mark.className = 'score-mark';
      const number = document.createElement('span');
      number.className = 'score-mark-number';
      number.textContent = String(score);
      mark.appendChild(number);
      if (relative === -1) mark.classList.add('single-circle');
      else if (relative <= -2) mark.classList.add('double-circle');
      else if (relative === 1) mark.classList.add('single-square');
      else if (relative === 2) mark.classList.add('double-square');
      else if (relative >= 3) mark.classList.add('bold-square');
      else mark.classList.add('par-mark');
      return mark;
    }

    function pendingScoresKey(team) {
      if (!team) return '';
      return 'rotbPendingScores:' + String(team.slot);
    }


    function readPendingScores(team) {
      const key = pendingScoresKey(team);
      if (!key) return null;

      try {
        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
        if (!Array.isArray(parsed) || parsed.length !== 18) return null;
        return normalizeScores(parsed);
      }
      catch (_) {
        return null;
      }
    }


    function syncPendingScoresStorage() {
      if (!selectedTeam) return;

      const key = pendingScoresKey(selectedTeam);
      if (!key) return;

      if (hasPendingScores()) {
        localStorage.setItem(key, JSON.stringify(localScores));
      }
      else {
        localStorage.removeItem(key);
      }
    }


    function hasPendingScores() {
      if (!selectedTeam) return false;
      return localScores.some((score,index) => score !== savedScores[index]);
    }

    function updateSubmitButtonState() {
      els.submitBtn.disabled = saveInProgress || !hasPendingScores();
    }


    /* =========================================================
       AUTHORIZATION
       ========================================================= */


    function isSelectedTeamAuthorized() {

      if (
        !selectedTeam
      ) {

        return false;

      }


      return (
        normalizeName(
          getAuthorizedTeam()
        ) ===
        normalizeName(
          selectedTeam.name
        )
      );

    }


    function requestScoreEntry(
      index
    ) {

      if (
        !selectedTeam
      ) {

        return;

      }


      if (isTeamQr()) {
        if (normalizeName(selectedTeam.name) !== normalizeName(getQrTeam())) { showNotAuthorized(); return; }
        openScoreEntry(index);
        return;
      }

      if (isMasterQr() && !isTeamAuthorizationEnabled()) {
        openScoreEntry(index);
        return;
      }

      if (isSelectedTeamAuthorized()) {
        openScoreEntry(index);
        return;
      }

      showAuthorizationModal(index);

    }


    function showAuthorizationModal(index) {

          '<span class="auth-check-box">✓</span>' +

      const authorizeButton = makeModalButton('AUTHORIZE', '', () => {
