    function applyV16ShellGeometry(view) {
      if (!view) return null;

      const shell = view.querySelector('.scorecard-screen, .leaderboard-screen');
      if (!shell) return null;

      const width = Math.max(1, Math.min(760, shell.clientWidth || window.innerWidth || 1));
      const height = Math.max(1, shell.clientHeight || window.innerHeight || 1);

      /* S25 visual reference: 756px wide × ~1423px browser-content height.
         Values below are the approved screenshot measurements multiplied by
         independent horizontal/vertical device factors. Large-screen growth
         is bounded so iPad controls remain deliberate rather than enormous. */
      const sx = Math.max(0.38, Math.min(1.00, width / 756));
      const sy = Math.max(0.40, Math.min(0.68, height / 1423));

      const px = value => Math.max(1, value * sx);
      const py = value => Math.max(1, value * sy);

      const vars = {
        '--v16-rail': px(24),
        '--v16-nav-w': px(141),
        '--v16-nav-h': py(78),
        '--v16-top-inset': py(14),
        '--v16-nav-context-gap': py(12),
        '--v16-context-h': py(88),
        '--v16-context-table-gap': py(12),
        '--v16-score-table-footer-gap': py(18),
        '--v16-leader-table-footer-gap': py(28),
        '--v16-footer-h': py(113),
        '--v16-bottom-gap': py(18),
        '--v16-internal-gap': px(28)
      };

      /* Completed Final Results uses a 1fr / 2fr footer after subtracting
         rails and the internal gap. Store the exact second-column left edge
         as a variable so parse-time and runtime use the same anchor. */
      vars['--v16-final-action-left'] =
        (width / 3) +
        (vars['--v16-rail'] / 3) +
        ((vars['--v16-internal-gap'] * 2) / 3);

      Object.entries(vars).forEach(([name, value]) => {
        view.style.setProperty(name, value + 'px');
      });

      try {
        sessionStorage.setItem(
          'sshcpV16ShellGeometry',
          JSON.stringify({
            w: window.innerWidth || 0,
            h: window.innerHeight || 0,
            vars
          })
        );
      } catch (e) {}

      const navButtons = view.querySelectorAll('.nav-button');
      navButtons.forEach(button => {
        fitTextToBoxV5(button, button, vars['--v16-nav-h'] * 0.52, 12, {
          horizontalPad: 8,
          verticalPad: 4,
          wrap: false,
          lineHeight: 1
        });
      });

      const brand = view.querySelector('.header-brand');
      if (brand) {
        fitTextToBoxV5(brand, brand, vars['--v16-nav-h'] * 0.38, 8, {
          horizontalPad: 4,
          verticalPad: 2,
          wrap: false,
          lineHeight: 1
        });
      }

      return { width, height, sx, sy, vars };
    }


    function sizeScorecardV5() {
      const screen = els.scorecardView
        ? els.scorecardView.querySelector('.scorecard-screen')
        : null;
      const top = els.scorecardView
        ? els.scorecardView.querySelector('.score-fixed-top')
        : null;
      const header = els.scorecardView
        ? els.scorecardView.querySelector('.score-table-head')
        : null;
      const bottom = els.scorecardView
        ? els.scorecardView.querySelector('.score-fixed-bottom')
        : null;

      if (!screen || !top || !header || !bottom || !els.scoreScroll) return;

      const geometry = applyV16ShellGeometry(els.scorecardView);
      if (!geometry) return;

      const screenHeight = screen.clientHeight;
      const topHeight = top.getBoundingClientRect().height;
      const oldHeaderHeight = header.getBoundingClientRect().height;
      const bottomHeight = bottom.getBoundingClientRect().height;
      if (!Number.isFinite(screenHeight) || screenHeight <= 0) return;

      /* V16: anchors/buffers define one table rectangle. The table merely fills it.
         Header = 0.85x; nine visible score rows = 9x. The tiny nine-hole divider
         is taken out first so it cannot distort the agreed 0.85 : 1 row ratio. */
      const fixedShellWithoutHeader = Math.max(0, topHeight - oldHeaderHeight) + bottomHeight;
      const tableBudget = Math.max(1, screenHeight - fixedShellWithoutHeader);
      const divider = Math.max(2, Math.min(4, tableBudget * 0.004));
      const scoreTableBudget = Math.max(1, tableBudget - divider);
      const rowHeight = Math.max(1, scoreTableBudget / 9.85);
      const headerHeight = rowHeight * 0.85;

      els.scorecardView.style.setProperty('--v5-score-row-h', rowHeight + 'px');
      els.scorecardView.style.setProperty('--v5-score-head-h', headerHeight + 'px');
      els.scorecardView.style.setProperty('--v5-nine-break-h', divider + 'px');

      const sampleScoreCell = els.scoreRows
        ? els.scoreRows.querySelector('.score-row .score-cell')
        : null;
      const scoreCellWidth = sampleScoreCell
        ? sampleScoreCell.clientWidth
        : Math.max(1, els.scoreScroll.clientWidth * 0.35);
      const scoreCellHeight = sampleScoreCell
        ? sampleScoreCell.clientHeight
        : rowHeight;

      let scoreInnerWidth = scoreCellWidth;
      let scoreInnerHeight = scoreCellHeight;
      if (sampleScoreCell) {
        const scoreCellStyle = getComputedStyle(sampleScoreCell);
        scoreInnerWidth = Math.max(1, scoreCellWidth -
          (parseFloat(scoreCellStyle.paddingLeft) || 0) -
          (parseFloat(scoreCellStyle.paddingRight) || 0));
        scoreInnerHeight = Math.max(1, scoreCellHeight -
          (parseFloat(scoreCellStyle.paddingTop) || 0) -
          (parseFloat(scoreCellStyle.paddingBottom) || 0));
      }

      const scoreBox = Math.max(
        18,
        Math.min(
          scoreInnerHeight * 0.96,
          (scoreInnerWidth * 0.96) / 1.5
        )
      );
      els.scorecardView.style.setProperty('--v5-score-box', scoreBox + 'px');

      rememberResponsiveGeometryV5({
        scoreHead: headerHeight,
        scoreRow: rowHeight,
        scoreBox: scoreBox,
        scoreDivider: divider
      });

      Array.from(header.children).forEach((cell, index) => {
        if (index < 3) {
          fitTextToBoxV5(cell, cell, headerHeight * 0.375, 12, {
            horizontalPad: 8,
            verticalPad: 4
          });
        }
      });

      const running = header.querySelector('.score-running-header');
      if (running) {
        const parts = Array.from(running.children);
        if (parts[0]) fitTextToBoxV5(parts[0], parts[0], headerHeight * 0.40, 7, {horizontalPad:8, verticalPad:4});
        if (parts[1]) fitTextToBoxV5(parts[1], parts[1], headerHeight * 0.375, 9, {horizontalPad:10, verticalPad:4});
        if (parts[2]) fitTextToBoxV5(parts[2], parts[2], headerHeight * 0.40, 7, {horizontalPad:8, verticalPad:4});
      }

      els.scoreRows.querySelectorAll('.score-row').forEach(row => {
        const holeCell = row.querySelector('.hole-cell');
        const hole = row.querySelector('.hole-number');
        const par = row.querySelector('.par-cell');
        const yards = row.querySelector('.yardage-cell');
        const button = row.querySelector('.score-button');

        if (holeCell && hole) fitTextToBoxV5(holeCell, hole, rowHeight * 0.50, 13, {horizontalPad:8,verticalPad:6});
        if (par) fitTextToBoxV5(par, par, rowHeight * 0.40, 12, {horizontalPad:8,verticalPad:6});
        if (yards) fitTextToBoxV5(yards, yards, rowHeight * 0.40, 11, {horizontalPad:8,verticalPad:6});
        if (button) fitTextToBoxV5(button, button, scoreBox * 0.68, 13, {horizontalPad:4,verticalPad:4});
      });

      const footerButton = els.scorecardView.querySelector('.score-bottom-actions .leaderboard-button');
      if (footerButton) {
        fitTextToBoxV5(footerButton, footerButton, footerButton.clientHeight * 0.35, 13, {
          horizontalPad: 12,
          verticalPad: 6,
          wrap: false,
          lineHeight: 1
        });
      }
    }

      const nextHoleIndex = scorecardActiveHoleIndexV16(localScores, selectedTeam);

    function makeSubmittedScoreMark(score, par) {
      const mark = document.createElement('span');
      const relative = Number(score) - Number(par);
      mark.className = 'score-mark';
      const number = document.createElement('span');
      number.className = 'score-mark-number';
      number.textContent = String(score);
      mark.appendChild(number);
      if (relative === -1) mark.classList.add('single-circle');
      else if (relative <= -2) mark.classList.add('double-circle');
      else if (relative === 1) mark.classList.add('single-square');
      else if (relative === 2) mark.classList.add('double-square');
      else if (relative >= 3) mark.classList.add('bold-square');
      else mark.classList.add('par-mark');
      return mark;
    }

    function commitScoreEntryValue() {

      if (
        activeScoreIndex ===
        null
      ) {

        return {
          committed: false,
          cleared: false,
          index: null
        };

      }


      const index =
        activeScoreIndex;


      const raw =
        String(
          els.scoreEntryInput.value ||
          ''
        ).trim();


      if (
        raw === ''
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      const value =
        Number(
          raw
        );


      if (
        !Number.isInteger(
          value
        ) ||
        value < 0
      ) {

        return {
          committed: false,
          cleared: false,
          index
        };

      }


      if (
        value === 0
      ) {

        localScores[
          index
        ] =
          null;


        renderScorecard();
        syncPendingScoresStorage();


        addTestLog(
          'SCORE H' + (index + 1),
          'PENDING',
          '—',
          'Cleared to blank • auto-submit'
        );


        return {
          committed: true,
          cleared: true,
          index
        };

      }


      localScores[
        index
      ] =
        value;


      renderScorecard();
      syncPendingScoresStorage();


      addTestLog(
        'SCORE H' + (index + 1),
        'PENDING',
        '—',
        'Score ' + value + ' • auto-submit'
      );


      return {
        committed: true,
        cleared: false,
        index
      };

    }


    function closeScoreEntry(
      commitTypedValue
    ) {

      if (
        !els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          ) ||
        scoreEntryClosing
      ) {

        return;

      }


      scoreEntryClosing =
        true;


      const commitResult =
        commitTypedValue
          ? commitScoreEntryValue()
          : {
              committed: false,
              cleared: false,
              index: activeScoreIndex
            };


      els.scoreEntryOverlay
        .classList
        .remove(
          'open'
        );


      els.scoreEntryInput.blur();


      els.scoreEntryInput.value =
        '';


      activeScoreIndex =
        null;


      /*
        V7-CF.11: A committed 0 OR blank value is handled as one atomic CLEAR.
        The popup is closed first, then the auto-submit is started.
        This avoids the old deferred clear/close race that could make
        Android Enter appear to require multiple attempts.

        Every committed score now starts the verified save immediately after
        the popup closes. If another score is entered while that save is
        in flight, one follow-up save is queued so the newer gray score is
        not overwritten or lost.
      */
      if (
        commitResult.committed
      ) {

        /*

          V16.21 visual Blue now follows the fixed 0.8s cadence; backend
          verification remains authoritative and can roll it back on failure.
        */
        if (!commitResult.cleared) {
          beginScoreVisualCadenceV1619(
            commitResult.index,
            localScores[commitResult.index]
          );
          restoreScorePosition(true);
        } else {
          /* CLEAR stays stationary and never participates in optimistic Blue. */
          clearScoreVisualStateV1619(commitResult.index);
          cancelScoreEnterBeautyScrollV1618();

    /* =========================================================
       CLOUDFLARE: VERIFIED SCORE WRITE
       Google Apps Script is NOT used.

       One request only:
       Worker writes -> reads Google Sheets back -> verifies.
       Worker verification still requires verified:true plus an exact
       verifiedScores match. V16.21's Blue state is a UI-only 0.8s optimistic
       cadence and is rolled back on a failed/unconfirmed save.
       ========================================================= */


    async function submitScores(failureContextV1621 = 'enter') {

      if (
        !selectedTeam ||
        !hasPendingScores()
      ) {
        return;
      }

      if (saveInProgress) {
        saveQueued = true;
        /* A queued real ENTER is the more specific user action. Otherwise
           preserve REFRESH so a failed refresh retry gets refresh-only copy. */
        if (failureContextV1621 === 'enter' || saveQueuedFailureContextV1621 !== 'enter') {
          saveQueuedFailureContextV1621 = failureContextV1621;
        }
        return;
      }

      if (
        els.scoreEntryOverlay
          .classList
          .contains(
            'open'
          )
      ) {
        closeScoreEntry(
          true
        );
      }

      saveInProgress =
        true;

      els.submitBtn.disabled =
        true;

      const started =
        timerStart();

      const expectedScores =
        normalizeScores(
          localScores
        );

      const savedScoresAtRequestV1619 = normalizeScores(savedScores);
      const visualGenerationsAtRequestV1619 = scoreVisualStateV1619.map(
        state => state ? state.generation : null
      );
      const visualEnteredTimesAtRequestV1619 = scoreVisualStateV1619
        .map((state, index) => (
          state &&
          visualGenerationsAtRequestV1619[index] === state.generation &&
          expectedScores[index] !== savedScoresAtRequestV1619[index]
        ) ? state.enteredAt : null)
        .filter(value => Number.isFinite(value));
      const failureReferenceAtV1619 = visualEnteredTimesAtRequestV1619.length
        ? Math.max(...visualEnteredTimesAtRequestV1619)
        : started;

      const expectedSlot =
        Number(
          selectedTeam.slot
        );

      const apiScores =
        expectedScores.map(
          score =>
            score === null
              ? ''
              : score
        );

      const encodedScores =
        encodeURIComponent(
          JSON.stringify(
            apiScores
          )
        );

      const url =
        CLOUDFLARE_API_URL +
        '?action=saveScores' +
        '&slot=' +
        encodeURIComponent(
          expectedSlot
        ) +
        '&scores=' +
        encodedScores +
        '&passkey=' +
        encodeURIComponent(getQrPasskey()) +
        '&refresh=' +
        Date.now();

      startLoadingLine();

      try {

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Save request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true ||
          data.verified !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scores were not verified.'
          );
        }

        const confirmedScores =
          normalizeScores(
            data.verifiedScores
          );

        if (
          !scoresEqual(
            confirmedScores,
            expectedScores
          )
        ) {
          throw new Error(
            'Verified scores did not match submitted scores.'
          );
        }

        /*
          V15.9 — determine whether this verified batch contains an
          entered score before replacing savedScores. This preserves the
          V15.8 behavior: ENTER may auto-position; CLEAR does not.
        */
        const shouldAutoPositionAfterSave =
          expectedScores.some(
            (score, index) =>
              score !== null &&
              score !== savedScores[index]
          );

        savedScores =
          [
            ...confirmedScores
          ];

        markScoreVisualVerificationV1619(
          confirmedScores,
          visualGenerationsAtRequestV1619
        );

        /*
          Do not overwrite localScores here. The player may already have
          entered another hole while this request was in flight. The
          verified snapshot becomes savedScores; any newer local difference
          stays gray and is sent by the queued save below.
        */
        syncPendingScoresStorage();

        const teamIndex =
          teams.findIndex(
            team =>
              Number(
                team.slot
              ) ===
              expectedSlot
          );

        if (
          teamIndex >= 0
        ) {

          teams[
            teamIndex
          ].scores =
            [
              ...confirmedScores
            ];

          selectedTeam =
            teams[
              teamIndex
            ];

        }

        syncPendingScoresStorage();
        renderScorecard();

        /*
          V15.9 — only an entered/verified score advances the visible
          scorecard position. Clearing a score still rerenders the
          scorecard and updates its hole indicator, but does not move
          the viewport.
        */
        if (shouldAutoPositionAfterSave) {
          restoreScorePosition();
        }

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'save'
          );

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'VERIFIED', scoreSaveSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

      }
      catch (error) {

        scoreSaveSeconds =
          timerSeconds(
            started
          );

        updateScoreTiming();
        addTestLog('ENTER SCORES', 'FAILED', scoreSaveSeconds + 's', String(error && error.message ? error.message : 'Save failed'));
        stopLoadingLine();

        scheduleScoreFailureNoticeV1619(
          expectedScores,
          savedScoresAtRequestV1619,
          visualGenerationsAtRequestV1619,
          failureReferenceAtV1619,
          failureContextV1621
        );

      }
      finally {

        saveInProgress =
          false;

        updateSubmitButtonState();

        let queuedAnotherSave = false;

        if (saveQueued) {
          saveQueued = false;
          const queuedFailureContextV1621 = saveQueuedFailureContextV1621 || 'enter';
          saveQueuedFailureContextV1621 = null;

          if (hasPendingScores()) {
            queuedAnotherSave = true;
            setTimeout(
              () => submitScores(queuedFailureContextV1621),
              0
            );
          }
        }

        /* If the player moved to LIVE LEADERBOARD while this score was being
           verified, refresh immediately after the final queued save attempt.
           This is event-driven from score verification, not the 10-second idle
           leaderboard timer, so the completed state appears right away. */
        if (leaderboardRefreshAfterScoreSave && !queuedAnotherSave) {
          const shouldRefreshNow = currentView === 'leaderboard';
          leaderboardRefreshAfterScoreSave = false;

          if (shouldRefreshNow) {
            setTimeout(
              () => loadLeaderboard(false, true),
              0
            );
          } else {
            stopLoadingLine();
          }
        }

      }

    }


    /* =========================================================
       CLOUDFLARE: LEADERBOARD READ
       Google Apps Script is NOT used.
       Fresh read every time LIVE LEADERBOARD is opened + manual REFRESH.
       V5.8 also runs a 10-second idle refresh cycle while the tournament is live.
       Any leaderboard interaction resets that cycle.

    function leaderboardRefreshIsLiveV57() {
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')

        currentView === 'leaderboard' &&

    function stopLeaderboardRefreshCycleV57() {
      if (leaderboardRefreshTimerV57) {

        leaderboardRefreshTimerV57 = null;

        els.leaderboardView.classList.remove(

    function pauseLeaderboardRefreshCycleV58() {
      if (!leaderboardRefreshIsLiveV57() || leaderboardLoadInProgress) return;

      leaderboardRefreshPointerActiveV58 = true;

      if (leaderboardRefreshTimerV57) {
        clearTimeout(leaderboardRefreshTimerV57);
        leaderboardRefreshTimerV57 = null;
      }

      if (els.leaderboardView && els.leaderboardView.classList.contains('leader-auto-refresh-active')) {
        els.leaderboardView.classList.add('leader-auto-refresh-paused');
      }
    }

    function releaseLeaderboardRefreshCycleV58() {
      if (!leaderboardRefreshPointerActiveV58) return;
      leaderboardRefreshPointerActiveV58 = false;
      restartLeaderboardRefreshCycleV57();
    }

    function restartLeaderboardRefreshCycleV57() {
      stopLeaderboardRefreshCycleV57();

      if (
        !leaderboardRefreshIsLiveV57() ||
        leaderboardLoadInProgress ||
        leaderboardRefreshPointerActiveV58
      ) {
        return;
      }

      const titleBar = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-title-bar')

      }

      leaderboardRefreshTimerV57 = setTimeout(async () => {
        leaderboardRefreshTimerV57 = null;

        if (!leaderboardRefreshIsLiveV57()) {
          stopLeaderboardRefreshCycleV57();
          return;
        }

        if (els.leaderboardView) {
          els.leaderboardView.classList.remove('leader-auto-refresh-active');

        /* V16.8 — the 10-second live auto-refresh uses the same orientation
           contract as entering LIVE LEADERBOARD / browser pull-refresh:
           start from the top, fresh-read immediately, then let the established
           1.5-second authorized-team positioning bring a team below the visible
           eight rows back into view. */
        cancelLeaderboardAutoScroll();
        if (els.leaderContent) {
          els.leaderContent.scrollTop = 0;
        }
        await loadLeaderboard(false, true);
      }, 10000);
    }

    /* =========================================================
       V14.1 — TOURNAMENT COMPLETION / PODIUM TIEBREAK
       ========================================================= */
    function tournamentIsComplete(rows) {
      return Array.isArray(rows) && rows.length > 0 &&
        rows.every(row => Number(row.thru) === 18);
    }

    function firstPlaceTiedRows(rows) {
      if (!Array.isArray(rows) || rows.length < 2) return [];
      const numericRows = rows.filter(row => Number.isFinite(Number(row.net)));
      if (numericRows.length < 2) return [];
      const bestNet = Math.min(...numericRows.map(row => Number(row.net)));
      return numericRows.filter(row => Number(row.net) === bestNet);
    }

    function tiebreakValue(row, index) {
      const raw = Array.isArray(row.tiebreakScores)
        ? row.tiebreakScores[index]
        : '';
      if (raw === '' || raw === null || raw === undefined) return NaN;
      return Number(raw);
    }

    function actualTiebreakHole(row, index) {
      const raw = Array.isArray(row?.tiebreakHoles)
        ? row.tiebreakHoles[index]
        : '';

      if (raw === '' || raw === null || raw === undefined) return '';
      return String(raw).trim();
    }

    function resolveTieContenders(tied) {
      if (!Array.isArray(tied) || tied.length < 2) return null;

      let contenders = [...tied];

      const holeCount = Math.max(
        0,
        ...tied.map(row =>
          Array.isArray(row?.tiebreakScores)
            ? row.tiebreakScores.length
            : 0
        )
      );

      for (let index = 0; index < holeCount; index++) {
        const enteringHole = [...contenders];

        const scored = enteringHole.map(row => ({
          row,
          score: tiebreakValue(row, index)
        }));

        if (scored.some(item => !Number.isFinite(item.score))) {
          return {
            tied: [...tied],
            winner: null,
            decidingIndex: null,
            unresolved: true,
            decidingContenders: enteringHole
          };
        }

        const bestScore = Math.min(...scored.map(item => item.score));
        contenders = scored
          .filter(item => item.score === bestScore)
          .map(item => item.row);

        if (contenders.length === 1) {
          return {
            tied: [...tied],
            winner: contenders[0],
            decidingIndex: index,
            winningScore: bestScore,
            unresolved: false,
            decidingContenders: enteringHole
          };
        }
      }

      return {
        tied: [...tied],
        winner: null,
        decidingIndex: null,
        unresolved: true,
        decidingContenders: [...contenders]
      };
    }

    function resolveFirstPlaceTie(rows) {
      const tied = firstPlaceTiedRows(rows);
      if (tied.length < 2) return null;
      return resolveTieContenders(tied);
    }

    function ordinalNumber(number) {
      const n = Number(number);
      const mod100 = n % 100;
      if (mod100 >= 11 && mod100 <= 13) return n + 'th';
      switch (n % 10) {
        case 1: return n + 'st';
        case 2: return n + 'nd';
        case 3: return n + 'rd';
        default: return n + 'th';
      }
    }

    function ordinalHandicapHole(index) {
      const number = Number(index) + 1;
      return Number.isFinite(number) && number > 0
        ? ordinalNumber(number) + ' Handicap Hole'
        : '';
    }

    function measureCompletedActionSpaceV53() {

    function syncHomeTournamentCompleteV1630(complete) {

    function updateTournamentFinishState(rows) {

    function joinTeamNamesHtml(rows) {

    function fitTieBreakExplanationV1515() {
      if (!els.modalOverlay.classList.contains('tournament-result')) return;

      const outer = els.modalBody
        ? els.modalBody.querySelector('.tiebreak-explanation')
        : null;
      const inner = outer
        ? outer.querySelector('.tiebreak-explanation-inner')
        : null;

      if (!outer || !inner) return;

      inner.style.removeProperty('font-size');
      inner.style.setProperty('line-height', '1.22', 'important');
      inner.style.setProperty('white-space', 'normal', 'important');
      inner.style.setProperty('overflow', 'hidden', 'important');

      const targetPx = parseFloat(getComputedStyle(inner).fontSize) || 22;
      const minPx = 14;

      const fitsAt = size => {
        inner.style.setProperty('font-size', size + 'px', 'important');
        return (
          inner.scrollWidth <= outer.clientWidth + 0.75 &&
          inner.scrollHeight <= outer.clientHeight + 0.75
        );
      };

      if (fitsAt(targetPx)) return;

      let low = minPx;
      let high = targetPx;
      let best = minPx;

      for (let i = 0; i < 12; i++) {
        const mid = (low + high) / 2;
        if (fitsAt(mid)) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      fitsAt(best);
    }


    function getSummaryHandicap(row) {
      const match = teams.find(team => Number(team.slot) === Number(row.slot));
      const candidates = [
        row.handicap,
        row.hcp,
        row.teamHandicap,
        row.teamHcp,
        match ? match.handicap : undefined,
        match ? match.hcp : undefined
      ];
      const direct = candidates.find(value =>
        value !== undefined && value !== null && String(value).trim() !== ''
      );
      let hcp = Number(direct);
      if (!Number.isFinite(hcp)) {
        const gross = Number(row.gross);
        const net = Number(row.net);
        if (Number.isFinite(gross) && Number.isFinite(net)) {
          hcp = Math.abs(gross - net);
        }
      }
      return Number.isFinite(hcp) ? Math.abs(hcp) : null;
    }

    function buildTournamentPodium(rows) {
      const source = Array.isArray(rows)
        ? rows.filter(row => row && Number.isFinite(Number(row.net)))
        : [];

      /* Base tournament order is net score, then stable team slot order.
         Slot order is the clean fallback for any places we do NOT explicitly
         resolve by tiebreak. */
      const base = [...source].sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      const annotations = new Map();
      const podiumRows = [];
      const remaining = [...base];

      /* Resolve ONLY podium places. For each place, find everyone tied on the
         best remaining NET score, resolve that tie through handicap holes,
         remove the winner, then repeat for the next podium place. */
      for (let place = 1; place <= 3 && remaining.length; place++) {
        const bestNet = Number(remaining[0].net);
        const tiedGroup = remaining.filter(
          row => Number(row.net) === bestNet
        );

        let winner = tiedGroup[0];
        let resolution = null;

        if (tiedGroup.length > 1) {
          resolution = resolveTieContenders(tiedGroup);

          if (resolution && resolution.winner) {
            winner = resolution.winner;
          }
        }

        podiumRows.push(winner);

        const removeIndex = remaining.indexOf(winner);
        if (removeIndex >= 0) remaining.splice(removeIndex, 1);

        if (
          resolution &&
          resolution.winner &&
          resolution.decidingIndex !== null
        ) {
          const actualHole = actualTiebreakHole(
            winner,
            resolution.decidingIndex
          );
          const hcpHoleNumber = Number(resolution.decidingIndex) + 1;

          annotations.set(winner, {
            marks: '',
            note:
              '• ' +
              place +
              ordinalSuffix(place) +
              ' Place Won on ' +
              hcpHoleNumber +
              ' HCP Hole' +
              (actualHole ? ' (Hole\u00A0' + actualHole + ')' : '')
          });
        }
      }

      /* Everything after 3rd is intentionally NOT further tiebroken.
         Preserve clean NET grouping and team/slot order inside each tie. */
      remaining.sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      return {
        ordered: [...podiumRows, ...remaining],
        annotations,
        firstTie: firstPlaceTiedRows(source)
      };
    }

    function ordinalSuffix(number) {
      if (number === 1) return 'st';
      if (number === 2) return 'nd';
      if (number === 3) return 'rd';
      return 'th';
    }

    /* V15.15 — one authoritative resolved-place labeler shared by
       FINAL RESULTS and SCRAMBLE SUMMARY after BREAK TIE is revealed. */
    function resolvedTournamentPlaceLabel(orderedRows, rowIndex) {
      if (!Array.isArray(orderedRows) || rowIndex < 0 || rowIndex >= orderedRows.length) {
        return '';
      }

      if (rowIndex < 3) return String(rowIndex + 1);

      const row = orderedRows[rowIndex];
      const currentNet = Number(row && row.net);

      const priorSameNet = orderedRows
        .slice(3, rowIndex)
        .some(item => Number(item && item.net) === currentNet);

      const laterSameNet = orderedRows
        .slice(rowIndex + 1)
        .some(item => Number(item && item.net) === currentNet);

      let unresolvedPlace = 4;
      for (let i = 3; i < rowIndex; i++) {
        if (Number(orderedRows[i] && orderedRows[i].net) < currentNet) {
          unresolvedPlace++;
        }
      }

      return (priorSameNet || laterSameNet)
        ? 'T' + unresolvedPlace
        : String(unresolvedPlace);
    }


    function applyTournamentSummaryGeometryV16(body, topGrid, lower, lowerRows) {
      if (!body || !topGrid || !lower) return;

      const subtitle = body.querySelector('.tournament-summary-subtitle');
      const notes = body.querySelector('.tournament-summary-notes');
      const noteCount = Math.min(
        3,
        notes ? notes.querySelectorAll('.tournament-summary-note').length : 0
      );
      const lowerCount = Math.min(
        7,
        Array.isArray(lowerRows) ? lowerRows.length : 0
      );
      const bodyHeight = Math.max(1, body.clientHeight);

      /* V16.11 Scramble Summary geometry contract.
         The title/subtitle are natural content-height elements, not fixed
         invisible boxes. Fixed shell pieces are budgeted BEFORE x is solved:
           - popup top -> SCRAMBLE SUMMARY = one measured RESULTS/TOP 10 line-height
           - SCRAMBLE SUMMARY -> RESULTS/TOP 10 = 15px (title margin)
           - RESULTS/TOP 10 -> top table = 15px
           - lower table -> BACK = 15px (modal-actions top padding)
           - no tie notes = one 15px separator buffer
           - 1-3 tie notes = 8px above + 15px per line + 8px below
         Weighted row equation is unchanged from V16.10:
           header 1.1x + 1st 2x + 2nd 1.5x + 3rd 1.5x
           + up to seven lower rows at 1x each. */
      const resultsBuffer = 15;
      const noTieBuffer = 15;
      const tieBuffer = 8;
      const tieLineH = 15;
      const measuredSubtitleH = subtitle
        ? Math.max(1, Math.ceil(subtitle.getBoundingClientRect().height))
        : 24;
      const subtitleBlockH = measuredSubtitleH + resultsBuffer;
      const noteSectionH = noteCount > 0
        ? tieBuffer + (noteCount * tieLineH) + tieBuffer
        : noTieBuffer;

      const fixedSpace = subtitleBlockH + noteSectionH;
      const weightedSpace = Math.max(1, bodyHeight - fixedSpace);
      const weight = 1.1 + 2 + 1.5 + 1.5 + lowerCount;
      const x = Math.max(1, weightedSpace / Math.max(1, weight));

      const headerH = 1.1 * x;
      const place1 = 2 * x;
      const place2 = 1.5 * x;
      const place3 = 1.5 * x;
      const lowerRow = 1 * x;
      const topGridH = headerH + place1 + place2 + place3;
      const lowerH = lowerRow * lowerCount;

      body.style.setProperty('gap', '0px', 'important');
      body.style.setProperty(
        'grid-template-rows',
        subtitleBlockH + 'px ' + topGridH + 'px ' + noteSectionH + 'px ' + lowerH + 'px',
        'important'
      );
      topGrid.style.setProperty(
        'grid-template-rows',
        headerH + 'px ' + place1 + 'px ' + place2 + 'px ' + place3 + 'px',
        'important'
      );
      lower.style.setProperty(
        'grid-template-rows',
        lowerCount > 0 ? 'repeat(' + lowerCount + ', ' + lowerRow + 'px)' : '0px',
        'important'
      );

      if (subtitle) {
        subtitle.style.setProperty('height', 'auto', 'important');
        subtitle.style.setProperty('min-height', '0px', 'important');
        subtitle.style.setProperty('max-height', 'none', 'important');
        subtitle.style.setProperty('margin', '0px', 'important');
      }
      if (notes) {
        notes.style.setProperty('height', noteSectionH + 'px', 'important');
        notes.style.setProperty('min-height', noteSectionH + 'px', 'important');
        notes.style.setProperty('max-height', noteSectionH + 'px', 'important');
        notes.style.setProperty('padding-top', noteCount > 0 ? tieBuffer + 'px' : '0px', 'important');
        notes.style.setProperty('padding-bottom', noteCount > 0 ? tieBuffer + 'px' : '0px', 'important');
      }
    }

      [1,2,3].forEach((place, index) => {

        if (team && teamText) {
          fitTwoLineTeamTextV58(

        if (net) fitTextToBoxV5(net, net, Math.min(46, row.clientHeight * ([0.60,0.55,0.50][index])), 12, {horizontalPad:6,verticalPad:5});
      });

      const lowerPlace = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.place'));
      const lowerTeam = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.team'));
      const lowerNet = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-score'));

      const fitUniform = (cells, ratio, minimum, pad=6) => {
        let chosen = Infinity;
        cells.forEach(cell => {
          chosen = Math.min(chosen, fitTextToBoxV5(cell, cell, cell.clientHeight * ratio, minimum, {
            horizontalPad: pad,
            verticalPad: 5
          }));
        });
        if (Number.isFinite(chosen)) {

        }

        const teamText = teamCell.querySelector('.summary-team-text');
        if (!teamText) return;

          teamText,

          10
        );

      fitUniform(lowerNet, 0.48, 12, 6);

         same one-line notation and one common fitted size. Start at the

         the smallest size needed so the column stays visually consistent. */
      const allStrokes = [
        ...Array.from(topGrid.querySelectorAll('.tournament-summary-strokes')),
        ...Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-strokes'))
      ];
      let strokesSize = 17;
      allStrokes.forEach(cell => {
        strokesSize = Math.min(strokesSize, fitTextToBoxV5(cell, cell, 17, 8, {
          horizontalPad: 4,
          verticalPad: 4,

          lineHeight: 1
        }));
      });
      allStrokes.forEach(cell => {
        cell.style.setProperty('font-size', strokesSize + 'px', 'important');
        cell.style.setProperty('white-space', 'nowrap', 'important');
      });

      document.documentElement.style.setProperty('--v5-summary-note-font', '13px');
    }



    /* =========================================================
       SSHCP V16.27 — SKINS FIRST PASS
       Gross skins only. Assigned OFFICIAL teams are eligible. For each actual
       Hole 1-18, the unique lowest valid score wins one skin. Tied low scores
       produce no winner; no carryover and no handicap adjustment in this pass.
       ========================================================= */
    const SKINS_ENABLED_KEY_V1627 = 'sshcpSkinsEnabledV1627';

    function skinsEnabledV1627() {
      return localStorage.getItem(SKINS_ENABLED_KEY_V1627) === '1';
    }

    function setSkinsEnabledV1627(enabled) {
      localStorage.setItem(SKINS_ENABLED_KEY_V1627, enabled ? '1' : '0');
      if (els.controlCenterSkinsCheck) els.controlCenterSkinsCheck.checked = Boolean(enabled);
      addTestLog('SKINS', enabled ? 'ON' : 'OFF', '—', 'Summary button ' + (enabled ? 'shown' : 'hidden'));
    }

    function buildSkinsResultsV1627(scorecardTeams, courseHoles) {
      const eligible = Array.isArray(scorecardTeams)
        ? scorecardTeams.filter(team => team && String(team.name || '').trim() !== '')
        : [];
      const course = Array.isArray(courseHoles) ? courseHoles : [];
      const results = [];

      for (let index = 0; index < 18; index++) {
        const hole = course[index] || {};
        const entered = eligible.map(team => {
          const value = Number(Array.isArray(team.scores) ? team.scores[index] : NaN);
          return { team, score: value };
        }).filter(item => Number.isFinite(item.score) && item.score > 0);

        /* A skin is only meaningful when every currently assigned team has a
           valid score on that hole. Completed Summary normally guarantees it,
           but this guard prevents partial data from awarding a false skin. */
        if (!eligible.length || entered.length !== eligible.length) continue;

        const low = Math.min(...entered.map(item => item.score));
        const winners = entered.filter(item => item.score === low);
        if (winners.length !== 1) continue;

        results.push({
          team: winners[0].team,
          hole: Number(hole.hole) || (index + 1),
          par: Number(hole.par),
          score: low
        });
      }

      return results;
    }

    function makeSkinsScoreMarkV1627(score, par) {
      const wrap = document.createElement('span');
      wrap.className = 'skins-score-mark-v1627';
      const relative = Number(score) - Number(par);
      if (relative === -1) wrap.classList.add('single-circle');
      else if (relative <= -2) wrap.classList.add('double-circle');

      const number = document.createElement('span');
      number.className = 'skins-score-number-v1627';
      number.textContent = String(score);
      wrap.appendChild(number);
      return wrap;
    }

      return { teams: sourceTeams, holes: sourceHoles };

    function renderLeaderboard(
      rows,
      allowAutoScroll = true
    ) {

      const priorLeaderboardScroll = els.leaderContent
        ? els.leaderContent.scrollTop
        : 0;

      /* SSHCP V5.2 — Once the tournament is complete, the normal leaderboard
         keeps the existing resolved podium ordering. Scramble Summary uses
         that same top-three logic, but does not resolve places 4 and below.
         A first-place tie still remains unrevealed until BREAK TIE is viewed. */
      if (tournamentIsComplete(rows)) {
        const firstTie = firstPlaceTiedRows(rows);
        const mayShowResolvedPodium =
          firstTie.length < 2 || hasViewedTournamentTieBreak();

        if (mayShowResolvedPodium) {
          const podium = buildTournamentPodium(rows);
          const podiumOrder = new Map(
            podium.ordered.map((row, index) => [Number(row.slot), index])
          );

          rows = [...rows].sort((a, b) => {
            const aNet = Number(a.net);
            const bNet = Number(b.net);

            if (Number.isFinite(aNet) && Number.isFinite(bNet) && aNet !== bNet) {
              return aNet - bNet;
            }

            const aOrder = podiumOrder.get(Number(a.slot));
            const bOrder = podiumOrder.get(Number(b.slot));

            if (Number.isFinite(aOrder) && Number.isFinite(bOrder)) {
              return aOrder - bOrder;
            }
            return 0;
          });
        }
      }

      els.leaderRows.innerHTML =
        '';

      if (els.leaderContent) {
        els.leaderContent.classList.toggle(
          'short-leaderboard',
          Array.isArray(rows) && rows.length < 8
        );
      }


      let previousNet = null;
      let previousPlace = 0;

      /* V16.8 — once FINAL RESULTS can legitimately reveal podium order,
         its PLACE labels must match SCRAMBLE SUMMARY immediately. A first-place
         tie remains intentionally unresolved until TIE BREAK is viewed; when
         there is no first-place tie, podium places 1/2/3 are already safe to
         resolve and lower unresolved ties use T4/T6/etc. */
      const completedForPlaces = tournamentIsComplete(rows);
      const firstPlaceTieForPlaces = completedForPlaces
        ? firstPlaceTiedRows(rows)
        : [];
      const useResolvedTournamentPlaces =
        completedForPlaces &&
        (firstPlaceTieForPlaces.length < 2 || hasViewedTournamentTieBreak());

      const authorizedTeamName =
        normalizeName(
          getAuthorizedTeam() || ''
        );

      const completedMarkerByTeam = new Map();
      if (useResolvedTournamentPlaces) {
        const podiumForMarkers = buildTournamentPodium(rows);
        podiumForMarkers.annotations.forEach((annotation, podiumRow) => {
          const key = Number.isFinite(Number(podiumRow && podiumRow.slot))
            ? 'slot:' + Number(podiumRow.slot)
            : 'team:' + normalizeName((podiumRow && podiumRow.team) || '');
          completedMarkerByTeam.set(key, annotation);
        });
      }

      rows.forEach(
        (row, index) => {

          const netKey = Number(row.net);
          const samePlace =
            index > 0 &&
            Number.isFinite(netKey) &&
            Number.isFinite(previousNet) &&
            netKey === previousNet;

          const place = useResolvedTournamentPlaces
            ? resolvedTournamentPlaceLabel(rows, index)
            : (samePlace ? previousPlace : index + 1);

          previousNet = netKey;
          previousPlace = place;

          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';
          line.dataset.team = normalizeName(row.team || '');

          const placeCell = document.createElement('div');
          placeCell.className = 'leader-place-cell';

          const placeNumber = document.createElement('span');
          placeNumber.className = 'leader-place-number';
          placeNumber.textContent = String(place);
          placeCell.appendChild(placeNumber);

          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';

          if (
            authorizedTeamName &&
            line.dataset.team === authorizedTeamName
          ) {
            placeCell.classList.add(
              'authorized-place-cell'
            );
          }


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          teamName.textContent = displayTeamName(row.team || '');
          teamName.dataset.v58Name = displayTeamName(row.team || '');

          const teamAnchor = document.createElement('span');
          teamAnchor.className = 'leader-team-anchor';
          teamAnchor.appendChild(teamName);

          const hcpCell =
            document.createElement(
              'div'
            );


          hcpCell.className =
            'leader-hcp-cell';


          /*
            HCP SOURCE — OFFICIAL LEADERBOARD:
            Prefer an explicit handicap value if Cloudflare supplies one.
            If it does not, derive the handicap directly from the official
            leaderboard values: GROSS - NET. This keeps HCP correct even
            when the leaderboard response does not expose a separate HCP field.
          */
          const match =
            teams.find(
              team =>
                Number(
                  team.slot
                ) ===
                Number(
                  row.slot
                )
            );


          const directHandicapCandidates = [
            row.handicap,
            row.hcp,
            row.teamHandicap,
            row.teamHcp,
            match
              ? match.handicap
              : undefined,
            match
              ? match.hcp
              : undefined
          ];


          let handicapValue =
            directHandicapCandidates.find(
              value =>
                value !== undefined &&
                value !== null &&
                String(
                  value
                ).trim() !== ''
            );


          let handicapNumber =
            Number(
              handicapValue
            );


          if (
            !Number.isFinite(
              handicapNumber
            )
          ) {

            const grossNumber =
              Number(
                row.gross
              );

            const netNumber =
              Number(
                row.net
              );


            if (
              Number.isFinite(
                grossNumber
              ) &&
              Number.isFinite(
                netNumber
              )
            ) {

              handicapNumber =
                Math.abs(
                  grossNumber -
                  netNumber
                );

            }

          }


          hcpCell.textContent =
            Number.isFinite(
              handicapNumber
            )
              ? (
                  handicapNumber === 0
                    ? '-'
                    : String(
                        Math.abs(
                          handicapNumber
                        )
                      )
                )
              : '-';


          teamCell.append(
            teamAnchor
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';

          /*
            V15.13 — STATUS progress background.
            Fill left to right in 18 equal hole segments.
          */
          const throughProgress =
            Math.max(
              0,
              Math.min(
                18,
                Number(row.thru) || 0
              )
            );

          throughCell.style.setProperty(
            '--thru-progress',
            `${(throughProgress / 18) * 100}%`
          );


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          /* V15.13c — ROUND is three direct rows.
             No nested label wrapper: SCORE / THRU / HOLES COMPLETED. */
          const throughWord =
            document.createElement(
              'div'
            );


          throughWord.className =
            'leader-through-word';


          throughWord.textContent =
            'THRU';


          const throughValue =
            document.createElement(
              'div'
            );


          throughValue.className =
            'leader-through-value' +
            (
              Number(row.thru) > 0
                ? ' has-progress'
                : ''
            );


          throughValue.textContent =
            row.thru;


          throughCell.append(
            throughScore,
            throughWord,
            throughValue
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            placeCell,
            teamCell,
            hcpCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );

        }
      );

      sizeLeaderboardRows();
      requestAnimationFrame(() => {
        if (!els.leaderContent) return;
        const maxScroll = Math.max(0, els.leaderContent.scrollHeight - els.leaderContent.clientHeight);
        const rowHeight = parseFloat(
          getComputedStyle(els.leaderContent).getPropertyValue('--leader-row-height')
        ) || 0;
        let restoredScroll = Math.max(0, priorLeaderboardScroll);

        /* Tiny persisted offsets at the top can shave a few pixels off row 1.
           Treat anything within the top quarter-row as true top=0 while still
           preserving intentional deeper/partial-row scrolling. */
        if (rowHeight > 0 && restoredScroll < rowHeight * 0.25) {
          restoredScroll = 0;
        }

        els.leaderContent.scrollTop = Math.min(restoredScroll, maxScroll);
        saveLeaderboardSnapshotV53();
      });
      if (allowAutoScroll) {
        scheduleLeaderboardAutoScroll();
      } else {
        cancelLeaderboardAutoScroll();
      }

    }

    /* =========================================================
       V9.10 — LEADERBOARD ROW SIZING
       The existing fixed UI keeps its V9.9 dimensions. Because
       .leader-content flexes into only the remaining screen space,
       dividing its inner height by 8 produces exactly eight visible rows.
       ========================================================= */

    /* =========================================================
       V12 — RESPONSIVE LEADERBOARD TYPOGRAPHY
       All row typography is driven from the actual leaderboard row height.
       Width fitting is shared by column group, never row-by-row.
       ========================================================= */

    function splitLeaderboardTeamTwoLinesV55(text) {
      const value = String(text || '').trim();
      if (!value) return ['', ''];

      const midpoint = value.length / 2;
      const spaces = [];
      for (let i = 1; i < value.length - 1; i++) {
        if (value[i] === ' ') spaces.push(i);
      }

      let cut;
      if (spaces.length) {
        cut = spaces.reduce((best, index) =>
          Math.abs(index - midpoint) < Math.abs(best - midpoint) ? index : best
        , spaces[0]);
        return [value.slice(0, cut).trim(), value.slice(cut + 1).trim()];
      }

      cut = Math.max(1, Math.min(value.length - 1, Math.round(midpoint)));
      return [value.slice(0, cut), value.slice(cut)];
    }

    function splitLeaderboardTeamTwoLinesV58(text) {
      return splitLeaderboardTeamTwoLinesV55(text);
    }

    function measureTeamLineWidthV58(target, text, fontSize) {
      if (!target) return Infinity;

      if (!v5MeasureProbe) {
        v5MeasureProbe = document.createElement('span');
        v5MeasureProbe.setAttribute('aria-hidden', 'true');
        Object.assign(v5MeasureProbe.style, {
          position: 'fixed',
          left: '-10000px',
          top: '-10000px',
          visibility: 'hidden',
          pointerEvents: 'none',
          zIndex: '-1'
        });
        document.body.appendChild(v5MeasureProbe);
      }

      const computed = getComputedStyle(target);
      v5MeasureProbe.textContent = String(text || '');
      v5MeasureProbe.style.fontFamily = computed.fontFamily;
      v5MeasureProbe.style.fontWeight = computed.fontWeight;
      v5MeasureProbe.style.fontStyle = computed.fontStyle;
      v5MeasureProbe.style.letterSpacing = computed.letterSpacing;
      v5MeasureProbe.style.textTransform = computed.textTransform;
      v5MeasureProbe.style.whiteSpace = 'nowrap';
      v5MeasureProbe.style.width = 'auto';
      v5MeasureProbe.style.lineHeight = '1';
      v5MeasureProbe.style.fontSize = fontSize + 'px';
      return v5MeasureProbe.getBoundingClientRect().width;
    }

    function fitSingleLineTeamTextV58(container, textEl, fullName, targetSize, minSize, options = {}) {
      if (!container || !textEl) return minSize;

      const original = String(fullName || '').trim();
      textEl.dataset.fullTeamName = original;
      textEl.textContent = original;

      const horizontalPad = Number(options.horizontalPad || 0);
      const verticalPad = Number(options.verticalPad || 0);
      const availableWidth = Math.max(1, container.clientWidth - horizontalPad);
      const availableHeight = Math.max(1, container.clientHeight - verticalPad);
      const lineHeight = Number(options.lineHeight || 1);
      const minimum = Math.max(5, Number(minSize) || 8);
      const target = Math.max(minimum, Number(targetSize) || minimum);

      let size = fitTextToBoxV5(
        container,
        textEl,
        target,
        minimum,
        {
          horizontalPad,
          verticalPad,
          wrap: false,
          lineHeight,
          ignoreHeight: !!options.ignoreHeight
        }
      );

      const fullWidth = measureTeamLineWidthV58(textEl, original, size);
      const fullHeight = size * lineHeight;
      if (
        fullWidth <= availableWidth + 0.75 &&
        (options.ignoreHeight || fullHeight <= availableHeight + 0.75)
      ) {
        return { size, truncated: false };
      }

      /* Last fallback only: at the minimum size, keep the longest prefix that
         fits and place | immediately after the last visible non-space char. */
      size = minimum;
      textEl.style.setProperty('font-size', size + 'px', 'important');
      textEl.style.setProperty('line-height', String(lineHeight), 'important');
      textEl.style.setProperty('white-space', 'nowrap', 'important');
      textEl.style.setProperty('overflow', 'hidden', 'important');

      let chosen = '|';
      for (let count = original.length - 1; count >= 1; count--) {
        const prefix = original.slice(0, count).replace(/\s+$/, '');
        if (!prefix) continue;
        const candidate = prefix + '|';
        const width = measureTeamLineWidthV58(textEl, candidate, size);
        if (width <= availableWidth + 0.75) {
          chosen = candidate;
          break;
        }
      }

      textEl.textContent = chosen;
      return { size, truncated: chosen !== original };
    }

    function renderTwoLineTeamTextV58(textEl, line1, line2) {
      textEl.replaceChildren(
        document.createTextNode(line1),
        document.createElement('br'),
        document.createTextNode(line2)
      );
      textEl.classList.add('two-line');
    }

    function twoLineTeamFitsV58(textEl, value, fontSize, availableWidth, availableHeight) {
      const [line1, line2] = splitLeaderboardTeamTwoLinesV58(value);
      const width1 = measureTeamLineWidthV58(textEl, line1, fontSize);
      const width2 = measureTeamLineWidthV58(textEl, line2, fontSize);
      const height = fontSize * 1.02 * 2;
      return {
        fits: Math.max(width1, width2) <= availableWidth + 0.75 && height <= availableHeight + 0.75,
        line1,
        line2
      };
    }

    function fitTwoLineTeamTextV58(container, anchor, textEl, rowHeight, targetSize, minSize, horizontalPad) {
      if (!container || !textEl) return;

      const original = String(
        textEl.dataset.v58Name ||
        textEl.dataset.fullTeamName ||
        textEl.textContent || ''
      ).trim();
      textEl.dataset.v58Name = original;
      textEl.dataset.fullTeamName = original;
      textEl.classList.remove('two-line');
      textEl.textContent = original;
      textEl.style.removeProperty('font-size');

      if (anchor) {
        anchor.style.setProperty('width', 'auto', 'important');
        anchor.style.setProperty('max-width', '100%', 'important');
      }

      const availableWidth = Math.max(
        1,
        container.clientWidth - Math.max(0, Number(horizontalPad) || 0)
      );
      const availableTwoLineHeight = Math.max(1, rowHeight * 0.80);
      const minimum = Math.max(5, Number(minSize) || 8);
      const target = Math.max(minimum, Number(targetSize) || minimum);

      /* Target size, one line first. */
      textEl.style.setProperty('font-size', target + 'px', 'important');
      textEl.style.setProperty('line-height', '1.04', 'important');
      textEl.style.setProperty('white-space', 'nowrap', 'important');
      textEl.style.setProperty('overflow', 'visible', 'important');

      if (
        measureTeamLineWidthV58(textEl, original, target) <= availableWidth + 0.75 &&
        target * 1.04 <= availableTwoLineHeight + 0.75
      ) {
        return { size: target, truncated: false, lines: 1 };
      }

      /* First fallback: two lines at the SAME target size. */
      let two = twoLineTeamFitsV58(
        textEl,
        original,
        target,
        availableWidth,
        availableTwoLineHeight
      );
      renderTwoLineTeamTextV58(textEl, two.line1, two.line2);
      textEl.style.setProperty('font-size', target + 'px', 'important');
      textEl.style.setProperty('line-height', '1.02', 'important');
      textEl.style.setProperty('white-space', 'normal', 'important');
      textEl.style.setProperty('overflow', 'visible', 'important');

      if (two.fits) {
        return { size: target, truncated: false, lines: 2 };
      }

      /* Only now shrink the two-line block. */
      let size = target;
      while (size > minimum) {
        size = Math.max(minimum, size - 0.5);
        two = twoLineTeamFitsV58(
          textEl,
          original,
          size,
          availableWidth,
          availableTwoLineHeight
        );
        renderTwoLineTeamTextV58(textEl, two.line1, two.line2);
        textEl.style.setProperty('font-size', size + 'px', 'important');
        if (two.fits) {
          return { size, truncated: false, lines: 2 };
        }
      }

      /* Final fallback: only after two lines + minimum still cannot fit,
         truncate to the longest fitting prefix and add |. */
      for (let count = original.length - 1; count >= 1; count--) {
        const prefix = original.slice(0, count).replace(/\s+$/, '');
        if (!prefix) continue;
        const candidate = prefix + '|';
        const candidateFit = twoLineTeamFitsV58(
          textEl,
          candidate,
          minimum,
          availableWidth,
          availableTwoLineHeight
        );
        if (!candidateFit.fits) continue;

        renderTwoLineTeamTextV58(textEl, candidateFit.line1, candidateFit.line2);
        textEl.style.setProperty('font-size', minimum + 'px', 'important');
        textEl.style.setProperty('line-height', '1.02', 'important');
        return { size: minimum, truncated: true, lines: 2 };
      }

      textEl.textContent = '|';
      textEl.classList.remove('two-line');
      textEl.style.setProperty('font-size', minimum + 'px', 'important');
      return { size: minimum, truncated: true, lines: 1 };
    }

    function fitLeaderboardTeamV55(teamCell, teamAnchor, team, rowHeight) {
      if (!teamCell || !team) return;

      const targetSize = Math.min(36, rowHeight * 0.475);
      fitTwoLineTeamTextV58(
        teamCell,
        teamAnchor,
        team,
        rowHeight,
        targetSize,
        13,
        14
      );
    }

    function fitLeaderboardTypography() {
      const header = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-table-head')
        : null;
      const firstRow = els.leaderRows
        ? els.leaderRows.querySelector('.leader-row')
        : null;

      if (!header || !firstRow) return;

      const rowHeight = firstRow.getBoundingClientRect().height;
      const headerHeight = header.getBoundingClientRect().height;
      if (rowHeight <= 0 || headerHeight <= 0) return;

      Array.from(header.children).forEach(cell => {
        const target = cell.querySelector('span') || cell;
        fitTextToBoxV5(
          cell,
          target,
          headerHeight * 0.375,
          8,
          { horizontalPad: 6, verticalPad: 4 }
        );
      });

      els.leaderRows.querySelectorAll('.leader-row').forEach(row => {

           Minimums are only the final safeguard on extreme compression. */
        if (place) {

          fitTextToBoxV5(place, placeNumber || place, rowHeight * 0.34, 8, {
            horizontalPad: 6,

          fitTextToBoxV5(hcp, hcp, rowHeight * 0.24, 8, {
            horizontalPad: 4,
            verticalPad: 5
          });
        }

        fitLeaderboardTeamV55(teamCell, teamAnchor, team, rowHeight);

        if (total) {
          fitTextToBoxV5(total, total, rowHeight * 0.70, 11, {
            horizontalPad: 6,
            verticalPad: 4
          });

        if (score) {
          fitTextToBoxV5(score, score, rowHeight * 0.32, 8, {
            horizontalPad: 4,
            verticalPad: 1,

          });

            horizontalPad: 2,
            verticalPad: 0,
            wrap: false,
            lineHeight: 1
          });
        }

        if (thruValue) {
          fitTextToBoxV5(thruValue, thruValue, rowHeight * 0.32, 8, {

    function sizeLeaderboardRows() {
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;
      const header = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-table-head')
        : null;

      if (!screen || !header || !els.leaderContent) return;

      const geometry = applyV16ShellGeometry(els.leaderboardView);
      if (!geometry) return;

      const titleBar = els.leaderboardView.querySelector('.leader-title-bar');
      const title = els.leaderboardView.querySelector('.leader-title');
      if (titleBar && title) {
        fitTextToBoxV5(titleBar, title, titleBar.clientHeight * 0.55, 14, {
          horizontalPad: 10,
          verticalPad: 5,
          wrap: false,
          lineHeight: 1
        });
      }

      const headerRect = header.getBoundingClientRect();
      const contentRect = els.leaderContent.getBoundingClientRect();
      const tableBudget = contentRect.bottom - headerRect.top;
      if (!Number.isFinite(tableBudget) || tableBudget <= 0) return;

      const rowCount = Math.max(
        1,
        Math.min(8, els.leaderRows ? els.leaderRows.querySelectorAll('.leader-row').length : 1)
      );

      /* V16: the anchored shell defines the table rectangle first.
         HEADER = 0.85x and N visible team rows = N*x, N capped at 8. */
      const rowHeightInitial = Math.max(1, tableBudget / (rowCount + 0.85));
      const headerHeight = rowHeightInitial * 0.85;

      els.leaderboardView.style.setProperty('--v5-leader-head-h', headerHeight + 'px');
      els.leaderContent.style.setProperty('--leader-row-height', rowHeightInitial + 'px');
      els.leaderContent.style.setProperty('--v16-visible-row-count', String(rowCount));

      requestAnimationFrame(() => {
        /* V16.6: row height belongs to the visible leaderboard viewport,
           not to the full table. With 9+ teams the table is taller than the
           viewport by design; dividing total table height by 8 would inflate
           every row and destroy the proven <=8-team geometry. */
        const actualViewportHeight = els.leaderContent.clientHeight;
        const rowHeight = actualViewportHeight > 0
          ? actualViewportHeight / rowCount
          : rowHeightInitial;

        els.leaderContent.style.setProperty('--leader-row-height', rowHeight + 'px');

        rememberResponsiveGeometryV5({
          leaderHeadLive: headerHeight,
          leaderRowLive: rowHeight,
          leaderHeadComplete: headerHeight,
          leaderRowComplete: rowHeight,
          leaderHead: headerHeight,
          leaderRow: rowHeight
        });

        const current = els.leaderContent.scrollTop;
        if (rowHeight > 0 && current > 0) {
          const snapped = Math.round(current / rowHeight) * rowHeight;
          const maxScroll = Math.max(0, els.leaderContent.scrollHeight - els.leaderContent.clientHeight);
          els.leaderContent.scrollTop = Math.min(Math.max(0, snapped), maxScroll);
        }

        fitLeaderboardTypography();

        const footerButtons = els.leaderboardView.querySelectorAll('.leader-bottom button');
        footerButtons.forEach(button => {
          fitTextToBoxV5(button, button, button.clientHeight * 0.34, 11, {
            horizontalPad: 10,
            verticalPad: 5,
            wrap: false,
            lineHeight: 1
          });
        });

        if (screen.classList.contains('tournament-complete')) {
          positionCompletedFinalAction();
        }
      });
    }


    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);
        leaderboardAutoScrollTimer = null;
      }
    }

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          /* V15.12:
             Keep the initial visible leaderboard untouched when the
             authorized team is already on screen.

             For an authorized team below that initial view, position by
             current leaderboard place — never by hard-coded team number:
               • last place: 0.0 rows visible below
               • second-to-last: 1.0 row visible below
               • third-to-last: 1.5 rows visible below
               • fourth-to-last+: 2.5 rows visible below

             This preserves a partial-row cue when more teams remain below,
             while naturally tapering at the bottom of any leaderboard size. */
          const rowHeight =
            parseFloat(
              getComputedStyle(els.leaderContent)
                .getPropertyValue('--leader-row-height')
            ) || target.getBoundingClientRect().height;

          const targetIndex =
            Array.prototype.indexOf.call(
              els.leaderRows.children,
              target
            );

          if (targetIndex < 8) {
            return;
          }

          const totalRows =
            els.leaderRows.children.length;

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          const rowsBelow =
            totalRows - targetIndex - 1;

          let desiredRowsBelow;

          if (rowsBelow <= 0) {
            desiredRowsBelow = 0;
          } else if (rowsBelow === 1) {
            desiredRowsBelow = 1;
          } else if (rowsBelow === 2) {
            desiredRowsBelow = 1.5;
          } else {
            desiredRowsBelow = 2.5;
          }

          /*
            Eight rows are visible. To leave N rows beneath the authorized
            row, place it at visible index 7 - N.
          */
          const visibleTargetIndex =
            7 - desiredRowsBelow;

          const preferredScroll =
            Math.max(
              0,
              (targetIndex - visibleTargetIndex) *
              rowHeight
            );

          const desired =
            Math.min(
              preferredScroll,
              maxScroll
            );

          els.leaderContent.scrollTo({
            top: desired,
            behavior: 'smooth'
          });
        },
        1500
      );
    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );

    }

        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }

    function fitQrWelcomeTeamV1631() {
      const box = document.getElementById('qrWelcomeTeamV1631');
      const span = document.getElementById('qrWelcomeTeamTextV1631');
      if (!box || !span || !span.textContent) return;

      /* Width is the governing dimension. Measure the actual rendered name and
         choose whatever font height is required for the text itself to occupy
         80% of the viewport width on one line. */
      const targetWidth = Math.max(1, window.innerWidth * 0.80);
      span.style.fontSize = '100px';
      const measured = span.getBoundingClientRect().width;
      if (!(measured > 0)) return;

      let size = 100 * targetWidth / measured;
      size = Math.max(12, size);
      span.style.fontSize = size.toFixed(2) + 'px';

      /* One correction pass accounts for font rounding / letter spacing. */
      const corrected = span.getBoundingClientRect().width;
      if (corrected > 0) {
        size *= targetWidth / corrected;
        span.style.fontSize = Math.max(12, size).toFixed(2) + 'px';
      }
    }

          overlay.classList.add('show-team');
          window.setTimeout(() => {
            if (window.__sshcpIncomingQrWelcomeV1631) overlay.classList.add('show-actions');
          }, 500);
        };

        /* Fit before the fade whenever the real font is available so the team
           name does not visibly resize after it appears. */
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(revealTeam).catch(revealTeam);
        } else {
          revealTeam();
        }
      }, wait);
    }

    window.addEventListener('resize', () => {
      if (window.__sshcpIncomingQrWelcomeV1631) {
        requestAnimationFrame(fitQrWelcomeTeamV1631);
      }
    });

    async function initialize() {


    window.addEventListener(
      'resize',
      () => {
        if (
          currentView === 'leaderboard' &&
          tournamentIsComplete(lastLeaderboardRows)
        ) {
          requestAnimationFrame(
            positionCompletedFinalAction
          );
        }
      }
    );


    window.addEventListener(
      'resize',
      () => {
        if (currentView === 'leaderboard') {
          sizeLeaderboardRows();
        }

        if (currentView === 'scorecard') {
          requestAnimationFrame(
            fitScorecardBodyTypography
          );
          requestAnimationFrame(
            fitScoreTeamSelectName
          );
        }
      }
    );


      const rememberedView =
        getRememberedView();
      const restoreTeamsPopupV1626 = teamsPopupWasOpenOnRefreshV1626();
      syncHomeTournamentCompleteV1630(
        sessionStorage.getItem('sshcpTournamentComplete') === '1'
      );

      if (
        rememberedView ===
        'scorecard'
      ) {
        hydrateScorecardSnapshotV53();
      }
      else if (
        rememberedView ===
        'leaderboard'
      ) {
        hydrateLeaderboardSnapshotV53();
      }

      setupQrWelcomeV1631();
      await initializeQrAuthorization();
      revealQrWelcomeAfterAuthV1631();
      if (isTeamQr() && getQrTeam()) rememberSelectedTeam(getQrTeam());
      syncTestAuthorizationToggle();
      syncTeamQrLockedUi();
      updateHomeScorecardAccess();

      /* V16.26 — browser refresh while TEAMS is open returns directly to the
         TEAMS workspace (and restores its table scroll position) instead of
         falling through to HOME. */
      if (restoreTeamsPopupV1626) {
        showTestLog();
        openTeamsPopup({ restoreAfterRefresh: true });
        return;
      }

      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }



    const refitCompletedLeaderboard = () => {
      if (
        currentView === 'leaderboard' &&
        tournamentIsComplete(lastLeaderboardRows)
      ) {
        requestAnimationFrame(() => {
          sizeLeaderboardRows();
          positionCompletedFinalAction();
        });
      }
    };

    window.addEventListener(
      'resize',
      refitCompletedLeaderboard
    );

    window.addEventListener(
      'orientationchange',
      () => {
        window.setTimeout(
          refitCompletedLeaderboard,
          80
        );
      }
    );


    let v5ResizeFrame = 0;

    function refitVisibleGeometryV5() {
      cancelAnimationFrame(
        v5ResizeFrame
      );

      v5ResizeFrame =
        requestAnimationFrame(() => {
          if (
            currentView === 'home'
          ) {
            fitHomeScorecardTeamNameV55();
          }

          if (
            currentView === 'scorecard'
          ) {
            sizeScorecardV5();
            fitScoreTeamSelectName();
          }

          if (
            currentView === 'leaderboard'
          ) {
            sizeLeaderboardRows();
          }

          if (
            currentView === 'testlog'
          ) {
            fitTestPageButtonText();
          }

          if (
            els.modalOverlay.classList.contains(
              'tournament-summary'
            )
          ) {
            fitTournamentSummaryRemaining();
          }
        });
    }

    const v5GeometryObserver =
      new ResizeObserver(
        refitVisibleGeometryV5
      );

    [
      document.querySelector(
        '.scorecard-screen'
      ),
      document.querySelector(
        '.leaderboard-screen'
      ),
      els.modalBox
    ]
      .filter(Boolean)
      .forEach(element => {
        v5GeometryObserver.observe(
          element
        );
      });

    window.addEventListener(
      'resize',
      refitVisibleGeometryV5,
      {
        passive: true
      }
    );

    if (currentView === 'scorecard') {
      sizeScorecardV5();
    } else if (currentView === 'leaderboard') {
      sizeLeaderboardRows();
    }

    /* V5.8 Oswald determinism: initial fallback-font measurements are allowed
       for instant paint, but every width-sensitive element is remeasured once
       the actual webfont is ready. This keeps S25/iPad fitting consistent. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        requestAnimationFrame(() => {
          fitHomeScorecardTeamNameV55();
          fitScoreTeamSelectName();
          fitHomeTeamOptionsV58();
          fitScoreTeamOptionsV58();
          if (currentView === 'scorecard') sizeScorecardV5();
          if (currentView === 'leaderboard') sizeLeaderboardRows();
          if (currentView === 'testlog') fitTestPageButtonText();
          if (els.modalOverlay.classList.contains('authorization')) {
            fitAuthorizationTeamNameV58();
          }
          if (els.modalOverlay.classList.contains('tournament-summary')) {
            fitTournamentSummaryRemaining();
          }
        });
      }).catch(() => {});
    }

    initialize()
      .catch(error => {
        console.error('SSHCP initialization failed:', error);
      })
      .finally(() => {
        document.documentElement.classList.remove(
          'sshcp-pre-scorecard',
          'sshcp-pre-leaderboard',
          'sshcp-pre-complete'
        );
      });

    window.addEventListener('resize', () => {
      if (els.modalOverlay.classList.contains('tournament-summary')) {
        requestAnimationFrame(fitTournamentSummaryRemaining);
      }
    });

</script>

</body>
</html>
