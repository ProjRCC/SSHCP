          '<div class="tiebreak-explanation">All configured Handicap Holes were used and the tie still remains.</div>';
      } else {
        const tiedNet = formatGolfScore(resolution.tied[0].net);
        const holeLabel = ordinalHandicapHole(resolution.decidingIndex);
        const actualHole = actualTiebreakHole(
          resolution.winner,
          resolution.decidingIndex
        );
        const actualHoleText = actualHole
          ? '<span class="tiebreak-hole-nowrap">(Hole&nbsp;' + escapeHtml(actualHole) + ')</span>'
          : '';
        const priorCount = resolution.decidingIndex;
        const priorText = priorCount === 0 ? '' :
          (priorCount === 1 ? 'They remained tied on the 1st Handicap Hole.<br><br>' :
          'They remained tied through the first ' + priorCount + ' Handicap Holes.<br><br>');

        const losingScores = (resolution.decidingContenders || resolution.tied)
          .filter(row => row !== resolution.winner)
          .map(row => tiebreakValue(row, resolution.decidingIndex))
          .filter(score => Number.isFinite(score));
        const nextBest = losingScores.length ? Math.min(...losingScores) : null;
        const scoreText = Number.isFinite(nextBest)
          ? ', ' + resolution.winningScore + ' to ' + nextBest
          : '';

        els.modalBody.innerHTML =
          '<div class="tiebreak-winner">' +
          escapeHtml(displayTeamName(resolution.winner.team || '').toUpperCase()) +
          ' WINS</div>' +
          '<div class="tiebreak-explanation">' +
          joinTeamNamesHtml(resolution.tied) +
          ' finished tied at ' + escapeHtml(tiedNet) + '.<br><br>' +
          priorText +
          '<strong>' + escapeHtml(displayTeamName(resolution.winner.team || '')) + '</strong>' +
          ' won on the ' + escapeHtml(holeLabel) +
          (actualHoleText ? ' ' + actualHoleText : '') +
          escapeHtml(scoreText) + '.</div>';
      }

      const back = makeModalButton('BACK', '', closeModal);
      const summary = makeModalButton(
        'SCRAMBLE SUMMARY',
        'tournament-summary-button',
        showTournamentSummary
      );
      els.modalActions.className = 'modal-actions';
      els.modalActions.replaceChildren(back, summary);
      els.modalOverlay.classList.add('open');
      requestAnimationFrame(() => {
        fitTextToBoxV5(summary, summary, summary.clientHeight * 0.50, 14, {
          horizontalPad: 12,
          verticalPad: 6
        });
      });
    }

    function getSummaryHandicap(row) {
      const match = teams.find(team => Number(team.slot) === Number(row.slot));
      const candidates = [
        row.handicap,
        row.hcp,
        row.teamHandicap,
        row.teamHcp,
        match ? match.handicap : undefined,
        match ? match.hcp : undefined
      ];
      const direct = candidates.find(value =>
        value !== undefined && value !== null && String(value).trim() !== ''
      );
      let hcp = Number(direct);
      if (!Number.isFinite(hcp)) {
        const gross = Number(row.gross);
        const net = Number(row.net);
        if (Number.isFinite(gross) && Number.isFinite(net)) {
          hcp = Math.abs(gross - net);
        }
      }
      return Number.isFinite(hcp) ? Math.abs(hcp) : null;
    }

    function buildTournamentPodium(rows) {
      const source = Array.isArray(rows)
        ? rows.filter(row => row && Number.isFinite(Number(row.net)))
        : [];

      /* Base tournament order is net score, then stable team slot order.
         Slot order is the clean fallback for any places we do NOT explicitly
         resolve by tiebreak. */
      const base = [...source].sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      const annotations = new Map();
      const podiumRows = [];
      const remaining = [...base];

      /* Resolve ONLY podium places. For each place, find everyone tied on the
         best remaining NET score, resolve that tie through handicap holes,
         remove the winner, then repeat for the next podium place. */
      for (let place = 1; place <= 3 && remaining.length; place++) {
        const bestNet = Number(remaining[0].net);
        const tiedGroup = remaining.filter(
          row => Number(row.net) === bestNet
        );

        let winner = tiedGroup[0];
        let resolution = null;

        if (tiedGroup.length > 1) {
          resolution = resolveTieContenders(tiedGroup);

          if (resolution && resolution.winner) {
            winner = resolution.winner;
          }
        }

        podiumRows.push(winner);

        const removeIndex = remaining.indexOf(winner);
        if (removeIndex >= 0) remaining.splice(removeIndex, 1);

        if (
          resolution &&
          resolution.winner &&
          resolution.decidingIndex !== null
        ) {
          if (place === 1) {
            const actualHole = actualTiebreakHole(
              winner,
              resolution.decidingIndex
            );

            annotations.set(winner, {
              marks: '*',
              note:
                '* Won on ' +
                ordinalHandicapHole(resolution.decidingIndex) +
                (actualHole ? ' (Hole\u00A0' + actualHole + ')' : '')
            });
          }
          else {
            annotations.set(winner, {
              marks: '**',
              note:
                '** Won ' +
                place +
                ordinalSuffix(place) +
                '-place tiebreak on ' +
                ordinalHandicapHole(resolution.decidingIndex)
            });
          }
        }
      }

      /* Everything after 3rd is intentionally NOT further tiebroken.
         Preserve clean NET grouping and team/slot order inside each tie. */
      remaining.sort((a, b) => {
        const aNet = Number(a.net);
        const bNet = Number(b.net);

        if (aNet !== bNet) return aNet - bNet;

        const aSlot = Number(a.slot);
        const bSlot = Number(b.slot);

        if (Number.isFinite(aSlot) && Number.isFinite(bSlot)) {
          return aSlot - bSlot;
        }

        return String(a.team || '').localeCompare(String(b.team || ''));
      });

      return {
        ordered: [...podiumRows, ...remaining],
        annotations,
        firstTie: firstPlaceTiedRows(source)
      };
    }

    function ordinalSuffix(number) {
      if (number === 1) return 'st';
      if (number === 2) return 'nd';
      if (number === 3) return 'rd';
      return 'th';
    }


    function fitTournamentSummaryRemaining() {
      if (!els.modalOverlay.classList.contains('tournament-summary')) return;
      if (!els.modalBox || !els.modalBody) return;

      const body = els.modalBody;
      const topGrid = body.querySelector('.tournament-summary-grid');
      const lower = body.querySelector('.tournament-summary-remaining');
      if (!topGrid || !lower) return;

      const lowerRows = Array.from(lower.querySelectorAll('.tournament-summary-remaining-row'));
      document.documentElement.style.setProperty('--v5-summary-lower-count', String(Math.max(1, lowerRows.length)));

      const notes = Array.from(body.querySelectorAll('.tournament-summary-note'));

      /*
        Notes are secondary, but they must remain readable. Their grid row
        is AUTO-sized so wrapping consumes a little table height instead of
        forcing the note font into unreadable territory.
      */

      /* Title/subtitle are viewer chrome; fit but never drive the table. */
      fitTextToBoxV5(els.modalTitle, els.modalTitle, Math.min(52, els.modalBox.clientWidth * 0.115), 20, {
        horizontalPad: 12,
        verticalPad: 2,
        wrap: true,
        lineHeight: 0.92
      });

      const subtitle = body.querySelector('.tournament-summary-subtitle');
      if (subtitle) {
        fitTextToBoxV5(subtitle, subtitle, Math.min(34, subtitle.clientHeight * 0.72), 18, {
          horizontalPad: 8,
          verticalPad: 2
        });
      }

      const header = topGrid.querySelector('.tournament-summary-row.header');
      if (header) {
        Array.from(header.children).forEach((cell, index) => {
          const mayWrap = index === 2 || index === 3;
          fitTextToBoxV5(cell, cell, cell.clientHeight * 0.50, 10, {
            horizontalPad: 6,
            verticalPad: 4,
            wrap: mayWrap,
            lineHeight: mayWrap ? 0.94 : 1
          });
        });
      }

      [1,2,3].forEach((place, index) => {
        const row = topGrid.querySelector('.tournament-summary-row.place-' + place);
        if (!row) return;
        const placeCell = row.querySelector('.tournament-summary-place');
        const team = row.querySelector('.tournament-summary-team');
        const teamText = row.querySelector('.summary-team-text') || team;
        const strokes = row.querySelector('.tournament-summary-strokes');
        const strokesValue = row.querySelector('.top-three-strokes-value');
        const strokesHcp = row.querySelector('.top-three-strokes-hcp');
        const net = row.querySelector('.tournament-summary-net');

        if (placeCell) fitTextToBoxV5(placeCell, placeCell, row.clientHeight * 0.34, 11, {horizontalPad:4,verticalPad:5});
        if (team && teamText) fitTextToBoxV5(team, teamText, Math.min(32, row.clientHeight * ([0.47,0.43,0.40][index])), 13, {horizontalPad:10,verticalPad:5});
        if (strokes && strokesValue) {
          fitTextToBoxV5(strokes, strokesValue, Math.min(30, row.clientHeight * 0.40), 12, {horizontalPad:2,verticalPad:1});
        }
        if (strokes && strokesHcp) {
          fitTextToBoxV5(strokes, strokesHcp, Math.min(24, row.clientHeight * 0.30), 10, {horizontalPad:2,verticalPad:1});
        }
        if (net) fitTextToBoxV5(net, net, Math.min(46, row.clientHeight * ([0.60,0.55,0.50][index])), 15, {horizontalPad:6,verticalPad:5});
      });

      const lowerPlace = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.place'));
      const lowerTeam = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.team'));
      const lowerStrokes = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-strokes'));
      const lowerNet = Array.from(lower.querySelectorAll('.tournament-summary-remaining-cell.net-score'));

      const fitUniform = (cells, ratio, minimum, pad=6) => {
        let chosen = Infinity;
        cells.forEach(cell => {
          chosen = Math.min(chosen, fitTextToBoxV5(cell, cell, cell.clientHeight * ratio, minimum, {
            horizontalPad: pad,
            verticalPad: 5
          }));
        });
        if (Number.isFinite(chosen)) {
          cells.forEach(cell => cell.style.setProperty('font-size', chosen + 'px', 'important'));
        }
        return chosen;
      };

      fitUniform(lowerPlace, 0.34, 11, 4);
      fitUniform(lowerTeam, 0.40, 13, 10);
      fitUniform(lowerNet, 0.48, 15, 6);

      /* Lower standings keep the approved V5.2 NET STROKES sizing.
         Only the top three use the 40% / 30% two-line split above. */
      fitUniform(lowerStrokes, 0.32, 11, 8);

      /* V5.3: fixed full-S25 explanation size across phone/tablet heights. */
      document.documentElement.style.setProperty('--v5-summary-note-font', '13px');
    }


    function showTournamentSummary() {
      if (!tournamentIsComplete(lastLeaderboardRows)) {
        closeModal();
        return;
      }

      const podium = buildTournamentPodium(lastLeaderboardRows);
      const rows = podium.ordered.slice(0, 10);

      function summaryPlaceLabel(rowIndex) {
        if (rowIndex < 3) return String(rowIndex + 1);

        const row = rows[rowIndex];
        if (!row) return '';

        const currentNet = Number(row.net);
        const priorSameNet = rows
          .slice(3, rowIndex)
          .some(item => Number(item.net) === currentNet);

        const laterSameNet = rows
          .slice(rowIndex + 1)
          .some(item => Number(item.net) === currentNet);

        /* Podium has already been explicitly resolved. The first unresolved
           row starts at place 4. Any tied NET group from there is shown as
           T4 / T5 / etc rather than pretending additional places were won. */
        let unresolvedPlace = 4;
        for (let i = 3; i < rowIndex; i++) {
          if (Number(rows[i].net) < currentNet) unresolvedPlace++;
        }

        return (priorSameNet || laterSameNet)
          ? 'T' + unresolvedPlace
          : String(unresolvedPlace);
      }

      closeModal();
      els.modalOverlay.classList.add('tournament-summary');
      els.modalTitle.textContent = 'SCRAMBLE SUMMARY';
      els.modalTitle.classList.remove('testing');
      els.modalInput.style.display = 'none';

      let html =
        '<div class="tournament-summary-subtitle">' + (lastLeaderboardRows.length >= 10 ? 'TOP 10' : 'RESULTS') + '</div>' +
        '<div class="tournament-summary-grid">' +
        '<div class="tournament-summary-row header">' +
        '<div>#</div><div>TEAM</div><div>NET STROKES</div><div>NET +/-</div>' +
        '</div>';

      rows.slice(0, 3).forEach((row, index) => {
        const annotation = podium.annotations.get(row);
        const marks = annotation ? annotation.marks : '';
        const hcp = getSummaryHandicap(row);
        const strokesValue = String(row.totalStrokes ?? '');
        const hcpValue = hcp === null ? '' : '(' + hcp + 'HCP)';

        html +=
          '<div class="tournament-summary-row place-' + (index + 1) + '">' +
          '<div class="tournament-summary-place">' + escapeHtml(String(index + 1)) + '</div>' +
          '<div class="tournament-summary-team"><span class="summary-team-anchor">' +
          '<span class="summary-team-text">' + escapeHtml(displayTeamName(row.team || '')) + '</span>' +
          (marks ? '<span class="summary-team-marker" aria-hidden="true">' + escapeHtml(marks) + '</span>' : '') +
          '</span></div>' +
          '<div class="tournament-summary-strokes top-three-strokes">' +
          '<span class="top-three-strokes-value">' + escapeHtml(strokesValue) + '</span>' +
          (hcpValue ? '<span class="top-three-strokes-hcp">' + escapeHtml(hcpValue) + '</span>' : '') +
          '</div>' +
          '<div class="tournament-summary-net ' + scoreClass(row.net) + '">' +
          escapeHtml(formatGolfScore(row.net)) + '</div>' +
          '</div>';
      });

      html += '</div>';

      const notes = [];
      rows.slice(0, 3).forEach(row => {
        const annotation = podium.annotations.get(row);
        if (annotation && annotation.note && !notes.includes(annotation.note)) {
          notes.push(annotation.note);
        }
      });
      if (notes.length) {
        html += '<div class="tournament-summary-notes">' +
          notes.map(note =>
            '<div class="tournament-summary-note">' + escapeHtml(note) + '</div>'
          ).join('') +
          '</div>';
      }

      if (rows.length > 3) {
        html += '<div class="tournament-summary-remaining">';
        rows.slice(3).forEach((row, index) => {
          const rowIndex = index + 3;
          const place = summaryPlaceLabel(rowIndex);
          const hcp = getSummaryHandicap(row);
          const strokesText =
            String(row.totalStrokes ?? '') +
            (hcp === null ? '' : ' (HCP ' + hcp + ')');
          html +=
            '<div class="tournament-summary-remaining-row">' +
            '<div class="tournament-summary-remaining-cell place">' + escapeHtml(String(place)) + '</div>' +
            '<div class="tournament-summary-remaining-cell team">' + escapeHtml(displayTeamName(row.team || '')) + '</div>' +
            '<div class="tournament-summary-remaining-cell net-strokes">' + escapeHtml(strokesText) + '</div>' +
            '<div class="tournament-summary-remaining-cell net-score ' + scoreClass(row.net) + '">' +
            escapeHtml(formatGolfScore(row.net)) + '</div>' +
            '</div>';
        });
        html += '</div>';
      }

      els.modalBody.innerHTML = html;
      const back = makeModalButton('BACK', '', closeModal);
      els.modalActions.className = 'modal-actions single';
      els.modalActions.replaceChildren(back);
      els.modalOverlay.classList.add('open');

      if (tournamentSummaryResizeObserver) {
        tournamentSummaryResizeObserver.disconnect();
      }

      tournamentSummaryResizeObserver =
        new ResizeObserver(() => {
          requestAnimationFrame(
            fitTournamentSummaryRemaining
          );
        });

      tournamentSummaryResizeObserver.observe(els.modalBox);

      requestAnimationFrame(fitTournamentSummaryRemaining);
    }

    function handleLeaderboardFinalAction() {
      if (!tournamentIsComplete(lastLeaderboardRows)) return;
      const tied = firstPlaceTiedRows(lastLeaderboardRows);
      if (tied.length >= 2 && !hasViewedTournamentTieBreak()) {
        showTieBreakResult();
        return;
      }
      showTournamentSummary();
    }

    /* =========================================================
       LEADERBOARD RENDER
       ========================================================= */


    function renderLeaderboard(
      rows,
      allowAutoScroll = true
    ) {

      const priorLeaderboardScroll = els.leaderContent
        ? els.leaderContent.scrollTop
        : 0;

      /* SSHCP V5.2 — Once the tournament is complete, the normal leaderboard
         keeps the existing resolved podium ordering. Scramble Summary uses
         that same top-three logic, but does not resolve places 4 and below.
         A first-place tie still remains unrevealed until BREAK TIE is viewed. */
      if (tournamentIsComplete(rows)) {
        const firstTie = firstPlaceTiedRows(rows);
        const mayShowResolvedPodium =
          firstTie.length < 2 || hasViewedTournamentTieBreak();

        if (mayShowResolvedPodium) {
          const podium = buildTournamentPodium(rows);
          const podiumOrder = new Map(
            podium.ordered.map((row, index) => [Number(row.slot), index])
          );

          rows = [...rows].sort((a, b) => {
            const aNet = Number(a.net);
            const bNet = Number(b.net);

            if (Number.isFinite(aNet) && Number.isFinite(bNet) && aNet !== bNet) {
              return aNet - bNet;
            }

            const aOrder = podiumOrder.get(Number(a.slot));
            const bOrder = podiumOrder.get(Number(b.slot));

            if (Number.isFinite(aOrder) && Number.isFinite(bOrder)) {
              return aOrder - bOrder;
            }
            return 0;
          });
        }
      }

      els.leaderRows.innerHTML =
        '';

      if (els.leaderContent) {
        els.leaderContent.classList.toggle(
          'short-leaderboard',
          Array.isArray(rows) && rows.length < 8
        );
      }


      let previousNet = null;
      let previousPlace = 0;

      const authorizedTeamName =
        normalizeName(
          getAuthorizedTeam() || ''
        );

      rows.forEach(
        (row, index) => {

          const netKey = Number(row.net);
          const samePlace = index > 0 && Number.isFinite(netKey) && Number.isFinite(previousNet) && netKey === previousNet;
          const place = samePlace ? previousPlace : index + 1;
          previousNet = netKey;
          previousPlace = place;

          const line =
            document.createElement(
              'div'
            );


          line.className =
            'leader-row';
          line.dataset.team = normalizeName(row.team || '');

          const placeCell = document.createElement('div');
          placeCell.className = 'leader-place-cell';
          placeCell.textContent = String(place);

          const teamCell =
            document.createElement(
              'div'
            );


          teamCell.className =
            'leader-team-cell';

          if (
            authorizedTeamName &&
            line.dataset.team === authorizedTeamName
          ) {
            teamCell.classList.add(
              'authorized-team-cell'
            );
          }


          const teamName =
            document.createElement(
              'div'
            );


          teamName.className =
            'leader-team-name';


          teamName.textContent = displayTeamName(row.team || '');

          const teamAnchor = document.createElement('span');
          teamAnchor.className = 'leader-team-anchor';
          teamAnchor.appendChild(teamName);

          if (tournamentIsComplete(rows) && hasViewedTournamentTieBreak()) {
            const podiumForMarkers = buildTournamentPodium(rows);
            const annotation = podiumForMarkers.annotations.get(row);
            if (annotation && annotation.marks) {
              const marker = document.createElement('span');
              marker.className = 'leader-team-marker';
              marker.setAttribute('aria-hidden', 'true');
              marker.textContent = annotation.marks;
              teamAnchor.appendChild(marker);
            }
          }


          const hcpCell =
            document.createElement(
              'div'
            );


          hcpCell.className =
            'leader-hcp-cell';


          /*
            HCP SOURCE — OFFICIAL LEADERBOARD:
            Prefer an explicit handicap value if Cloudflare supplies one.
            If it does not, derive the handicap directly from the official
            leaderboard values: GROSS - NET. This keeps HCP correct even
            when the leaderboard response does not expose a separate HCP field.
          */
          const match =
            teams.find(
              team =>
                Number(
                  team.slot
                ) ===
                Number(
                  row.slot
                )
            );


          const directHandicapCandidates = [
            row.handicap,
            row.hcp,
            row.teamHandicap,
            row.teamHcp,
            match
              ? match.handicap
              : undefined,
            match
              ? match.hcp
              : undefined
          ];


          let handicapValue =
            directHandicapCandidates.find(
              value =>
                value !== undefined &&
                value !== null &&
                String(
                  value
                ).trim() !== ''
            );


          let handicapNumber =
            Number(
              handicapValue
            );


          if (
            !Number.isFinite(
              handicapNumber
            )
          ) {

            const grossNumber =
              Number(
                row.gross
              );

            const netNumber =
              Number(
                row.net
              );


            if (
              Number.isFinite(
                grossNumber
              ) &&
              Number.isFinite(
                netNumber
              )
            ) {

              handicapNumber =
                Math.abs(
                  grossNumber -
                  netNumber
                );

            }

          }


          hcpCell.textContent =
            Number.isFinite(
              handicapNumber
            )
              ? (
                  handicapNumber === 0
                    ? '-'
                    : String(
                        Math.abs(
                          handicapNumber
                        )
                      )
                )
              : '-';


          teamCell.append(
            teamAnchor
          );


          const throughCell =
            document.createElement(
              'div'
            );


          throughCell.className =
            'leader-through-cell';

          /*
            V15.13 — STATUS progress background.
            Fill left to right in 18 equal hole segments.
          */
          const throughProgress =
            Math.max(
              0,
              Math.min(
                18,
                Number(row.thru) || 0
              )
            );

          throughCell.style.setProperty(
            '--thru-progress',
            `${(throughProgress / 18) * 100}%`
          );


          const throughScore =
            document.createElement(
              'div'
            );


          throughScore.className =
            'leader-through-score ' +
            scoreClass(
              row.gross
            );


          throughScore.textContent =
            formatGolfScore(
              row.gross
            );


          const throughLabel =
            document.createElement(
              'div'
            );


          throughLabel.className =
            'leader-through-label';


          const throughWord =
            document.createElement(
              'span'
            );


          throughWord.className =
            'leader-through-word';


          throughWord.textContent =
            'H';


          const throughValue =
            document.createElement(
              'span'
            );


          throughValue.className =
            'leader-through-value' +
            (
              Number(row.thru) > 0
                ? ' has-progress'
                : ''
            );


          throughValue.textContent =
            row.thru;


          throughLabel.append(
            throughWord,
            throughValue
          );


          throughCell.append(
            throughScore,
            throughLabel
          );


          const total =
            document.createElement(
              'div'
            );


          total.className =
            'leader-total ' +
            scoreClass(
              row.net
            );


          total.textContent =
            formatGolfScore(
              row.net
            );


          line.append(
            placeCell,
            teamCell,
            hcpCell,
            throughCell,
            total
          );


          els.leaderRows.appendChild(
            line
          );

        }
      );

      sizeLeaderboardRows();
      requestAnimationFrame(() => {
        if (!els.leaderContent) return;
        const maxScroll = Math.max(0, els.leaderContent.scrollHeight - els.leaderContent.clientHeight);
        els.leaderContent.scrollTop = Math.min(Math.max(0, priorLeaderboardScroll), maxScroll);
        saveLeaderboardSnapshotV53();
      });
      if (allowAutoScroll) {
        scheduleLeaderboardAutoScroll();
      } else {
        cancelLeaderboardAutoScroll();
      }

    }

    /* =========================================================
       V9.10 — LEADERBOARD ROW SIZING
       The existing fixed UI keeps its V9.9 dimensions. Because
       .leader-content flexes into only the remaining screen space,
       dividing its inner height by 8 produces exactly eight visible rows.
       ========================================================= */

    /* =========================================================
       V12 — RESPONSIVE LEADERBOARD TYPOGRAPHY
       All row typography is driven from the actual leaderboard row height.
       Width fitting is shared by column group, never row-by-row.
       ========================================================= */

    function fitLeaderboardTypography() {
      const header = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-table-head')
        : null;
      const firstRow = els.leaderRows
        ? els.leaderRows.querySelector('.leader-row')
        : null;

      if (!header || !firstRow) return;

      const rowHeight = firstRow.getBoundingClientRect().height;
      const headerHeight = header.getBoundingClientRect().height;
      if (rowHeight <= 0 || headerHeight <= 0) return;

      Array.from(header.children).forEach(cell => {
        const target = cell.querySelector('span') || cell;
        fitTextToBoxV5(
          cell,
          target,
          Math.min(28, headerHeight * 0.375),
          10,
          { horizontalPad: 6, verticalPad: 4 }
        );
      });

      els.leaderRows.querySelectorAll('.leader-row').forEach(row => {
        const place = row.querySelector('.leader-place-cell');
        const teamCell = row.querySelector('.leader-team-cell');
        const teamAnchor = row.querySelector('.leader-team-anchor');
        const team = row.querySelector('.leader-team-name');
        const hcp = row.querySelector('.leader-hcp-cell');
        const score = row.querySelector('.leader-through-score');
        const statusLabel = row.querySelector('.leader-through-label');
        const total = row.querySelector('.leader-total');

        if (place) {
          fitTextToBoxV5(place, place, Math.min(24, rowHeight * 0.34), 13, {
            horizontalPad: 6,
            verticalPad: 6
          });
        }

        if (hcp) {
          fitTextToBoxV5(hcp, hcp, Math.min(18, rowHeight * 0.24), 11, {
            horizontalPad: 4,
            verticalPad: 6
          });
        }

        /* V5.4 TEAM rule: one line only. Start at 50% of row height and
           shrink ONLY this team's text until the actual cell width fits.
           A slightly relaxed line-height preserves descenders (g/y/p/q/j). */
        if (teamCell && team) {
          team.classList.remove('two-line');
          if (teamAnchor) {
            teamAnchor.style.setProperty('width', 'auto', 'important');
            teamAnchor.style.setProperty('max-width', '100%', 'important');
          }

          fitTextToBoxV5(
            teamCell,
            team,
            Math.min(36, rowHeight * 0.50),
            8,
            {
              horizontalPad: 14,
              verticalPad: rowHeight * 0.20,
              wrap: false,
              lineHeight: 1.10
            }
          );
        }

        if (total) {
          fitTextToBoxV5(total, total, Math.min(48, rowHeight * 0.70), 17, {
            horizontalPad: 6,
            verticalPad: 4
          });
        }

        /* V5.4 STATUS: compact SCORE / divider / H18 block. The entire
           group stays centered with explicit top/bottom breathing room. */
        if (score) {
          fitTextToBoxV5(score, score, Math.min(34, rowHeight * 0.30), 11, {
            horizontalPad: 4,
            verticalPad: 1,
            lineHeight: 0.92
          });
        }

        if (statusLabel) {
          fitTextToBoxV5(
            statusLabel,
            statusLabel,
            Math.min(34, rowHeight * 0.30),
            11,
            {
              horizontalPad: 4,
              verticalPad: 1,
              wrap: false,
              lineHeight: 0.92
            }
          );
        }
      });
    }


    function sizeLeaderboardRows() {
      const screen = els.leaderboardView
        ? els.leaderboardView.querySelector('.leaderboard-screen')
        : null;
      const top = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-top')
        : null;
      const header = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-table-head')
        : null;
      const finalSlot = els.leaderFinalActionButton
        ? els.leaderFinalActionButton.closest('.leader-final-slot')
        : null;
      const updateNote = els.leaderUpdateNote;
      const bottom = els.leaderboardView
        ? els.leaderboardView.querySelector('.leader-bottom')
        : null;

      if (!screen || !top || !header || !bottom || !els.leaderContent) return;

      const screenHeight = screen.clientHeight;
      const topHeight = top.getBoundingClientRect().height;
      const bottomHeight = bottom.getBoundingClientRect().height;
      const finalHeight = finalSlot && getComputedStyle(finalSlot).display !== 'none'
        ? finalSlot.getBoundingClientRect().height
        : 0;
      const noteHeight = updateNote && getComputedStyle(updateNote).display !== 'none'
        ? updateNote.getBoundingClientRect().height
        : 0;

      if (screenHeight <= 0) return;

      /*
        V5.2 fixed-point leaderboard geometry.
        TABLE HEADER + 8 visible rows share one current table budget.
        The result button/footer/top shell are protected. The table is the
        part allowed to compress first on a short viewport.
      */
      const fixedWithoutHeader =
        Math.max(0, topHeight) + bottomHeight + finalHeight + noteHeight;
      const tableBudget = Math.max(1, screenHeight - fixedWithoutHeader);
      const headerHeight = (tableBudget / 9) * 0.85;
      const rowHeight = Math.max(1, (tableBudget - headerHeight) / 8);

      els.leaderboardView.style.setProperty('--v5-leader-head-h', headerHeight + 'px');
      els.leaderContent.style.setProperty('--leader-row-height', rowHeight + 'px');

      rememberResponsiveGeometryV5({
        leaderHead: headerHeight,
        leaderRow: rowHeight
      });

      requestAnimationFrame(() => {
        const current = els.leaderContent.scrollTop;
        if (rowHeight > 0 && current > 0) {
          const snapped = Math.round(current / rowHeight) * rowHeight;
          const maxScroll = Math.max(0, els.leaderContent.scrollHeight - els.leaderContent.clientHeight);
          els.leaderContent.scrollTop = Math.min(Math.max(0, snapped), maxScroll);
        }
        fitLeaderboardTypography();
      });
    }


    function cancelLeaderboardAutoScroll() {
      if (leaderboardAutoScrollTimer) {
        clearTimeout(leaderboardAutoScrollTimer);
        leaderboardAutoScrollTimer = null;
      }
    }

    function scheduleLeaderboardAutoScroll() {
      cancelLeaderboardAutoScroll();

      if (
        currentView !== 'leaderboard' ||
        !els.leaderContent
      ) {
        return;
      }

      const authorized = getAuthorizedTeam();

      if (!authorized) {
        return;
      }

      const targetName = normalizeName(authorized);

      leaderboardAutoScrollTimer = setTimeout(
        () => {
          leaderboardAutoScrollTimer = null;

          if (currentView !== 'leaderboard') {
            return;
          }

          const target = Array.from(
            els.leaderRows.querySelectorAll('.leader-row')
          ).find(
            row => row.dataset.team === targetName
          );

          if (!target) {
            return;
          }

          const containerRect =
            els.leaderContent.getBoundingClientRect();

          const targetRect =
            target.getBoundingClientRect();

          const fullyVisible =
            targetRect.top >= containerRect.top &&
            targetRect.bottom <= containerRect.bottom;

          if (fullyVisible) {
            return;
          }

          /* V15.12:
             Keep the initial visible leaderboard untouched when the
             authorized team is already on screen.

             For an authorized team below that initial view, position by
             current leaderboard place — never by hard-coded team number:
               • last place: 0.0 rows visible below
               • second-to-last: 1.0 row visible below
               • third-to-last: 1.5 rows visible below
               • fourth-to-last+: 2.5 rows visible below

             This preserves a partial-row cue when more teams remain below,
             while naturally tapering at the bottom of any leaderboard size. */
          const rowHeight =
            parseFloat(
              getComputedStyle(els.leaderContent)
                .getPropertyValue('--leader-row-height')
            ) || target.getBoundingClientRect().height;

          const targetIndex =
            Array.prototype.indexOf.call(
              els.leaderRows.children,
              target
            );

          if (targetIndex < 8) {
            return;
          }

          const totalRows =
            els.leaderRows.children.length;

          const maxScroll = Math.max(
            0,
            els.leaderContent.scrollHeight -
            els.leaderContent.clientHeight
          );

          const rowsBelow =
            totalRows - targetIndex - 1;

          let desiredRowsBelow;

          if (rowsBelow <= 0) {
            desiredRowsBelow = 0;
          } else if (rowsBelow === 1) {
            desiredRowsBelow = 1;
          } else if (rowsBelow === 2) {
            desiredRowsBelow = 1.5;
          } else {
            desiredRowsBelow = 2.5;
          }

          /*
            Eight rows are visible. To leave N rows beneath the authorized
            row, place it at visible index 7 - N.
          */
          const visibleTargetIndex =
            7 - desiredRowsBelow;

          const preferredScroll =
            Math.max(
              0,
              (targetIndex - visibleTargetIndex) *
              rowHeight
            );

          const desired =
            Math.min(
              preferredScroll,
              maxScroll
            );

          els.leaderContent.scrollTo({
            top: desired,
            behavior: 'smooth'
          });
        },
        1500
      );
    }


    function formatGolfScore(
      value
    ) {

      const number =
        Number(
          value
        );


      if (
        !Number.isFinite(
          number
        )
      ) {

        return '';

      }


      if (
        number === 0
      ) {

        return 'E';

      }


      return (
        number > 0
          ? '+' +
            number
          : String(
              number
            )
      );

    }


    function scoreClass(
      value
    ) {

      const number =
        Number(
          value
        );


      return (
        number < 0
          ? 'under'
          : 'even-over'
      );

    }

            fitScorecardBodyTypography
          );
          requestAnimationFrame(
            fitScoreTeamSelectName
          );
        }
      }
    );


      const rememberedView =
        getRememberedView();

      if (
        rememberedView ===
        'scorecard'
      ) {
        hydrateScorecardSnapshotV53();
      }
      else if (
        rememberedView ===
        'leaderboard'
      ) {
        hydrateLeaderboardSnapshotV53();
      }

      await initializeQrAuthorization();
      if (isTeamQr() && getQrTeam()) rememberSelectedTeam(getQrTeam());
      syncTestAuthorizationToggle();
      syncTeamQrLockedUi();
      updateHomeScorecardAccess();

      if (
        rememberedView ===
        'scorecard'
      ) {

        await showScorecard();

        return;

      }


      if (
        rememberedView ===
        'leaderboard'
      ) {

        await showLeaderboard();

        return;

      }


      showHome();

    }



    const refitCompletedLeaderboard = () => {
      if (
        currentView === 'leaderboard' &&
        tournamentIsComplete(lastLeaderboardRows)
      ) {
        requestAnimationFrame(() => {
          sizeLeaderboardRows();
          positionCompletedFinalAction();
        });
      }
    };

    window.addEventListener(
      'resize',
      refitCompletedLeaderboard
    );

    window.addEventListener(
      'orientationchange',
      () => {
        window.setTimeout(
          refitCompletedLeaderboard,
          80
        );
      }
    );


    let v5ResizeFrame = 0;

    function refitVisibleGeometryV5() {
      cancelAnimationFrame(
        v5ResizeFrame
      );

      v5ResizeFrame =
        requestAnimationFrame(() => {
          if (
            currentView === 'scorecard'
          ) {
            sizeScorecardV5();
          }

          if (
            currentView === 'leaderboard'
          ) {
            sizeLeaderboardRows();
          }

          if (
            els.modalOverlay.classList.contains(
              'tournament-summary'
            )
          ) {
            fitTournamentSummaryRemaining();
          }
        });
    }

    const v5GeometryObserver =
      new ResizeObserver(
        refitVisibleGeometryV5
      );

    [
      document.querySelector(
        '.scorecard-screen'
      ),
      document.querySelector(
        '.leaderboard-screen'
      ),
      els.modalBox
    ]
      .filter(Boolean)
      .forEach(element => {
        v5GeometryObserver.observe(
          element
        );
      });

    window.addEventListener(
      'resize',
      refitVisibleGeometryV5,
      {
        passive: true
      }
    );

    if (currentView === 'scorecard') {
      sizeScorecardV5();
    } else if (currentView === 'leaderboard') {
      sizeLeaderboardRows();
    }

    initialize()
      .catch(error => {
        console.error('SSHCP initialization failed:', error);
      })
      .finally(() => {
        document.documentElement.classList.remove(
          'sshcp-pre-scorecard',
          'sshcp-pre-leaderboard',
          'sshcp-pre-complete'
        );
      });

    window.addEventListener('resize', () => {
      if (els.modalOverlay.classList.contains('tournament-summary')) {
        requestAnimationFrame(fitTournamentSummaryRemaining);
      }
    });

</script>

</body>
</html>
