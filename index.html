/* =========================================================
   ROTB 2026 — V13 LAYOUT CONTRACT

   V12.15 remains the frozen recovery build.

   FIXED CONTROLS
   Controls outside data tables intentionally keep their proven physical
   dimensions: navigation, footer actions, modal actions and utility buttons.
   The target design range begins at normal iPhone portrait height; shorter
   torture-test viewports may look compressed but must remain functional.

   RESPONSIVE TABLE CONTENT
   Scorecard and leaderboard table content owns the available row space.
   Anything inside a resizable row may shrink with that row, including the
   tappable score box and its notation.

   ACTION POPUPS
   Thumb-zone position remains viewport based. Non-scrollable action popups
   compress their internal vertical geometry when viewport height becomes
   shorter than the normal phone range rather than becoming scrollable.
   ========================================================= */

  padding: 0 !important;

   No scorecard row-height or column-width changes.
   ========================================================= */

/* SCORECARD:
   Hole number gets a modest bump.
   Score number + circle/square mark get a modest bump inside the SAME
   score-button footprint. */
#scorecardView .hole-cell{
  font-size:29px!important;
}

#scorecardView .score-button{
  font-size:63cqh!important;
}

#scorecardView .score-mark:not(.par-mark){
  width:74cqh!important;
  height:74cqh!important;
}

/* Keep the larger marks centered and proportional. */
#scorecardView .score-mark.single-circle,
#scorecardView .score-mark.double-circle,
#scorecardView .score-mark.single-square,
#scorecardView .score-mark.double-square{
  border-width:max(2px,0.052em)!important;
}

#scorecardView .score-mark.bold-square{
  border-width:max(4px,0.095em)!important;
}

/* SCRAMBLE SUMMARY:
   90% viewport height = 5% edge at top and bottom.
   Existing table structure and row logic stay intact. */
.modal-overlay.tournament-summary .modal-box{
  top:5%!important;
  bottom:5%!important;
}

/* Tiebreak notes: slightly larger and easier to read. */
.modal-overlay.tournament-summary .tournament-summary-note{
  font-size:var(--ts-note-font, clamp(14px,3.9vw,19px))!important;
  line-height:1.06!important;
}

/* Less dead space between the summary content and BACK. */
.modal-overlay.tournament-summary .modal-actions{
  margin-top:6px!important;
  margin-bottom:8px!important;
}

/* BACK remains secondary but can use a little more vertical room. */
.modal-overlay.tournament-summary .modal-btn{
  height:34px!important;
  font-size:17px!important;
}

@media(max-width:420px){
  #scorecardView .hole-cell{
    font-size:28px!important;
  }

  #scorecardView .score-button{
    font-size:61cqh!important;
  }

  #scorecardView .score-mark:not(.par-mark){
    width:72cqh!important;
    height:72cqh!important;
  }
}

/* =========================================================
   SSHCP V5.2 — COMPLETED LEADERBOARD STAYS RESPONSIVE
   ========================================================= */

/* Remove only live-only elements. */
.leaderboard-screen.tournament-complete .leader-title-bar{
  display:none!important;
}

/* Same responsive table behavior as in-play. */
.leaderboard-screen.tournament-complete .leader-content{
  flex:1 1 auto!important;
  height:auto!important;
  max-height:none!important;
  min-height:0!important;
}

/* Result action is a REAL layout row, not an absolute overlay.
   It scales with the current portrait viewport, so the leaderboard
   above it automatically gains/loses the complementary space. */
.leaderboard-screen.tournament-complete .leader-final-slot{
  display:flex!important;
  position:relative!important;
  inset:auto!important;

  flex:0 0 clamp(7.5dvh, 9.5dvh, 11dvh)!important;
  min-height:0!important;
  max-height:none!important;

  margin:0!important;
  padding:6% 12px 4%!important;

  align-items:stretch!important;
  justify-content:center!important;

  overflow:visible!important;
  pointer-events:auto!important;
  z-index:auto!important;
}

.leaderboard-screen.tournament-complete
.leader-final-slot
.leader-final-action{
  position:static!important;
  inset:auto!important;
  transform:none!important;

  width:92%!important;
  height:100%!important;
  min-height:0!important;
  max-height:none!important;

  margin:0 auto!important;
  padding:0 10px!important;
  box-sizing:border-box!important;

  white-space:nowrap!important;
  font-size:clamp(24px, 6.8vw, 36px)!important;
  font-weight:900!important;
  line-height:1!important;
}

/* Footer remains exactly the same established footer. */
.leaderboard-screen.tournament-complete .leader-bottom{
  flex:0 0 auto!important;
  position:relative!important;
}

/* The standard row-height variable still controls both states. */
.leaderboard-screen.tournament-complete #leaderRows > .leader-row{
  height:var(--leader-row-height)!important;
  min-height:var(--leader-row-height)!important;
  max-height:var(--leader-row-height)!important;
}

/* =========================================================
   SSHCP V5.2 — SCRAMBLE SUMMARY LIVE FRACTIONAL LAYOUT
   Row geometry is CSS/fr based; no stored pixel row heights.
   Dragging the viewport should visibly resize rows immediately.
   ========================================================= */

.modal-overlay.tournament-summary .modal-text{
  display:grid!important;
  grid-template-rows:
    auto
    minmax(0, 3.55fr)
    auto
    minmax(0, 6.45fr)!important;
  gap:clamp(3px, .55dvh, 7px)!important;
  min-height:0!important;
  overflow:hidden!important;
}

/* Top 3 section uses live fractional height. */
.modal-overlay.tournament-summary .tournament-summary-grid{
  min-height:0!important;
  height:100%!important;
  display:grid!important;
  grid-template-rows:
    .62fr
    1.30fr
    1.18fr
    1.06fr!important;
  overflow:hidden!important;
}

/* Stop old pixel heights from winning. */
.modal-overlay.tournament-summary
.tournament-summary-row.header,
.modal-overlay.tournament-summary
.tournament-summary-row.place-1,
.modal-overlay.tournament-summary
.tournament-summary-row.place-2,
.modal-overlay.tournament-summary
.tournament-summary-row.place-3{
  height:auto!important;
  min-height:0!important;
  max-height:none!important;
}

/* Lower 4–10 section owns the exact remaining table height. */
.modal-overlay.tournament-summary .tournament-summary-remaining{
  min-height:0!important;
  height:100%!important;
  max-height:none!important;

  display:grid!important;
  grid-template-columns:
    9%
    minmax(0,1fr)
    31%
    20%!important;

  grid-template-rows:
    repeat(
      var(--ts-lower-count,7),
      minmax(0,1fr)
    )!important;

  grid-auto-rows:unset!important;
  overflow:hidden!important;
}

.modal-overlay.tournament-summary
.tournament-summary-remaining-row{
  display:contents!important;
}

/* Every cell is bounded by its live row/column. */
.modal-overlay.tournament-summary
.tournament-summary-remaining-cell{
  min-width:0!important;
  min-height:0!important;
  overflow:hidden!important;
  white-space:nowrap!important;
  text-overflow:clip!important;
  box-sizing:border-box!important;
}

/* Net strokes intentionally consistent all the way down. */
.modal-overlay.tournament-summary
.tournament-summary-strokes,
.modal-overlay.tournament-summary
.tournament-summary-remaining-cell.net-strokes{
  font-size:var(--ts-live-strokes-font,15px)!important;
}

/* Tie explanation stays secondary and participates in height naturally. */
.modal-overlay.tournament-summary
.tournament-summary-note{
  font-size:var(--ts-live-note-font,12px)!important;
  line-height:1.08!important;
}

/* BACK stays outside the table budget in the fixed action area. */
.modal-overlay.tournament-summary .modal-actions{
  flex:0 0 auto!important;
}


/* =======================================================================
   SSHCP V5.2 — RESPONSIVE GEOMETRY SYSTEM
   -----------------------------------------------------------------------
   HOME, TEST, and SCORE ENTRY are deliberately NOT restyled here.

   Priority rule for short portrait screens:
     protected shell (navigation/context/actions) keeps its readable size;
     table area absorbs the height change first.

   Within a table:
     CURRENT TABLE BUDGET -> HEADER + ROW BOXES -> CONTENT FITS BOXES
   ======================================================================= */

*{box-sizing:border-box;}

/* ---------------- SCORECARD ---------------- */
#scorecardView,
#scorecardView .scorecard-screen{
  height:100dvh!important;
  min-height:0!important;
  overflow:hidden!important;
}

#scorecardView .scorecard-screen{
  display:grid!important;
  grid-template-rows:auto minmax(0,1fr) auto!important;
}

#scorecardView .score-fixed-top{
  min-height:0!important;
  display:block!important;
}

#scorecardView .score-table-head{
  height:var(--v5-score-head-h,58px)!important;
  min-height:var(--v5-score-head-h,58px)!important;
  max-height:var(--v5-score-head-h,58px)!important;
  display:grid!important;
  grid-template-columns:20% 15% 30% 35%!important;
  overflow:hidden!important;
}

#scorecardView .score-table-head > div,
#scorecardView .score-row > div{
  min-width:0!important;
  min-height:0!important;
  height:100%!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  overflow:hidden!important;
  line-height:1!important;
}

#scorecardView .score-table-head > .score-running-header{
  display:grid!important;
  grid-template-columns:18% minmax(0,64%) 18%!important;
  align-items:stretch!important;
  justify-items:stretch!important;
  gap:0!important;
}

#scorecardView .score-table-head > .score-running-header > span{
  min-width:0!important;
  min-height:0!important;
  width:100%!important;
  height:100%!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
  white-space:nowrap!important;
  line-height:1!important;
}

#scorecardView .score-scroll{
  min-height:0!important;
  height:100%!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior-y:contain!important;
  -webkit-overflow-scrolling:touch!important;
}

#scorecardView #scoreRows{min-height:0!important;}

#scorecardView .score-row{
  height:var(--v5-score-row-h,66px)!important;
  min-height:var(--v5-score-row-h,66px)!important;
  max-height:var(--v5-score-row-h,66px)!important;

#scorecardView .score-row > div{padding:2% 2.5%!important;}

#scorecardView .hole-number,
#scorecardView .par-cell,
#scorecardView .yardage-cell,

  min-width:0!important;
  max-width:100%!important;
  line-height:1!important;
  white-space:nowrap!important;
  overflow:hidden!important;

#scorecardView .yardage-cell{gap:3%!important;}

#scorecardView .score-button{
  width:var(--v5-score-box,58px)!important;
  height:var(--v5-score-box,58px)!important;
  min-width:0!important;
  min-height:0!important;
  max-width:90%!important;
  max-height:90%!important;
  margin:auto!important;
  padding:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
  line-height:1!important;

#scorecardView .score-button > *{

#scorecardView .nine-break{

#scorecardView .score-fixed-bottom{

   ========================================================= */

/* V16.1 iPad / large-screen correction. The V5.10 rule constrained the
   outer #scorecardView to 760px but left that outer view itself aligned to
   the viewport's left edge. Center that existing bounded shell; phone width
   and every internal percentage/row equation remain unchanged. */

   its notation is allowed to paint outside that tile when required. */

  overflow:hidden!important;
}

#scorecardView .score-button.empty,
#scorecardView .score-button.unsaved,

/* =========================================================
   SSHCP V16.2 — SCORECARD BUFFER + TRUE SCORE-CELL NOTATION
   - Scorecard upper gap remains the V16 12px S25 baseline.
   - Scorecard table->footer gap is now its own 18px S25 baseline.
   - Leaderboard/Final lower buffer stays at the proven V16/V16.1 value.
   - Scramble Summary spacing is intentionally untouched.
   - Score notation is drawn by the SCORE CELL, not by the gold/gray tile.
     The score-entry popup remains untouched.
   ========================================================= */

/* Remove scorecard-only circle/square borders from the number wrapper.
   The wrapper remains in place so the approved score-number sizing and
   centering do not change. The score-entry preview is outside #scorecardView
   and therefore keeps its existing notation implementation. */
#scorecardView .score-button .score-mark.single-circle,
#scorecardView .score-button .score-mark.double-circle,
#scorecardView .score-button .score-mark.single-square,
#scorecardView .score-button .score-mark.double-square,
#scorecardView .score-button .score-mark.bold-square{
  border:0!important;
}
#scorecardView .score-button .score-mark.double-circle::after,
#scorecardView .score-button .score-mark.double-square::after{
  content:none!important;
  display:none!important;
}

/* The cell is the one hard clipping boundary. The tile is only a background.
   Pseudo-elements are centered on the exact same cell center as the button. */
#scorecardView .score-cell.score-notation{
  --v162-notation-color:#000;
  position:relative!important;
  overflow:hidden!important;
}
#scorecardView .score-cell.score-notation.notation-unsaved{
  --v162-notation-color:#fff;
}
#scorecardView .score-cell.score-notation::before,
#scorecardView .score-cell.score-notation::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-sizing:border-box;
  pointer-events:none;
  z-index:1;
}

/* Single marks preserve the approved V16 scale. */
#scorecardView .score-cell.notation-single-circle::before,
#scorecardView .score-cell.notation-single-square::before,
#scorecardView .score-cell.notation-double-circle::before,
#scorecardView .score-cell.notation-double-square::before,
#scorecardView .score-cell.notation-bold-square::before{
  width:calc(var(--v5-score-box,58px) * .82);
  height:calc(var(--v5-score-box,58px) * .82);
  border:clamp(1.5px,calc(var(--v5-score-box,58px) * .045),3px) solid var(--v162-notation-color);
}
#scorecardView .score-cell.notation-single-circle::before,
#scorecardView .score-cell.notation-double-circle::before,
#scorecardView .score-cell.notation-double-circle::after{
  border-radius:50%;
}
#scorecardView .score-cell.notation-single-square::before,
#scorecardView .score-cell.notation-double-square::before,
#scorecardView .score-cell.notation-double-square::after,
#scorecardView .score-cell.notation-bold-square::before{
  border-radius:1px;
}

/* Double marks are two complete independent shapes. The outer mark is
   deliberately a touch larger than the 1:1.5 tile's height, but the score
   cell remains the hard boundary. This removes the detached-side-rail failure. */
#scorecardView .score-cell.notation-double-circle::after,
#scorecardView .score-cell.notation-double-square::after{
  width:calc(var(--v5-score-box,58px) * 1.02);
  height:calc(var(--v5-score-box,58px) * 1.02);
  border:clamp(1.2px,calc(var(--v5-score-box,58px) * .032),2.4px) solid var(--v162-notation-color);
}

#scorecardView .score-cell.notation-bold-square::before{
  border-width:clamp(3px,calc(var(--v5-score-box,58px) * .075),5px);
}

      if (!Number.isInteger(index) || index < 0 || index >= 18 || value === null) return;

      clearScoreVisualStateV1619(index);

      const enteredAt = performance.now();
      const state = {
        generation: ++scoreVisualGenerationV1619,
        value,
        previousSavedValue: savedScores[index],
        enteredAt,
        releaseAt: enteredAt + SCORE_VISUAL_BLUE_DELAY_V1619,
        blue: false,
        verified: false,
        timer: 0
      };

      scoreVisualStateV1619[index] = state;

      state.timer = window.setTimeout(() => {
        if (scoreVisualStateV1619[index] !== state) return;
        if (localScores[index] !== state.value) {
          clearScoreVisualStateV1619(index);
          return;
        }

        state.timer = 0;
        state.blue = true;

        /* If the backend already verified this exact value, the temporary
           visual gate can now be removed; native savedScores styling keeps
           the tile Blue from this same render onward. */
        if (
          state.verified &&
          savedScores[index] === state.value
        ) {
          scoreVisualStateV1619[index] = null;
        }

        renderScorecard();
      }, SCORE_VISUAL_BLUE_DELAY_V1619);
    }

    function scoreIsVisuallyBlueV1619(index, localValue, savedValue) {
      const state = scoreVisualStateV1619[index];
      if (state && localValue === state.value) return state.blue === true;
      return localValue === savedValue;
    }

    function scoreVisualProgressV1619() {
      const visual = normalizeScores(savedScores);

      scoreVisualStateV1619.forEach((state, index) => {
        if (!state || localScores[index] !== state.value) return;
        visual[index] = state.blue ? state.value : state.previousSavedValue;
      });

      return visual;
    }

    function markScoreVisualVerificationV1619(confirmedScores, requestGenerations) {
      scoreVisualStateV1619.forEach((state, index) => {
        if (!state) return;
        if (!requestGenerations || requestGenerations[index] !== state.generation) return;
        if (confirmedScores[index] !== state.value) return;

        state.verified = true;

        /* Verification may finish before 0.8s. Keep the score gray until the
           fixed visual release time. If 0.8s has already elapsed, native
           verified styling can take over immediately with no visible change. */
        if (performance.now() >= state.releaseAt) {
          if (state.timer) window.clearTimeout(state.timer);
          scoreVisualStateV1619[index] = null;

    function scheduleScoreFailureNoticeV1619(
      expectedScores,
      savedAtRequest,
      requestGenerations,
      failureReferenceAt,
      failureContextV1621 = 'enter'
    ) {
      const affected = expectedScores
        .map((score, index) => score !== savedAtRequest[index] ? index : -1)
        .filter(index => index >= 0);

      if (!affected.length) return;

      /*
        V16.21 warning split:
          ENTER failure   -> hold until 1.5s from ENTER, then SCORE NOT SAVED.
          REFRESH failure -> once the refresh retry has actually failed, report
                             GREY SCORES remain UNSAVED without an added delay.
      */
      const targetAt = failureContextV1621 === 'refresh'
        ? performance.now()
        : failureReferenceAt + SCORE_FAILURE_NOTICE_DELAY_V1619;
      const delay = Math.max(0, targetAt - performance.now());

      window.setTimeout(() => {
        const unresolved = affected.filter(index => {
          if (localScores[index] !== expectedScores[index]) return false;
          if (savedScores[index] === expectedScores[index]) return false;

          const requestGeneration = requestGenerations[index];
          if (requestGeneration !== null && requestGeneration !== undefined) {
            const state = scoreVisualStateV1619[index];
            if (!state || state.generation !== requestGeneration) return false;
          }

          return true;
        });

        if (!unresolved.length) return;

        unresolved.forEach(index => {
          const state = scoreVisualStateV1619[index];
          if (state) {
            if (state.timer) window.clearTimeout(state.timer);
            state.timer = 0;
            state.blue = false;
            state.verified = false;
          }
        });

        renderScorecard();
        showScoreSaveFailureModalV1621(failureContextV1621);
      }, delay);
    }

    function timerSeconds(
      start

      return (
        (
          performance.now() -
          start
        ) /
        1000
      ).toFixed(2);

    function intervalSeconds(
      start,
      end
    ) {

      return (

          end -

        ) /

    function msSeconds(value) {

      const ms = Number(value);

    function formatCloudflareTiming(
      timing,
      operation
    ) {

      if (!timing || typeof timing !== 'object') {
        return '';
      }

      const parts = [];

      const expectedKeys =
        operation === 'save'
          ? [
              ['authMs', 'AUTH'],
              ['parseMs', 'PARSE'],
              ['teamReadMs', 'TEAM'],
              ['writeMs', 'WRITE'],
              ['verifyMs', 'VERIFY'],
              ['totalMs', 'CF']
            ]
          : [
              ['authMs', 'AUTH'],
              ['readMs', 'READ'],
              ['buildMs', 'BUILD'],
              ['totalMs', 'CF']
            ];

      expectedKeys.forEach(
        ([key, label]) => {
          const seconds =
            msSeconds(
              timing[key]
            );

          if (seconds !== null) {
            parts.push(
              label + ' ' + seconds + 's'
            );
          }
        }
      );

      return parts.join(' • ');

    }


    function buildBrowserTimingDetail(
      started,
      responseReceivedAt,
      jsonParsedAt,
      renderedAt,
      cloudflareTiming,
      operation
    ) {

      const parts = [
        'REQ ' +
        intervalSeconds(
          started,
          responseReceivedAt
        ) +
        's',

        'JSON ' +
        intervalSeconds(
          responseReceivedAt,
          jsonParsedAt
        ) +
        's',

        'RENDER ' +
        intervalSeconds(
          jsonParsedAt,
          renderedAt
        ) +
        's'
      ];

      const cf =
        formatCloudflareTiming(
          cloudflareTiming,
          operation
        );

      if (cf) {
        parts.push(cf);
      }

      return parts.join(' • ');

    }

    const SSHCP_QR_AUTH_REQUEST_KEY_V1631 = 'sshcpQrAuthActiveRequestV1631';

    function makeQrAuthRequestTokenV1631() {
      return String(Date.now()) + '-' + Math.random().toString(36).slice(2);

    function beginQrAuthRequestV1631() {
      if (sshcpQrAuthControllerV1631) {
        try { sshcpQrAuthControllerV1631.abort(); } catch (_) {}

      const token = makeQrAuthRequestTokenV1631();
      localStorage.setItem(SSHCP_QR_AUTH_REQUEST_KEY_V1631, token);
      const controller = typeof AbortController === 'function' ? new AbortController() : null;
      sshcpQrAuthControllerV1631 = controller;
      return { token, controller };
    }

    function invalidateQrAuthRequestsV1631() {
      localStorage.setItem(SSHCP_QR_AUTH_REQUEST_KEY_V1631, 'REMOVED-' + makeQrAuthRequestTokenV1631());
      if (sshcpQrAuthControllerV1631) {
        try { sshcpQrAuthControllerV1631.abort(); } catch (_) {}
      }
      sshcpQrAuthControllerV1631 = null;
    }

    function qrAuthRequestIsCurrentV1631(token) {

    async function validateQrPasskey(passkey, showFailure=true){
      const clean=String(passkey||'').trim();

      if(!clean){
        invalidateQrAuthRequestsV1631();
        clearQrAuthorization();
        localStorage.removeItem('rotbAuthorizedTeam');
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();
        addTestLog('QR AUTH CHECK','INVALID','—','EMPTY PASSKEY');
        if(showFailure) showInvalidQrPasskey();
        return false;
      }

      const request = beginQrAuthRequestV1631();
      const requestToken = request.token;
      const started = timerStart();

      try{
        const fetchOptions = {cache:'no-store'};
        if (request.controller) fetchOptions.signal = request.controller.signal;

        const response=await fetch(
          CLOUDFLARE_API_URL+
          '?action=qrAuth&passkey='+encodeURIComponent(clean)+
          '&refresh='+Date.now(),
          fetchOptions
        );

        /* A newer auth or REMOVE AUTH owns state now. Ignore this response
           completely — no storage write, no failure popup, no stale log. */
        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        const httpStatus=response.status;
        let data;

        try{
          data=await response.json();
        }catch(_){
          if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • INVALID JSON'
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        if(!response.ok || !data || data.ok!==true){
          addTestLog(
            'QR AUTH CHECK',
            'FAILED',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+
            (data && (data.reason||data.error) ? ' • '+String(data.reason||data.error) : '')
          );
          if(showFailure) showAuthorizationCheckFailed(clean);
          return false;
        }

        if(data.valid!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'INVALID',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • VALID FALSE'
          );
          if(showFailure) showInvalidQrPasskey();
          return false;
        }

        if(data.role==='QR' && data.assigned!==true){
          clearQrAuthorization();
          localStorage.removeItem('rotbAuthorizedTeam');
          syncTestAuthorizationToggle();
          updateHomeScorecardAccess();
          addTestLog(
            'QR AUTH CHECK',
            'OK',
            timerSeconds(started)+'s',
            'HTTP '+httpStatus+' • '+String(data.qrId||'QR')+' • VALID / NOT ASSIGNED'
          );
          if(showFailure) showValidUnassignedQrPasskey();
          return false;
        }

        if(!qrAuthRequestIsCurrentV1631(requestToken)) return null;

        saveQrAuthorization(data,clean);
        syncTestAuthorizationToggle();
        updateHomeScorecardAccess();

        addTestLog(
          'QR AUTH CHECK',
          'OK',
          timerSeconds(started)+'s',
          [
            'HTTP '+httpStatus,
            String(data.role||''),
            data.qrId ? 'QR '+String(data.qrId) : '',
            data.team ? String(data.team) : ''
          ].filter(Boolean).join(' • ')
        );

        return true;
      }catch(error){
        if(
          !qrAuthRequestIsCurrentV1631(requestToken) ||
          (error && error.name === 'AbortError')
        ){
          return null;
        }

        addTestLog(
          'QR AUTH CHECK',
          'FAILED',
          timerSeconds(started)+'s',
          error && error.message ? error.message : 'REQUEST FAILED'
        );
        if(showFailure) showAuthorizationCheckFailed(clean);
        return false;
      }finally{
        if(
          sshcpQrAuthControllerV1631 === request.controller &&
          qrAuthRequestIsCurrentV1631(requestToken)
        ){
          sshcpQrAuthControllerV1631 = null;
        }
      }
    }

    async function loadAssignedPasskeys(forceRefresh = true) {
      if (sshcpQrDirectoryPromise) return sshcpQrDirectoryPromise;

      if (!forceRefresh) {
        const stored = readStoredTestQrDirectory();
        if (stored) return stored;
      }

      const started = timerStart();

      sshcpQrDirectoryPromise = (async () => {
        let response = null;

        try {
          response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=qrDirectory' +
              '&passkey=' + encodeURIComponent(SSHCP_MASTER_TEST_KEY) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          const httpStatus = response.status;
          let data;

          try {
            data = await response.json();
          } catch (_) {
            throw new Error('HTTP ' + httpStatus + ' — invalid JSON response');
          }

          if (
            !response.ok ||
            !data ||
            data.ok !== true ||
            data.authorized !== true ||
            data.role !== 'MASTER' ||
            !Array.isArray(data.directory)
          ) {
            const reason =
              data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'Directory request failed';
            throw new Error('HTTP ' + httpStatus + ' — ' + reason);
          }

          const directory = data.directory
            .filter(item => item && item.qrId && item.passkey)
            .map(item => ({
              qrId: String(item.qrId),
              passkey: String(item.passkey).trim(),
              role: 'QR',
              assigned: item.assigned === true,
              team: String(item.team || ''),
              status: String(item.status || (item.assigned ? 'ASSIGNED' : 'NOT ASSIGNED'))
            }));

            ? {
                qrId: 'MASTER',
                passkey: String(data.master.passkey).trim(),
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              }
            : {
                qrId: 'MASTER',
                passkey: SSHCP_MASTER_TEST_KEY,
                role: 'MASTER',
                assigned: true,
                team: 'MASTER',
                status: 'MASTER'
              };

          const assignedCount =
            directory.filter(item => item.assigned && item.team).length;

          const unassignedCount =
            directory.filter(item => !item.assigned).length;

          const validQrCount =
            Number(data.counts && data.counts.validQrCount) ||
            directory.length + 1;

          const workerAssignedCount =
            Number(data.counts && data.counts.assignedCount);

          const workerUnassignedCount =
            Number(data.counts && data.counts.unassignedCount);

          const countsMatch =
            validQrCount === directory.length + 1 &&
            (!Number.isFinite(workerAssignedCount) || workerAssignedCount === assignedCount) &&
            (!Number.isFinite(workerUnassignedCount) || workerUnassignedCount === unassignedCount);

          if (!countsMatch) {
            throw new Error(
              'HTTP ' + httpStatus +
              ' — directory count mismatch (' +
              validQrCount + ' valid / ' +
              assignedCount + ' assigned / ' +
              unassignedCount + ' unassigned)'
            );
          }

          const snapshot = [
            master,
            ...directory
          ];

          saveStoredTestQrDirectory(snapshot);

          const cfTotal =
            data.timing && Number.isFinite(Number(data.timing.totalMs))
              ? (Number(data.timing.totalMs) / 1000).toFixed(3) + 's CF'
              : '';

          addTestLog(
            'QR PASSKEY LOAD',
            'OK',
            timerSeconds(started) + 's',
            [
              'HTTP ' + httpStatus,
              validQrCount + ' VALID',
              assignedCount + ' ASSIGNED',
              unassignedCount + ' UNASSIGNED',
              cfTotal
            ].filter(Boolean).join(' • ')
          );

          return snapshot;
        }
        catch (error) {
          addTestLog(
            'QR PASSKEY LOAD',
            'FAILED',
            timerSeconds(started) + 's',
            error && error.message
              ? error.message
              : 'Directory request failed — CACHE NOT REPLACED'
          );

          return readStoredTestQrDirectory() || [
            {
              qrId: 'MASTER',
              passkey: SSHCP_MASTER_TEST_KEY,
              role: 'MASTER',
              assigned: true,
              team: 'MASTER',
              status: 'MASTER'
            }
          ];
        }
      })().finally(() => {
        sshcpQrDirectoryPromise = null;
      });

      return sshcpQrDirectoryPromise;
    }

    function scorecardStartingHoleV16(team = selectedTeam) {
      if (!team) return 1;

      const candidates = [
        team.startingHole,
        team.startHole,
        team.starting_hole,
        team.startingHoleNumber,
        team.starting_hole_number,
        team.starting
      ];

      for (const candidate of candidates) {
        const value = Number(candidate);
        if (Number.isInteger(value) && value >= 1 && value <= 18) {
          return value;
        }
      }

      return 1;
    }


    function scorecardPlayOrderV16(team = selectedTeam) {
      const start = Math.max(1, Math.min(18, scorecardStartingHoleV16(team))) - 1;
      return Array.from({ length: 18 }, (_, offset) => (start + offset) % 18);
    }


    /* =========================================================
       SSHCP V16.13 — SHOTGUN STARTING-HOLE INTRO

       Blank / missing / invalid Starting Hole normalizes to 1 through
       scorecardStartingHoleV16(). Scan active teams from Team 1 forward;
       the first active team above 1 makes the event a shotgun start.

       In shotgun mode, every team — including a team that starts on 1 —
       receives STARTING HOLE X every time that team's scorecard is entered
       while all 18 scores are blank. Dismissing the message does not create
       a persistent seen-state. As soon as any score exists, the message stops.
       If all scores are later cleared again, the message resumes automatically.
       This is informational only and does not change THRU, scoring, save
       verification, or cyclic play order.
       ========================================================= */

    function tournamentUsesShotgunStartV1613() {
      const activeTeams = Array.isArray(teams) ? teams : [];

      for (const team of activeTeams) {
        if (!team || !String(team.name || '').trim()) continue;
        if (scorecardStartingHoleV16(team) > 1) return true;
      }

      return false;
    }


    function scorecardIsCompletelyBlankV1613(scores = localScores) {
      const source = Array.isArray(scores) ? scores : [];

      for (let index = 0; index < 18; index++) {
        const value = source[index];
        if (value !== null && value !== undefined && value !== '') {
          return false;
        }
      }

      return true;
    }


    function showStartingHoleIntroV1613() {
      if (!selectedTeam || currentView !== 'scorecard') return false;
      if (!scorecardIsCompletelyBlankV1613(localScores)) return false;
      if (!tournamentUsesShotgunStartV1613()) return false;

      closeModal();

      els.modalTitle.textContent =
        'STARTING HOLE ' + String(scorecardStartingHoleV16(selectedTeam));
      els.modalTitle.classList.remove('testing');
      els.modalBody.textContent = '';
      els.modalInput.style.display = 'none';

      els.modalActions.replaceChildren(ok);
      els.modalOverlay.classList.add('open');

      return true;
    }


    function scorecardActiveHoleIndexV16(scores, team = selectedTeam) {
      const source = Array.isArray(scores) ? scores : [];
      const order = scorecardPlayOrderV16(team);

      for (const index of order) {
        if (source[index] === null || source[index] === undefined || source[index] === '') {
          return index;
        }
      }

      return order.length ? order[order.length - 1] : 0;
    }


    /*
      SSHCP V16.21 — ENTER beauty scroll + fixed visual save cadence.
      Normal score entry keeps every V16.17 scoring / gray / Blue behavior
      unchanged, but when the four-rows-below viewport actually has to move,
      the scorecard visibly travels to the new position over ~0.8 seconds.

      CLEAR never starts this animation. Refresh / return positioning keeps
      the already-approved native smooth scroll behavior.
    */
    let scoreEnterBeautyScrollFrameV1618 = 0;
    let scoreEnterBeautyScrollTargetV1618 = null;

    function cancelScoreEnterBeautyScrollV1618() {
      if (scoreEnterBeautyScrollFrameV1618) {
        cancelAnimationFrame(scoreEnterBeautyScrollFrameV1618);
      }

      scoreEnterBeautyScrollFrameV1618 = 0;
      scoreEnterBeautyScrollTargetV1618 = null;
    }

    function animateScoreEnterBeautyScrollV1618(targetTop, durationMs = 800) {
      if (!els.scoreScroll) return false;

      const startTop = els.scoreScroll.scrollTop;
      const distance = targetTop - startTop;

      if (Math.abs(distance) <= 2) {
        return false;
      }

      cancelScoreEnterBeautyScrollV1618();

      const startedAt = performance.now();
      scoreEnterBeautyScrollTargetV1618 = targetTop;

      const step = now => {
        const progress = Math.min(1, Math.max(0, (now - startedAt) / durationMs));
        const eased = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        els.scoreScroll.scrollTop = startTop + (distance * eased);

        if (progress < 1) {
          scoreEnterBeautyScrollFrameV1618 = requestAnimationFrame(step);
          return;
        }

        els.scoreScroll.scrollTop = targetTop;
        scoreEnterBeautyScrollFrameV1618 = 0;
        scoreEnterBeautyScrollTargetV1618 = null;
        rememberScorePosition();
      };

      scoreEnterBeautyScrollFrameV1618 = requestAnimationFrame(step);
      return true;
    }


    function restoreScorePosition(useLocalProgress = false) {

      if (
        !selectedTeam ||
        !els.scoreScroll
      ) {
        return;
      }

      requestAnimationFrame(
        () => {
          requestAnimationFrame(
            () => {
              /*
                SSHCP V16 — Starting Hole controls only the play order / active
                navigation position. THRU remains independent and is still the
                count of completed scores.

                The active hole is the first blank score in the team's cyclic
                Starting-Hole order. The viewport positions that active hole
                with four course rows below whenever the 1–18 boundaries allow.
                A wrap from Hole 18 to Hole 1 therefore returns to the beginning.
              */
              const progressScores = useLocalProgress ? localScores : savedScores;
              const activeIndex = scorecardActiveHoleIndexV16(progressScores, selectedTeam);

              const targetIndex = Math.min(
                9,
                Math.max(0, activeIndex - 4)
              );

              const row = els.scoreRows.querySelector(
                '.score-row[data-score-index="' + targetIndex + '"]'
              );

              if (row) {
                const maxScroll = Math.max(
                  0,
                  els.scoreScroll.scrollHeight - els.scoreScroll.clientHeight
                );

                const scrollRect = els.scoreScroll.getBoundingClientRect();
                const rowRect = row.getBoundingClientRect();
                const targetScroll = els.scoreScroll.scrollTop + (rowRect.top - scrollRect.top);
                const clampedTarget = Math.min(Math.max(0, targetScroll), maxScroll);

                const reducedMotion = window.matchMedia &&
                  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                const needsMove =
                  Math.abs(clampedTarget - els.scoreScroll.scrollTop) > 2;

                /*
                  V16.19: a real ENTER uses the V16.18 explicit ~0.8s visual scroll
                  only when the four-below target actually changes. The save
                  request / pending gray / verified Blue states continue on
                  their existing timing and are never gated by this animation.
                */
                if (useLocalProgress && !reducedMotion && needsMove) {
                  animateScoreEnterBeautyScrollV1618(clampedTarget, 800);
                  return;
                }

                /*
                  Verification can finish while the ENTER animation is still
                  traveling to this same target. Do not start a second scroll
                  on top of it. If a newer local score is already queued, also
                  leave the viewport under the newer local-progress animation.
                */
                if (
                  !useLocalProgress &&
                  scoreEnterBeautyScrollFrameV1618 &&
                  (
                    hasPendingScores() ||
                    (
                      Number.isFinite(scoreEnterBeautyScrollTargetV1618) &&
                      Math.abs(clampedTarget - scoreEnterBeautyScrollTargetV1618) <= 2
                    )
                  )
                ) {
                  return;
                }

                if (!useLocalProgress && !reducedMotion && needsMove) {
                  cancelScoreEnterBeautyScrollV1618();
                  els.scoreScroll.scrollTo({ top: clampedTarget, behavior: 'smooth' });
                  window.setTimeout(rememberScorePosition, 520);
                } else {
                  cancelScoreEnterBeautyScrollV1618();
                  els.scoreScroll.scrollTop = clampedTarget;
                  rememberScorePosition();
                }
                return;
              }

              els.scoreScroll.scrollTop = 0;
              rememberScorePosition();
            }
          );
        }
      );
    }

    function getTestLog() {

    function addTestLog(action, result, total, detail) {
      const log = getTestLog();
      const now = new Date();

      log.unshift({
        time: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}),
        timestamp: now.toISOString(),
        action: String(action || ''),
        result: String(result || ''),
        total: total ? String(total) : '—',
        detail: String(detail || '')
      });

      /* SSHCP V5.2 — no 20-entry truncation. History remains until the
         user explicitly taps DELETE TEST DATA. */
      localStorage.setItem(TEST_LOG_KEY, JSON.stringify(log));

      if (currentView === 'testlog') renderTestLog();
    }

    function buildTestLogReport() {
      const log = getTestLog();
      const directory = readStoredTestQrDirectory() || [];
      const assigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && item.assigned && item.team
      ).length;
      const unassigned = directory.filter(
        item => item && item.qrId !== 'MASTER' && !item.assigned
      ).length;
      const cacheTimeRaw = Number(
        localStorage.getItem(SSHCP_TEST_QR_CACHE_TIME_KEY) || 0
      );

      const lines = [
        'SSHCP V16.26 CONTROL CENTER LOG',
        'Generated: ' + new Date().toISOString(),
        'Worker: ' + CLOUDFLARE_API_URL,
        'Authorization: ' + getQrRole() +
          (getQrTeam() ? ' / ' + getQrTeam() : ''),
        'QR cache: ' +
          (directory.length
            ? directory.length + ' valid / ' + assigned + ' assigned / ' + unassigned + ' unassigned'
            : 'NOT LOADED'),
        'QR cache time: ' +
          (cacheTimeRaw ? new Date(cacheTimeRaw).toISOString() : '—'),
        'Log entries: ' + log.length,
        '',
        'TIME | ACTION | RESULT | TOTAL | DETAIL'
      ];

      log.slice().reverse().forEach(item => {
        lines.push(
          [
            item.timestamp || item.time || '',
            item.action || '',
            item.result || '',
            item.total || '—',
            item.detail || ''
          ].join(' | ')
        );
      });

      return lines.join('\n');
    }

    async function copyTestLog() {
      const report = buildTestLogReport();
      let copied = false;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(report);
          copied = true;
        }
      } catch (_) {}

      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();

        try {
          copied = document.execCommand('copy');
        } catch (_) {
          copied = false;
        }

        textarea.remove();
      }

      if (copied) {
        addTestLog('COPY LOG', 'OK', '—', getTestLog().length + ' ENTRIES COPIED');
        if (els.testCopyLogButton) {
          const original = 'COPY LOG';
          els.testCopyLogButton.textContent = 'COPIED';
          setTimeout(() => {
            if (els.testCopyLogButton) els.testCopyLogButton.textContent = original;
          }, 1200);
        }
      } else {
        addTestLog('COPY LOG', 'FAILED', '—', 'CLIPBOARD UNAVAILABLE');
      }
    }

    function renderTestLog() {
      const log = getTestLog();
      if (!log.length) {
        els.testLogRows.innerHTML = '<div class="test-log-empty">NO TEST ACTIONS RECORDED</div>';
        return;
      }

      /* V16.16 — render the full stored history in the flexible scrollable
         table. The table is the only Control Center region allowed to squeeze
         as viewport height is consumed by bottom-anchored controls. */
      els.testLogRows.innerHTML = log.map(item => {
        const resultClass = item.result === 'OK' || item.result === 'VERIFIED' ? 'test-log-ok' : (item.result === 'FAILED' ? 'test-log-fail' : '');
        const detail = String(item.detail || '').trim();
        return '<div class="test-log-row">' +
          '<div>' + escapeHtml(item.time) + '</div>' +
          '<div class="test-log-action"><strong>' + escapeHtml(item.action) + '</strong>' +
            (detail ? '<span class="test-log-detail">' + escapeHtml(detail) + '</span>' : '') +
          '</div>' +
          '<div class="' + resultClass + '">' + escapeHtml(item.result) + '</div>' +
          '<div>' + escapeHtml(item.total) + '</div>' +
          '</div>';
      }).join('');
    }

    /* =========================================================
       SSHCP V16.27 — CONTROL CENTER / TEAMS POPUP
       CF V1.9 supplies all 36 fixed TEAMS slots from TEAMS!B1:F37.
       This frontend view is intentionally read-only: only assigned/active
       teams are displayed, and Google Sheets remains the sole edit surface.
       Refresh restore keeps the last rendered TEAMS snapshot visible while
       fresh data loads so no provisional giant-header geometry can flash.

    function teamsPopupMeasureTextWidth(element, text, fontSize) {
      if (!teamsPopupTextMeasureContext) return 0;
      const style = getComputedStyle(element);
      const family = style.fontFamily || "'Oswald',Arial,sans-serif";
      const weight = style.fontWeight || '400';
      const fontStyle = style.fontStyle || 'normal';
      teamsPopupTextMeasureContext.font = fontStyle + ' ' + weight + ' ' + fontSize + 'px ' + family;
      let width = teamsPopupTextMeasureContext.measureText(String(text || '')).width;
      const spacing = parseFloat(style.letterSpacing);
      if (Number.isFinite(spacing) && spacing !== 0) {
        width += Math.max(0, String(text || '').length - 1) * spacing;
      }
      return width;
    }

    function teamsPopupTargetRatioV1626(element) {
      if (!element) return 0.60;
      if (element.closest('.teams-popup-row.header')) return 0.45;
      if (element.classList.contains('teams-popup-name')) return 0.60;
      if (element.classList.contains('teams-popup-hcp')) return 0.50;
      if (
        element.classList.contains('teams-popup-team') ||
        element.classList.contains('teams-popup-qr') ||
        element.classList.contains('teams-popup-hole')
      ) return 0.40;
      return 0.40;

    function fitTeamsPopupCellText(element) {
      if (!element) return;
      const rowHeight = Math.max(1, teamsPopupCalculatedRowHeightV1626 || 36);
      const target = rowHeight * teamsPopupTargetRatioV1626(element);
      const minimum = 7;
      const text = element.textContent || '';
      const available = Math.max(1, element.clientWidth - 6);
      let size = target;

      element.style.fontSize = size + 'px';
      while (size > minimum && teamsPopupMeasureTextWidth(element, text, size) > available) {
        size = Math.max(minimum, size - 0.5);
        element.style.fontSize = size + 'px';
      }
    }

    /* =========================================================
       SSHCP V5.3 QUICK TEST-WRITE PATCH
       - One retry for transient RANDOM 2 team writes.
       - HTTP status + Worker reason logged for bulk test failures.

    /* =========================================================
       TEST PAGE — BULK SCORE CONTROLS
       ADD PAR / ADD RANDOM affect current teams. DELETE ALL clears all slots.
       ADD RANDOM 2 uses the existing verified saveScores path to create a
       stronger 68–74 round with 3–7 birdies, 3–7 bogeys and 0–2 eagles.
       ========================================================= */

    function randomIntInclusive(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffledIndexes(values) {
      const copy = [...values];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function generateRandom2Round(courseHoles) {
      const usable = Array.isArray(courseHoles) ? courseHoles.slice(0, 18) : [];
      if (usable.length !== 18) {
        throw new Error('ADD RANDOM 2 requires 18 course holes.');
      }

      const pars = usable.map(hole => Number(hole.par));
      if (pars.some(par => !Number.isFinite(par) || par <= 0)) {
        throw new Error('ADD RANDOM 2 could not read the course pars.');
      }

      const parTotal = pars.reduce((sum, par) => sum + par, 0);
      const eagleEligible = usable
        .map((hole, index) => Number(hole.par) >= 4 ? index : -1)
        .filter(index => index >= 0);

      const combinations = [];
      for (let eagles = 0; eagles <= 2; eagles++) {
        if (eagles > eagleEligible.length) continue;
        for (let birdies = 3; birdies <= 7; birdies++) {
          for (let bogeys = 3; bogeys <= 7; bogeys++) {
            if (eagles + birdies + bogeys > 18) continue;
            const total = parTotal - (2 * eagles) - birdies + bogeys;
            if (total >= 68 && total <= 74) {
              combinations.push({ eagles, birdies, bogeys, total });
            }
          }
        }
      }

      if (!combinations.length) {
        throw new Error('No 68–74 RANDOM 2 combination fits this course par.');
      }

      const combo = combinations[randomIntInclusive(0, combinations.length - 1)];
      const scores = [...pars];
      const used = new Set();

      shuffledIndexes(eagleEligible)
        .slice(0, combo.eagles)
        .forEach(index => {
          scores[index] = pars[index] - 2;
          used.add(index);
        });

      const birdiePool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      birdiePool.slice(0, combo.birdies).forEach(index => {
        scores[index] = pars[index] - 1;
        used.add(index);
      });

      const bogeyPool = shuffledIndexes(
        usable.map((_, index) => index).filter(index => !used.has(index))
      );
      bogeyPool.slice(0, combo.bogeys).forEach(index => {
        scores[index] = pars[index] + 1;
        used.add(index);
      });

      return { scores, ...combo };
    }

    async function loadFreshTestScoreSource() {
      const response = await fetch(
        CLOUDFLARE_API_URL + '?refresh=' + Date.now() + '-random2',
        { cache: 'no-store' }
      );

      if (!response.ok) {
        throw new Error('ADD RANDOM 2 could not load current teams.');
      }

      const data = await response.json();
      if (!data || data.ok !== true) {
        throw new Error((data && data.error) || 'ADD RANDOM 2 data unavailable.');
      }

      const freshHoles = Array.isArray(data.course && data.course.holes)
        ? data.course.holes.slice(0, 18)
        : [];
      const freshTeams = Array.isArray(data.teams)
        ? data.teams.filter(team => team && String(team.name || '').trim() !== '')
        : [];

      if (freshHoles.length !== 18 || !freshTeams.length) {
        throw new Error('ADD RANDOM 2 needs 18 holes and at least one current team.');
      }

      holes = freshHoles;
      teams = freshTeams;
      return { freshHoles, freshTeams };
    }

    async function runRandom2Current() {
      const { freshHoles, freshTeams } = await loadFreshTestScoreSource();
      const passkey = isMasterQr() && getQrPasskey()
        ? getQrPasskey()
        : SSHCP_MASTER_TEST_KEY;

      const generated = [];

      /* Sequential verified writes avoid concurrent Google Sheets test writes.
         A single transient Worker/Sheets failure gets one immediate retry. */
      for (const team of freshTeams) {
        const round = generateRandom2Round(freshHoles);
        let lastError = null;
        let verified = false;

        for (let attempt = 1; attempt <= 2 && !verified; attempt++) {
          try {
            const response = await fetch(
              CLOUDFLARE_API_URL +
                '?action=saveScores' +
                '&slot=' + encodeURIComponent(Number(team.slot)) +
                '&scores=' + encodeURIComponent(JSON.stringify(round.scores)) +
                '&passkey=' + encodeURIComponent(passkey) +
                '&refresh=' + Date.now() + '-' + attempt,
              { cache: 'no-store' }
            );

            let data = null;
            try { data = await response.json(); } catch (_) {}

            if (!response.ok) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'request failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            if (
              !data ||
              data.ok !== true ||
              data.verified !== true ||
              !scoresEqual(data.verifiedScores, round.scores)
            ) {
              const reason = data && (data.reason || data.error)
                ? String(data.reason || data.error)
                : 'verification failed';
              throw new Error('HTTP ' + response.status + ' • ' + reason);
            }

            verified = true;
          } catch (error) {
            lastError = error;
            if (attempt === 1) {
              await new Promise(resolve => setTimeout(resolve, 450));
            }
          }
        }

        if (!verified) {
          throw new Error(
            'ADD RANDOM 2 failed for ' + String(team.name || 'a team') +
            (lastError && lastError.message ? ' • ' + lastError.message : '')
          );
        }

        generated.push(round);
      }

      const totals = generated.map(round => round.total);
      const birdies = generated.map(round => round.birdies);
      const bogeys = generated.map(round => round.bogeys);
      const eagles = generated.map(round => round.eagles);

      return {
        ok: true,
        verified: true,
        affectedTeams: generated.length,
        random2Summary:
          Math.min(...totals) + '–' + Math.max(...totals) + ' TOTAL • ' +
          Math.min(...birdies) + '–' + Math.max(...birdies) + ' BIRDIES • ' +
          Math.min(...bogeys) + '–' + Math.max(...bogeys) + ' BOGEYS • ' +
          Math.min(...eagles) + '–' + Math.max(...eagles) + ' EAGLES'
      };
    }

    async function runTestScoreAction(mode, scope) {
      closeModal();
      startLoadingLine();

      const started = timerStart();
      const isPar = mode === 'par';
      const isRandom = mode === 'random';
      const isRandom2 = mode === 'random2';

      const actionLabel =
        isRandom2
          ? 'ADD RANDOM 2'
          : isRandom
            ? 'ADD RANDOM'
            : isPar
              ? 'ADD PAR'
              : 'DELETE ALL';

      try {
        let data;

        if (isRandom2) {
          data = await runRandom2Current();
        } else {
          const controlCenterPasskey =
            isMasterQr()
              ? getQrPasskey()
              : (
                  mode === 'clear' &&
                  scope === 'all' &&
                  isTeamQr() &&
                  getQrPasskey()
                )
                ? SSHCP_MASTER_TEST_KEY
                : '';

          const response = await fetch(
            CLOUDFLARE_API_URL +
              '?action=testScores' +
              '&mode=' + encodeURIComponent(mode) +
              '&scope=' + encodeURIComponent(scope) +
              '&passkey=' + encodeURIComponent(controlCenterPasskey) +
              '&refresh=' + Date.now(),
            { cache: 'no-store' }
          );

          let parsed = null;
          try { parsed = await response.json(); } catch (_) {}

          if (!response.ok) {
            const reason = parsed && (parsed.reason || parsed.error)
              ? String(parsed.reason || parsed.error)
              : 'request failed';
            throw new Error(actionLabel + ' failed • HTTP ' + response.status + ' • ' + reason);
          }

          data = parsed;
        }

        if (!data || data.ok !== true || data.verified !== true) {
          throw new Error(
            (data && data.error) ||
            (actionLabel + ' was not verified.')
          );
        }

        teams.forEach(team => {
          localStorage.removeItem(pendingScoresKey(team));
        });

        scorecardHasLoaded = false;
        leaderboardHasLoaded = false;
        sessionStorage.removeItem('sshcpScorecardSnapshotV53');
        sessionStorage.removeItem('sshcpLeaderboardSnapshotV53');

        const testDetailParts = [
          data.affectedTeams + ' team slot' +
            (Number(data.affectedTeams) === 1 ? '' : 's')
        ];

        if (mode === 'random' && data.randomMix) {
          testDetailParts.push(
            data.randomMix.birdiesPerTeam + ' BIRDIES / ' +
            data.randomMix.parsPerTeam + ' PARS / ' +
            data.randomMix.bogeysPerTeam + ' BOGEYS EACH'
          );
        }

        if (isRandom2 && data.random2Summary) {
          testDetailParts.push(data.random2Summary);
        }

        addTestLog(
          actionLabel,
          'VERIFIED',
          timerSeconds(started) + 's',
          testDetailParts.join(' • ')
        );

        completeLoadingLine();
        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' COMPLETE';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          data.affectedTeams +
          ' team slot' +
          (Number(data.affectedTeams) === 1 ? '' : 's') +
          ' verified.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', 'primary', closeModal);
        els.modalActions.className = 'modal-actions single test-success';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
      catch (error) {
        stopLoadingLine();

        addTestLog(
          actionLabel,
          'FAILED',
          timerSeconds(started) + 's',
          error && error.message ? error.message : 'Action failed'
        );

        renderTestLog();
        requestAnimationFrame(fitTestPageButtonText);

        closeModal();
        els.modalOverlay.classList.add('reset-authorization');
        els.modalTitle.textContent = actionLabel + ' FAILED';
        els.modalTitle.classList.remove('testing');
        els.modalBody.textContent =
          error && error.message
            ? error.message
            : 'The score action could not be completed.';
        els.modalInput.style.display = 'none';

        const ok = makeModalButton('OK', '', closeModal);
        els.modalActions.className = 'modal-actions single';
        els.modalActions.replaceChildren(ok);
        els.modalOverlay.classList.add('open');
      }
    }

    /* =========================================================
       CLOUDFLARE: SCORECARD READ
       Google Apps Script is NOT used.
       ========================================================= */


    async function loadScorecard() {

      if (
        scorecardLoadInProgress
      ) {
        return;
      }

      const hadExistingScorecard =
        scorecardHasLoaded &&
        els.scoreRows &&
        els.scoreRows.children.length > 0;

      scorecardLoadInProgress =
        true;

      const started =
        timerStart();

      startLoadingLine();

      try {

        const url =
          CLOUDFLARE_API_URL +
          '?refresh=' +
          Date.now();

        const response =
          await fetch(
            url,
            {
              cache:
                'no-store'
            }
          );

        const responseReceivedAt =
          timerStart();

        if (!response.ok) {
          throw new Error(
            'Scorecard request failed.'
          );
        }

        const data =
          await response.json();

        const jsonParsedAt =
          timerStart();

        if (
          !data ||
          data.ok !== true
        ) {
          throw new Error(
            (
              data &&
              data.error
            ) ||
            'Scorecard data unavailable.'
          );
        }

        holes =
          Array.isArray(
            data.course &&
            data.course.holes
          )
            ? data.course.holes
            : [];

        teams =
          Array.isArray(
            data.teams
          )
            ? data.teams.filter(
                team =>
                  team &&
                  String(
                    team.name || ''
                  ).trim() !== ''
              )
            : [];

        buildTeamSelect();
        restoreOrSelectTeam();
        renderScorecard();

        const renderedAt =
          timerStart();

        scoreTimingDetail =
          buildBrowserTimingDetail(
            started,
            responseReceivedAt,
            jsonParsedAt,
            renderedAt,
            data.timing,
            'read'
          );

        scorecardHasLoaded =
          true;

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreSaveSeconds =
          null;

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'OK', scorecardLoadSeconds + 's', scoreTimingDetail);
        completeLoadingLine();

        /*
          V8-CF.2: If this device had a gray/pending score when the page
          was refreshed, the fresh read above establishes the official
          Sheets state first. Any still-different local score is then
          written once through the normal verified Cloudflare save path.
        */
        if (hasPendingScores()) {
          setTimeout(
            () => submitScores('refresh'),
            0
          );
        }

      }
      catch (error) {

        scorecardLoadSeconds =
          timerSeconds(
            started
          );

        scoreTimingDetail =
          '';

        updateScoreTiming();
        addTestLog('SCORECARD LOAD', 'FAILED', scorecardLoadSeconds + 's', 'Request failed');
        stopLoadingLine();

        if (!hadExistingScorecard) {
          showLoadError(
            'Scorecard Could Not Load',
            'The ROTB scorecard could not be loaded.',
            async () => {
              closeModal();
              scorecardHasLoaded =
                false;
              await loadScorecard();
            }
          );
        }

      }
      finally {

        scorecardLoadInProgress =
          false;

      }

    }

    function normalizeName(
      value
    ) {

      return String(
        value || ''
      )
        .trim()
        .toLowerCase();

    }


    function normalizeScores(
      values
    ) {

      const source =
        Array.isArray(
          values
        )
          ? values
          : [];


      return Array.from(
        {
          length: 18
        },
        (_, index) => {

          const value =
            source[
              index
            ];


          if (
            value === '' ||
            value === null ||
            value === undefined
          ) {

            return null;

          }


          const number =
            Number(
              value
            );


          if (
            Number.isInteger(
              number
            ) &&
            number > 0
          ) {

            return number;

          }


          return null;

        }
      );

    }


    function scoresEqual(
      first,
      second
    ) {

      const a =
        normalizeScores(
          first
        );

      const b =
        normalizeScores(
          second
        );

      return a.every(
        (value, index) =>
          value === b[index]
      );

    }



    /* =========================================================
       V9.9 — SCORECARD RUNNING GROSS / NET
       Uses verified (gold) scores only.
       Net matches the leaderboard convention:
       gross relative-to-par minus the team's full handicap.
       ========================================================= */

    function scorecardHandicap(team) {
      if (!team) return 0;

      const candidates = [
        team.handicap,
        team.hcp,
        team.teamHandicap,
        team.teamHcp
      ];

      const value = candidates.find(
        item =>
          item !== undefined &&
          item !== null &&
          String(item).trim() !== ''
      );

      const number = Number(value);
      return Number.isFinite(number) ? Math.abs(number) : 0;
    }


    function formatScorecardRelative(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'E';
      return number > 0 ? '+' + number : String(number);
    }


    function updateScorecardRunningScores() {
      if (!els.scoreRunningGross || !els.scoreRunningNet) return;

      if (!selectedTeam) {
        els.scoreRunningGross.textContent = '(E)';
        els.scoreRunningNet.textContent = '(E)';
        els.scoreRunningGross.classList.remove('under-par');
        els.scoreRunningNet.classList.remove('under-par');
        return;
      }

      let gross = 0;

      savedScores.forEach((score, index) => {
        if (
          score === null ||
          !holes[index] ||
          !Number.isFinite(Number(score)) ||
          !Number.isFinite(Number(holes[index].par))
        ) {
          return;
        }

        gross += Number(score) - Number(holes[index].par);
      });

      const net = gross - scorecardHandicap(selectedTeam);

      els.scoreRunningGross.textContent =
        '(' + formatScorecardRelative(gross) + ')';

      els.scoreRunningNet.textContent =
        '(' + formatScorecardRelative(net) + ')';

      els.scoreRunningGross.classList.toggle('under-par', gross < 0);
      els.scoreRunningNet.classList.toggle('under-par', net < 0);
    }


    /* =========================================================
       SCORECARD RENDER
       ========================================================= */


    let v5MeasureProbe = null;

    function fitTextToBoxV5(
      box,
      target,
      maxPx,
      minPx = 8,
      options = {}
    ) {
      if (!box || !target) return minPx;

      const boxWidth = box.clientWidth;
      const boxHeight = box.clientHeight;
      if (boxWidth <= 0 || boxHeight <= 0) return minPx;

      const horizontalPad = Number(options.horizontalPad || 0);
      const verticalPad = Number(options.verticalPad || 0);
      const availableWidth = Math.max(1, boxWidth - horizontalPad);
      const availableHeight = Math.max(1, boxHeight - verticalPad);

      if (!v5MeasureProbe) {
        v5MeasureProbe = document.createElement('span');
        v5MeasureProbe.setAttribute('aria-hidden', 'true');
        Object.assign(v5MeasureProbe.style, {
          position: 'fixed',
          left: '-10000px',
          top: '-10000px',
          visibility: 'hidden',
          pointerEvents: 'none',
          zIndex: '-1'
        });
        document.body.appendChild(v5MeasureProbe);
      }

      const computed = getComputedStyle(target);
      const text = String(target.textContent || '').replace(/\s+/g, ' ').trim();

      v5MeasureProbe.textContent = text;
      v5MeasureProbe.style.fontFamily = computed.fontFamily;
      v5MeasureProbe.style.fontWeight = computed.fontWeight;
      v5MeasureProbe.style.fontStyle = computed.fontStyle;
      v5MeasureProbe.style.letterSpacing = computed.letterSpacing;
      v5MeasureProbe.style.textTransform = computed.textTransform;
      v5MeasureProbe.style.whiteSpace = options.wrap ? 'normal' : 'nowrap';
      v5MeasureProbe.style.width = options.wrap ? availableWidth + 'px' : 'auto';
      v5MeasureProbe.style.lineHeight = String(options.lineHeight || 1);

      let low = Math.max(5, minPx);
      let high = Math.max(low, maxPx);
      let best = low;

      for (let i = 0; i < 12; i++) {
        const mid = (low + high) / 2;
        v5MeasureProbe.style.fontSize = mid + 'px';
        const rect = v5MeasureProbe.getBoundingClientRect();

        const fits =
          rect.width <= availableWidth + 0.75 &&
          (options.ignoreHeight || rect.height <= availableHeight + 0.75);

        if (fits) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      target.style.setProperty('font-size', best + 'px', 'important');
      target.style.setProperty('line-height', String(options.lineHeight || 1), 'important');
      target.style.setProperty('white-space', options.wrap ? 'normal' : 'nowrap', 'important');
      target.style.setProperty('overflow', 'hidden', 'important');
      target.style.setProperty('text-align', 'center', 'important');

      return best;
    }

    function saveScorecardSnapshotV53() {
      if (!els.scoreRows || !els.scoreScroll || !selectedTeam || !holes.length) return;
      try {
        const snapshot = {
          holes,
          teams,
          selectedSlot: Number(selectedTeam.slot),
          selectedName: selectedTeam.name || '',

          savedScores: normalizeScores(savedScores),

            className: els.scoreRunningNet ? els.scoreRunningNet.className : 'score-running-net'
          }
        };
        sessionStorage.setItem(SSHCP_SCORECARD_SNAPSHOT_KEY, JSON.stringify(snapshot));
        window.__sshcpBootScorecardSnapshot = snapshot;
      } catch (_) {}
    }

    function hydrateScorecardSnapshotV53() {
      let snapshot = window.__sshcpBootScorecardSnapshot || null;
      if (!snapshot) {
        try {
          snapshot = JSON.parse(sessionStorage.getItem(SSHCP_SCORECARD_SNAPSHOT_KEY) || 'null');
        } catch (_) {
          snapshot = null;
        }
      }

      if (!snapshot || !Array.isArray(snapshot.holes) || !Array.isArray(snapshot.teams)) {
        return false;
      }

      holes = snapshot.holes;
      teams = snapshot.teams;
      selectedTeam = teams.find(team => Number(team.slot) === Number(snapshot.selectedSlot)) ||
        teams.find(team => normalizeName(team.name) === normalizeName(snapshot.selectedName)) || null;

      if (!selectedTeam) return false;

      localScores = normalizeScores(snapshot.localScores);
      savedScores = normalizeScores(snapshot.savedScores);
      scorecardHasLoaded = true;
      scorecardHydratedFromSnapshotV53 = true;
      scorecardHydratedScrollTopV53 = Math.max(0, Number(snapshot.scrollTop) || 0);
      buildTeamSelect();
      renderScorecard();

      requestAnimationFrame(() => {
        if (els.scoreScroll) {
          const maxScroll = Math.max(0, els.scoreScroll.scrollHeight - els.scoreScroll.clientHeight);
          els.scoreScroll.scrollTop = Math.min(
            scorecardHydratedScrollTopV53,
            maxScroll
          );
          saveScorecardSnapshotV53();
        }
      });

      return true;
    }

    function saveLeaderboardSnapshotV53() {
      if (!els.leaderRows || !els.leaderContent || !lastLeaderboardRows.length) return;
      try {
        const finalSlot = els.leaderFinalActionButton
          ? els.leaderFinalActionButton.closest('.leader-final-slot')
          : null;
        const finalSlotHeight = finalSlot && getComputedStyle(finalSlot).display !== 'none'
          ? finalSlot.getBoundingClientRect().height
          : 0;

        const snapshot = {
          rows: lastLeaderboardRows,
          teams,
          rowsHtml: els.leaderRows.innerHTML,
          scrollTop: els.leaderContent.scrollTop || 0,
          complete: tournamentIsComplete(lastLeaderboardRows),
          finalSlotHeight
        };
