.test-score-action{min-height:42px;border-radius:8px;background:#fafafa;font-size:13px;font-weight:800;letter-spacing:.1px}
.test-score-action.add{border:2px solid var(--gold);color:var(--gold)}
.test-score-action.delete{border:2px solid var(--red);color:var(--red)}

.par-cell{font-style:italic}
.top-team-select.has-team{font-size:20px}
.hole-cell{font-size:24px}
.score-button{font-size:30px}
.score-mark{width:37px;height:37px;font-size:26px}
.score-mark.double-circle,.score-mark.double-square{font-size:26px}
.score-button .score-mark{transform:none}
.score-mark-number{display:inline-block;transform:translateY(-3px)}
.score-mark:not(.par-mark) .score-mark-number{transform:none}
.leader-team-name{font-size:20.5px;white-space:nowrap;overflow:hidden}

.home-scorecard-access{position:relative;width:100%}
.home-scorecard-split{display:grid;grid-template-columns:minmax(0,1fr) 48px;width:100%;min-height:70px;border:2px solid var(--gold);border-radius:9px;overflow:visible;background:var(--gold)}
.home-scorecard-main,.home-scorecard-arrow{border:0;background:var(--gold);color:#eee;font-weight:700}
.home-scorecard-main{min-width:0;padding:8px 0 8px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.02;overflow:hidden}
.home-scorecard-action{display:block;width:100%;font-size:20px;font-weight:700;letter-spacing:.25px;white-space:nowrap;text-align:center}
.home-scorecard-team{display:block;width:100%;margin-top:5px;font-size:18px;font-weight:700;letter-spacing:.15px;white-space:nowrap;text-align:center;overflow:hidden}
.home-scorecard-team.select-team{font-style:italic;font-weight:600}
.home-scorecard-arrow{position:relative;border-left:1px solid rgba(255,255,255,.28);font-size:0}
.home-scorecard-arrow::after{content:"";position:absolute;left:50%;top:54%;width:11px;height:11px;border-left:3px solid #eee;border-top:3px solid #eee;transform:translate(-50%,-35%) rotate(45deg)}
.home-scorecard-main:active,.home-scorecard-arrow:active{filter:brightness(.9)}
.home-team-dropup{position:absolute;left:0;right:0;bottom:calc(100% + 7px);z-index:80;display:none;max-height:min(48dvh,390px);overflow-y:auto;padding:6px;border:2px solid var(--gold);border-radius:9px;background:#fafafa;box-shadow:0 -8px 28px rgba(255,255,255,.48)}
.home-team-dropup.open{display:block}
.home-team-option{display:block;width:100%;min-height:48px;padding:9px 12px;border:0;border-bottom:1px solid #ccc;background:#fafafa;color:#000;text-align:center;font-size:18px;font-weight:600}
.home-team-option:last-child{border-bottom:0}
.home-team-option:active{background:var(--gold);color:#eee}
.modal-overlay.reset-authorization{align-items:flex-end;justify-content:center;padding:20px 20px max(calc(env(safe-area-inset-bottom) + 20px),calc(33dvh - 55px))}

/* =========================================================
   ROTB 2026 — V13 LAYOUT CONTRACT

   V12.15 remains the frozen recovery build.

   FIXED CONTROLS
   Controls outside data tables intentionally keep their proven physical
   dimensions: navigation, footer actions, modal actions and utility buttons.
   The target design range begins at normal iPhone portrait height; shorter
   torture-test viewports may look compressed but must remain functional.

   RESPONSIVE TABLE CONTENT
   Scorecard and leaderboard table content owns the available row space.
   Anything inside a resizable row may shrink with that row, including the
   tappable score box and its notation.

   ACTION POPUPS
   Thumb-zone position remains viewport based. Non-scrollable action popups
   compress their internal vertical geometry when viewport height becomes
   shorter than the normal phone range rather than becoming scrollable.
   ========================================================= */

/* SCORECARD — one geometry for EMPTY, PENDING and CERTIFIED states.
   State changes appearance only; the row controls the box dimensions. */
.score-row {
  min-height: 0 !important;
}

.score-cell {
  container-type: size;
}

.score-button,
.score-button.empty,
.score-button.unsaved,
.score-button.saved {
  height: calc(100% - max(4px, 5cqh)) !important;
  min-height: 0 !important;
  max-height: none !important;

  width: auto !important;
  max-width: calc(100% - 6px) !important;
  aspect-ratio: 1.25 / 1 !important;

  padding: 0 !important;
  border-radius: 6px !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  font-size: 58cqh !important;
  line-height: 1 !important;
  -webkit-appearance: none !important;
  appearance: none !important;
}

.score-button.empty {
  border: 1px solid rgba(0,0,0,.48) !important;
  background: rgba(255,255,255,.72) !important;
  color: #555 !important;
}

/* =========================================================
   SSHCP V16.1 — NARROW GOLDEN-V16 PATCH
   1) Center only the outer Scorecard shell on large screens.
   2) The score CELL is the notation boundary; the gold tile may no longer
      clip circle/square notation. Score-entry popup rules are untouched.
   ========================================================= */

/* V16.1 iPad / large-screen correction. The V5.10 rule constrained the
   outer #scorecardView to 760px but left that outer view itself aligned to
   the viewport's left edge. Center that existing bounded shell; phone width
   and every internal percentage/row equation remain unchanged. */
#scorecardView{
  margin-left:auto!important;
  margin-right:auto!important;
}

/* V16.1 score notation layering. The cell is the hard outer clipping box.
   The 1:1.5 gold/gray button remains the background/highlight layer, while
   its notation is allowed to paint outside that tile when required. */
#scorecardView .score-cell{
  position:relative!important;
  overflow:hidden!important;
}
#scorecardView .score-button,
#scorecardView .score-button.empty,
#scorecardView .score-button.unsaved,
#scorecardView .score-button.saved{
  overflow:visible!important;
}
#scorecardView .score-button .score-mark,
#scorecardView .score-button .score-mark-number{
  position:relative!important;
  z-index:2!important;
}


/* =========================================================
   SSHCP V16.2 — SCORECARD BUFFER + TRUE SCORE-CELL NOTATION
   - Scorecard upper gap remains the V16 12px S25 baseline.
   - Scorecard table->footer gap is now its own 18px S25 baseline.
   - Leaderboard/Final lower buffer stays at the proven V16/V16.1 value.
   - Scramble Summary spacing is intentionally untouched.
   - Score notation is drawn by the SCORE CELL, not by the gold/gray tile.
     The score-entry popup remains untouched.
   ========================================================= */

/* Remove scorecard-only circle/square borders from the number wrapper.
   The wrapper remains in place so the approved score-number sizing and
   centering do not change. The score-entry preview is outside #scorecardView
   and therefore keeps its existing notation implementation. */
#scorecardView .score-button .score-mark.single-circle,
#scorecardView .score-button .score-mark.double-circle,
#scorecardView .score-button .score-mark.single-square,
#scorecardView .score-button .score-mark.double-square,
#scorecardView .score-button .score-mark.bold-square{
  border:0!important;
}
#scorecardView .score-button .score-mark.double-circle::after,
#scorecardView .score-button .score-mark.double-square::after{
  content:none!important;
  display:none!important;
}

/* The cell is the one hard clipping boundary. The tile is only a background.
   Pseudo-elements are centered on the exact same cell center as the button. */
#scorecardView .score-cell.score-notation{
  --v162-notation-color:#000;
  position:relative!important;
  overflow:hidden!important;
}
#scorecardView .score-cell.score-notation.notation-unsaved{
  --v162-notation-color:#fff;
}
#scorecardView .score-cell.score-notation::before,
#scorecardView .score-cell.score-notation::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  box-sizing:border-box;
  pointer-events:none;
  z-index:1;
}

/* Single marks preserve the approved V16 scale. */
#scorecardView .score-cell.notation-single-circle::before,
#scorecardView .score-cell.notation-single-square::before,
#scorecardView .score-cell.notation-double-circle::before,
#scorecardView .score-cell.notation-double-square::before,
#scorecardView .score-cell.notation-bold-square::before{
  width:calc(var(--v5-score-box,58px) * .82);
  height:calc(var(--v5-score-box,58px) * .82);
  border:clamp(1.5px,calc(var(--v5-score-box,58px) * .045),3px) solid var(--v162-notation-color);
}
#scorecardView .score-cell.notation-single-circle::before,
#scorecardView .score-cell.notation-double-circle::before,
#scorecardView .score-cell.notation-double-circle::after{
  border-radius:50%;
}
#scorecardView .score-cell.notation-single-square::before,
#scorecardView .score-cell.notation-double-square::before,
#scorecardView .score-cell.notation-double-square::after,
#scorecardView .score-cell.notation-bold-square::before{
  border-radius:1px;
}

/* Double marks are two complete independent shapes. The outer mark is
   deliberately a touch larger than the 1:1.5 tile's height, but the score
   cell remains the hard boundary. This removes the detached-side-rail failure. */
#scorecardView .score-cell.notation-double-circle::after,
#scorecardView .score-cell.notation-double-square::after{
  width:calc(var(--v5-score-box,58px) * 1.02);
  height:calc(var(--v5-score-box,58px) * 1.02);
  border:clamp(1.2px,calc(var(--v5-score-box,58px) * .032),2.4px) solid var(--v162-notation-color);
}

#scorecardView .score-cell.notation-bold-square::before{
  border-width:clamp(3px,calc(var(--v5-score-box,58px) * .075),5px);
}

/* =========================================================
   SSHCP V16.27 — CONTROL CENTER / TEAMS POPUP
   Read-only CF V1.9 team-data confirmation view. Five locked columns are
   10/50/10/15/15. Only assigned teams are shown, up to 36. Header and team
   rows share one exact calculated height: available table height / (N + 1).
   Column text targets use calculated row height: TEAM 40%, NAME 60%, HCP 50%,
   QR ID 40%, HOLE 40%; each shrinks only when its actual text needs the width.
   ========================================================= */
.teams-popup-overlay{
  position:fixed;
  inset:0;
  z-index:260;
  display:none;
  align-items:center;
  justify-content:center;
  padding:0 8px;
  background:#fff;
  box-sizing:border-box;
}
.teams-popup-overlay.open{display:flex;}
.teams-popup-overlay.teams-loading .teams-popup-table-scroll{visibility:hidden;}
.teams-popup-box{
  width:min(760px,calc(100vw - 16px));
  height:95dvh;
  max-height:95dvh;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:6px;
  border:2px solid #000;
  border-radius:14px;
  background:#fff;
  overflow:hidden;
}
.teams-popup-table-frame{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  border:1px solid #a9a9a9;
  border-radius:8px;
  background:#fff;
}
.teams-popup-table-scroll{
  width:100%;
  height:100%;
  min-height:0;
  box-sizing:border-box;
  overflow-y:auto;
  overflow-x:hidden;
  border:0;
  border-radius:0;
  background:#fff;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.teams-popup-row{
  display:grid;
  grid-template-columns:10fr 50fr 10fr 15fr 15fr;
  width:100%;
  height:var(--teams-popup-row-h,36px);
  min-height:var(--teams-popup-row-h,36px);
  box-sizing:border-box;
  background:#fff;
}
.teams-popup-row.header{
  position:sticky;
  top:0;
  z-index:2;
  height:var(--teams-popup-header-h,27px);
  min-height:var(--teams-popup-header-h,27px);
  background:var(--accent);
  color:var(--on-accent);
  font-weight:800;
}
.teams-popup-cell{
  min-width:0;
  height:100%;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 2px;
  border-right:1px solid #b7b7b7;
  border-bottom:1px solid #b7b7b7;
  overflow:hidden;
  white-space:nowrap;
  font-family:'Oswald',Arial,sans-serif;
  font-weight:400;
  line-height:1;
  text-align:center;
  color:#000;
}
.teams-popup-row .teams-popup-cell:last-child{border-right:0;}
.teams-popup-row.header .teams-popup-cell{
  border-color:rgba(255,255,255,.55);
  font-weight:800;
  color:var(--on-accent);
}
.teams-popup-name{font-weight:800;}
.teams-popup-hcp{color:var(--red);}
.teams-popup-back{
  flex:0 0 auto;
  width:100%;
  height:48px;
  min-height:48px;
  margin:7px 0 0;
  padding:0 8px;
  border:2px solid var(--accent);
  border-radius:8px;
  background:var(--accent);
  color:var(--on-accent);
  font-family:'Oswald',Arial,sans-serif;
  font-size:20px;
  font-weight:800;
  line-height:1;
}
